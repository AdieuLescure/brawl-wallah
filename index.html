  hdEllipse(c, 320, 440, 46, 18, '#ffffff', 6);
  c.strokeStyle = INK;
  c.lineWidth = 4;
  c.beginPath();
  c.moveTo(274, 440);
  c.lineTo(366, 440);
  c.moveTo(300, 424);
  c.lineTo(300, 456);
  c.moveTo(320, 422);
  c.lineTo(320, 458);
  c.moveTo(340, 424);
  c.lineTo(340, 456);
  c.stroke();
}

// --- Ballon ------------------------------------------------------------------
function drawBall(c, n) {
  c.clearRect(0, 0, n, n);
  const r = n / 2 - 5;
  const cx = n / 2, cy = n / 2;
  c.save();
  c.beginPath();
  c.arc(cx, cy, r, 0, Math.PI * 2);
  c.fillStyle = '#ffffff';
  c.fill();
  c.clip();
  const pent = (x, y, R, rot) => {
    c.beginPath();
    for (let i = 0; i < 5; i++) {
      const a = rot + (i * 2 * Math.PI) / 5;
      c.lineTo(x + Math.cos(a) * R, y + Math.sin(a) * R);
    }
    c.closePath();
    c.fillStyle = '#1b1822';
    c.fill();
  };
  pent(cx, cy, r * 0.34, -Math.PI / 2);
  for (let i = 0; i < 5; i++) {
    const a = -Math.PI / 2 + (i * 2 * Math.PI) / 5 + Math.PI / 5;
    pent(cx + Math.cos(a) * r * 0.95, cy + Math.sin(a) * r * 0.95, r * 0.3, a + Math.PI);
    c.strokeStyle = '#1b1822';
    c.lineWidth = 3;
    c.beginPath();
    c.moveTo(cx + Math.cos(a - Math.PI / 5) * r * 0.31, cy + Math.sin(a - Math.PI / 5) * r * 0.31);
    c.lineTo(cx + Math.cos(a - Math.PI / 5) * r * 0.66, cy + Math.sin(a - Math.PI / 5) * r * 0.66);
    c.stroke();
  }
  // ombrage
  const g = c.createRadialGradient(cx - r * 0.35, cy - r * 0.35, r * 0.1, cx, cy, r);
  g.addColorStop(0, 'rgba(255,255,255,0)');
  g.addColorStop(1, 'rgba(60,60,110,0.38)');
  c.fillStyle = g;
  c.fillRect(0, 0, n, n);
  c.restore();
  c.beginPath();
  c.arc(cx, cy, r, 0, Math.PI * 2);
  c.strokeStyle = INK;
  c.lineWidth = 7;
  c.stroke();
}

// --- Vague d'énergie (poussée) ----------------------------------------------------
function drawWave(c, W, H) {
  c.clearRect(0, 0, W, H);
  const cy = H / 2;
  const layers = [
    [1.0, 'rgba(30,170,255,0.45)'],
    [0.76, 'rgba(110,225,255,0.8)'],
    [0.48, '#e2fcff'],
    [0.22, '#ffffff'],
  ];
  layers.forEach(([k, col]) => {
    c.beginPath();
    for (let x = 0; x <= W; x += 6) {
      const taper = Math.min(1, x / 90);
      const hh = (H / 2) * k * taper * (0.78 + 0.22 * Math.sin(x / 31 + k * 4));
      if (x === 0) c.moveTo(x, cy - hh);
      else c.lineTo(x, cy - hh);
    }
    for (let x = W; x >= 0; x -= 6) {
      const taper = Math.min(1, x / 90);
      const hh = (H / 2) * k * taper * (0.78 + 0.22 * Math.sin(x / 27 + k * 3));
      c.lineTo(x, cy + hh);
    }
    c.closePath();
    c.fillStyle = col;
    c.fill();
  });
  // arcs d'énergie
  c.strokeStyle = 'rgba(255,255,255,0.85)';
  c.lineWidth = 4;
  for (let i = 0; i < 9; i++) {
    const x = 90 + i * 90;
    c.beginPath();
    c.ellipse(x, cy, 22, (H / 2) * 0.8, 0, -1.2, 1.2);
    c.stroke();
  }
}

// --- Code pénal (livre) -------------------------------------------------------------
function drawBook(c, W, H) {
  c.clearRect(0, 0, W, H);
  // tranche des pages
  hdPoly(c, [[14, H - 14], [W - 10, H - 14], [W - 10, H - 34], [14, H - 34]], '#f6efdc', 5);
  c.strokeStyle = '#c9bb96';
  c.lineWidth = 2;
  for (let i = 1; i < 4; i++) {
    c.beginPath();
    c.moveTo(18, H - 14 - i * 5);
    c.lineTo(W - 14, H - 14 - i * 5);
    c.stroke();
  }
  // couverture
  hdPoly(c, [[8, 10], [W - 16, 10], [W - 16, H - 34], [8, H - 34]], '#7a1f2b', 6);
  // dos
  hdPoly(c, [[8, 10], [30, 10], [30, H - 34], [8, H - 34]], '#541520', 6);
  // cadre doré
  c.strokeStyle = '#f2c14e';
  c.lineWidth = 3;
  c.strokeRect(42, 20, W - 70, H - 64);
  // titre
  c.fillStyle = '#f2c14e';
  c.textAlign = 'center';
  c.textBaseline = 'middle';
  c.font = 'bold 26px Georgia, "Times New Roman", serif';
  c.fillText('CODE', 42 + (W - 70) / 2, 42);
  c.fillText('PÉNAL', 42 + (W - 70) / 2, 74);
  // balance de la justice (simple)
  c.strokeStyle = '#f2c14e';
  c.lineWidth = 3;
  c.beginPath();
  c.moveTo(W / 2 + 6, 88);
  c.lineTo(W / 2 + 6, 98);
  c.moveTo(W / 2 - 16, 92);
  c.lineTo(W / 2 + 28, 92);
  c.stroke();
}

// --- Fonds ------------------------------------------------------------------------
function drawGradBg(c, W, H, stops) {
  const g = c.createLinearGradient(0, 0, 0, H);
  stops.forEach(([p, col]) => g.addColorStop(p, col));
  c.fillStyle = g;
  c.fillRect(0, 0, W, H);
}

function drawHalftone(c, n) {
  c.clearRect(0, 0, n, n);
  c.fillStyle = '#ffffff';
  c.beginPath();
  c.arc(n / 2, n / 2, n * 0.26, 0, Math.PI * 2);
  c.fill();
  c.beginPath();
  c.arc(0, 0, n * 0.26, 0, Math.PI * 2);
  c.arc(n, 0, n * 0.26, 0, Math.PI * 2);
  c.arc(0, n, n * 0.26, 0, Math.PI * 2);
  c.arc(n, n, n * 0.26, 0, Math.PI * 2);
  c.fill();
}

const SAVE_KEY = 'brawl_campaign_v1';
function campSave() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify({ hero: camp.hero, ch: camp.ch })); } catch (e) {}
}
function campLoad() {
  try {
    const s = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null');
    if (s && ORDER.includes(s.hero) && s.ch >= 0 && s.ch < 6) return s;
  } catch (e) {}
  return null;
}
function campClear() {
  try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
}

function campOpp(hero, ch) {
  const others = ORDER.filter((x) => x !== hero);
  return ch < 5 ? others[ch] : hero;
}
function campChapterLines(ch) {
  const hero = camp.hero;
  const opp = campOpp(hero, ch);
  const key = ch < 5 ? opp : 'ombre';
  const title = ch < 5 ? `CHAPITRE ${ch + 1} : ${CHARS[opp].name}` : 'CHAPITRE FINAL : L\'OMBRE';
  const lines = [['title', title], ...STORY.intro[key]];
  return ch === 0 ? [...STORY.prologue, ...lines] : lines;
}

        { label: 'NOUVELLE PARTIE', col: 0xffb703, fn: () => { campPick = true; this.showSelect(); } },

  uiTap(p) {
    if (this.state === 'story' && this.storyTap) {
      this.storyTap();
      return;
    }
    if (SETTINGS.sound) SFX.play('ui');
    const bb = this.barBtn;
    if (bb && Math.abs(p.x - bb.x) <= bb.w / 2 && Math.abs(p.y - bb.y) <= bb.h / 2) {
      bb.fn();
      return;
    }
    for (const b of this.uiBtns || []) {
      if (Math.abs(p.x - b.x) <= b.w / 2 && Math.abs(p.y - b.y) <= b.h / 2) {
        b.fn();
        return;
      }
    }
  },

  // ----- Déroulement de la campagne ----------------------------------------
  campNew(hero) {
    campPick = false;
    camp = { hero, ch: 0 };
    campSave();
    this.campChapter();
  },

  campResume(save) {
    camp = { hero: save.hero, ch: save.ch };
    campPick = false;
    this.campChapter(true);
  },

  campChapter(skipPrologue) {
    camp.phase = 'story';
    camp.after = 'match';
    camp.opp = campOpp(camp.hero, camp.ch);
    let lines = campChapterLines(camp.ch);
    if (skipPrologue && camp.ch === 0) lines = lines.slice(STORY.prologue.length);
    camp.lines = lines;
    chosen = camp.hero;
    goSelect = false;
    this.scene.restart();
  },

  campEnter() {
    const c = camp;
    this.setControls(false);
    if (c.phase === 'story') {
      this.state = 'story';
      this.campStory();
    } else if (c.phase === 'match') {
      this.setControls(true);
      this.state = 'play';
      chosen = c.hero;
      this.forceBot = c.opp;
      this.beginMatch(c.hero);
      this.campApply();
    } else if (c.phase === 'lost') {
      this.showCampLost();
    }
  },

  campApply() {
    const d = CAMP_DIFF[camp.ch];
    const e = this.p2;
    e.stocks = d.stocks;
    e.aggr = d.aggr;
    e.lvl = d.lvl;
    if (d.dmg) e.dmgMul = d.dmg;
    if (camp.ch === 5) {
      e.shade = 0x7c6bd6;
      e.tag.setText('OMBRE');
      e.hud.name.setText('OMBRE');
    }
    this.add
      .text(this.W / 2, 78, camp.ch === 5 ? 'CHAPITRE FINAL' : `CHAPITRE ${camp.ch + 1}/6`, { fontFamily: FONT, fontSize: '14px', color: '#ffe9a8', stroke: '#000', strokeThickness: 4 })
      .setOrigin(0.5)
      .setDepth(50);
  },

  campFinish(won) {
    const c = camp;
    let fired = false;
    const go = () => {
      if (fired) return;
      fired = true;
      this.campSkip = null;
      if (won) {
        c.phase = 'story';
        const key = c.ch < 5 ? c.opp : null;
        c.lines = key ? STORY.outro[key] : STORY.epilogue;
        c.after = key ? 'advance' : 'quit';
      } else c.phase = 'lost';
      if (won && c.ch === 5) campClear();
      this.scene.restart();
    };
    this.campSkip = go;
    this.sub.setText(won ? 'TOUCHE POUR CONTINUER' : '');
    this.time.delayedCall(won ? 3500 : 2200, go);
  },

  showCampLost() {
    this.state = 'menu';
    this.ui.push(this.add.rectangle(this.W / 2, this.H / 2, this.W, this.H, 0x0b0d1f, 0.92).setDepth(100));
    this.ui.push(this.add.text(this.W / 2, this.H * 0.2, 'DEFAITE...', { fontFamily: FONT, fontSize: '44px', color: '#ff5a6e', stroke: '#000', strokeThickness: 8 }).setOrigin(0.5).setDepth(101));

  campStory() {

    const oppId = c.opp;
    const gy = L.baseY - 34;

    // les deux personnages sur la scène
    const hs = this.add.image(W / 2 - 150, gy, `${c.hero}_idle0`).setScale(PX).setDepth(10);

    const body = this.add
      .text(32 + 18, py - ph / 2 + 16 + fs + 20, '', { fontFamily: FONT, fontSize: fs + 'px', color: '#ffffff', lineSpacing: 10, wordWrap: { width: W - 100 } })
      .setDepth(D + 1);
    const more = this.add.text(W - 52, py + ph / 2 - 22, '▼', { fontFamily: FONT, fontSize: '18px', color: '#ffe9a8' }).setOrigin(0.5).setDepth(D + 1);
    this.tweens.add({ targets: more, alpha: 0.2, duration: 450, yoyo: true, repeat: -1 });
    this.ui.push(name, body, more);

    let cur = null, typing = null, full = '';
    const finish = () => {
      if (typing) typing.remove();
      typing = null;
      body.setText(full);
      more.setVisible(true);
    };
    const next = () => {
      const ln = lines.shift();
      if (!ln) {
        this.storyTap = null;
        const a = c.after;
        if (a === 'match') c.phase = 'match';
        else if (a === 'advance') {
          c.ch++;
          campSave();
          c.opp = campOpp(c.hero, c.ch);
          c.phase = 'story';
          c.after = 'match';
          c.lines = campChapterLines(c.ch);
        } else {
          camp = null;
          chosen = null;
          goSelect = false;
        }
        this.scene.restart();
        return;
      }
      const [who, raw] = ln;
      if (who === 'title') {
        // carte de chapitre
        name.setText('');
        full = raw;
        body.setText('').setFontSize(fs + 6);
        body.setColor('#ffe9a8');
      } else {
        body.setFontSize(fs).setColor('#ffffff');
        let spk = SPEAKER[who];
        if (who === 'hero') spk = { n: heroName, c: '#ffe9a8' };
        else if (!spk) spk = { n: CHARS[who].name, c: CHARS[who].roleCol };
        name.setText(spk.n).setColor(spk.c);
        full = raw;
        body.setText('');
        const isHero = who === 'hero';
        hs.setAlpha(who === 'nar' || isHero ? 1 : 0.55);
        os.setAlpha(who === 'nar' || (!isHero && who !== 'nar') ? 1 : 0.55);
      }
      more.setVisible(false);
      let i = 0;
      typing = this.time.addEvent({
        delay: 26,
        loop: true,
        callback: () => {
          i++;
          body.setText(full.slice(0, i));
          if (i >= full.length) finish();
        },
      });
    };
    this.storyTap = () => (typing ? finish() : next());
    next();
  },
});

// ===========================================================================
// NETCODE : rollback (type GGPO) pour le duel en ligne 1v1
//  - snapshot()/restore() : état complet du combat, restauré à l'identique
//  - netStep() : prédit l'adversaire, corrige et rejoue les images quand son vrai input arrive
//  - pendant un rejeu, aucun effet visuel (sinon on verrait chaque coup en double)
// ===========================================================================
const NET_DELAY = 2; // images de retard volontaire sur MES commandes (≈ 33 ms) : rend les prédictions presque toujours justes
const NET_MAX_PRED = 9; // on attend l'adversaire au-delà de 9 images prédites (≈ 150 ms)
const NET_KEEP = 40;

// Objet « neutre » : accepte n'importe quel appel et ne dessine rien (utilisé pendant les rejeux)
const NULLOBJ = new Proxy(function () {}, {
  get: (t, k) => (k === Symbol.toPrimitive ? () => 0 : k === 'then' ? undefined : NULLOBJ),
  apply: () => NULLOBJ,
  set: () => true,
});

// Etat d'un joueur : tous ses champs simples (nombres, booléens, textes) sont sauvegardés, sauf ceux-ci
const P_SKIP = new Set(['char', 'def', 'sprite', 'tag', 'human', 'hud', 'umb', 'chgBg', 'chgFg', 'chgRing', 'carryImg', 'atk', 'grab', 'moveCd', 'i', 'shade', 'lvl', 'aggr', 'dmgMul', 'spdMul', 'flashUntil', 'lastHeart', 'lastAura', 'charmFx', 'catImg', 'flashCol', 'lastPuff']);
const plainVal = (v) => v === null || typeof v === 'number' || typeof v === 'boolean' || typeof v === 'string';

// --- entrées : 1 entier par image (sx, sy sur 8 bits, + 4 boutons) -> identique des deux côtés
function packInput(i) {
  const q = (v) => Math.max(-127, Math.min(127, Math.round(v * 127))) + 127;
  return q(i.sx || 0) | (q(i.sy || 0) << 8) | (i.jump ? 1 << 16 : 0) | (i.attack ? 1 << 17 : 0) | (i.hold ? 1 << 18 : 0) | (i.block ? 1 << 19 : 0);
}
function unpackInput(v) {
  return { sx: ((v & 255) - 127) / 127, sy: (((v >> 8) & 255) - 127) / 127, jump: !!(v & (1 << 16)), attack: !!(v & (1 << 17)), hold: !!(v & (1 << 18)), block: !!(v & (1 << 19)) };
}
const NEUTRAL_IN = packInput({});
// pour prédire : on garde la direction et les boutons maintenus, jamais les « appuis » ponctuels
const predictFrom = (v) => v & ~((1 << 16) | (1 << 17));

function hashStr(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) {
    h ^= s.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}

Object.assign(GameScene.prototype, {
  // ----- Etat ------------------------------------------------------------
  snapshot() {
    const pls = [this.p1, this.p2].map((pl) => {
      const b = pl.sprite.body;
      const o = {
        sx: pl.sprite.x, sy: pl.sprite.y,
        px: b.position.x, py: b.position.y, ppx: b.prev.x, ppy: b.prev.y, pfx: b.prevFrame.x, pfy: b.prevFrame.y,
        vx: b.velocity.x, vy: b.velocity.y, g: b.allowGravity ? 1 : 0,
        bd: b.blocked.down ? 1 : 0, bu: b.blocked.up ? 1 : 0, td: b.touching.down ? 1 : 0, tn: b.touching.none ? 1 : 0,
        atk: pl.atk ? JSON.parse(JSON.stringify(pl.atk)) : null,
        grab: pl.grab ? { v: pl.grab.victim.i, start: pl.grab.start, slamAt: pl.grab.slamAt, spec: pl.grab.spec } : null,
        moveCd: { ...pl.moveCd },
        f: {},
      };
      for (const k in pl) if (!P_SKIP.has(k) && plainVal(pl[k])) o.f[k] = pl[k];
      return o;
    });
    const projs = this.projs
      .filter((p) => !p.dead)
      .map((p) => ({
        id: p.id, o: p.owner.i, t: p.target.i, spec: p.spec, x: p.x, y: p.y, vx: p.vx, vy: p.vy, born: p.born, armedAt: p.armedAt, lastTrail: p.lastTrail, f: p.f,
        spent: !!p.spent, bounced: !!p.bounced, carry: p.carry ? { ...p.carry } : null, hits: p.hits ? [...p.hits].map((q) => q.i) : null,
      }));
    return JSON.stringify({ pls, projs, timers: this.timers, frame: this.frame, simFrames: this.simFrames, freeze: this.freezeLeft, atkSeq: this.atkSeq, projSeq: this.projSeq, sudden: !!this.sudden });
  },

  restore(str) {
    const S = JSON.parse(str);
    [this.p1, this.p2].forEach((pl, i) => {
      const o = S.pls[i];
      const s = pl.sprite, b = s.body;
      b.stop();
      s.setPosition(o.sx, o.sy);
      b.position.set(o.px, o.py);
      b.prev.set(o.ppx, o.ppy);
      b.prevFrame.set(o.pfx, o.pfy);
      b.updateCenter();
      b.velocity.set(o.vx, o.vy);
      b.allowGravity = !!o.g;
      b.blocked.down = !!o.bd; b.blocked.up = !!o.bu; b.touching.down = !!o.td; b.touching.none = !!o.tn;
      for (const k in pl) if (!P_SKIP.has(k) && plainVal(pl[k]) && !(k in o.f)) pl[k] = undefined;
      Object.assign(pl, o.f);
      pl.atk = o.atk;
      pl.moveCd = { ...o.moveCd };
      pl.grab = o.grab ? { victim: this.pl(o.grab.v), start: o.grab.start, slamAt: o.grab.slamAt, spec: o.grab.spec } : null;
      s.setFlipX(pl.facing < 0);
      if (!pl.grab) s.setAngle(0);
    });
    // projectiles : on garde les sprites existants, on recrée ceux qui manquent
    const live = new Map(this.projs.map((p) => [p.id, p]));
    const keep = new Set();
    this.projs = S.projs.map((d) => {
      let p = live.get(d.id);
      keep.add(d.id);
      const owner = this.pl(d.o), target = this.pl(d.t);
      const fields = { owner, target, spec: d.spec, x: d.x, y: d.y, vx: d.vx, vy: d.vy, born: d.born, armedAt: d.armedAt, lastTrail: d.lastTrail, f: d.f, spent: d.spent, bounced: d.bounced, carry: d.carry, dead: false, hits: d.hits ? new Set(d.hits.map((j) => this.pl(j))) : null };
      if (!p) {
        p = { id: d.id, ...fields, sprite: null };
        p.sprite = this.makeProjSprite(p);
      } else {
        Object.assign(p, fields);
        // son image a pu être effacée entre-temps (projectile détruit puis ressuscité par le rejeu)
        if (p.sprite !== NULLOBJ && (!p.sprite || !p.sprite.active)) p.sprite = this.makeProjSprite(p);
      }
      return p;
    });
    live.forEach((p, id) => {
      if (!keep.has(id) && p.sprite && p.sprite !== NULLOBJ) p.sprite.destroy();
    });
    this.timers = S.timers;
    this.frame = S.frame;
    this.simFrames = S.simFrames;
    this.simNow = S.simFrames * STEP_MS;
    this.nowT = this.simNow;
    this.freezeLeft = S.freeze;
    this.atkSeq = S.atkSeq;
    this.projSeq = S.projSeq;
    this.sudden = !!S.sudden;
  },

  makeProjSprite(p) {
    const sp = p.spec;
    const img = this.add.image(p.x, p.y, sp.tex).setScale(sp.s || 3).setDepth(sp.kind === 'mine' ? 8 : 24);
    if (img === NULLOBJ) return NULLOBJ;
    if (sp.kind === 'hook') img.setAngle(p.f * 90);
    else if (sp.kind === 'eagle') img.setAngle(-90).setDepth(27);
    else if (sp.kind === 'ball') img.setDepth(25);
    else if (sp.kind === 'hermine') img.setOrigin(0.5, 1).setScale(sp.s, sp.s);
    else if (sp.kind === 'corgi') img.setFlipX(p.f < 0);
    else if (sp.kind === 'book') img.setDepth(26).setAngle(-12);
    return img;
  },

  // ----- Rejeu silencieux --------------------------------------------------
  beginResim() {
    if (this.resim) return;
    this.resim = true;
    this._real = { add: this.add, tweens: this.tweens, time: this.time, cameras: this.cameras };
    this.add = NULLOBJ;
    this.tweens = NULLOBJ;
    this.time = NULLOBJ;
    this.cameras = NULLOBJ;
  },
  endResim() {
    if (!this.resim) return;
    Object.assign(this, this._real);
    this.resim = false;
    this.projs.forEach((p) => {
      if (p.sprite === NULLOBJ) p.sprite = this.makeProjSprite(p);
    });
  },

  // ----- Match en ligne ------------------------------------------------------
  // cfg : { me: 0|1, chars: [id0, id1], send(msg) }
  beginNetMatch(cfg) {
    this.clearUi();
    this.state = 'play';
    this.setControls && this.setControls(true);
    const [c0, c1] = cfg.chars;
    this.p1 = this.makePlayer(c0, this.W / 2 - 150, L.baseY - 110, cfg.me === 0);
    this.p2 = this.makePlayer(c1, this.W / 2 + 150, L.baseY - 110, cfg.me === 1);
    if (cfg.names) [this.p1, this.p2].forEach((pl, i) => pl.tag.setText(String(cfg.names[i] || '').toUpperCase().slice(0, 12)));
    this.p1.facing = 1;
    this.p2.facing = -1;
    this.p1.i = 0;
    this.p2.i = 1;
    this.projSeq = 0;
    this.timeLimit = MATCH_MS;
    this.sudden = false;
    this.buildHud();
    const D = NET_DELAY;
    this.net = {
      me: cfg.me, send: cfg.send, rtt: cfg.rtt || (() => 0), remoteMax: -1, lastSkip: 0,
      inputs: [{}, {}], // inputs[joueur][image] = entier
      used: {}, snaps: {}, verified: -1, lastRemote: NEUTRAL_IN,
      hashes: { mine: {}, theirs: {} }, desync: false, stalled: 0, rollbacks: 0, maxRoll: 0,
    };
    for (let f = 0; f < D; f++) this.net.inputs[0][f] = this.net.inputs[1][f] = NEUTRAL_IN; // images 0..D-1 : neutre pour les deux
    // les gestes de pistolet/charge utilisent le hasard des bots : jamais en ligne
    this.autoP1 = false;
    this.curIn = [NEUTRAL_IN, NEUTRAL_IN];
    this.netInput = (i) => unpackInput(this.curIn[i]);
    this.snapAt = {};
  },

  netReceive(msg) {
    const n = this.net;
    if (!n) return;
    const r = 1 - n.me;
    if (msg.t === 'in') {
      msg.a.forEach(([f, v]) => {
        if (n.inputs[r][f] === undefined) n.inputs[r][f] = v;
        if (f > n.remoteMax) n.remoteMax = f;
      });
    } else if (msg.t === 'hash') {
      n.hashes.theirs[msg.f] = msg.h;
      this.netCheckHash(msg.f);
    }
  },

  netCheckHash(f) {
    const n = this.net;
    const a = n.hashes.mine[f], b = n.hashes.theirs[f];
    if (a === undefined || b === undefined) return;
    if (a !== b && !n.desync) {
      n.desync = true;
      n.send({ t: 'desync', f });
      if (this.onDesync) this.onDesync(f);
    }
    delete n.hashes.mine[f];
    delete n.hashes.theirs[f];
  },

  sampleLocal() {
    const inp = { sx: this.stick.sx, sy: this.stick.sy, jump: this.queue.jump, attack: this.queue.attack, hold: this.btn.attack.id !== null, block: this.btn.block.id !== null };
    this.queue.jump = this.queue.attack = this.queue.block = false;
    return packInput(inp);
  },

  netUpdate(delta) {
    const n = this.net;
    this.acc = Math.min((this.acc || 0) + Math.min(delta, 100), STEP_MS * 6);
    while (this.acc >= STEP_MS && !this.over) {
      // trop d'images prédites sans nouvelles de l'adversaire : on patiente
      if (this.frame - n.verified > NET_MAX_PRED) {
        n.stalled++;
        this.netVerify(this.frame);
        if (n.stalled % 3 === 0) {
          // en attente : on renvoie nos dernières entrées (sinon blocage mutuel avec l'envoi à 30 Hz) ;
          // de temps en temps, tout l'historique gardé (utile après une coupure réseau)
          this.netResend(n.stalled % 30 === 0 ? NET_KEEP - 2 : 16);
        }
        break;
      }
      // recalage du rythme : si on est en avance sur l'adversaire, on ralentit d'une image de temps en temps
      if (n.remoteMax >= 0 && this.frame - n.lastSkip > 20) {
        const remoteNow = n.remoteMax - NET_DELAY + Math.round(n.rtt() / 2 / STEP_MS);
        if (this.frame - remoteNow > 2) {
          n.lastSkip = this.frame;
          this.acc -= STEP_MS;
          continue;
        }
      }
      this.acc -= STEP_MS;
      this.netStep();
    }
    this.updateHud();
  },

  netResend(win) {
    const n = this.net;
    if (!n) return;
    const pk = [];
    for (let k = this.frame + NET_DELAY; k > this.frame + NET_DELAY - win && k >= 0; k--) if (n.inputs[n.me][k] !== undefined) pk.push([k, n.inputs[n.me][k]]);
    n.send({ t: 'in', a: pk });
  },

  // vérifie les prédictions contre les vraies commandes reçues (rollback si besoin) + empreintes
  netVerify(f) {
    const n = this.net;
    const r = 1 - n.me;
    // 2. l'adversaire a-t-il fait autre chose que prévu ?
    let mis = -1;
    let v = n.verified + 1;
    while (v < f && n.inputs[r][v] !== undefined) {
      if (n.used[v][r] !== n.inputs[r][v]) {
        mis = v;
        break;
      }
      v++;
    }
    if (mis < 0) n.verified = v - 1;
    else {
      n.verified = mis - 1;
      this.netRollback(mis, f);
      // on revérifie ce qui vient d'être rejoué
      let w = mis;
      while (w < f && n.inputs[r][w] !== undefined) w++;
      n.verified = w - 1;
    }
    // 3. empreinte de l'état (images confirmées) pour détecter une désynchronisation
    if (n.verified >= 30 && (n.verified % 30 === 0 || n.lastHashF === undefined)) {
      const F = n.verified - (n.verified % 30);
      if (F > (n.lastHashF || 0) && n.snaps[F]) {
        n.lastHashF = F;
        const h = hashStr(this.stateKey(n.snaps[F]));
        n.hashes.mine[F] = h;
        n.send({ t: 'hash', f: F, h });
        this.netCheckHash(F);
      }
    }
  },

  netStep() {
    const n = this.net;
    const me = n.me, r = 1 - me;
    const f = this.frame;
    // 1. mes commandes de l'image f+D, envoyées avec les 5 précédentes (redondance)
    n.inputs[me][f + NET_DELAY] = this.sampleLocal();
    const pk = [];
    for (let k = f + NET_DELAY; k > f + NET_DELAY - 6 && k >= 0; k--) if (n.inputs[me][k] !== undefined) pk.push([k, n.inputs[me][k]]);
    if ((f & 1) === 0) n.send({ t: 'in', a: pk }); // 30 Hz : économise le quota Cloudflare
    this.netVerify(f);
    // 4. on joue l'image f
    this.netPlay(f);
    // ménage
    const old = f - NET_KEEP;
    if (old >= 0) {
      delete n.snaps[old];
      delete n.used[old];
      delete n.inputs[0][old];
      delete n.inputs[1][old];
    }
  },

  netPlay(f) {
    const n = this.net;
    const me = n.me, r = 1 - me;
    n.snaps[f] = this.snapshot();
    const mine = n.inputs[me][f] !== undefined ? n.inputs[me][f] : NEUTRAL_IN;
    let theirs = n.inputs[r][f];
    if (theirs === undefined) theirs = n.lastRemote;
    else n.lastRemote = predictFrom(theirs);
    const used = [0, 0];
    used[me] = mine;
    used[r] = theirs;
    n.used[f] = used;
    this.curIn = used;
    this.simTick();
  },

  netRollback(from, to) {
    const n = this.net;
    n.rollbacks++;
    n.maxRoll = Math.max(n.maxRoll, to - from);
    this.restore(n.snaps[from]);
    this.beginResim();
    // la dernière entrée adverse connue AVANT l'image rejouée sert de base de prédiction
    for (let k = from; k < to; k++) this.netPlay(k);
    this.endResim();
  },

  // clé d'état stable (positions arrondies : le bruit de virgule flottante ne compte pas)
  stateKey(snapStr) {
    const S = JSON.parse(snapStr);
    const r = (x) => Math.round(x * 100) / 100;
    return JSON.stringify([S.frame, S.pls.map((o) => [r(o.sx), r(o.sy), r(o.vx), r(o.vy), o.f.damage, o.f.stocks, o.f.rage, o.f.jumps, o.f.ledgeSide, r(o.f.stunUntil)]), S.projs.map((p) => [p.id, r(p.x), r(p.y)])]);
  },
});

// Config attendue (config.js) : window.BRAWL_CONFIG = { SUPABASE_URL, SUPABASE_ANON_KEY, RELAY_URL }
// ===========================================================================
const CFG = window.BRAWL_CONFIG || {};
const ONLINE_OK = !!(CFG.RELAY_URL && (CFG.DEV || (CFG.SUPABASE_URL && CFG.SUPABASE_ANON_KEY && window.supabase)));
let onlineStage = null; // null = hors ligne ; sinon 'menu' | 'lobby' | ...
let onlinePick = null;
let pendingRoom = null; // callback de choix de personnage
const Online = { conn: null, idx: 0, peers: [null, null], code: '', ranked: false, names: ['', ''], chars: [null, null], rematchAsked: false };

// ---------------------------------------------------------------------------
// Fenêtres de saisie (HTML par-dessus le jeu : clavier natif sur téléphone)
// ---------------------------------------------------------------------------
function domModal(title, fields, buttons, note) {
  return new Promise((resolve) => {
    const old = document.getElementById('dm');
    if (old) old.remove();
    const el = document.createElement('div');
    el.id = 'dm';
    el.innerHTML =
      `<form><h2>${title}</h2>${note ? `<p class="n">${note}</p>` : ''}` +
      fields.map((f) => `<label>${f.label}<input name="${f.name}" type="${f.type || 'text'}" autocomplete="${f.ac || 'off'}" ${f.max ? `maxlength="${f.max}"` : ''} ${f.upper ? 'style="text-transform:uppercase"' : ''}></label>`).join('') +
      `<p class="e" id="dme"></p><div class="b">${buttons.map((b, i) => `<button type="button" data-i="${i}" class="${b.primary ? 'p' : ''}">${b.label}</button>`).join('')}</div></form>`;
    document.body.appendChild(el);
    const form = el.querySelector('form');
    const close = (v) => {
      el.remove();
      resolve(v);
    };
    el.querySelectorAll('button').forEach((bt) =>
      bt.addEventListener('click', () => {
        const b = buttons[+bt.dataset.i];
        const values = {};
        fields.forEach((f) => (values[f.name] = form.elements[f.name].value.trim()));
        if (b.cancel) return close(null);
        const err = (m) => (document.getElementById('dme').textContent = m || '');
        if (b.run) {
          bt.disabled = true;
          Promise.resolve(b.run(values, err))
            .then((ok) => {
              bt.disabled = false;
              if (ok) close({ button: b.label, values });
            })
            .catch((e) => {
              bt.disabled = false;
              err(String((e && e.message) || e));
            });
        } else close({ button: b.label, values });
      })
    );
    form.addEventListener('submit', (e) => e.preventDefault());
    const first = form.elements[0];
    if (first) setTimeout(() => first.focus(), 50);
  });
}

const Auth = {
  sb: null,
  session: null,
  profile: null,
  init() {
    if (CFG.DEV) {
      const qs = new URLSearchParams(location.search);
      const n = qs.get('dev') || localStorage.getItem('dev_name') || 'joueur' + Math.floor(Math.random() * 900 + 100);
      this.session = { access_token: 'dev:' + n, user: { id: n, is_anonymous: n.startsWith('guest') } };
      this.profile = { username: n, rating: 1000, wins: 0, losses: 0 };
      return Promise.resolve();
    }
    if (!window.supabase || !CFG.SUPABASE_URL) return Promise.resolve();
    this.sb = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY, { auth: { persistSession: true, autoRefreshToken: true } });
    return this.sb.auth.getSession().then(async ({ data }) => {
      this.session = data.session;
      if (this.session) await this.loadProfile();
    });
  },
  get anon() {
    return !!(this.session && this.session.user && this.session.user.is_anonymous);
  },
  async token() {
    if (CFG.DEV) return this.session.access_token;
    const { data } = await this.sb.auth.getSession();
    this.session = data.session;
    return data.session ? data.session.access_token : null;
  },
  async loadProfile() {
    if (CFG.DEV || !this.session) return (this.profile = null);
    const { data } = await this.sb.from('profiles').select('username,rating,wins,losses').eq('id', this.session.user.id).maybeSingle();
    this.profile = data;
    return data;
  },
  async signOut() {
    if (this.sb) await this.sb.auth.signOut();
    this.session = null;
    this.profile = null;
    this.setGuest('');
  },
  apiUrl(path) {
    return CFG.RELAY_URL.replace(/^ws/, 'http').replace(/\/$/, '') + path;
  },
  async call(path, body) {
    let r;
    try {
      r = await fetch(this.apiUrl(path), { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
    } catch (e) {
      throw new Error('Serveur injoignable');
    }
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.msg || 'Erreur ' + r.status);
    return d;
  },
  emailOf(pseudo) {
    return pseudo.toLowerCase() + '@brawl-players.app';
  },
  async setUsername(name) {
    if (!/^[A-Za-z0-9_]{3,16}$/.test(name)) throw new Error('3 à 16 caractères : lettres, chiffres, _');
    await this.call('/api/rename', { token: await this.token(), pseudo: name });
    await this.loadProfile();
    if (!this.profile) this.profile = { username: name, rating: 1000, wins: 0, losses: 0 };
    else this.profile.username = name;
  },
  async login(pseudo, pw) {
    const { error } = await this.sb.auth.signInWithPassword({ email: this.emailOf(pseudo), password: pw });
    if (error) throw new Error(/invalid|credentials/i.test(error.message) ? 'Pseudo ou mot de passe incorrect' : error.message);
    const { data } = await this.sb.auth.getSession();
    this.session = data.session;
    await this.loadProfile();
    // profil absent (compte créé avant la base) : on le recrée avec le pseudo saisi
    if (!this.profile || !this.profile.username) await this.setUsername(pseudo);
  },
  // ----- invité (pseudo local, pas de compte) -----
  guestName: (() => {
    try {
      return localStorage.getItem('brawl_guest') || '';
    } catch (e) {
      return '';
    }
  })(),
  setGuest(n) {
    this.guestName = n;
    try {
      n ? localStorage.setItem('brawl_guest', n) : localStorage.removeItem('brawl_guest');
    } catch (e) {}
  },
  get isGuest() {
    return !this.session && !!this.guestName;
  },
  get name() {
    if (this.session) return (this.profile && this.profile.username) || 'JOUEUR';
    return this.guestName || '';
  },
  async loginModal(allowGuest, note) {
    const check = (v, err) => {
      if (!/^[A-Za-z0-9_]{3,16}$/.test(v.pseudo)) return err('Pseudo : 3 à 16 caractères (lettres, chiffres, _)'), false;
      if (v.pw.length < 6) return err('Mot de passe : 6 caractères minimum'), false;
      return true;
    };
    for (;;) {
      const r = await domModal(
        allowGuest ? 'BIENVENUE' : 'CONNEXION',
        [
          { name: 'pseudo', label: 'Pseudo', max: 16, ac: 'username' },
          { name: 'pw', label: 'Mot de passe (6 caractères min.)', type: 'password', ac: 'current-password' },
        ],
        [
          {
            label: 'Se connecter',
            primary: true,
            run: async (v, err) => {
              if (!check(v, err)) return false;
              await this.login(v.pseudo, v.pw);
              return true;
            },
          },
          {
            label: 'Créer mon compte',
            run: async (v, err) => {
              if (!check(v, err)) return false;
              await this.call('/api/signup', { pseudo: v.pseudo, password: v.pw });
              await this.login(v.pseudo, v.pw);
              return true;
            },
          },
          ...(allowGuest ? [{ label: 'Jouer en invité', guest: true, run: async () => true }] : [{ label: 'Annuler', cancel: true }]),
        ],
        note || "Pas besoin d'e-mail : choisis un pseudo et un mot de passe."
      );
      if (!r) return false;
      if (r.button === 'Jouer en invité') {
        const g = await domModal(
          'MODE INVITE',
          [{ name: 'pseudo', label: 'Ton pseudo (3 à 16 : lettres, chiffres, _)', max: 16 }],
          [
            {
              label: 'Jouer',
              primary: true,
              run: async (v, err) => (/^[A-Za-z0-9_]{3,16}$/.test(v.pseudo) ? (this.setGuest(v.pseudo), true) : (err('Pseudo : 3 à 16 caractères (lettres, chiffres, _)'), false)),
            },
            { label: 'Retour', cancel: true },
          ],
          "L'invité joue contre le bot. Pour jouer en ligne, il faut un compte."
        );
        if (!g) continue;
        return true;
      }
      if (this.session) {
        this.setGuest('');
        return true;
      }
    }
  },
  // à l'arrivée sur le jeu : session gardée, invité mémorisé, sinon on demande
  async gate() {
    if (CFG.DEV || this.session || this.guestName) return true;
    return this.loginModal(true);
  },
  // action en ligne : un vrai compte est nécessaire
  async ensure() {
    if (CFG.DEV || this.session) return true;
    return this.loginModal(false, this.guestName ? 'Il faut un compte pour jouer en ligne.' : '');
  },
  async leaderboard(n) {
    if (CFG.DEV) return [];
    const { data } = await this.sb.from('profiles').select('username,rating,wins,losses').not('username', 'is', null).order('rating', { ascending: false }).limit(n || 20);
    return data || [];
  },
};

// Connexion temps réel
// ---------------------------------------------------------------------------
function netOpen(path, onMsg, onClose) {
  return new Promise((resolve, reject) => {
    const ws = new WebSocket(CFG.RELAY_URL.replace(/\/$/, '') + path);
    const c = { ws, rtt: 0, last: Date.now(), send: (o) => ws.readyState === 1 && ws.send(JSON.stringify(o)), close: () => ws.close() };
    let ended = false;
    const end = () => {
      if (ended) return;
      ended = true;
      clearInterval(c.timer);
      onClose && onClose(c);
    };
    ws.onopen = () => {
      c.last = Date.now();
      c.timer = setInterval(() => {
        // plus rien reçu depuis 7 s (pas même la réponse au ping) : connexion morte, on n'attend pas le navigateur
        if (Date.now() - c.last > 7000) {
          try {
            ws.close();
          } catch (e) {}
          return end();
        }
        c.send({ t: 'ping', ts: Date.now() });
      }, 2000);
      resolve(c);
    };
    ws.onerror = () => reject(new Error('Serveur injoignable'));
    ws.onclose = end;
    ws.onmessage = (e) => {
      c.last = Date.now();
      let m;
      try {
        m = JSON.parse(e.data);
      } catch (x) {
        return;
      }
      if (m.t === 'pong') c.rtt = Date.now() - m.ts;
      else onMsg(m);
    };
  });
}

function goOnline() {
  trainingMode = false;
  canonLayout = true;
  onlineStage = 'menu';
  boot();
  rotateCheck();
}
function leaveOnline() {
  Online.leaving = true;
  if (Online.conn) {
    try { Online.conn.close(); } catch (e) {}
  }
  Online.conn = null;
  canonLayout = false;
  onlineStage = null;
  onlinePick = null;
  boot();
  rotateCheck();
}
function rotateCheck() {
  let el = document.getElementById('rot');
  if (!el) {
    el = document.createElement('div');
    el.id = 'rot';
    el.textContent = 'Tourne ton téléphone en mode paysage pour jouer en ligne';
    document.body.appendChild(el);
  }
  el.style.display = canonLayout && window.innerHeight > window.innerWidth ? 'flex' : 'none';
}
window.addEventListener('resize', rotateCheck);

  async joinRoom(code, ranked, vs, pub, stage) {
    this.onlineMsg('CONNEXION...', 'SALLE ' + code);
    Online.code = code;
    Online.ranked = ranked;
    Online.vs = vs || '';
    Online.rematchAsked = false;
    Online.picked = null;
    Online.leaving = false;
    Online.stage = stage || null;
    try {
      Online.conn = await netOpen('/ws/room/' + code + (pub ? '?pub=1' : ''), (m) => this.roomMsg(m), (x) => this.roomClosed(x));
    } catch (e) {
      return this.onlineMsg('ERREUR', 'SERVEUR INJOIGNABLE');
    }
    Online.conn.send({ t: 'join', token: await Auth.token(), stage: Online.stage });
  },

  roomClosed(c) {
    if (!this.scene || !this.sys || !this.sys.isActive() || Online.leaving) return;
    if (c && Online.conn && c !== Online.conn) return; // ancienne connexion, déjà remplacée
    if (this.net && !this.over) this.netReconnect();
    else if (this.state !== 'play' && !this.over) this.onlineMsg('DECONNECTE', 'LA CONNEXION A ETE PERDUE');
  },

  // coupure pendant un combat : on retente pendant 10 s (le serveur garde la place)
  netReconnect() {
    if (this.reco) return;
    this.reco = { until: Date.now() + 10000 };
    this.recoTxt = this.add.text(this.W / 2, this.H * 0.3, 'RECONNEXION...', { fontFamily: FONT, fontSize: '22px', color: '#ffe9a8', stroke: '#000', strokeThickness: 6 }).setOrigin(0.5).setDepth(90);
    const attempt = async () => {
      if (!this.reco || this.over || !this.sys.isActive()) return;
      if (Date.now() > this.reco.until) {
        this.reco = null;
        if (this.recoTxt) this.recoTxt.destroy();
        return this.onlineEndNoResult('CONNEXION PERDUE');
      }
      try {
        const c = await netOpen('/ws/room/' + Online.code, (m) => this.roomMsg(m), (x) => this.roomClosed(x));
        Online.conn = c;
        c.send({ t: 'join', token: await Auth.token() });
      } catch (e) {
        setTimeout(attempt, 1500);
      }
    };
    attempt();
  },

  roomMsg(m) {
    const n = this.net;
    if (m.t === 'error') {
      Online.conn && Online.conn.close();
      Online.conn = null;
      return this.onlineMsg('IMPOSSIBLE', m.e === 'full' ? 'SALLE PLEINE' : m.e === 'forbidden' ? 'ACCES REFUSE' : 'CONNEXION REFUSEE');
    }
    if (m.t === 'hello' && this.net && !this.over) {
      // reconnecté pendant le combat : on continue
      Online.idx = m.idx;
      Online.peers = m.peers;
      if (this.reco) {
        this.reco = null;
        if (this.recoTxt) this.recoTxt.destroy();
        this.popup(this.W / 2, this.H * 0.3, 'RECONNECTE', '#6ee7b7');
      }
      this.netResend(NET_KEEP - 2);
      return;
    }
    if (m.t === 'drop') {
      if (n && !this.over && !this.dropTxt) this.dropTxt = this.add.text(this.W / 2, this.H * 0.3, "L'ADVERSAIRE SE RECONNECTE...", { fontFamily: FONT, fontSize: '18px', color: '#ffe9a8', stroke: '#000', strokeThickness: 6 }).setOrigin(0.5).setDepth(90);
      return;
    }
    if (m.t === 'back') {
      if (this.dropTxt) this.dropTxt.destroy();
      this.dropTxt = null;
      if (n) this.netResend(NET_KEEP - 2);
      return;
    }
    if (m.t === 'hello') {
      Online.idx = m.idx;
      if (m.stage) Online.stage = m.stage;
      Online.peers = m.peers;
      onlineStage = 'lobby';
      return this.showLobby();
    }
    if (m.t === 'peers' || m.t === 'rematch') {
      Online.peers = m.peers;
      if (m.t === 'rematch') {
        onlineStage = 'lobby';
        Online.picked = null;
        this.scene.restart();
        return;
      }
      if (this.state === 'lobby') this.showLobby();
      return;
    }
    if (m.t === 'start') return this.onlineStart(m);
    if (m.t === 'in' || m.t === 'hash') return n && this.netReceive(m);
    if (m.t === 'desync') return this.onDesync(m.f);
    if (m.t === 'left') {
      if (this.dropTxt) this.dropTxt.destroy();
      this.dropTxt = null;
      if (n && !this.over) this.onlineForfeit("L'ADVERSAIRE EST PARTI");
      return;
    }
    if (m.t === 'rated') {
      const mine = m.winner === Online.idx;
      this.sub && this.sub.setText(`${m.delta >= 0 ? '+' : ''}${m.delta} POINTS  (${m.rating})`).setColor(m.delta >= 0 ? '#6ee7b7' : '#ff8fa3');
      if (Auth.profile) Auth.profile.rating = m.rating;
      return;
    }
    if (m.t === 'rematch?') return this.sub && !Online.rematchAsked && this.sub.setText("L'ADVERSAIRE VEUT UNE REVANCHE");
    if (m.t === 'final') return m.disputed && this.sub && this.sub.setText('RESULTAT CONTESTE : SANS EFFET');
  },

  // ----- Salon : choix du personnage -----------------------------------------------
  showLobby() {
    this.clearUi();
    if (typeof MUSIC !== 'undefined') MUSIC.play('menu');
    this.state = 'lobby';
    const me = Online.peers[Online.idx], other = Online.peers[1 - Online.idx];
    const D = 100;
    this.ui.push(this.add.rectangle(this.W / 2, this.H / 2, this.W, this.H, 0x0b0d1f, 0.92).setDepth(D));
    const title = Online.ranked ? 'DUEL CLASSE' : 'SALLE  ' + Online.code;
    this.ui.push(this.add.text(this.W / 2, 56, title, { fontFamily: FONT, fontSize: '36px', color: '#fff', stroke: '#f72585', strokeThickness: 8 }).setOrigin(0.5).setDepth(D + 1));
    const line = (p, y, label) => {
      const txt = p ? `${label} ${p.name}  ${p.char ? CHARS[p.char].name : '...'}  ${p.ready ? 'PRET' : ''}` : `${label} EN ATTENTE...`;
      this.ui.push(this.add.text(this.W / 2, y, txt, { fontFamily: FONT, fontSize: '18px', color: p && p.ready ? '#6ee7b7' : '#cfd3ff' }).setOrigin(0.5).setDepth(D + 1));
    };
    line(me, 120, 'TOI:');
    line(other, 156, 'ADV:');
    if (!Online.ranked && Online.stage)
      this.ui.push(this.add.text(this.W - 40, 56, 'ARENE : ' + (STAGE_NAMES[Online.stage] || '?'), { fontFamily: FONT, fontSize: '16px', color: '#ffd166', stroke: '#000', strokeThickness: 4 }).setOrigin(1, 0.5).setDepth(D + 1));
    const buttons = [];
    if (!me || !me.char || !me.ready) buttons.push({ label: me && me.char ? 'CHANGER DE PERSO' : 'CHOISIR MON PERSO', fn: () => this.lobbyPick() });
    if (!Online.ranked) buttons.push({ label: 'COPIER LE LIEN', col: 0x4cc9f0, fn: () => this.copyInvite() });
    buttons.push({ label: 'QUITTER', col: 0x888888, fn: () => leaveOnline() });
    if (me && me.char && !me.ready && other) {
      this.ui.push(this.add.text(this.W / 2, 200, 'TOUCHE PRET QUAND TU ES BON', { fontFamily: FONT, fontSize: '12px', color: '#9aa0d0' }).setOrigin(0.5).setDepth(D + 1));
      buttons.unshift({ label: 'PRET !', col: 0x6ee7b7, fn: () => Online.conn.send({ t: 'ready' }) });
    }
    if (me && me.ready && !other) this.ui.push(this.add.text(this.W / 2, 220, 'EN ATTENTE DE L\'ADVERSAIRE...', { fontFamily: FONT, fontSize: '14px', color: '#ffe9a8' }).setOrigin(0.5).setDepth(D + 1));
    this.menuButtons(buttons, this.H * 0.42);
    if (!Online.picked && (!me || !me.char)) this.lobbyPick();
  },

  lobbyPick() {
    onlinePick = (id) => {
      onlinePick = null;
      Online.picked = id;
      Online.conn.send({ t: 'pick', char: id });
      this.showLobby();
    };
    this.showSelect();
  },

  copyInvite() {
    const url = location.origin + location.pathname + '?room=' + Online.code;
    const done = () => this.popup(this.W / 2, 240, 'LIEN COPIE', '#6ee7b7');
    if (navigator.clipboard) navigator.clipboard.writeText(url).then(done, () => prompt('Copie ce lien', url));
    else prompt('Copie ce lien', url);
  },

  // ----- Match ------------------------------------------------------------------------
  onlineStart(m) {
    this.clearUi();
    onlinePick = null;
    this.over = false;
    // même terrain sur les deux téléphones : tiré du code de la salle
    const stage = STAGES.includes(m.stage) ? m.stage : STAGES.includes(Online.stage) ? Online.stage : stageFromCode(Online.code);
    if (this.applyStage) this.applyStage(stage);
    if (typeof MUSIC !== 'undefined') MUSIC.play(stage === 'dune' ? 'desert' : 'night');
    this.beginNetMatch({ me: Online.idx, chars: m.chars, names: m.names, send: (o) => Online.conn && Online.conn.send(o), rtt: () => (Online.conn ? Online.conn.rtt : 0) });
    this.state = 'countdown';
    this.setControls(true);
    this.onDesync = (f) => this.onlineEndNoResult('DESYNCHRONISATION');
    const D = 120;
    const t = this.add.text(this.W / 2, this.H * 0.35, '3', { fontFamily: FONT, fontSize: '96px', color: '#fff', stroke: '#f72585', strokeThickness: 14 }).setOrigin(0.5).setDepth(D);
    const names = this.add.text(this.W / 2, this.H * 0.2, `${m.names[0]}  VS  ${m.names[1]}`, { fontFamily: FONT, fontSize: '22px', color: '#ffe9a8', stroke: '#000', strokeThickness: 5 }).setOrigin(0.5).setDepth(D);
    let c = 3;
    const ev = this.time.addEvent({
      delay: 800,
      repeat: 3,
      callback: () => {
        c--;
        if (c > 0) {
          t.setText(String(c));
          this.sfx('count');
        } else if (c === 0) {
          t.setText('GO !');
          this.sfx('go');
          this.state = 'play';
          this.acc = 0;
        } else {
          t.destroy();
          names.destroy();
        }
      },
    });
    this.netHud = this.add.text(this.W - 20, this.H - 20, '', { fontFamily: FONT, fontSize: '11px', color: '#9aa0d0' }).setOrigin(1, 1).setDepth(50);
  },

  onlineForfeit(msg) {
    if (this.over) return;
    this.over = true;
    this.net = this.net; // gardé pour le rapport
    const mine = Online.idx;
    this.banner.setText('VICTOIRE !');
    this.sub.setText(msg);
    Online.conn && Online.conn.send({ t: 'result', winner: mine });
    this.onlineOverButtons();
  },

  onlineEndNoResult(msg) {
    if (this.over) return;
    this.over = true;
    this.banner.setText('MATCH ANNULE').setFontSize('36px');
    this.sub.setText(msg);
    this.onlineOverButtons();
  },

  onlineFinish(winnerPlayer) {
    const widx = winnerPlayer === this.p1 ? 0 : 1;
    const won = widx === Online.idx;
    this.banner.setText(won ? 'VICTOIRE !' : 'DEFAITE...');
    this.sub.setText(Online.ranked ? 'CALCUL DU CLASSEMENT...' : '');
    Online.conn && Online.conn.send({ t: 'result', winner: widx });
    this.onlineOverButtons();
  },

  onlineOverButtons() {
    this.setControls(false);
    this.time.delayedCall(1400, () => {
      this.state = 'menu';
      this.menuButtons(
        [
          ...(Online.ranked ? [] : [{ label: 'REVANCHE', fn: () => { Online.rematchAsked = true; Online.conn && Online.conn.send({ t: 'rematch' }); this.sub.setText("EN ATTENTE DE L'ADVERSAIRE..."); } }]),
          { label: 'QUITTER', col: 0x888888, fn: () => leaveOnline() },
        ],
        this.H * 0.62
      );
    });
  },
});

// petit affichage réseau pendant le combat (ping + corrections)
GameScene.prototype.updateNetHud = function () {
  if (this.netHud && Online.conn && this.net) this.netHud.setText(`PING ${Online.conn.rtt}ms  RB ${this.net.rollbacks}`);
};

if (ONLINE_OK) {
  Auth.ready = Auth.init().catch(() => {});
  const rc = new URLSearchParams(location.search).get('room');
  if (rc) {
    pendingRoom = rc.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 8);
    canonLayout = true;
    onlineStage = 'menu';
    setTimeout(rotateCheck, 500);
  }
}

// ===========================================================================
// BOTS : jouent avec les mêmes règles que le joueur.
// Le niveau règle le temps de réaction, la précision et les choix (jamais de bonus de dégâts).
// ===========================================================================
const BOT_LV = [
  { react: 430, acc: 0.6, aggr: 0.65, dodge: 0.3, punish: 0.35, di: 0.3, escape: 0.2 }, // facile
  { react: 270, acc: 0.8, aggr: 1.0, dodge: 0.5, punish: 0.65, di: 0.7, escape: 0.5 }, // moyen
  { react: 170, acc: 0.92, aggr: 1.25, dodge: 0.7, punish: 0.85, di: 0.95, escape: 0.85 }, // difficile
];

// Coups utilisés par chaque bot : dir (sens du joystick), air (true = en l'air seulement, false = au sol seulement),
// dx (distance horizontale à la cible, en px), dy (cible - bot, négatif = cible au-dessus), w (poids du choix)
const BOT_MOVES = {
  toro: [
    { d: 'neutral', air: false, dx: [0, 90], dy: [-60, 50], w: 4 },
    { d: 'forward', air: false, dx: [50, 150], dy: [-50, 50], w: 2 },
    { d: 'up', air: false, dx: [0, 80], dy: [-170, -20], w: 2 },
    { d: 'down', air: false, dx: [30, 140], dy: [-20, 60], w: 1.5 },
    { d: 'back', air: false, dx: [40, 150], dy: [-40, 40], w: 1 },
    { d: 'neutral', air: true, dx: [0, 90], dy: [-70, 70], w: 3 },
    { d: 'forward', air: true, dx: [40, 160], dy: [-60, 60], w: 2 },
    { d: 'down', air: true, dx: [0, 60], dy: [30, 160], w: 2 },
  ],
  astra: [
    { d: 'neutral', air: false, dx: [140, 600], dy: [-60, 60], w: 4 },
    { d: 'forward', air: false, dx: [200, 650], dy: [-60, 60], w: 1.5 },
    { d: 'up', air: false, dx: [60, 320], dy: [-260, -60], w: 2 },
    { d: 'down', air: false, dx: [40, 230], dy: [-20, 60], w: 1 },
    { d: 'back', air: false, dx: [0, 160], dy: [-60, 60], w: 3 },
    { d: 'neutral', air: true, dx: [0, 90], dy: [-70, 70], w: 3 },
    { d: 'forward', air: true, dx: [200, 650], dy: [-80, 80], w: 1 },
    { d: 'down', air: true, dx: [60, 300], dy: [40, 320], w: 2 },
  ],
  grom: [
    { d: 'neutral', air: false, dx: [0, 95], dy: [-60, 50], w: 3 },
    { d: 'forward', air: false, dx: [0, 85], dy: [-50, 40], w: 3, grab: true },
    { d: 'up', air: false, dx: [0, 90], dy: [-180, -20], w: 2 },
    { d: 'down', air: false, dx: [0, 120], dy: [-20, 40], w: 1.5, tgtGround: true },
    { d: 'back', air: false, dx: [180, 420], dy: [-50, 50], w: 1, hook: true },
    { d: 'neutral', air: true, dx: [0, 100], dy: [-70, 70], w: 3 },
    { d: 'forward', air: true, dx: [30, 120], dy: [-20, 120], w: 2 },
    { d: 'down', air: true, dx: [0, 60], dy: [30, 160], w: 2 },
  ],
  deadlulu: [
    { d: 'neutral', air: false, dx: [110, 420], dy: [-60, 60], w: 4 },
    { d: 'forward', air: false, dx: [50, 150], dy: [-60, 50], w: 2 },
    { d: 'up', air: false, dx: [0, 80], dy: [-180, -20], w: 2 },
    { d: 'down', air: false, dx: [180, 320], dy: [-40, 60], w: 1.5, tgtGround: true },
    { d: 'neutral', air: true, dx: [0, 100], dy: [-70, 70], w: 3 },
    { d: 'forward', air: true, dx: [30, 140], dy: [-60, 60], w: 2 },
    { d: 'down', air: true, dx: [0, 60], dy: [30, 160], w: 1.5 },
  ],
  denodoom: [
    { d: 'neutral', air: false, dx: [40, 260], dy: [-50, 50], w: 3 },
    { d: 'forward', air: false, dx: [30, 140], dy: [-50, 50], w: 3 },
    { d: 'up', air: false, dx: [0, 120], dy: [-320, -60], w: 2 },
    { d: 'down', air: false, dx: [90, 170], dy: [-40, 60], w: 1.5, tgtGround: true },
    { d: 'back', air: false, dx: [250, 620], dy: [-50, 50], w: 1, charge: true },
    { d: 'neutral', air: true, dx: [0, 100], dy: [-70, 70], w: 3 },
    { d: 'forward', air: true, dx: [30, 140], dy: [-60, 60], w: 2 },
    { d: 'down', air: true, dx: [0, 60], dy: [30, 160], w: 1.5 },
  ],
  nini: [
    { d: 'neutral', air: false, dx: [0, 95], dy: [-60, 50], w: 4 },
    { d: 'forward', air: false, dx: [50, 170], dy: [-50, 50], w: 2.5 },
    { d: 'up', air: false, dx: [0, 90], dy: [-200, -20], w: 2 },
    { d: 'down', air: false, dx: [160, 600], dy: [-40, 60], w: 1.2, tgtGround: true },
    { d: 'back', air: false, dx: [160, 520], dy: [-50, 50], w: 1.2, tgtGround: true },
    { d: 'neutral', air: true, dx: [0, 95], dy: [-70, 70], w: 3 },
    { d: 'forward', air: true, dx: [30, 130], dy: [-60, 60], w: 2 },
    { d: 'down', air: true, dx: [0, 80], dy: [40, 260], w: 1.5 },
  ],
  adieulescure: [
    { d: 'neutral', air: false, dx: [0, 90], dy: [-50, 60], w: 4 },
    { d: 'forward', air: false, dx: [60, 260], dy: [-50, 50], w: 2 },
    { d: 'up', air: false, dx: [0, 90], dy: [-200, -20], w: 2 },
    { d: 'neutral', air: true, dx: [0, 90], dy: [-70, 70], w: 3 },
    { d: 'forward', air: true, dx: [120, 420], dy: [-40, 160], w: 2 },
    { d: 'back', air: true, dx: [20, 120], dy: [-50, 50], w: 1.5 },
  ],
};
const BOT_PREF = { toro: 70, astra: 330, grom: 60, deadlulu: 200, denodoom: 160, nini: 90, adieulescure: 90 };

Object.assign(GameScene.prototype, {
  botInput(bot, tgt, now) {
    const i = { sx: 0, sy: 0, jump: false, attack: false, hold: false, block: false };
    if (bot.stocks <= 0 || tgt.stocks <= 0) return i;
    const lv = BOT_LV[bot.lvl === undefined ? 1 : bot.lvl];
    const aggr = lv.aggr * (bot.aggr || 1);
    const s = bot.sprite, b = s.body, ts = tgt.sprite, tb = ts.body;
    const dx = ts.x - s.x, dy = ts.y - s.y, adx = Math.abs(dx), dir = Math.sign(dx) || 1;
    const cx = this.W / 2, half = L.mainW / 2;
    const grounded = b.blocked.down || b.touching.down;
    const tGround = tb.blocked.down || tb.touching.down;
    const offstage = Math.abs(s.x - cx) > half - 4 || s.y > L.baseY + 6;
    const press = () => {
      // un appui d'esquive = un front montant : on relâche une image sur deux
      i.block = !bot.botBlockPrev;
    };
    bot.botBlockPrev = false;

    // ballon de handball : on maintient le temps voulu
    if (bot.atk && bot.atk.charging) {
      i.hold = now - bot.atk.start < (bot.botCharge || 400);
      return i;
    }
    // accroché au rebord : on attend un peu, puis on remonte, on saute, on attaque ou on roule
    if (bot.ledgeSide) {
      if (bot.botLedgeAt !== bot.ledgeAt) {
        bot.botLedgeAt = bot.ledgeAt;
        bot.botLedgeWait = lv.react * 0.6 + Math.random() * 500;
        bot.botLedgeHow = Math.random();
      }
      if (now - bot.ledgeAt > bot.botLedgeWait) {
        const h = bot.botLedgeHow;
        if (h < 0.45) i.sx = -bot.ledgeSide;
        else if (h < 0.7) i.jump = true;
        else if (h < 0.85) i.attack = true;
        else press();
      }
      bot.botBlockPrev = i.block;
      return i;
    }
    // éjecté : influence directionnelle vers le terrain, et sortie d'éjection quand ça devient dangereux
    if (now < bot.stunUntil) {
      if (Math.random() < lv.di) {
        i.sx = Math.sign(cx - s.x) || 0;
        i.sy = -0.5;
      }
      const fast = hyp(b.velocity.x, b.velocity.y) > 700;
      if (fast && now - bot.stunStart >= STUN_ESCAPE && !bot.airDodged && Math.random() < lv.escape * 0.2) press();
      bot.botBlockPrev = i.block;
      return i;
    }
    // enchaînement (jab x3 de Toro, griffes de Nini) : on rappuie pendant le coup
    if (bot.atk && bot.atk.chainKey && now >= bot.atk.hitAt && bot.atk.chainIdx < bot.def.moves[bot.atk.chainKey].chain.length) {
      if (bot.botChainFor !== bot.atk.id) {
        bot.botChainFor = bot.atk.id;
        bot.botChainGo = Math.random() < lv.acc;
      }
      if (bot.botChainGo) {
        i.attack = true;
        return i;
      }
    }
    // hors du terrain : on revient
    if (offstage && !grounded) {
      this.botRecover(bot, i, now, lv);
      bot.botBlockPrev = i.block;
      return i;
    }

    // --- défense : esquiver ce qu'on a vu venir (après le temps de réaction)
    const ta = tgt.atk;
    if (ta && ta.id !== bot.botSeenAtk && now - ta.start >= lv.react && !ta.charging) {
      bot.botSeenAtk = ta.id;
      const m = ta.m;
      const reach = (m.ox || 0) + (m.w || 0) / 2 + 40;
      const coming = now < ta.hitAt + (m.active || 0) && (m.type === 'melee' || m.type === 'grab') && adx < reach + 30 && Math.abs(dy) < 140;
      if (coming && Math.random() < lv.dodge && now >= bot.dodgeCd && !bot.atk) {
        const r = Math.random();
        if (r < 0.5) i.sx = 0;
        else i.sx = r < 0.8 ? -dir : dir;
        press();
        bot.botBlockPrev = i.block;
        return i;
      }
      // punition : le coup adverse va rater et sa fin est longue
      if (!coming && m.type !== 'proj' && adx < 170 && Math.random() < lv.punish) bot.botPunish = ta.id;
    }
    for (const p of this.projs) {
      if (p.dead || p.owner !== tgt || p.id === bot.botSeenProj) continue;
      const pdx = s.x - p.x;
      const approaching = Math.sign(p.vx || 0) === Math.sign(pdx) || (p.spec.kind === 'book' && Math.abs(pdx) < 110);
      if (approaching && Math.abs(pdx) < 220 && Math.abs(p.y - s.y) < 120 && now - p.born >= lv.react * 0.5) {
        bot.botSeenProj = p.id;
        const cm = bot.def.moves.back;
        if (cm && cm.type === 'catch' && grounded && !bot.atk && now > bot.cdUntil && Math.random() < lv.dodge * 0.7) {
          i.sx = -dir;
          i.attack = true;
          return i;
        }
        if (Math.random() < lv.dodge) {
          if (grounded && Math.random() < 0.5 && bot.jumps > 0) i.jump = true;
          else press();
          bot.botBlockPrev = i.block;
          return i;
        }
      }
    }
    // punir un coup raté (pendant sa fin)
    if (ta && bot.botPunish === ta.id && now >= ta.hitAt + (ta.m.active || 0) && !bot.atk) {
      bot.botPunish = 0;
      const opts = (BOT_MOVES[bot.char] || []).filter((o) => o.air === !grounded && adx >= o.dx[0] - 30 && adx <= o.dx[1] + 20 && !o.heal && !o.charge);
      if (opts.length) return this.botUse(bot, i, opts[0], dir, lv);
    }

    // --- déplacement : distance préférée, sans tomber du terrain
    const pref = BOT_PREF[bot.char] || 90;
    const tOff = Math.abs(ts.x - cx) > half || ts.y > L.baseY + 10;
    if (tOff) {
      // l'adversaire est dehors : on se place près du bord pour le gêner
      const ex = cx + Math.sign(ts.x - cx) * (half - 50);
      if (Math.abs(ex - s.x) > 20) i.sx = Math.sign(ex - s.x) * 0.9;
    } else if (adx > pref + 40) i.sx = dir * 0.9;
    else if (adx < pref - 40) i.sx = -dir * 0.7;
    if (Math.abs(s.x + i.sx * 60 - cx) > half - 30 && !tOff) i.sx = 0; // pas de chute volontaire
    // monter sur une plateforme / en descendre
    if (dy < -110 && grounded && adx < 260 && Math.random() < 0.025 * aggr) i.jump = true;
    if (dy > 110 && grounded && s.y < L.baseY - 60 && adx < 200 && Math.random() < 0.5) {
      i.sy = 1;
      i.sx = 0;
    }

    // l'adversaire est charmé : on en profite avec un coup fort
    if (tgt.charmUntil > now && !bot.atk && now > bot.cdUntil && adx < 200) {
      const o = grounded ? { d: adx < 90 ? 'neutral' : 'forward' } : { d: 'forward' };
      return this.botUse(bot, i, o, dir, { acc: 1 });
    }
    // --- attaque
    if (!bot.atk && now > bot.cdUntil) {
      const opts = (BOT_MOVES[bot.char] || []).filter(
        (o) =>
          o.air === !grounded &&
          adx >= o.dx[0] && adx <= o.dx[1] &&
          dy >= o.dy[0] && dy <= o.dy[1] &&
          (!o.tgtGround || tGround) &&
          (!o.heal || bot.damage > 35) &&
          this.botReady(bot, o, grounded, now)
      );
      if (opts.length && Math.random() < 0.055 * aggr) {
        let tot = opts.reduce((a, o) => a + o.w, 0), r = Math.random() * tot, pick = opts[0];
        for (const o of opts) {
          r -= o.w;
          if (r <= 0) { pick = o; break; }
        }
        return this.botUse(bot, i, pick, dir, lv);
      }
    }
    bot.botBlockPrev = i.block;
    return i;
  },

  // le coup est-il disponible (recharge, objets déjà à l'écran) ?
  botReady(bot, o, grounded, now) {
    const mv = bot.def.moves;
    let key = o.d;
    if (!grounded) {
      const ak = { neutral: 'nAir', forward: 'fwdAir', back: 'bAir', up: 'upAir', down: 'downAir' }[o.d];
      if (mv[ak]) key = ak;
    }
    const m = mv[key];
    if (!m) return false;
    if ((m.cd || m.cooldown) && now < (bot.moveCd[m.cdKey || key] || 0)) return false;
    if (m.max && m.proj && !m.replace && this.projs.filter((p) => !p.dead && p.owner === bot && p.spec.kind === m.proj.kind && p.spec.tex === m.proj.tex).length >= m.max) return false;
    return true;
  },

  botUse(bot, i, o, dir, lv) {
    i.attack = true;
    i.sx = 0;
    i.sy = 0;
    let d = o.d;
    // erreur de précision : mauvais coup de temps en temps
    if (Math.random() > lv.acc) d = ['neutral', 'forward', 'down', 'up'][Math.floor(Math.random() * 4)];
    if (d === 'forward') i.sx = dir;
    else if (d === 'back') i.sx = -dir;
    else if (d === 'up') i.sy = -1;
    else if (d === 'down') i.sy = 1;
    if (o.charge) bot.botCharge = 200 + Math.random() * 800;
    bot.botBlockPrev = false;
    return i;
  },

  botRecover(bot, i, now, lv) {
    const s = bot.sprite, b = s.body;
    const cx = this.W / 2, half = L.mainW / 2;
    const side = Math.sign(s.x - cx) || 1;
    const edgeX = cx + side * half;
    const out = (s.x - edgeX) * side; // distance hors du terrain
    const below = s.y > L.baseY - 30;
    i.sx = -side;
    // Grom : grappin vers le bord quand il est assez près
    if (bot.char === 'grom' && !bot.atk && out < 330 && Math.abs(s.y - L.baseY) < 110 && now > bot.cdUntil && Math.random() < 0.3) {
      i.attack = true;
      i.sx = -bot.facing;
      i.sy = 0;
      return;
    }
    // AdieuLescure : CTRL+Z pour revenir là où il était (s'il était plus près du terrain)
    if (bot.def.rewind && !bot.atk && now > bot.cdUntil && now >= (bot.moveCd.ctrlz || 0) && bot.zn >= 6) {
      const j = bot.zn < 10 ? 0 : bot.zi || 0;
      const back = (bot['zx' + j] - edgeX) * side;
      if (back < out - 120 && Math.random() < 0.3 * lv.escape + 0.1) {
        i.attack = true;
        i.sy = 1;
        i.sx = 0;
        return;
      }
    }
    if (b.velocity.y > -80) {
      if (bot.jumps > 0 && now - bot.lastJump > 220 && (below || out > 160)) i.jump = true;
      else if (bot.jumps === 0 && !bot.recUsed && (s.y > L.baseY - 60 || out > 140)) {
        // coup de retour (HAUT en l'air), en visant le terrain
        i.attack = true;
        i.sy = -1;
        i.sx = -side * 0.6;
      } else if (bot.jumps === 0 && bot.recUsed && !bot.airDodged && s.y > L.baseY + 20 && out < 260 && Math.random() < lv.escape) {
        i.block = !bot.botBlockPrev;
        i.sx = -side;
        i.sy = -0.8;
      }
    }
  },

  // Mannequin du mode entraînement
  dummyInput(pl, other, now) {
    const i = { sx: 0, sy: 0, jump: false, attack: false, hold: false, block: false };
    const mode = this.dummyMode || 0;
    if (mode === 1) {
      // saute régulièrement
      if ((pl.sprite.body.blocked.down || pl.sprite.body.touching.down) && Math.floor(now / 900) !== pl.dumJump) {
        pl.dumJump = Math.floor(now / 900);
        i.jump = true;
      }
    } else if (mode === 2) {
      // esquive dès qu'une attaque part
      const a = other.atk;
      if (a && a.id !== pl.dumSeen && now - a.start > 60) {
        pl.dumSeen = a.id;
        i.block = true;
      }
    } else if (mode === 3) return this.botInput(pl, other, now);
    // revient au centre s'il est poussé hors du terrain
    const cx = this.W / 2;
    if (Math.abs(pl.sprite.x - cx) > L.mainW / 2 - 10 || pl.sprite.y > L.baseY + 6) this.botRecover(pl, i, now, BOT_LV[2]);
    return i;
  },
});

// --- Sons synthétisés (aucun fichier à charger) --------------------------------
const SFX = {
  ctx: null,
  noise: null,
  last: {},
  init() {
    if (this.ctx) return this.ctx;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    try {
      this.ctx = new AC();
      const n = this.ctx.sampleRate * 0.5;
      this.noise = this.ctx.createBuffer(1, n, this.ctx.sampleRate);
      const d = this.noise.getChannelData(0);
      let seed = 12345;
      for (let i = 0; i < n; i++) {
        seed = (seed * 1103515245 + 12345) & 0x7fffffff;
        d[i] = (seed / 0x3fffffff - 1) * 0.9;
      }
    } catch (e) {
      this.ctx = null;
    }
    return this.ctx;
  },
  tone(type, f0, f1, dur, vol, t0) {
    const c = this.ctx, t = c.currentTime + (t0 || 0);
    const o = c.createOscillator(), g = c.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(f1, 20), t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(c.destination);
    o.start(t);
    o.stop(t + dur + 0.02);
  },
  hiss(filter, freq, dur, vol, sweep) {
    const c = this.ctx, t = c.currentTime;
    const src = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    src.buffer = this.noise;
    f.type = filter;
    f.frequency.setValueAtTime(freq, t);
    if (sweep) f.frequency.exponentialRampToValueAtTime(sweep, t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f).connect(g).connect(c.destination);
    src.start(t);
    src.stop(t + dur + 0.02);
  },
  play(name, k) {
    if (!this.ctx || this.ctx.state !== 'running') return;
    const now = performance.now();
    if (now - (this.last[name] || 0) < 45) return;
    this.last[name] = now;
    k = k || 0.5;
    try {
      if (name === 'hit') {
        this.hiss('bandpass', 700 + k * 700, 0.09, 0.22 + 0.2 * k);
        this.tone('sine', 140, 55, 0.12, 0.35 + 0.2 * k);
      } else if (name === 'ko') {
        this.tone('sine', 100, 35, 0.45, 0.55);
        this.hiss('lowpass', 900, 0.35, 0.3, 200);
      } else if (name === 'jump') this.tone('square', 330, 620, 0.08, 0.05);
      else if (name === 'dodge') this.hiss('highpass', 1800, 0.13, 0.12, 5000);
      else if (name === 'swing') this.hiss('bandpass', 1400, 0.06, 0.05, 2600);
      else if (name === 'parry') this.tone('triangle', 900, 1500, 0.12, 0.14);
      else if (name === 'armor') this.tone('square', 210, 160, 0.09, 0.09);
      else if (name === 'charm') this.tone('sine', 700, 1150, 0.18, 0.1);
      else if (name === 'count') this.tone('square', 660, 660, 0.12, 0.08);
      else if (name === 'go') this.tone('square', 990, 990, 0.25, 0.1);
      else if (name === 'ui') this.tone('triangle', 520, 640, 0.05, 0.06);
      else if (name === 'rumble') {
        this.tone('sine', 55, 38, 1.4, 0.3);
        this.hiss('lowpass', 260, 1.6, 0.22, 120);
      }
    } catch (e) {}
  },
};
// le son ne peut démarrer qu'après un toucher
['pointerdown', 'touchstart', 'keydown'].forEach((ev) =>
  window.addEventListener(
    ev,
    () => {
      const c = SFX.init();
      if (c && c.state !== 'running') c.resume().catch(() => {});
    },
    { passive: true }
  )
);

    const inside = (b) => Math.abs(p.x - b.x) <= b.w / 2 && Math.abs(p.y - b.y) <= b.h / 2;
    if (this.quitUi) {
      for (const b of this.quitUi.btns) if (inside(b)) { b.fn(); return true; }

    }
    if (this.over || this.state !== 'play' || !this.quitBtn || !inside(this.quitBtn)) return false;
    if (this.ctrlObjs && this.ctrlObjs[0] && !this.ctrlObjs[0].visible) return false;
    this.askQuit();
