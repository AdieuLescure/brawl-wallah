// ---------------------------------------------------------------------------
// Détection : le coup envoie-t-il l'adversaire (dernière vie) hors du terrain à coup sûr ?
// ---------------------------------------------------------------------------
GameScene.prototype.isFinisher = function (vic, now) {
  if (this.cine || this.over || vic.stocks !== 1 || vic.damage < 60) return false;
  const b = vic.sprite.body;
  let x = vic.sprite.x, y = vic.sprite.y, vx = b.velocity.x, vy = b.velocity.y;
  const T = Math.max((vic.stunUntil - now) / 1000, 0);
  const cx = this.W / 2, half = L.mainW / 2;
  const xl = cx - (half + 360) * 0.9, xr = cx + (half + 360) * 0.9;
  const yb = L.baseY + 420 * 0.9, yt = L.baseY - 640 * 0.9;
  for (let t = 0; t < T + 0.25; t += 1 / 60) {
    vy += GRAVITY / 60;
    if (t < T) vx *= 1 - 0.8 / 60;
    x += vx / 60;
    y += vy / 60;
    if (x < xl || x > xr || y < yt) return true;
    if (y > yb && Math.abs(x - cx) > half + 20) return true;
  }
  return false;
};

// ---------------------------------------------------------------------------
// Mise en place
// ---------------------------------------------------------------------------
GameScene.prototype.startFinisher = function (att, vic, now) {
  this.ensureCineArt();
  const lulu = att.char === 'deadlulu';
  if (lulu) this.ensureLuluArt();
  const stunLeft = Math.max(vic.stunUntil - now, 1700); // aucune récupération possible une fois la cinématique finie
  const W = this.W, H = this.H;
  const S = Math.min(W / 1100, H / 720);
  const c = (this.cine = { t0: this.time.now, att, vic, lulu, stunLeft, skip: false, objs: [], dur: lulu ? 4400 : 2000, f: att.facing, S, shakeUntil: 0 });
  const own = (o) => (c.objs.push(o), o);
  c.dim = own(this.add.rectangle(W / 2, H / 2, W, H, 0x05060f, 1).setDepth(300));
  c.halftone = own(this.add.tileSprite(W / 2, H / 2, W, H, 'halftone').setDepth(300.2).setAlpha(0.12).setTileScale(2));
  c.gfx = own(this.add.graphics().setDepth(300.5));
  c.world = own(this.add.container(W / 2, H / 2).setScale(S * c.f, S).setDepth(302));
  c.ui = own(this.add.container(W / 2, H / 2).setScale(S).setDepth(303));
  c.flash = own(this.add.rectangle(W / 2, H / 2, W, H, 0xffffff, 0).setDepth(310));
  c.pg = own(this.add.graphics());
  c.ui.add(c.pg);
  c.toScr = (x, y, mirror) => [W / 2 + x * S * (mirror ? c.f : 1), H / 2 + y * S];
  if (lulu) this.luluBuild(c);
  else this.genBuild(c);
  this.cineTick(this.time.now);
};

GameScene.prototype.cineTick = function (time) {
  const c = this.cine;
  if (!c) return;
  let t = time - c.t0;
  if (c.skip) t = c.dur;
  if (t >= c.dur) {
    this.cineEnd();
    return;
  }
  // tremblement des conteneurs
  const sk = t < c.shakeUntil ? 10 : 0;
  c.world.setPosition(this.W / 2 + (sk ? (Math.random() - 0.5) * sk : 0), this.H / 2 + (sk ? (Math.random() - 0.5) * sk : 0));
  c.gfx.clear();
  if (c.lulu) this.luluFrame(c, t);
  else this.genFrame(c, t);
};

GameScene.prototype.cineEnd = function () {
  const c = this.cine;
  this.cine = null;
  c.vic.stunUntil = this.simNow + c.stunLeft;
  c.objs.forEach((o) => o && o.destroy && o.destroy());
  this.simScale = 2.6; // ralenti pour savourer l'envol
  this.time.delayedCall(750, () => (this.simScale = 1));
  this.cameras.main.shake(380, 0.012);
  const fl = this.add.rectangle(this.W / 2, this.H / 2, this.W, this.H, 0xffffff, 1).setDepth(310);
  this.tweens.add({ targets: fl, alpha: 0, duration: 380, onComplete: () => fl.destroy() });
};

// Lignes de vitesse rayonnantes (coordonnées écran)
GameScene.prototype.radLines = function (c, cx, cy, n, inner, col, alpha, seed) {
  const g = c.gfx;
  const r = seeded(seed);
  const far = Math.hypot(this.W, this.H);
  g.fillStyle(col, alpha);
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2 + r() * 0.12;
    const w = 0.006 + r() * 0.03;
    const r0 = inner * (0.7 + r() * 0.8);
    g.fillTriangle(cx + Math.cos(a - w) * far, cy + Math.sin(a - w) * far, cx + Math.cos(a + w) * far, cy + Math.sin(a + w) * far, cx + Math.cos(a) * r0, cy + Math.sin(a) * r0);
  }
};

// Traits de vitesse horizontaux (course)
GameScene.prototype.hLines = function (c, t, col, alpha, dir) {
  const g = c.gfx;
  const r = seeded(11);
  g.fillStyle(col, alpha);
  for (let i = 0; i < 26; i++) {
    const y = r() * this.H;
    const len = 180 + r() * 420;
    const sp = 1.6 + r() * 2.2;
    const x = (((r() * (this.W + 600) - t * sp * dir) % (this.W + 600)) + (this.W + 600)) % (this.W + 600) - 300;
    g.fillRect(x, y, len, 3 + r() * 4);
  }
};

GameScene.prototype.cText = function (c, str, size, fill, stroke, thick) {
  const t = this.add.text(0, 0, str, { fontFamily: FONT, fontSize: `${size}px`, color: fill, stroke, strokeThickness: thick, align: 'center' }).setOrigin(0.5).setVisible(false);
  c.ui.add(t);
  c.objs.push(t);
  return t;
};

// Paralléllogramme (panneau manga) dans le conteneur ui
GameScene.prototype.panel = function (c, pts, dx, fill, alpha) {
  const g = c.pg;
  const p = pts.map(([x, y]) => ({ x: x + dx, y }));
  g.fillStyle(fill, alpha);
  g.fillPoints(p, true);
  g.lineStyle(10, 0x14121c, 1);
  g.strokePoints(p, true);
  g.lineStyle(4, 0xffffff, 0.9);
  g.strokePoints(p.map((q) => ({ x: q.x + 0, y: q.y })), true);
};

GameScene.prototype.genBuild = function (c) {
  const att = c.att, vic = c.vic;
  const col = att.def.fx.main;
  c.col = col;
  c.dim.setFillStyle(this.lerpCol(0x05060f, col, 0.24));
  c.halftone.setTint(col);
  const poseKey = { toro: 'punch', astra: 'cast', grom: 'grab' }[att.char] || 'punch';
  const mk = (key, ox, oy) => {
    const im = this.add.image(0, 0, key).setOrigin(ox, oy).setVisible(false);
    c.world.add(im);
    c.objs.push(im);
    return im;
  };
  c.wg = this.add.graphics();
  c.world.add(c.wg);
  c.objs.push(c.wg);
  c.vGuard = this.hdTex(vic.char, 'guard');
  c.vHurt = this.hdTex(vic.char, 'hurt');
  c.sa = mk(this.hdTex(att.char, poseKey), 300 / 700, 380 / 700);
  c.sb = mk(c.vGuard, 300 / 700, 380 / 700).setFlipX(true);
  c.burst = mk('burst', 0.5, 0.5);
  c.ring = mk('ring', 0.5, 0.5);
  const hex = '#' + col.toString(16).padStart(6, '0');
  c.shout = this.cText(c, att.def.shout || 'COUP FINAL !', 46, '#ffffff', hex, 14);
  c.name = this.cText(c, att.def.name, 24, '#ffe9a8', '#14121c', 7);
  c.tKo = this.cText(c, 'K.O. !!', 110, '#ffffff', '#e63946', 22);
};

GameScene.prototype.genFrame = function (c, t) {
  const col = c.col;
  const g = c.wg;
  g.clear();
  c.pg.clear();
  const hide = (...o) => o.forEach((x) => x.setVisible(false));
  hide(c.burst, c.ring, c.shout, c.tKo);
  c.flash.setAlpha(0);
  const IMP = 800; // moment de l'impact
  const GROUND = 286;
  const [mx, my] = c.toScr(0, -40);
  // fond : lignes de vitesse rayonnantes (inversées au moment de l'impact)
  const post = t >= IMP;
  c.dim.setFillStyle(post && t < IMP + 380 ? this.lerpCol(0xffffff, col, 0.35) : this.lerpCol(0x05060f, col, 0.24));
  this.radLines(c, mx, my, 54, 150, post && t < IMP + 380 ? 0x14121c : col, 0.45, Math.floor(t / 55));
  this.radLines(c, mx, my, 30, 300, 0xffffff, 0.14, Math.floor(t / 55) + 99);
  // sol
  g.fillStyle(0x14121c, 0.6);
  g.fillRect(-1500, GROUND, 3000, 700);
  g.fillStyle(col, 1);
  g.fillRect(-1500, GROUND, 3000, 8);

  // entrées latérales
  const e = eOut((t - 60) / 340);
  const push = 44 * eIn((t - 420) / 380);
  const ax = -140 - (1 - e) * 760 + push;
  const vx0 = 150 + (1 - e) * 760;
  c.sa.setVisible(true).setPosition(ax, 62).setScale(0.95);

  // effet propre au combattant, sur le poing / la main
  const fx = ax + 205, fy = -60;
  const k = cl01((t - 300) / 480);
  if (t < IMP + 120) {
    if (c.att.char === 'toro') {
      g.fillStyle(0xe8590c, 0.55);
      g.fillCircle(fx, fy, 22 + 44 * k);
      g.fillStyle(0xffb703, 0.8);
      g.fillCircle(fx, fy, 14 + 30 * k);
      g.fillStyle(0xfff3b0, 1);
      g.fillCircle(fx, fy, 8 + 14 * k);
    } else if (c.att.char === 'astra') {
      g.fillStyle(0x7a5cff, 0.5);
      g.fillCircle(fx + 20, fy, 26 + 54 * k);
      g.fillStyle(0x7df9ff, 0.85);
      g.fillCircle(fx + 20, fy, 16 + 34 * k);
      g.fillStyle(0xffffff, 1);
      g.fillCircle(fx + 20, fy, 8 + 18 * k);
    } else {
      g.lineStyle(10, 0xffd166, 0.8 * k);
      g.strokeCircle(fx + 10, fy, 24 + 40 * k);
    }
  }

  // victime
  if (t < IMP) {
    const sh = Math.sin(t / 22) * (t > 500 ? 5 : 1);
    c.sb.setVisible(true).setTexture(c.vGuard).setPosition(vx0 + sh, 62).setScale(0.95).setAngle(0).clearTint();
  } else {
    const tt = t - IMP;
    if (tt < 130) {
      c.sb.setVisible(true).setTexture(c.vHurt).setPosition(150 + tt * 0.12, 62).setScale(0.95 * 1.12, 0.95 * 0.8).setAngle(0).setTintFill(0xffffff);
    } else {
      const kk = tt - 130;
      c.sb.setVisible(true).setTexture(c.vHurt).clearTint().setPosition(165 + kk * 2.2, 62 - kk * 1.0 + kk * kk * 0.0006).setScale(lerp(0.95, 0.4, cl01(kk / 800))).setAngle(kk * 1.05);
      for (let i = 1; i <= 6; i++) {
        const q = Math.max(kk - i * 26, 0);
        g.fillStyle(0xffffff, 0.45 - i * 0.06);
        g.fillCircle(165 + q * 2.2, 62 - q * 1.0 + q * q * 0.0006 - 90, 30 - i * 4);
      }
    }
    if (tt < 420) {
      const u = tt / 420;
      c.burst.setVisible(true).setPosition(112, -48).setScale(lerp(7, 28, eOut(u))).setAlpha(1 - u * 0.8).setAngle(u * 25);
      c.ring.setVisible(true).setTint(0xffffff).setPosition(112, -48).setScale(lerp(1, 17, eOut(u))).setAlpha(1 - u);
      c.shakeUntil = t + 1;
    }
    if (c.att.char === 'grom' && tt < 460) {
      g.lineStyle(8, 0xd9c3a0, 1 - tt / 460);
      g.strokeEllipse(110, GROUND - 4, 120 + tt * 1.6, 20 + tt * 0.1);
    }
  }
  // textes
  const su = cl01((t - 240) / 260);
  if (su > 0 && t < IMP + 250) c.shout.setVisible(true).setPosition(-20, -300).setAngle(-6).setScale(lerp(2.4, 1, eOut(su))).setAlpha(Math.min(su * 3, 1));
  const ku = eOut((t - IMP - 120) / 260);
  if (ku > 0) c.tKo.setVisible(true).setPosition(10, -170 + Math.sin(t / 30) * 3).setAngle(-6).setScale(lerp(3, 1, ku));
  c.name.setVisible(t > 200).setPosition(-330, 322).setAngle(-3);
  // flash d'entrée, d'impact et de sortie
  if (t < 90) c.flash.setAlpha(1 - t / 90);
  else if (t >= IMP && t < IMP + 220) c.flash.setAlpha(1 - (t - IMP) / 220);
  else if (t > c.dur - 320) c.flash.setAlpha((t - (c.dur - 320)) / 320);
};

// ===========================================================================
// CINEMATIQUE DE DEAD LULU
// Course poussée par un footballeur (inspiré d'une poussée d'énergie façon shônen) -> gros plan -> méga frappe de ballon
// ===========================================================================
GameScene.prototype.luluBuild = function (c) {

  const W = this.world;
  const mk = (key, ox, oy) => {
    const im = this.add.image(0, 0, key).setOrigin(ox, oy).setVisible(false);
    c.world.add(im);
    c.objs.push(im);
    return im;
  };
  c.wg = this.add.graphics(); // sol, traînées
  c.world.add(c.wg);
  c.objs.push(c.wg);
  c.wave = mk('wave', 0, 0.5);
  c.foot = mk('foot_push', 300 / 700, 380 / 700).setScale(1.1);
  c.lulu = mk('lulu_run0', 300 / 700, 380 / 700).setScale(1.1);
  c.face = mk('lulu_face', 0.5, 0.5);
  c.kick = mk('lulu_kick', 300 / 700, 380 / 700).setScale(1.2);
  c.ball = mk('ball', 0.5, 0.5);
  c.vGuard = this.hdTex(vic.char, 'guard');
  c.vHurt = this.hdTex(vic.char, 'hurt');
  c.vsp = this.add.image(0, 0, c.vGuard).setOrigin(300 / 700, 380 / 700).setScale(1.1).setFlipX(true).setVisible(false);
  c.world.add(c.vsp);
  c.objs.push(c.vsp);
  c.burst = mk('burst', 0.5, 0.5);
  c.ring = mk('ring', 0.5, 0.5);
  c.orb = this.add.circle(0, 0, 40, 0xbff6ff, 1).setVisible(false);
  c.world.add(c.orb);
  c.objs.push(c.orb);
  c.tName = this.cText(c, 'DEAD LULU', 40, '#ffffff', '#14121c', 10);
  c.tSub = this.cText(c, 'SUPER COUP FINAL', 18, '#ffe9a8', '#14121c', 6);
  c.tHa = this.cText(c, 'HAAAAA !!', 30, '#e2fcff', '#1e8fff', 9);
  c.tGo = this.cText(c, 'ON Y VA !!', 64, '#ffe14d', '#14121c', 14);
  c.tBam = this.cText(c, 'BAM !!', 80, '#ffffff', '#e8590c', 16);
  c.tKo = this.cText(c, 'K.O. !!', 120, '#ffffff', '#e63946', 22);
  void W;
};

GameScene.prototype.luluFrame = function (c, t) {
  const W = this.W, H = this.H;
  const f = c.f;
  const g = c.wg;
  g.clear();
  c.pg.clear();
  const hide = (...o) => o.forEach((x) => x.setVisible(false));
  hide(c.wave, c.foot, c.lulu, c.face, c.kick, c.ball, c.vsp, c.burst, c.ring, c.orb, c.tName, c.tSub, c.tHa, c.tGo, c.tBam, c.tKo);
  c.flash.setAlpha(0);
  c.halftone.setAlpha(0.14);

  const GROUND = 322;
  const ground = (colTop, colBot) => {
    g.fillStyle(colBot, 1);
    g.fillRect(-1500, GROUND, 3000, 600);
    g.fillStyle(colTop, 1);
    g.fillRect(-1500, GROUND, 3000, 10);
  };

  // ---------------------------------------------------------------- P1 : la course
  if (t < 1560) {
    c.dim.setFillStyle(0xff9f1c);
    c.halftone.setTint(0xffffff);
    this.hLines(c, t, 0xffffff, 0.55, 1);
    const [gx, gy] = c.toScr(0, 0);
    void gx; void gy;
    ground(0xffffff, 0x2b1a3a);
    // bandes de sol qui défilent
    g.fillStyle(0x3d2655, 1);
    for (let i = 0; i < 14; i++) {
      const x = ((i * 220 - t * 1.9) % 3080) - 1540;
      g.fillPoints([{ x, y: GROUND + 14 }, { x: x + 110, y: GROUND + 14 }, { x: x + 40, y: GROUND + 60 }, { x: x - 70, y: GROUND + 60 }], true);
    }
    const u = cl01(t / 1500);
    const lx = -700 + 800 * u * (0.4 + 0.6 * u);
    const bob = Math.sin(t / 55) * 7;
    c.lulu.setVisible(true).setTexture(Math.floor(t / 105) % 2 ? 'lulu_run0' : 'lulu_run1').setPosition(lx, 60 + bob);
    // footballeur derrière, bras tendu qui pousse
    const fx = lx - 345;
    c.foot.setVisible(true).setPosition(fx, 62 - bob * 0.5);
    const hx = fx + 266, hy = 62 - 129 - bob * 0.5;
    // vague d'énergie : de la main jusque devant Lulu
    const wu = eOut((t - 220) / 500);
    if (wu > 0) {
      const len = 1500;
      c.wave.setVisible(true).setPosition(hx, hy + 8).setScale((len / 900) * wu, lerp(0.15, 0.62, wu) * (0.92 + 0.08 * Math.sin(t / 30)));
      c.orb.setVisible(true).setPosition(hx + 10, hy + 8).setRadius(lerp(10, 46, wu) + Math.sin(t / 40) * 5);
    }
    // ordre d'affichage : vague derrière Lulu, devant le sol
    c.world.bringToTop(c.foot);
    c.world.bringToTop(c.wave);
    c.world.bringToTop(c.lulu);
    c.world.bringToTop(c.orb);
    const ha = cl01((t - 380) / 200);
    if (ha > 0) c.tHa.setVisible(true).setPosition(f * (fx + 60), -250).setScale(1 + 0.12 * Math.sin(t / 40)).setAngle(-6 * f);
    const na = eOut((t - 100) / 300);
    c.tName.setVisible(na > 0).setPosition(-330 - (1 - na) * 500, 215).setAngle(-4);
    c.tSub.setVisible(na > 0).setPosition(-290 - (1 - na) * 500, 262).setAngle(-4);
    if (t > 1450) c.flash.setAlpha(cl01((t - 1450) / 110));
    return;
  }

  // ---------------------------------------------------------------- P2 : gros plan
  if (t < 2300) {
    const tt = t - 1560;
    c.dim.setFillStyle(0xb5121b);
    c.halftone.setTint(0x000000).setAlpha(0.2);
    const [fx, fy] = c.toScr(-120, -10);
    this.radLines(c, fx, fy, 60, 160, 0xffffff, 0.5, Math.floor(t / 45));
    this.radLines(c, fx, fy, 24, 300, 0xffe14d, 0.3, Math.floor(t / 45) + 5);
    const u = cl01(tt / 740);
    const sc = lerp(0.98, 1.1, u);
    c.face.setVisible(true).setPosition(f * -120, 30).setScale(sc);
    // éclat dans l'oeil
    if (tt > 330 && tt < 560) {
      const k = (tt - 330) / 230;
      c.burst.setVisible(true).setPosition(f * (-120 + 58 * sc * -1), 30 + (-62) * sc).setScale(lerp(1, 7, Math.sin(k * Math.PI))).setAngle(k * 60);
    }
    const gu = eOut((tt - 100) / 260);
    c.tGo.setVisible(gu > 0).setPosition(300, -20 + (1 - gu) * 120).setAngle(-6).setScale(lerp(1.8, 1, gu));
    c.flash.setAlpha(tt < 90 ? 1 - tt / 90 : 0);
    return;
  }

  // ---------------------------------------------------------------- P3 : la frappe
  const BALL = [-20, 79];
  const VIC = [330, 66]; // hanche de la victime
  const VHIT = [262, 8]; // point d'impact (torse)
  const IMPACT = 2300 + 560; // moment de la frappe
  const HIT = IMPACT + 520; // moment où le ballon touche
  if (t < HIT) {
    const tt = t - 2300;
    c.dim.setFillStyle(0x0b1d4a);
    c.halftone.setTint(0x4cc9f0).setAlpha(0.12);
    const [vx, vy] = c.toScr(f * VHIT[0], VHIT[1]);
    this.radLines(c, vx, vy, 52, 200, 0x9ff3ff, 0.35, Math.floor(t / 50));
    ground(0x4cc9f0, 0x0a1230);
    const lu = eOut(tt / 260);
    c.kick.setVisible(true).setPosition(-300 - (1 - lu) * 420, 60);
    // victime qui attend
    c.vsp.setVisible(true).setTexture(c.vGuard).setPosition(VIC[0] + Math.sin(t / 22) * 3, VIC[1]).setScale(1.1).setAngle(0).clearTint();
    if (t < IMPACT) {
      const hop = Math.abs(Math.sin(tt / 90)) * 8 * (1 - tt / 560);
      c.ball.setVisible(true).setPosition(BALL[0], BALL[1] - hop).setScale(0.9).setAngle(0);
      // aura de charge sur le pied
      const k = cl01(tt / 560);
      g.fillStyle(0xffd166, 0.35 + 0.3 * k);
      g.fillCircle(BALL[0] - 20, BALL[1], 30 + 60 * k);
      g.fillStyle(0xffffff, 0.5 * k);
      g.fillCircle(BALL[0] - 20, BALL[1], 14 + 30 * k);
    } else {
      const pu = (t - IMPACT) / (HIT - IMPACT);
      const e = eIn(pu);
      const bx = lerp(BALL[0], VHIT[0] - 12, e), by = lerp(BALL[1], VHIT[1] + 10, e);
      const bs = lerp(0.9, 1.7, e);
      c.ball.setVisible(true).setPosition(bx, by).setScale(bs).setAngle(t * 0.9);
      // traînée de flammes / énergie
      for (let k = 9; k >= 1; k--) {
        const q = Math.max(e - k * 0.06, 0);
        const px = lerp(BALL[0], VHIT[0] - 12, q), py = lerp(BALL[1], VHIT[1] + 10, q);
        const rr = 62 * bs * (1 - k / 11);
        g.fillStyle(k % 2 ? 0xff7b00 : 0xffd166, 0.7 - k * 0.05);
        g.fillCircle(px, py, rr);
      }
      // onde de choc de la frappe
      const su = cl01((t - IMPACT) / 260);
      c.ring.setVisible(su < 1).setTint(0xffffff).setPosition(BALL[0] - 30, BALL[1]).setScale(lerp(0.5, 11, eOut(su))).setAlpha(1 - su);
      c.burst.setVisible(su < 1).setPosition(BALL[0] - 10, BALL[1]).setScale(lerp(3, 16, eOut(su))).setAlpha(1 - su);
      if (t - IMPACT < 160) c.shakeUntil = t + 1;
      // lignes d'impact horizontales
      this.hLines(c, t * 3, 0xffffff, 0.6, -1);
      const bu = eOut((t - IMPACT) / 140);
      c.tBam.setVisible(true).setPosition(-110, -150).setAngle(-8).setScale(lerp(2.4, 1, bu));
    }
    c.tName.setVisible(true).setPosition(-330, 300).setAngle(-4).setScale(0.7);
    if (t < IMPACT && tt < 60) c.flash.setAlpha(0.6 * (1 - tt / 60));
    return;
  }

  // ---------------------------------------------------------------- P4 : l'impact et l'envol
  const tt = t - HIT;
  c.dim.setFillStyle(tt < 380 ? 0xffe14d : 0x14121c);
  c.halftone.setTint(0xe63946).setAlpha(0.22);
  const [vx, vy] = c.toScr(f * VHIT[0], VHIT[1]);
  this.radLines(c, vx, vy, 64, 100, tt < 380 ? 0x14121c : 0xffe14d, 0.5, Math.floor(t / 45));
  ground(0xffe14d, 0x120e26);
  c.kick.setVisible(true).setPosition(-300, 60);
  // victime : écrasée une fraction de seconde, puis catapultée
  if (tt < 140) {
    c.vsp.setVisible(true).setTexture(c.vHurt).setPosition(VIC[0] + tt * 0.1, VIC[1]).setScale(1.1 * 1.15, 1.1 * 0.78).setAngle(0).setTintFill(0xffffff);
  } else {
    const k = tt - 140;
    c.vsp.clearTint();
    c.vsp.setVisible(true).setTexture(c.vHurt).setPosition(VIC[0] + k * 2.1, VIC[1] - k * 1.15 + k * k * 0.0005).setScale(lerp(1.1, 0.42, cl01(k / 800))).setAngle(k * 1.1);
    // traînée d'envol
    for (let i = 1; i <= 6; i++) {
      const kk = Math.max(k - i * 28, 0);
      g.fillStyle(0xffffff, 0.5 - i * 0.07);
      g.fillCircle(VIC[0] + kk * 2.1, VIC[1] - 90 - kk * 1.15 + kk * kk * 0.0005, 38 - i * 5);
    }
  }
  if (tt < 420) {
    const u = tt / 420;
    c.burst.setVisible(true).setPosition(VHIT[0], VHIT[1]).setScale(lerp(8, 34, eOut(u))).setAlpha(1 - u * 0.8).setAngle(u * 25);
    c.ring.setVisible(true).setTint(0xffffff).setPosition(VHIT[0], VHIT[1]).setScale(lerp(1, 18, eOut(u))).setAlpha(1 - u);
    c.shakeUntil = t + 1;
  }
  // ballon qui rebondit
  if (tt < 500) c.ball.setVisible(true).setPosition(VHIT[0] - 80 - tt * 0.5, 215 + Math.sin(tt / 90) * 26).setScale(1.2).setAngle(-tt);
  // K.O.
  const ku = eOut((tt - 220) / 260);
  if (ku > 0) c.tKo.setVisible(true).setPosition(0, -60 + Math.sin(t / 30) * 3).setAngle(-6).setScale(lerp(3.2, 1, ku));
  c.tName.setVisible(true).setPosition(-330, 300).setAngle(-4).setScale(0.7);
  // flash au contact, flash de sortie
  if (tt < 260) c.flash.setAlpha(1 - tt / 260);
  else if (t > c.dur - 380) c.flash.setAlpha(cl01((t - (c.dur - 380)) / 380));
};

// ===========================================================================
// MODE CAMPAGNE : "La Nuit des Éclats" — 6 chapitres, dialogues, boss final (L'OMBRE)
// Greffé sur GameScene : menu, dialogues, enchaînement des combats, sauvegarde locale.
// ===========================================================================
const SAVE_KEY = 'brawl_campaign_v1';
function campSave() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify({ hero: camp.hero, ch: camp.ch })); } catch (e) {}
}
function campLoad() {
  try {
    const s = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null');
    if (s && ORDER.includes(s.hero) && s.ch >= 0 && s.ch < 6) return s;
  } catch (e) {}
  return null;
}
function campClear() {
  try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
}

// Réglages de difficulté par chapitre (le dernier est l'Ombre)
const CAMP_DIFF = [
  { stocks: 2, aggr: 0.8, dmg: 0.85, spd: 0.95 },
  { stocks: 2, aggr: 0.95, dmg: 0.95, spd: 1.0 },
  { stocks: 3, aggr: 1.1, dmg: 1.0, spd: 1.0 },
  { stocks: 3, aggr: 1.25, dmg: 1.05, spd: 1.02 },
  { stocks: 3, aggr: 1.4, dmg: 1.1, spd: 1.04 },
  { stocks: 3, aggr: 1.6, dmg: 1.2, spd: 1.06 },

const SPEAKER = { nar: { n: '', c: '#cfd3ff' }, ombre: { n: 'L\'OMBRE', c: '#9b8cff' } };

function campOpp(hero, ch) {
  const others = ORDER.filter((x) => x !== hero);
  return ch < 5 ? others[ch] : hero;
}
function campChapterLines(ch) {
  const hero = camp.hero;
  const opp = campOpp(hero, ch);
  const key = ch < 5 ? opp : 'ombre';
  const title = ch < 5 ? `CHAPITRE ${ch + 1} : ${CHARS[opp].name}` : 'CHAPITRE FINAL : L\'OMBRE';
  const lines = [['title', title], ...STORY.intro[key]];
  return ch === 0 ? [...STORY.prologue, ...lines] : lines;
}

Object.assign(GameScene.prototype, {
  // ----- Menu principal ---------------------------------------------------
  menuButtons(list, y0) {
    const D = 120;
    this.uiBtns = [];
    const bw = Math.min(this.W - 80, 520), bh = L.portrait ? 84 : 70, gap = 22;
    list.forEach((b, i) => {
      const y = y0 + i * (bh + gap);
      const r = this.add.rectangle(this.W / 2, y, bw, bh, 0x1a1d33, 1).setStrokeStyle(4, b.col || 0xf72585).setDepth(D);
      const t = this.add.text(this.W / 2, y, b.label, { fontFamily: FONT, fontSize: L.portrait ? '20px' : '18px', color: '#ffffff', stroke: '#000', strokeThickness: 5, align: 'center' }).setOrigin(0.5).setDepth(D + 1);
      this.ui.push(r, t);
      this.uiBtns.push({ x: this.W / 2, y, w: bw, h: bh, fn: b.fn });
    });
  },

  menuBase(title, opts) {
    opts = opts || {};
    this.clearUi();
    this.state = 'menu';
    this.barBtn = null;
    const small = !!opts.small;
    this.ui.push(
      this.add.rectangle(this.W / 2, this.H / 2, this.W, this.H, 0x0b0d1f, 0.88).setDepth(100),
      this.add.text(this.W / 2, small ? 100 : this.H * (L.portrait ? 0.14 : 0.21), title, { fontFamily: FONT, fontSize: small ? '36px' : L.portrait ? '44px' : '48px', color: '#ffffff', stroke: '#f72585', strokeThickness: small ? 8 : 10, align: 'center', lineSpacing: 10 }).setOrigin(0.5).setDepth(101)
    );
    if (typeof ONLINE_OK !== 'undefined' && ONLINE_OK && !opts.noBar && Auth.name) this.drawBar();
  },

  // encart pseudo en haut : un toucher ouvre le profil
  drawBar() {
    const p = Auth.profile;
    let txt = Auth.name.toUpperCase().slice(0, 16);
    txt += Auth.session ? (p ? `  -  ${p.rating} PTS` : '') : '  (INVITE)';
    const w = Math.min(Math.max(300, txt.length * 20 + 80), this.W - 40), h = 46, x = this.W / 2, y = 32;
    this.ui.push(
      this.add.rectangle(x, y, w, h, 0x1a1d33, 1).setStrokeStyle(3, 0xffe9a8).setDepth(130),
      this.add.text(x, y, txt + '  >', { fontFamily: FONT, fontSize: '15px', color: '#ffe9a8', stroke: '#000', strokeThickness: 4 }).setOrigin(0.5).setDepth(131)
    );
    this.barBtn = { x, y, w, h, fn: () => this.showProfile() };
  },

  showMenu() {
    this.menuBase('BRAWL\nPROTO');
    const y0 = this.H * (L.portrait ? 0.38 : 0.5);
    this.menuButtons(
      [
        { label: 'JOUER', fn: () => this.showPlayMenu() },
        { label: 'CAMPAGNE', col: 0x4cc9f0, fn: () => this.showCampMenu() },
        { label: 'COMMENT JOUER', col: 0x6ee7b7, fn: () => this.showHelp() },
      ],
      y0
    );
  },

  showPlayMenu() {
    this.menuBase('JOUER');
    const list = [{ label: 'VS BOT', fn: () => { campPick = false; camp = null; this.showSelect(); } }];
    if (typeof ONLINE_OK !== 'undefined' && ONLINE_OK)
      list.push({ label: 'EN LIGNE', col: 0xffb703, fn: async () => { if (await Auth.ensure()) setTimeout(goOnline, 0); } });
    list.push({ label: 'RETOUR', col: 0x888888, fn: () => this.showMenu() });
    this.menuButtons(list, this.H * (L.portrait ? 0.38 : 0.5));
  },

  showCampMenu() {
    const save = campLoad();
    if (!save) {
      campPick = true;
      this.showSelect();
      return;
    }
    this.menuBase('CAMPAGNE');
    const y0 = this.H * (L.portrait ? 0.36 : 0.46);
    this.menuButtons(
      [
        { label: `CONTINUER\n${CHARS[save.hero].name} - CHAP. ${save.ch + 1}/6`, fn: () => this.campResume(save) },
        { label: 'NOUVELLE PARTIE', col: 0xffb703, fn: () => { campPick = true; this.showSelect(); } },
        { label: 'RETOUR', col: 0x888888, fn: () => this.showMenu() },
      ],
      y0
    );
  },

  uiTap(p) {
    if (this.state === 'story' && this.storyTap) {
      this.storyTap();
      return;
    }
    const bb = this.barBtn;
    if (bb && Math.abs(p.x - bb.x) <= bb.w / 2 && Math.abs(p.y - bb.y) <= bb.h / 2) {
      bb.fn();
      return;
    }
    for (const b of this.uiBtns || []) {
      if (Math.abs(p.x - b.x) <= b.w / 2 && Math.abs(p.y - b.y) <= b.h / 2) {
        b.fn();
        return;
      }
    }
  },

  // ----- Déroulement de la campagne ----------------------------------------
  campNew(hero) {
    campPick = false;
    camp = { hero, ch: 0 };
    campSave();
    this.campChapter();
  },

  campResume(save) {
    camp = { hero: save.hero, ch: save.ch };
    campPick = false;
    this.campChapter(true);
  },

  campChapter(skipPrologue) {
    camp.phase = 'story';
    camp.after = 'match';
    camp.opp = campOpp(camp.hero, camp.ch);
    let lines = campChapterLines(camp.ch);
    if (skipPrologue && camp.ch === 0) lines = lines.slice(STORY.prologue.length);
    camp.lines = lines;
    chosen = camp.hero;
    goSelect = false;
    this.scene.restart();
  },

  campEnter() {
    const c = camp;
    this.setControls(false);
    if (c.phase === 'story') {
      this.state = 'story';
      this.campStory();
    } else if (c.phase === 'match') {
      this.setControls(true);
      this.state = 'play';
      chosen = c.hero;
      this.forceBot = c.opp;
      this.beginMatch(c.hero);
      this.campApply();
    } else if (c.phase === 'lost') {
      this.showCampLost();
    }
  },

  campApply() {
    const d = CAMP_DIFF[camp.ch];
    const e = this.p2;
    e.stocks = d.stocks;
    e.aggr = d.aggr;
    e.dmgMul = d.dmg;
    e.spdMul = d.spd;
    if (camp.ch === 5) {
      e.shade = 0x7c6bd6;
      e.tag.setText('OMBRE');
      e.hud.name.setText('OMBRE');
    }
    this.add
      .text(this.W / 2, 78, camp.ch === 5 ? 'CHAPITRE FINAL' : `CHAPITRE ${camp.ch + 1}/6`, { fontFamily: FONT, fontSize: '14px', color: '#ffe9a8', stroke: '#000', strokeThickness: 4 })
      .setOrigin(0.5)
      .setDepth(50);
  },

  campFinish(won) {
    const c = camp;
    let fired = false;
    const go = () => {
      if (fired) return;
      fired = true;
      this.campSkip = null;
      if (won) {
        c.phase = 'story';
        const key = c.ch < 5 ? c.opp : null;
        c.lines = key ? STORY.outro[key] : STORY.epilogue;
        c.after = key ? 'advance' : 'quit';
      } else c.phase = 'lost';
      if (won && c.ch === 5) campClear();
      this.scene.restart();
    };
    this.campSkip = go;
    this.sub.setText(won ? 'TOUCHE POUR CONTINUER' : '');
    this.time.delayedCall(won ? 3500 : 2200, go);
  },

  showCampLost() {
    this.state = 'menu';
    this.ui.push(this.add.rectangle(this.W / 2, this.H / 2, this.W, this.H, 0x0b0d1f, 0.92).setDepth(100));
    this.ui.push(this.add.text(this.W / 2, this.H * 0.2, 'DEFAITE...', { fontFamily: FONT, fontSize: '44px', color: '#ff5a6e', stroke: '#000', strokeThickness: 8 }).setOrigin(0.5).setDepth(101));
    this.menuButtons(
      [
        { label: 'REESSAYER', fn: () => { camp.phase = 'match'; this.scene.restart(); } },
        { label: 'MENU PRINCIPAL', col: 0x888888, fn: () => { camp = null; chosen = null; goSelect = false; this.scene.restart(); } },
      ],
      this.H * (L.portrait ? 0.4 : 0.5)
    );
  },

  // ----- Dialogues ---------------------------------------------------------
  setControls(v) {
    (this.ctrlObjs || []).forEach((o) => o.setVisible(v));
  },

  campStory() {
    const c = camp;
    const D = 110;
    const W = this.W, H = this.H;
    const lines = c.lines.slice();
    const heroName = CHARS[c.hero].name;
    const oppId = c.opp;
    const gy = L.baseY - 34;

    // les deux personnages sur la scène
    const hs = this.add.image(W / 2 - 150, gy, `${c.hero}_idle0`).setScale(PX).setDepth(10);
    const os = this.add.image(W / 2 + 150, gy, `${oppId}_idle0`).setScale(PX).setDepth(10).setFlipX(true);
    if (c.ch === 5) os.setTint(0x7c6bd6);
    this.ui.push(hs, os);
    this.tweens.add({ targets: [hs, os], y: gy + 3, duration: 450, yoyo: true, repeat: -1 });

    const ph = L.portrait ? 270 : 190;
    const py = H - ph / 2 - 16;
    this.ui.push(this.add.rectangle(W / 2, py, W - 32, ph, 0x0b0d1f, 0.94).setStrokeStyle(4, 0xffffff, 0.8).setDepth(D));
    const fs = L.portrait ? 20 : 17;
    const name = this.add.text(32 + 18, py - ph / 2 + 16, '', { fontFamily: FONT, fontSize: fs + 2 + 'px', color: '#fff', stroke: '#000', strokeThickness: 5 }).setDepth(D + 1);
    const body = this.add
      .text(32 + 18, py - ph / 2 + 16 + fs + 20, '', { fontFamily: FONT, fontSize: fs + 'px', color: '#ffffff', lineSpacing: 10, wordWrap: { width: W - 100 } })
      .setDepth(D + 1);
    const more = this.add.text(W - 52, py + ph / 2 - 22, '▼', { fontFamily: FONT, fontSize: '18px', color: '#ffe9a8' }).setOrigin(0.5).setDepth(D + 1);
    this.tweens.add({ targets: more, alpha: 0.2, duration: 450, yoyo: true, repeat: -1 });
    this.ui.push(name, body, more);

    let cur = null, typing = null, full = '';
    const finish = () => {
      if (typing) typing.remove();
      typing = null;
      body.setText(full);
      more.setVisible(true);
    };
    const next = () => {
      const ln = lines.shift();
      if (!ln) {
        this.storyTap = null;
        const a = c.after;
        if (a === 'match') c.phase = 'match';
        else if (a === 'advance') {
          c.ch++;
          campSave();
          c.opp = campOpp(c.hero, c.ch);
          c.phase = 'story';
          c.after = 'match';
          c.lines = campChapterLines(c.ch);
        } else {
          camp = null;
          chosen = null;
          goSelect = false;
        }
        this.scene.restart();
        return;
      }
      const [who, raw] = ln;
      if (who === 'title') {
        // carte de chapitre
        name.setText('');
        full = raw;
        body.setText('').setFontSize(fs + 6);
        body.setColor('#ffe9a8');
      } else {
        body.setFontSize(fs).setColor('#ffffff');
        let spk = SPEAKER[who];
        if (who === 'hero') spk = { n: heroName, c: '#ffe9a8' };
        else if (!spk) spk = { n: CHARS[who].name, c: CHARS[who].roleCol };
        name.setText(spk.n).setColor(spk.c);
        full = raw;
        body.setText('');
        const isHero = who === 'hero';
        hs.setAlpha(who === 'nar' || isHero ? 1 : 0.55);
        os.setAlpha(who === 'nar' || (!isHero && who !== 'nar') ? 1 : 0.55);
      }
      more.setVisible(false);
      let i = 0;
      typing = this.time.addEvent({
        delay: 26,
        loop: true,
        callback: () => {
          i++;
          body.setText(full.slice(0, i));
          if (i >= full.length) finish();
        },
      });
    };
    this.storyTap = () => (typing ? finish() : next());
    next();
  },
});

// ===========================================================================
// NETCODE : rollback (type GGPO) pour le duel en ligne 1v1
//  - snapshot()/restore() : état complet du combat, restauré à l'identique
//  - netStep() : prédit l'adversaire, corrige et rejoue les images quand son vrai input arrive
//  - pendant un rejeu, aucun effet visuel (sinon on verrait chaque coup en double)
// ===========================================================================
const NET_DELAY = 2; // images de retard volontaire sur MES commandes (≈ 33 ms) : rend les prédictions presque toujours justes
const NET_MAX_PRED = 9; // on attend l'adversaire au-delà de 9 images prédites (≈ 150 ms)
const NET_KEEP = 40;

// Objet « neutre » : accepte n'importe quel appel et ne dessine rien (utilisé pendant les rejeux)
const NULLOBJ = new Proxy(function () {}, {
  get: (t, k) => (k === Symbol.toPrimitive ? () => 0 : k === 'then' ? undefined : NULLOBJ),
  apply: () => NULLOBJ,
  set: () => true,
});

const P_FIELDS = ['facing', 'damage', 'stocks', 'jumps', 'stunUntil', 'cdUntil', 'invulnUntil', 'lastJump', 'guard', 'blocking', 'prevBlock', 'rollUntil', 'rollCd', 'rollDir', 'dodgeUntil', 'airDodged', 'guardBreakUntil', 'rage', 'rageUntil', 'charmUntil', 'upUsed', 'altIdx'];

// --- entrées : 1 entier par image (sx, sy sur 8 bits, + 4 boutons) -> identique des deux côtés
function packInput(i) {
  const q = (v) => Math.max(-127, Math.min(127, Math.round(v * 127))) + 127;
  return q(i.sx || 0) | (q(i.sy || 0) << 8) | (i.jump ? 1 << 16 : 0) | (i.attack ? 1 << 17 : 0) | (i.hold ? 1 << 18 : 0) | (i.block ? 1 << 19 : 0);
}
function unpackInput(v) {
  return { sx: ((v & 255) - 127) / 127, sy: (((v >> 8) & 255) - 127) / 127, jump: !!(v & (1 << 16)), attack: !!(v & (1 << 17)), hold: !!(v & (1 << 18)), block: !!(v & (1 << 19)) };
}
const NEUTRAL_IN = packInput({});
// pour prédire : on garde la direction et les boutons maintenus, jamais les « appuis » ponctuels
const predictFrom = (v) => v & ~((1 << 16) | (1 << 17));

function hashStr(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) {
    h ^= s.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}

Object.assign(GameScene.prototype, {
  // ----- Etat ------------------------------------------------------------
  snapshot() {
    const pls = [this.p1, this.p2].map((pl) => {
      const b = pl.sprite.body;
      const o = {
        sx: pl.sprite.x, sy: pl.sprite.y,
        px: b.position.x, py: b.position.y, ppx: b.prev.x, ppy: b.prev.y, pfx: b.prevFrame.x, pfy: b.prevFrame.y,
        vx: b.velocity.x, vy: b.velocity.y, g: b.allowGravity ? 1 : 0,
        bd: b.blocked.down ? 1 : 0, bu: b.blocked.up ? 1 : 0, td: b.touching.down ? 1 : 0, tn: b.touching.none ? 1 : 0,
        atk: pl.atk ? JSON.parse(JSON.stringify(pl.atk)) : null,
        grab: pl.grab ? { v: pl.grab.victim.i, start: pl.grab.start, slamAt: pl.grab.slamAt, spec: pl.grab.spec } : null,
        moveCd: { ...pl.moveCd },
      };
      P_FIELDS.forEach((k) => (o[k] = pl[k]));
      return o;
    });
    const projs = this.projs
      .filter((p) => !p.dead)
      .map((p) => ({
        id: p.id, o: p.owner.i, t: p.target.i, spec: p.spec, x: p.x, y: p.y, vx: p.vx, vy: p.vy, born: p.born, armedAt: p.armedAt, lastTrail: p.lastTrail, f: p.f,
        spent: !!p.spent, bounced: !!p.bounced, carry: p.carry ? { ...p.carry } : null, hits: p.hits ? [...p.hits].map((q) => q.i) : null,
      }));
    return JSON.stringify({ pls, projs, timers: this.timers, frame: this.frame, simFrames: this.simFrames, freeze: this.freezeLeft, atkSeq: this.atkSeq, projSeq: this.projSeq });
  },

  restore(str) {
    const S = JSON.parse(str);
    [this.p1, this.p2].forEach((pl, i) => {
      const o = S.pls[i];
      const s = pl.sprite, b = s.body;
      b.stop();
      s.setPosition(o.sx, o.sy);
      b.position.set(o.px, o.py);
      b.prev.set(o.ppx, o.ppy);
      b.prevFrame.set(o.pfx, o.pfy);
      b.updateCenter();
      b.velocity.set(o.vx, o.vy);
      b.allowGravity = !!o.g;
      b.blocked.down = !!o.bd; b.blocked.up = !!o.bu; b.touching.down = !!o.td; b.touching.none = !!o.tn;
      P_FIELDS.forEach((k) => (pl[k] = o[k]));
      pl.atk = o.atk;
      pl.moveCd = { ...o.moveCd };
      pl.grab = o.grab ? { victim: this.pl(o.grab.v), start: o.grab.start, slamAt: o.grab.slamAt, spec: o.grab.spec } : null;
      s.setFlipX(pl.facing < 0);
      if (!pl.grab) s.setAngle(0);
    });
    // projectiles : on garde les sprites existants, on recrée ceux qui manquent
    const live = new Map(this.projs.map((p) => [p.id, p]));
    const keep = new Set();
    this.projs = S.projs.map((d) => {
      let p = live.get(d.id);
      keep.add(d.id);
      const owner = this.pl(d.o), target = this.pl(d.t);
      const fields = { owner, target, spec: d.spec, x: d.x, y: d.y, vx: d.vx, vy: d.vy, born: d.born, armedAt: d.armedAt, lastTrail: d.lastTrail, f: d.f, spent: d.spent, bounced: d.bounced, carry: d.carry, dead: false, hits: d.hits ? new Set(d.hits.map((j) => this.pl(j))) : null };
      if (!p) {
        p = { id: d.id, ...fields, sprite: null };
        p.sprite = this.makeProjSprite(p);
      } else Object.assign(p, fields);
      return p;
    });
    live.forEach((p, id) => {
      if (!keep.has(id) && p.sprite && p.sprite !== NULLOBJ) p.sprite.destroy();
    });
    this.timers = S.timers;
    this.frame = S.frame;
    this.simFrames = S.simFrames;
    this.simNow = S.simFrames * STEP_MS;
    this.nowT = this.simNow;
    this.freezeLeft = S.freeze;
    this.atkSeq = S.atkSeq;
    this.projSeq = S.projSeq;
  },

  makeProjSprite(p) {
    const sp = p.spec;
    const img = this.add.image(p.x, p.y, sp.tex).setScale(sp.s || 3).setDepth(sp.kind === 'mine' ? 8 : 24);
    if (img === NULLOBJ) return NULLOBJ;
    if (sp.kind === 'hook') img.setAngle(p.f * 90);
    else if (sp.kind === 'eagle') img.setAngle(-90).setDepth(27);
    else if (sp.kind === 'ball') img.setDepth(25);
    else if (sp.kind === 'hermine') img.setOrigin(0.5, 1).setScale(sp.s, sp.s);
    else if (sp.kind === 'corgi') img.setFlipX(p.f < 0);
    else if (sp.kind === 'book') img.setDepth(26).setAngle(-12);
    return img;
  },

  // ----- Rejeu silencieux --------------------------------------------------
  beginResim() {
    if (this.resim) return;
    this.resim = true;
    this._real = { add: this.add, tweens: this.tweens, time: this.time, cameras: this.cameras };
    this.add = NULLOBJ;
    this.tweens = NULLOBJ;
    this.time = NULLOBJ;
    this.cameras = NULLOBJ;
  },
  endResim() {
    if (!this.resim) return;
    Object.assign(this, this._real);
    this.resim = false;
    this.projs.forEach((p) => {
      if (p.sprite === NULLOBJ) p.sprite = this.makeProjSprite(p);
    });
  },

  // ----- Match en ligne ------------------------------------------------------
  // cfg : { me: 0|1, chars: [id0, id1], send(msg) }
  beginNetMatch(cfg) {
    this.clearUi();
    this.state = 'play';
    this.setControls && this.setControls(true);
    const [c0, c1] = cfg.chars;
    this.p1 = this.makePlayer(c0, this.W / 2 - 150, L.baseY - 110, cfg.me === 0);
    this.p2 = this.makePlayer(c1, this.W / 2 + 150, L.baseY - 110, cfg.me === 1);
    if (cfg.names) [this.p1, this.p2].forEach((pl, i) => pl.tag.setText(String(cfg.names[i] || '').toUpperCase().slice(0, 12)));
    this.p1.facing = 1;
    this.p2.facing = -1;
    this.p1.i = 0;
    this.p2.i = 1;
    this.projSeq = 0;
    this.buildHud();
    [this.p1, this.p2].forEach((pl) => this.shieldUi(pl));
    const D = NET_DELAY;
    this.net = {
      me: cfg.me, send: cfg.send,
      inputs: [{}, {}], // inputs[joueur][image] = entier
      used: {}, snaps: {}, verified: -1, lastRemote: NEUTRAL_IN,
      hashes: { mine: {}, theirs: {} }, desync: false, stalled: 0, rollbacks: 0, maxRoll: 0,
    };
    for (let f = 0; f < D; f++) this.net.inputs[0][f] = this.net.inputs[1][f] = NEUTRAL_IN; // images 0..D-1 : neutre pour les deux
    // les gestes de pistolet/charge utilisent le hasard des bots : jamais en ligne
    this.autoP1 = false;
    this.curIn = [NEUTRAL_IN, NEUTRAL_IN];
    this.netInput = (i) => unpackInput(this.curIn[i]);
    this.snapAt = {};
  },

  netReceive(msg) {
    const n = this.net;
    if (!n) return;
    const r = 1 - n.me;
    if (msg.t === 'in') {
      msg.a.forEach(([f, v]) => {
        if (n.inputs[r][f] === undefined) n.inputs[r][f] = v;
      });
    } else if (msg.t === 'hash') {
      n.hashes.theirs[msg.f] = msg.h;
      this.netCheckHash(msg.f);
    }
  },

  netCheckHash(f) {
    const n = this.net;
    const a = n.hashes.mine[f], b = n.hashes.theirs[f];
    if (a === undefined || b === undefined) return;
    if (a !== b && !n.desync) {
      n.desync = true;
      n.send({ t: 'desync', f });
      if (this.onDesync) this.onDesync(f);
    }
    delete n.hashes.mine[f];
    delete n.hashes.theirs[f];
  },

  sampleLocal() {
    const inp = { sx: this.stick.sx, sy: this.stick.sy, jump: this.queue.jump, attack: this.queue.attack, hold: this.btn.attack.id !== null, block: this.btn.block.id !== null };
    this.queue.jump = this.queue.attack = this.queue.block = false;
    return packInput(inp);
  },

  netUpdate(delta) {
    const n = this.net;
    this.acc = Math.min((this.acc || 0) + Math.min(delta, 100), STEP_MS * 6);
    while (this.acc >= STEP_MS && !this.over) {
      // trop d'images prédites sans nouvelles de l'adversaire : on patiente
      if (this.frame - n.verified > NET_MAX_PRED) {
        n.stalled++;
        this.netVerify(this.frame);
        if (n.stalled % 3 === 0) {
          // en attente : on renvoie nos dernières entrées (sinon blocage mutuel avec l'envoi à 30 Hz)
          const pk = [];
          for (let k = this.frame + NET_DELAY; k > this.frame + NET_DELAY - 8 && k >= 0; k--) if (n.inputs[n.me][k] !== undefined) pk.push([k, n.inputs[n.me][k]]);
          n.send({ t: 'in', a: pk });
        }
        break;
      }
      this.acc -= STEP_MS;
      this.netStep();
    }
    this.updateHud();
  },

  // vérifie les prédictions contre les vraies commandes reçues (rollback si besoin) + empreintes
  netVerify(f) {
    const n = this.net;
    const r = 1 - n.me;
    // 2. l'adversaire a-t-il fait autre chose que prévu ?
    let mis = -1;
    let v = n.verified + 1;
    while (v < f && n.inputs[r][v] !== undefined) {
      if (n.used[v][r] !== n.inputs[r][v]) {
        mis = v;
        break;
      }
      v++;
    }
    if (mis < 0) n.verified = v - 1;
    else {
      n.verified = mis - 1;
      this.netRollback(mis, f);
      // on revérifie ce qui vient d'être rejoué
      let w = mis;
      while (w < f && n.inputs[r][w] !== undefined) w++;
      n.verified = w - 1;
    }
    // 3. empreinte de l'état (images confirmées) pour détecter une désynchronisation
    if (n.verified >= 30 && (n.verified % 30 === 0 || n.lastHashF === undefined)) {
      const F = n.verified - (n.verified % 30);
      if (F > (n.lastHashF || 0) && n.snaps[F]) {
        n.lastHashF = F;
        const h = hashStr(this.stateKey(n.snaps[F]));
        n.hashes.mine[F] = h;
        n.send({ t: 'hash', f: F, h });
        this.netCheckHash(F);
      }
    }
  },

  netStep() {
    const n = this.net;
    const me = n.me, r = 1 - me;
    const f = this.frame;
    // 1. mes commandes de l'image f+D, envoyées avec les 5 précédentes (redondance)
    n.inputs[me][f + NET_DELAY] = this.sampleLocal();
    const pk = [];
    for (let k = f + NET_DELAY; k > f + NET_DELAY - 6 && k >= 0; k--) if (n.inputs[me][k] !== undefined) pk.push([k, n.inputs[me][k]]);
    if ((f & 1) === 0) n.send({ t: 'in', a: pk }); // 30 Hz : économise le quota Cloudflare
    this.netVerify(f);
    // 4. on joue l'image f
    this.netPlay(f);
    // ménage
    const old = f - NET_KEEP;
    if (old >= 0) {
      delete n.snaps[old];
      delete n.used[old];
      delete n.inputs[0][old];
      delete n.inputs[1][old];
    }
  },

  netPlay(f) {
    const n = this.net;
    const me = n.me, r = 1 - me;
    n.snaps[f] = this.snapshot();
    const mine = n.inputs[me][f] !== undefined ? n.inputs[me][f] : NEUTRAL_IN;
    let theirs = n.inputs[r][f];
    if (theirs === undefined) theirs = n.lastRemote;
    else n.lastRemote = predictFrom(theirs);
    const used = [0, 0];
    used[me] = mine;
    used[r] = theirs;
    n.used[f] = used;
    this.curIn = used;
    this.simTick();
  },

  netRollback(from, to) {
    const n = this.net;
    n.rollbacks++;
    n.maxRoll = Math.max(n.maxRoll, to - from);
    this.restore(n.snaps[from]);
    this.beginResim();
    // la dernière entrée adverse connue AVANT l'image rejouée sert de base de prédiction
    for (let k = from; k < to; k++) this.netPlay(k);
    this.endResim();
  },

  // clé d'état stable (positions arrondies : le bruit de virgule flottante ne compte pas)
  stateKey(snapStr) {
    const S = JSON.parse(snapStr);
    const r = (x) => Math.round(x * 100) / 100;
    return JSON.stringify([S.frame, S.pls.map((o) => [r(o.sx), r(o.sy), r(o.vx), r(o.vy), o.damage, o.stocks, r(o.guard), o.rage, o.jumps]), S.projs.map((p) => [p.id, r(p.x), r(p.y)])]);
  },
});

const CFG = window.BRAWL_CONFIG || {};
const ONLINE_OK = !!(CFG.RELAY_URL && (CFG.DEV || (CFG.SUPABASE_URL && CFG.SUPABASE_ANON_KEY && window.supabase)));

// ---------------------------------------------------------------------------
// Fenêtres de saisie (HTML par-dessus le jeu : clavier natif sur téléphone)
// ---------------------------------------------------------------------------
function domModal(title, fields, buttons, note) {
  return new Promise((resolve) => {
    const old = document.getElementById('dm');
    if (old) old.remove();
    const el = document.createElement('div');
    el.id = 'dm';
    el.innerHTML =
      `<form><h2>${title}</h2>${note ? `<p class="n">${note}</p>` : ''}` +
      fields.map((f) => `<label>${f.label}<input name="${f.name}" type="${f.type || 'text'}" autocomplete="${f.ac || 'off'}" ${f.max ? `maxlength="${f.max}"` : ''} ${f.upper ? 'style="text-transform:uppercase"' : ''}></label>`).join('') +
      `<p class="e" id="dme"></p><div class="b">${buttons.map((b, i) => `<button type="button" data-i="${i}" class="${b.primary ? 'p' : ''}">${b.label}</button>`).join('')}</div></form>`;
    document.body.appendChild(el);
    const form = el.querySelector('form');
    const close = (v) => {
      el.remove();
      resolve(v);
    };
    el.querySelectorAll('button').forEach((bt) =>
      bt.addEventListener('click', () => {
        const b = buttons[+bt.dataset.i];
        const values = {};
        fields.forEach((f) => (values[f.name] = form.elements[f.name].value.trim()));
        if (b.cancel) return close(null);
        const err = (m) => (document.getElementById('dme').textContent = m || '');
        if (b.run) {
          bt.disabled = true;
          Promise.resolve(b.run(values, err))
            .then((ok) => {
              bt.disabled = false;
              if (ok) close({ button: b.label, values });
            })
            .catch((e) => {
              bt.disabled = false;
              err(String((e && e.message) || e));
            });
        } else close({ button: b.label, values });
      })
    );
    form.addEventListener('submit', (e) => e.preventDefault());
    const first = form.elements[0];
    if (first) setTimeout(() => first.focus(), 50);
  });
}

const Auth = {
  sb: null,
  session: null,
  profile: null,
  init() {
    if (CFG.DEV) {
      const qs = new URLSearchParams(location.search);
      const n = qs.get('dev') || localStorage.getItem('dev_name') || 'joueur' + Math.floor(Math.random() * 900 + 100);
      this.session = { access_token: 'dev:' + n, user: { id: n, is_anonymous: n.startsWith('guest') } };
      this.profile = { username: n, rating: 1000, wins: 0, losses: 0 };
      return Promise.resolve();
    }
    if (!window.supabase || !CFG.SUPABASE_URL) return Promise.resolve();
    this.sb = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY, { auth: { persistSession: true, autoRefreshToken: true } });
    return this.sb.auth.getSession().then(async ({ data }) => {
      this.session = data.session;
      if (this.session) await this.loadProfile();
    });
  },
  get anon() {
    return !!(this.session && this.session.user && this.session.user.is_anonymous);
  },
  async token() {
    if (CFG.DEV) return this.session.access_token;
    const { data } = await this.sb.auth.getSession();
    this.session = data.session;
    return data.session ? data.session.access_token : null;
  },
  async loadProfile() {
    if (CFG.DEV || !this.session) return (this.profile = null);
    const { data } = await this.sb.from('profiles').select('username,rating,wins,losses').eq('id', this.session.user.id).maybeSingle();
    this.profile = data;
    return data;
  },
  async signOut() {
    if (this.sb) await this.sb.auth.signOut();
    this.session = null;
    this.profile = null;
    this.setGuest('');
  },
  apiUrl(path) {
    return CFG.RELAY_URL.replace(/^ws/, 'http').replace(/\/$/, '') + path;
  },
  async call(path, body) {
    let r;
    try {
      r = await fetch(this.apiUrl(path), { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
    } catch (e) {
      throw new Error('Serveur injoignable');
    }
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.msg || 'Erreur ' + r.status);
    return d;
  },
  emailOf(pseudo) {
    return pseudo.toLowerCase() + '@brawl-players.app';
  },
  async setUsername(name) {
    if (!/^[A-Za-z0-9_]{3,16}$/.test(name)) throw new Error('3 à 16 caractères : lettres, chiffres, _');
    await this.call('/api/rename', { token: await this.token(), pseudo: name });
    await this.loadProfile();
    if (!this.profile) this.profile = { username: name, rating: 1000, wins: 0, losses: 0 };
    else this.profile.username = name;
  },
  async login(pseudo, pw) {
    const { error } = await this.sb.auth.signInWithPassword({ email: this.emailOf(pseudo), password: pw });
    if (error) throw new Error(/invalid|credentials/i.test(error.message) ? 'Pseudo ou mot de passe incorrect' : error.message);
    const { data } = await this.sb.auth.getSession();
    this.session = data.session;
    await this.loadProfile();
    // profil absent (compte créé avant la base) : on le recrée avec le pseudo saisi
    if (!this.profile || !this.profile.username) await this.setUsername(pseudo);
  },
  // ----- invité (pseudo local, pas de compte) -----
  guestName: (() => {
    try {
      return localStorage.getItem('brawl_guest') || '';
    } catch (e) {
      return '';
    }
  })(),
  setGuest(n) {
    this.guestName = n;
    try {
      n ? localStorage.setItem('brawl_guest', n) : localStorage.removeItem('brawl_guest');
    } catch (e) {}
  },
  get isGuest() {
    return !this.session && !!this.guestName;
  },
  get name() {
    if (this.session) return (this.profile && this.profile.username) || 'JOUEUR';
    return this.guestName || '';
  },
  async loginModal(allowGuest, note) {
    const check = (v, err) => {
      if (!/^[A-Za-z0-9_]{3,16}$/.test(v.pseudo)) return err('Pseudo : 3 à 16 caractères (lettres, chiffres, _)'), false;
      if (v.pw.length < 6) return err('Mot de passe : 6 caractères minimum'), false;
      return true;
    };
    for (;;) {
      const r = await domModal(
        allowGuest ? 'BIENVENUE' : 'CONNEXION',
        [
          { name: 'pseudo', label: 'Pseudo', max: 16, ac: 'username' },
          { name: 'pw', label: 'Mot de passe (6 caractères min.)', type: 'password', ac: 'current-password' },
        ],
        [
          {
            label: 'Se connecter',
            primary: true,
            run: async (v, err) => {
              if (!check(v, err)) return false;
              await this.login(v.pseudo, v.pw);
              return true;
            },
          },
          {
            label: 'Créer mon compte',
            run: async (v, err) => {
              if (!check(v, err)) return false;
              await this.call('/api/signup', { pseudo: v.pseudo, password: v.pw });
              await this.login(v.pseudo, v.pw);
              return true;
            },
          },
          ...(allowGuest ? [{ label: 'Jouer en invité', guest: true, run: async () => true }] : [{ label: 'Annuler', cancel: true }]),
        ],
        note || "Pas besoin d'e-mail : choisis un pseudo et un mot de passe."
      );
      if (!r) return false;
      if (r.button === 'Jouer en invité') {
        const g = await domModal(
          'MODE INVITE',
          [{ name: 'pseudo', label: 'Ton pseudo (3 à 16 : lettres, chiffres, _)', max: 16 }],
          [
            {
              label: 'Jouer',
              primary: true,
              run: async (v, err) => (/^[A-Za-z0-9_]{3,16}$/.test(v.pseudo) ? (this.setGuest(v.pseudo), true) : (err('Pseudo : 3 à 16 caractères (lettres, chiffres, _)'), false)),
            },
            { label: 'Retour', cancel: true },
          ],
          "L'invité joue contre le bot. Pour jouer en ligne, il faut un compte."
        );
        if (!g) continue;
        return true;
      }
      if (this.session) {
        this.setGuest('');
        return true;
      }
    }
  },
  // à l'arrivée sur le jeu : session gardée, invité mémorisé, sinon on demande
  async gate() {
    if (CFG.DEV || this.session || this.guestName) return true;
    return this.loginModal(true);
  },
  // action en ligne : un vrai compte est nécessaire
  async ensure() {
    if (CFG.DEV || this.session) return true;
    return this.loginModal(false, this.guestName ? 'Il faut un compte pour jouer en ligne.' : '');
  },
  async leaderboard(n) {
    if (CFG.DEV) return [];
    const { data } = await this.sb.from('profiles').select('username,rating,wins,losses').not('username', 'is', null).order('rating', { ascending: false }).limit(n || 20);
    return data || [];
  },
};

function netOpen(path, onMsg, onClose) {
  return new Promise((resolve, reject) => {
    const ws = new WebSocket(CFG.RELAY_URL.replace(/\/$/, '') + path);
    const c = { ws, rtt: 0, send: (o) => ws.readyState === 1 && ws.send(JSON.stringify(o)), close: () => ws.close() };
    ws.onopen = () => {
      c.timer = setInterval(() => c.send({ t: 'ping', ts: Date.now() }), 2000);
      resolve(c);
    };
    ws.onerror = () => reject(new Error('Serveur injoignable'));
    ws.onclose = () => {
      clearInterval(c.timer);
      onClose && onClose();
    };
    ws.onmessage = (e) => {
      let m;
      try {
        m = JSON.parse(e.data);
      } catch (x) {
        return;
      }
      if (m.t === 'pong') c.rtt = Date.now() - m.ts;
      else onMsg(m);
    };
  });
}

function goOnline() {
  canonLayout = true;
  onlineStage = 'menu';
  boot();
  rotateCheck();
}
function leaveOnline() {
  if (Online.conn) {
    try { Online.conn.close(); } catch (e) {}
  }
  Online.conn = null;
  canonLayout = false;
  onlineStage = null;
  onlinePick = null;
  boot();
  rotateCheck();
}
function rotateCheck() {
  let el = document.getElementById('rot');
  if (!el) {
    el = document.createElement('div');
    el.id = 'rot';
    el.textContent = 'Tourne ton téléphone en mode paysage pour jouer en ligne';
    document.body.appendChild(el);
  }
  el.style.display = canonLayout && window.innerHeight > window.innerWidth ? 'flex' : 'none';
}
window.addEventListener('resize', rotateCheck);

    this.roomMsgTxt.setVisible(false);

      const t2 = this.add.text(560, y, '1/2', { fontFamily: FONT, fontSize: '15px', color: '#9aa0d0' }).setOrigin(0.5).setDepth(D + 1);
      const t3 = this.add.text(690, y, 'JOUER', { fontFamily: FONT, fontSize: '15px', color: '#6ee7b7', stroke: '#000', strokeThickness: 4 }).setOrigin(0.5).setDepth(D + 1);
      this.roomObjs.push(bg, t1, t2, t3);

  async joinPublic(code) {
    if (!(await Auth.ensure())) return;
    this.joinRoom(code, false);
  },

  // ----- Profil (encart pseudo) -----
  async showProfile() {
    await Auth.loadProfile().catch(() => {});
    this.menuBase('PROFIL', { noBar: true });
    const p = Auth.profile;
    const lines = Auth.session
      ? [Auth.name.toUpperCase(), p ? `${p.rating} POINTS` : '', p ? `${p.wins || 0} VICTOIRES - ${p.losses || 0} DEFAITES` : '']
      : [Auth.name.toUpperCase(), 'INVITE (SANS COMPTE)', 'JOUE CONTRE LE BOT'];
    this.ui.push(
      this.add.text(this.W / 2, this.H * (L.portrait ? 0.3 : 0.36), lines.join('\n'), { fontFamily: FONT, fontSize: L.portrait ? '20px' : '18px', color: '#ffe9a8', stroke: '#000', strokeThickness: 5, align: 'center', lineSpacing: 12 }).setOrigin(0.5).setDepth(101)
    );
    const list = [];
    list.push({ label: 'CHANGER DE PSEUDO', col: 0x4cc9f0, fn: () => this.renameFlow() });

    list.push(Auth.session ? { label: 'DECONNEXION', col: 0xf72585, fn: () => this.logoutFlow() } : { label: 'CREER UN COMPTE', col: 0x6ee7b7, fn: () => this.logoutFlow() });
    list.push({ label: 'RETOUR', col: 0x888888, fn: () => (onlineStage ? this.showOnlineMenu() : this.showMenu()) });

  async renameFlow() {
    const r = await domModal(
      'NOUVEAU PSEUDO',
      [{ name: 'u', label: 'Pseudo (3 à 16 : lettres, chiffres, _)', max: 16 }],
      [
        {
          label: 'Valider',
          primary: true,
          run: async (v, err) => {
            if (!/^[A-Za-z0-9_]{3,16}$/.test(v.u)) return err('Pseudo : 3 à 16 caractères (lettres, chiffres, _)'), false;
            if (Auth.session) await Auth.setUsername(v.u);
            else Auth.setGuest(v.u);
            return true;
          },
        },
        { label: 'Annuler', cancel: true },
      ]
    );
    this.showProfile();
  },

  async logoutFlow() {
    await Auth.signOut();
    sessionReady = false;
    if (onlineStage) leaveOnline();
    else this.scene.restart();
  },

  async showLeaderboard() {
    this.menuBase('CLASSEMENT', { noBar: true });
    const t = this.add.text(this.W / 2, this.H * 0.47, 'CHARGEMENT...', { fontFamily: FONT, fontSize: '18px', color: '#cfd3ff', align: 'center' }).setOrigin(0.5).setDepth(101);
    this.ui.push(t);
    this.menuButtons([{ label: 'RETOUR', col: 0x888888, fn: () => this.showProfile() }], this.H - 60);
    let rows = [];
    try {
      rows = await Auth.leaderboard(10);
    } catch (e) {}
    if (!t.active) return;
    const me = Auth.profile && Auth.profile.username;
    t.setText(rows.length ? rows.map((r, i) => `${String(i + 1).padStart(2)}. ${r.username.padEnd(16)} ${String(r.rating).padStart(4)}  ${r.wins}V/${r.losses}D${r.username === me ? '  <' : ''}`).join('\n') : "PERSONNE POUR L'INSTANT")
      .setFontSize('15px').setLineSpacing(10).setAlign('left').setOrigin(0.5, 0.5).setPosition(this.W / 2, this.H * 0.47);
  },

  // ----- Duel classé -----------------------------------------------------------
  async goRanked() {
    if (!(await Auth.ensure())) return this.showOnlineMenu();
    this.onlineMsg('RECHERCHE...', "ADVERSAIRE DE TON NIVEAU");
    let q;
    const cancel = () => {
      if (q) q.close();
      this.showOnlineMenu();
    };
    this.menuButtons([{ label: 'ANNULER', col: 0x888888, fn: cancel }], this.H - 80);
    try {
      q = await netOpen(
        '/ws/queue',
        (m) => {
          if (m.t === 'queued') return;
          if (m.t === 'error') {
            q.close();
            return this.onlineMsg('ERREUR', 'CONNEXION REFUSEE');
          }
          if (m.t === 'match') {
            clearInterval(poll);
            q.close();
            this.joinRoom(m.code, true, `${m.vs} (${m.rating})`);
          }
        },
        () => clearInterval(poll)
      );
    } catch (e) {
      return this.onlineMsg('ERREUR', 'SERVEUR INJOIGNABLE');
    }
    q.send({ t: 'join', token: await Auth.token() });
    const poll = setInterval(() => q.send({ t: 'poll' }), 2000);
  },

  // ----- Salles privées ---------------------------------------------------------
  async goCreate(pub) {
    if (!(await Auth.ensure())) return this.showOnlineMenu();
    const code = Array.from({ length: 4 }, () => 'ABCDEFGHJKLMNPQRSTUVWXYZ'[Math.floor(Math.random() * 24)]).join('');
    this.joinRoom(code, false, '', !!pub);
  },
  async goJoinPrompt() {
    if (!(await Auth.ensure())) return this.showOnlineMenu();
    const r = await domModal('REJOINDRE', [{ name: 'c', label: 'Code de la salle', max: 8, upper: true }], [
      { label: 'Rejoindre', primary: true, run: async (v, err) => (v.c.length >= 3 ? true : (err('Code trop court'), false)) },
      { label: 'Annuler', cancel: true },
    ]);
    if (r) this.joinRoom(r.values.c.toUpperCase().replace(/[^A-Z0-9]/g, ''), false);
    else this.showOnlineMenu();
  },

  async joinRoom(code, ranked, vs, pub) {
    this.onlineMsg('CONNEXION...', 'SALLE ' + code);
    Online.code = code;
    Online.ranked = ranked;
    Online.vs = vs || '';
    Online.rematchAsked = false;
    Online.picked = null;
    try {
      Online.conn = await netOpen('/ws/room/' + code + (pub ? '?pub=1' : ''), (m) => this.roomMsg(m), () => this.roomClosed());
    } catch (e) {
      return this.onlineMsg('ERREUR', 'SERVEUR INJOIGNABLE');
    }
    Online.conn.send({ t: 'join', token: await Auth.token() });
  },

  roomClosed() {
    if (!this.scene || !this.sys || !this.sys.isActive()) return;
    if (this.net && !this.over) this.onlineForfeit('CONNEXION PERDUE');
    else if (this.state !== 'play' && !this.over) this.onlineMsg('DECONNECTE', 'LA CONNEXION A ETE PERDUE');
  },

  roomMsg(m) {
    const n = this.net;
    if (m.t === 'error') {
      Online.conn && Online.conn.close();
      Online.conn = null;
      return this.onlineMsg('IMPOSSIBLE', m.e === 'full' ? 'SALLE PLEINE' : m.e === 'forbidden' ? 'ACCES REFUSE' : 'CONNEXION REFUSEE');
    }
    if (m.t === 'hello') {
      Online.idx = m.idx;
      Online.peers = m.peers;
      onlineStage = 'lobby';
      return this.showLobby();
    }
    if (m.t === 'peers' || m.t === 'rematch') {
      Online.peers = m.peers;
      if (m.t === 'rematch') {
        onlineStage = 'lobby';
        Online.picked = null;
        this.scene.restart();
        return;
      }
      if (this.state === 'lobby') this.showLobby();
      return;
    }
    if (m.t === 'start') return this.onlineStart(m);
    if (m.t === 'in' || m.t === 'hash') return n && this.netReceive(m);
    if (m.t === 'desync') return this.onDesync(m.f);
    if (m.t === 'left') {
      if (n && !this.over) this.onlineForfeit("L'ADVERSAIRE EST PARTI");
      return;
    }
    if (m.t === 'rated') {
      const mine = m.winner === Online.idx;
      this.sub && this.sub.setText(`${m.delta >= 0 ? '+' : ''}${m.delta} POINTS  (${m.rating})`).setColor(m.delta >= 0 ? '#6ee7b7' : '#ff8fa3');
      if (Auth.profile) Auth.profile.rating = m.rating;
      return;
    }
    if (m.t === 'rematch?') return this.sub && !Online.rematchAsked && this.sub.setText("L'ADVERSAIRE VEUT UNE REVANCHE");
    if (m.t === 'final') return m.disputed && this.sub && this.sub.setText('RESULTAT CONTESTE : SANS EFFET');
  },

  // ----- Salon : choix du personnage -----------------------------------------------
  showLobby() {
    this.clearUi();
    this.state = 'lobby';
    const me = Online.peers[Online.idx], other = Online.peers[1 - Online.idx];
    const D = 100;
    this.ui.push(this.add.rectangle(this.W / 2, this.H / 2, this.W, this.H, 0x0b0d1f, 0.92).setDepth(D));
    const title = Online.ranked ? 'DUEL CLASSE' : 'SALLE  ' + Online.code;
    this.ui.push(this.add.text(this.W / 2, 56, title, { fontFamily: FONT, fontSize: '36px', color: '#fff', stroke: '#f72585', strokeThickness: 8 }).setOrigin(0.5).setDepth(D + 1));
    const line = (p, y, label) => {
      const txt = p ? `${label} ${p.name}  ${p.char ? CHARS[p.char].name : '...'}  ${p.ready ? 'PRET' : ''}` : `${label} EN ATTENTE...`;
      this.ui.push(this.add.text(this.W / 2, y, txt, { fontFamily: FONT, fontSize: '18px', color: p && p.ready ? '#6ee7b7' : '#cfd3ff' }).setOrigin(0.5).setDepth(D + 1));
    };
    line(me, 120, 'TOI:');
    line(other, 156, 'ADV:');
    const buttons = [];
    if (!me || !me.char || !me.ready) buttons.push({ label: me && me.char ? 'CHANGER DE PERSO' : 'CHOISIR MON PERSO', fn: () => this.lobbyPick() });
    if (!Online.ranked) buttons.push({ label: 'COPIER LE LIEN', col: 0x4cc9f0, fn: () => this.copyInvite() });
    buttons.push({ label: 'QUITTER', col: 0x888888, fn: () => leaveOnline() });
    if (me && me.char && !me.ready && other) {
      this.ui.push(this.add.text(this.W / 2, 200, 'TOUCHE PRET QUAND TU ES BON', { fontFamily: FONT, fontSize: '12px', color: '#9aa0d0' }).setOrigin(0.5).setDepth(D + 1));
      buttons.unshift({ label: 'PRET !', col: 0x6ee7b7, fn: () => Online.conn.send({ t: 'ready' }) });
    }
    if (me && me.ready && !other) this.ui.push(this.add.text(this.W / 2, 220, 'EN ATTENTE DE L\'ADVERSAIRE...', { fontFamily: FONT, fontSize: '14px', color: '#ffe9a8' }).setOrigin(0.5).setDepth(D + 1));
    this.menuButtons(buttons, this.H * 0.42);
    if (!Online.picked && (!me || !me.char)) this.lobbyPick();
  },

  lobbyPick() {
    onlinePick = (id) => {
      onlinePick = null;
      Online.picked = id;
      Online.conn.send({ t: 'pick', char: id });
      this.showLobby();
    };
    this.showSelect();
  },

  copyInvite() {
    const url = location.origin + location.pathname + '?room=' + Online.code;
    const done = () => this.popup(this.W / 2, 240, 'LIEN COPIE', '#6ee7b7');
    if (navigator.clipboard) navigator.clipboard.writeText(url).then(done, () => prompt('Copie ce lien', url));
    else prompt('Copie ce lien', url);
  },

  // ----- Match ------------------------------------------------------------------------
  onlineStart(m) {
    this.clearUi();
    onlinePick = null;
    this.over = false;
    this.beginNetMatch({ me: Online.idx, chars: m.chars, names: m.names, send: (o) => Online.conn && Online.conn.send(o) });
    this.state = 'countdown';
    this.setControls(true);
    this.onDesync = (f) => this.onlineEndNoResult('DESYNCHRONISATION');
    const D = 120;
    const t = this.add.text(this.W / 2, this.H * 0.35, '3', { fontFamily: FONT, fontSize: '96px', color: '#fff', stroke: '#f72585', strokeThickness: 14 }).setOrigin(0.5).setDepth(D);
    const names = this.add.text(this.W / 2, this.H * 0.2, `${m.names[0]}  VS  ${m.names[1]}`, { fontFamily: FONT, fontSize: '22px', color: '#ffe9a8', stroke: '#000', strokeThickness: 5 }).setOrigin(0.5).setDepth(D);
    let c = 3;
    const ev = this.time.addEvent({
      delay: 800,
      repeat: 3,
      callback: () => {
        c--;
        if (c > 0) t.setText(String(c));
        else if (c === 0) {
          t.setText('GO !');
          this.state = 'play';
          this.acc = 0;
        } else {
          t.destroy();
          names.destroy();
        }
      },
    });
    this.netHud = this.add.text(this.W - 20, this.H - 20, '', { fontFamily: FONT, fontSize: '11px', color: '#9aa0d0' }).setOrigin(1, 1).setDepth(50);
  },

  onlineForfeit(msg) {
    if (this.over) return;
    this.over = true;
    this.net = this.net; // gardé pour le rapport
    const mine = Online.idx;
    this.banner.setText('VICTOIRE !');
    this.sub.setText(msg);
    Online.conn && Online.conn.send({ t: 'result', winner: mine });
    this.onlineOverButtons();
  },

  onlineEndNoResult(msg) {
    if (this.over) return;
    this.over = true;
    this.banner.setText('MATCH ANNULE').setFontSize('36px');
    this.sub.setText(msg);
    this.onlineOverButtons();
  },

  onlineFinish(winnerPlayer) {
    const widx = winnerPlayer === this.p1 ? 0 : 1;
    const won = widx === Online.idx;
    this.banner.setText(won ? 'VICTOIRE !' : 'DEFAITE...');
    this.sub.setText(Online.ranked ? 'CALCUL DU CLASSEMENT...' : '');
    Online.conn && Online.conn.send({ t: 'result', winner: widx });
    this.onlineOverButtons();
  },

  onlineOverButtons() {
    this.setControls(false);
    this.time.delayedCall(1400, () => {
      this.state = 'menu';
      this.menuButtons(
        [
          ...(Online.ranked ? [] : [{ label: 'REVANCHE', fn: () => { Online.rematchAsked = true; Online.conn && Online.conn.send({ t: 'rematch' }); this.sub.setText("EN ATTENTE DE L'ADVERSAIRE..."); } }]),
          { label: 'QUITTER', col: 0x888888, fn: () => leaveOnline() },
        ],
        this.H * 0.62
      );
    });
  },
});

// petit affichage réseau pendant le combat (ping + corrections)
GameScene.prototype.updateNetHud = function () {
  if (this.netHud && Online.conn && this.net) this.netHud.setText(`PING ${Online.conn.rtt}ms  RB ${this.net.rollbacks}`);
};

if (ONLINE_OK) {
  Auth.ready = Auth.init().catch(() => {});
  const rc = new URLSearchParams(location.search).get('room');
  if (rc) {
    pendingRoom = rc.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 8);
    canonLayout = true;
    onlineStage = 'menu';
    setTimeout(rotateCheck, 500);
  }
}
