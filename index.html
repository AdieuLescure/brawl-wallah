// Compte
// ---------------------------------------------------------------------------
const Auth = {
  sb: null,
  session: null,
  profile: null,
  init() {
    if (CFG.DEV) {
      const qs = new URLSearchParams(location.search);
      const n = qs.get('dev') || localStorage.getItem('dev_name') || 'joueur' + Math.floor(Math.random() * 900 + 100);
      this.session = { access_token: 'dev:' + n, user: { id: n, is_anonymous: n.startsWith('guest') } };
      this.profile = { username: n, rating: 1000, wins: 0, losses: 0 };
      return Promise.resolve();
    }
    if (!window.supabase || !CFG.SUPABASE_URL) return Promise.resolve();
    this.sb = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY, { auth: { persistSession: true, autoRefreshToken: true } });
    return this.sb.auth.getSession().then(async ({ data }) => {
      this.session = data.session;
      if (this.session) await this.loadProfile();
    });
  },
  get anon() {
    return !!(this.session && this.session.user && this.session.user.is_anonymous);
  },
  async token() {
    if (CFG.DEV) return this.session.access_token;
    const { data } = await this.sb.auth.getSession();
    this.session = data.session;
    return data.session ? data.session.access_token : null;
  },
  async loadProfile() {
    if (CFG.DEV || !this.session) return (this.profile = null);
    const { data } = await this.sb.from('profiles').select('username,rating,wins,losses').eq('id', this.session.user.id).maybeSingle();
    this.profile = data;
    return data;
  },
  async signOut() {
    if (this.sb) await this.sb.auth.signOut();
    this.session = null;
    this.profile = null;
    this.setGuest('');
  },
  apiUrl(path) {
    return CFG.RELAY_URL.replace(/^ws/, 'http').replace(/\/$/, '') + path;
  },
  async call(path, body) {
    let r;
    try {
      r = await fetch(this.apiUrl(path), { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) });
    } catch (e) {
      throw new Error('Serveur injoignable');
    }
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.msg || 'Erreur ' + r.status);
    return d;
  },
  emailOf(pseudo) {
    return pseudo.toLowerCase() + '@brawl-players.app';
  },
  async setUsername(name) {
    if (!/^[A-Za-z0-9_]{3,16}$/.test(name)) throw new Error('3 à 16 caractères : lettres, chiffres, _');
    await this.call('/api/rename', { token: await this.token(), pseudo: name });
    await this.loadProfile();
    if (!this.profile) this.profile = { username: name, rating: 1000, wins: 0, losses: 0 };
    else this.profile.username = name;
  },
  async login(pseudo, pw) {
    // le serveur retrouve le compte par son pseudo (même renommé, sans tenir compte des majuscules)
    let tok = null;
    try {
      tok = await this.call('/api/login', { pseudo, password: pw });
    } catch (e) {
      if (!/injoignable|Erreur 404/.test(e.message)) throw e;
    }
    if (tok && tok.access_token) {
      const { error } = await this.sb.auth.setSession({ access_token: tok.access_token, refresh_token: tok.refresh_token });
      if (error) throw new Error(error.message);
    } else {
      const { error } = await this.sb.auth.signInWithPassword({ email: this.emailOf(pseudo), password: pw });
      if (error) throw new Error(/invalid|credentials/i.test(error.message) ? 'Pseudo ou mot de passe incorrect' : error.message);
    }
    const { data } = await this.sb.auth.getSession();
    this.session = data.session;
    await this.loadProfile();
    // profil absent (compte créé avant la base) : on le recrée avec le pseudo saisi
    if (!this.profile || !this.profile.username) await this.setUsername(pseudo);
  },
  // ----- invité (pseudo local, pas de compte) -----
  guestName: (() => {
    try {
      return localStorage.getItem('brawl_guest') || '';
    } catch (e) {
      return '';
    }
  })(),
  setGuest(n) {
    this.guestName = n;
    try {
      n ? localStorage.setItem('brawl_guest', n) : localStorage.removeItem('brawl_guest');
    } catch (e) {}
  },
  get isGuest() {
    return !this.session && !!this.guestName;
  },
  get name() {
    if (this.session) return (this.profile && this.profile.username) || 'JOUEUR';
    return this.guestName || '';
  },
  async loginModal(allowGuest, note) {
    const check = (v, err) => {
      if (!/^[A-Za-z0-9_]{3,16}$/.test(v.pseudo)) return err('Pseudo : 3 à 16 caractères (lettres, chiffres, _)'), false;
      if (v.pw.length < 6) return err('Mot de passe : 6 caractères minimum'), false;
      return true;
    };
    for (;;) {
      const r = await domModal(
        allowGuest ? 'BIENVENUE' : 'CONNEXION',
        [
          { name: 'pseudo', label: 'Pseudo', max: 16, ac: 'username' },
          { name: 'pw', label: 'Mot de passe (6 caractères min.)', type: 'password', ac: 'current-password' },
        ],
        [
          {
            label: 'Se connecter',
            primary: true,
            run: async (v, err) => {
              if (!check(v, err)) return false;
              await this.login(v.pseudo, v.pw);
              return true;
            },
          },
          {
            label: 'Créer mon compte',
            run: async (v, err) => {
              if (!check(v, err)) return false;
              await this.call('/api/signup', { pseudo: v.pseudo, password: v.pw });
              await this.login(v.pseudo, v.pw);
              return true;
            },
          },
          ...(allowGuest ? [{ label: 'Jouer en invité', guest: true, run: async () => true }] : [{ label: 'Annuler', cancel: true }]),
        ],
        note || "Pas besoin d'e-mail : choisis un pseudo et un mot de passe."
      );
      if (!r) return false;
      if (r.button === 'Jouer en invité') {
        const g = await domModal(
          'MODE INVITÉ',
          [{ name: 'pseudo', label: 'Ton pseudo (3 à 16 : lettres, chiffres, _)', max: 16 }],
          [
            {
              label: 'Jouer',
              primary: true,
              run: async (v, err) => (/^[A-Za-z0-9_]{3,16}$/.test(v.pseudo) ? (this.setGuest(v.pseudo), true) : (err('Pseudo : 3 à 16 caractères (lettres, chiffres, _)'), false)),
            },
            { label: 'Retour', cancel: true },
          ],
          "L'invité joue contre le bot. Pour jouer en ligne, il faut un compte."
        );
        if (!g) continue;
        return true;
      }
      if (this.session) {
        this.setGuest('');
        return true;
      }
    }
  },
  // à l'arrivée sur le jeu : session gardée, invité mémorisé, sinon on demande
  async gate() {
    if (CFG.DEV || this.session || this.guestName) return true;
    return this.loginModal(true);
  },
  // action en ligne : un vrai compte est nécessaire
  async ensure() {
    if (CFG.DEV || this.session) return true;
    return this.loginModal(false, this.guestName ? 'Il faut un compte pour jouer en ligne.' : '');
  },
  async leaderboard(n) {
    if (CFG.DEV) return [];
    const { data } = await this.sb.from('profiles').select('username,rating,wins,losses').not('username', 'is', null).order('rating', { ascending: false }).limit(n || 20);
    return data || [];
  },
};

// ---------------------------------------------------------------------------
// Connexion temps réel
// ---------------------------------------------------------------------------
function netOpen(path, onMsg, onClose) {
  return new Promise((resolve, reject) => {
    const ws = new WebSocket(CFG.RELAY_URL.replace(/\/$/, '') + path);
    const c = { ws, rtt: 0, last: Date.now(), send: (o) => ws.readyState === 1 && ws.send(JSON.stringify(o)), close: () => ws.close() };
    let ended = false;
    const end = () => {
      if (ended) return;
      ended = true;
      clearInterval(c.timer);
      onClose && onClose(c);
    };
    ws.onopen = () => {
      c.last = Date.now();
      c.timer = setInterval(() => {
        // plus rien reçu depuis 7 s (pas même la réponse au ping) : connexion morte, on n'attend pas le navigateur
        if (Date.now() - c.last > 7000) {
          try {
            ws.close();
          } catch (e) {}
          return end();
        }
        c.send({ t: 'ping', ts: Date.now() });
      }, 2000);
      resolve(c);
    };
    ws.onerror = () => reject(new Error('Serveur injoignable'));
    ws.onclose = end;
    ws.onmessage = (e) => {
      c.last = Date.now();
      let m;
      try {
        m = JSON.parse(e.data);
      } catch (x) {
        return;
      }
      if (m.t === 'pong') c.rtt = Date.now() - m.ts;
      else onMsg(m);
    };
  });
}

      .setFontSize('15px').setLineSpacing(10).setAlign('left').setOrigin(0.5, 0.5).setPosition(this.W / 2, this.H * 0.47);
  },

  // ----- Duel classé -----------------------------------------------------------
  async goRanked() {
    if (!(await Auth.ensure())) return this.showOnlineMenu();
    this.onlineMsg('RECHERCHE...', "ADVERSAIRE DE TON NIVEAU");
    let q;
    let done = false;
    const cancel = () => {
      done = true;
      if (q) q.close();
      this.showOnlineMenu();
    };
    this.menuButtons([{ label: 'ANNULER', col: 0x888888, fn: cancel }], this.H - 80);
    try {
      q = await netOpen(
        '/ws/queue',
        (m) => {
          if (m.t === 'queued') return;
          if (m.t === 'error') {
            done = true;
            q.close();
            return this.onlineMsg('ERREUR', m.e === 'banned' ? 'TROP DE RÉSULTATS CONTESTÉS :\nDUEL CLASSÉ BLOQUÉ' : 'CONNEXION REFUSÉE');
          }
          if (m.t === 'match') {
            done = true;
            clearInterval(poll);
            q.close();
            this.joinRoom(m.code, true, `${m.vs} (${m.rating})`);
          }
        },
        () => {
          clearInterval(poll);
          if (!done && this.sys.isActive()) this.onlineMsg('ERREUR', 'CONNEXION PERDUE');
        }
      );
    } catch (e) {
      return this.onlineMsg('ERREUR', 'SERVEUR INJOIGNABLE');
    }
    q.send({ t: 'join', token: await Auth.token() });
    var poll = setInterval(() => q.send({ t: 'poll' }), 2000);
  },

  // ----- Salles privées ---------------------------------------------------------
  async goCreate(pub) {

    this.showStagePick((stage) => this.pickMode((mode) => this.joinRoom(code, false, '', !!pub, stage, mode), () => this.goCreate(pub)), () => this.showOnlineMenu());

  // mode du salon : chacun pour soi ou par équipes (jusqu'à 4 joueurs)
  pickMode(next, back) {
    this.menuBase('MODE DU SALON', { small: true });
    this.ui.push(this.add.text(this.W / 2, 150, "JUSQU'À 4 JOUEURS", { fontFamily: FONT, fontSize: '16px', color: '#ffd166', stroke: '#000', strokeThickness: 4 }).setOrigin(0.5).setDepth(101));
    this.menuButtons(
      [
        { label: 'CHACUN POUR SOI\n(FREE FOR ALL)', col: 0xf72585, fn: () => next('ffa') },
        { label: 'PAR ÉQUIPES\n(TEAM)', col: 0x4cc9f0, fn: () => next('team') },

  async goJoinPrompt() {
    if (!(await Auth.ensure())) return this.showOnlineMenu();
    const r = await domModal('REJOINDRE', [{ name: 'c', label: 'Code de la salle', max: 8, upper: true }], [
      { label: 'Rejoindre', primary: true, run: async (v, err) => (v.c.length >= 3 ? true : (err('Code trop court'), false)) },
      { label: 'Annuler', cancel: true },
    ]);
    if (r) this.joinRoom(r.values.c.toUpperCase().replace(/[^A-Z0-9]/g, ''), false);
    else this.showOnlineMenu();

  async joinRoom(code, ranked, vs, pub, stage, mode) {
    this.onlineMsg('CONNEXION...', 'SALLE ' + code);
    Online.code = code;
    Online.ranked = ranked;
    Online.vs = vs || '';
    Online.rematchAsked = false;
    Online.picked = null;
    Online.leaving = false;
    Online.stage = stage || null;
    Online.wantMode = mode || null;
    try {
      Online.conn = await netOpen('/ws/room/' + code + (pub ? '?pub=1' : ''), (m) => this.roomMsg(m), (x) => this.roomClosed(x));
    } catch (e) {
      return this.onlineMsg('ERREUR', 'SERVEUR INJOIGNABLE');
    }
    Online.conn.send({ t: 'join', token: await Auth.token(), stage: Online.stage, mode: Online.wantMode });
  },

  roomClosed(c) {
    if (!this.scene || !this.sys || !this.sys.isActive() || Online.leaving) return;
    if (c && Online.conn && c !== Online.conn) return; // ancienne connexion, déjà remplacée
    if (this.net && !this.over) this.netReconnect();
    else if (this.state !== 'play' && !this.over) this.onlineMsg('DÉCONNECTÉ', 'LA CONNEXION A ÉTÉ PERDUE');
  },

  // coupure pendant un combat : on retente pendant 10 s (le serveur garde la place)
  netReconnect() {
    if (this.reco) return;
    this.reco = { until: Date.now() + 10000 };
    this.recoTxt = this.add.text(this.W / 2, this.H * 0.3, 'RECONNEXION...', { fontFamily: FONT, fontSize: '22px', color: '#ffe9a8', stroke: '#000', strokeThickness: 6 }).setOrigin(0.5).setDepth(90);
    const attempt = async () => {
      if (!this.reco || this.over || !this.sys.isActive()) return;
      if (Date.now() > this.reco.until) {
        this.reco = null;
        if (this.recoTxt) this.recoTxt.destroy();
        return this.onlineEndNoResult('CONNEXION PERDUE');
      }
      try {
        const c = await netOpen('/ws/room/' + Online.code, (m) => this.roomMsg(m), (x) => this.roomClosed(x));
        Online.conn = c;
        c.send({ t: 'join', token: await Auth.token() });
      } catch (e) {
        setTimeout(attempt, 1500);
      }
    };
    attempt();
  },

  roomMsg(m) {
    const n = this.net;
    if (m.t === 'error') {
      Online.conn && Online.conn.close();
      Online.conn = null;
      return this.onlineMsg('IMPOSSIBLE', m.e === 'full' ? 'SALLE PLEINE' : m.e === 'forbidden' ? 'ACCÈS REFUSÉ' : 'CONNEXION REFUSÉE');
    }
    if (m.peers) Online.roomInfo(m);
    if (m.t === 'hello' && this.net && !this.over) {
      // reconnecté pendant le combat : on continue
      Online.idx = m.idx;
      if (this.reco) {
        this.reco = null;
        if (this.recoTxt) this.recoTxt.destroy();
        this.popup(this.W / 2, this.H * 0.3, 'RECONNECTÉ', '#6ee7b7');
      }
      this.netResend(NET_KEEP - 2);
      return;
    }
    if (m.t === 'drop') {
      if (n && !this.over && !this.dropTxt) this.dropTxt = this.add.text(this.W / 2, this.H * 0.3, this.pls && this.pls.length > 2 ? 'UN JOUEUR SE RECONNECTE...' : "L'ADVERSAIRE SE RECONNECTE...", { fontFamily: FONT, fontSize: '18px', color: '#ffe9a8', stroke: '#000', strokeThickness: 6 }).setOrigin(0.5).setDepth(90);
      return;
    }
    if (m.t === 'back') {
      if (this.dropTxt) this.dropTxt.destroy();
      this.dropTxt = null;
      if (n) this.netResend(NET_KEEP - 2);
      return;
    }
    if (m.t === 'hello') {
      Online.idx = m.idx;
      if (m.stage) Online.stage = m.stage;
      onlineStage = 'lobby';
      return this.showLobby();
    }
    if (m.t === 'peers' || m.t === 'rematch') {
      if (m.t === 'rematch') {
        onlineStage = 'lobby';
        Online.picked = null;
        this.scene.restart();
        return;
      }
      if (this.state === 'lobby') this.showLobby();
      return;
    }
    if (m.t === 'start') return this.onlineStart(m);
    if (m.t === 'in' || m.t === 'hash') return n && this.netReceive(m);
    if (m.t === 'desync') return this.onDesync(m.f);
    if (m.t === 'left') {
      if (this.dropTxt) this.dropTxt.destroy();
      this.dropTxt = null;
      if (n && !this.over && m.started && this.pls.length > 2) {
        // à plusieurs : le joueur parti est éliminé (à la même image chez tout le monde) et la partie continue
        if (m.p >= 0) this.netGone(m.p, m.last);
        const who = m.p >= 0 && this.pls[m.p] ? this.pls[m.p].name : '';
        this.popup(this.W / 2, this.H * 0.3, (who ? who + ' ' : 'UN JOUEUR ') + 'EST PARTI', '#ff8fa3');
      } else if (n && !this.over) this.onlineForfeit("L'ADVERSAIRE EST PARTI");
      return;
    }
    if (m.t === 'rated') {
      const mine = m.winner === (this.net ? this.net.me : Online.idx);
      this.sub && this.sub.setText(`${m.delta >= 0 ? '+' : ''}${m.delta} POINTS  (${m.rating})`).setColor(m.delta >= 0 ? '#6ee7b7' : '#ff8fa3');
      if (Auth.profile) Auth.profile.rating = m.rating;
      return;
    }
    if (m.t === 'rematch?') return this.sub && !Online.rematchAsked && this.sub.setText("L'ADVERSAIRE VEUT UNE REVANCHE");
    if (m.t === 'final') return m.disputed && this.sub && this.sub.setText('RÉSULTAT CONTESTÉ : SANS EFFET');
  },

  // ----- Salon : joueurs (jusqu'à 4), mode, équipes, choix du personnage ----------------
  showLobby() {
    this.clearUi();
    if (typeof MUSIC !== 'undefined') MUSIC.play('menu');
    this.state = 'lobby';
    this.uiBtns = [];
    this.barBtn = null;
    const peers = Online.peers || [];
    const me = peers[Online.idx];
    const cap = Online.ranked ? 2 : Online.cap || 4;
    const isHost = !Online.ranked && Online.host === Online.idx;
    const team = !Online.ranked && Online.mode === 'team';
    const D = 100, W = this.W;
    const txt = (x, y, s, size, col, ox) => {
      const t = this.add.text(x, y, s, { fontFamily: FONT, fontSize: size + 'px', color: col || '#fff', stroke: '#000', strokeThickness: 4, align: 'center' }).setOrigin(ox === undefined ? 0.5 : ox, 0.5).setDepth(D + 2);
      this.ui.push(t);
      return t;
    };
    const btn = (x, y, w, h, label, col, fn, size, fill) => {
      this.ui.push(this.add.rectangle(x, y, w, h, fill === undefined ? 0x1a1d33 : fill, 1).setStrokeStyle(4, col).setDepth(D + 1));
      txt(x, y, label, size || 15);
      this.uiBtns.push({ x, y, w, h, fn });
    };
    this.ui.push(this.add.rectangle(W / 2, this.H / 2, W, this.H, 0x0b0d1f, 0.94).setDepth(D));
    txt(W / 2, 48, Online.ranked ? 'DUEL CLASSÉ' : 'SALLE  ' + Online.code, 34, '#fff');
    const info = [];
    if (!Online.ranked) info.push(MODE_NAMES[Online.mode] || MODE_NAMES.ffa);
    if (!Online.ranked && Online.stage) info.push('ARÈNE : ' + (STAGE_NAMES[Online.stage] || '?'));
    if (info.length) txt(W / 2, 92, info.join('   ·   '), 15, '#ffd166');
    // les places
    const y0 = 146, rh = 64;
    const here = peers.filter((p) => p && p.here !== false);
    for (let j = 0; j < cap; j++) {
      const p = peers[j] && peers[j].here !== false ? peers[j] : null;
      const y = y0 + j * rh;
      const mine = j === Online.idx;
      this.ui.push(this.add.rectangle(W / 2, y, 940, rh - 10, mine ? 0x232846 : 0x161a30, 1).setStrokeStyle(3, mine ? 0xffe9a8 : 0x3a3f5c).setDepth(D + 1));
      txt(W / 2 - 450, y, `J${j + 1}`, 15, '#9aa0d0', 0);
      if (!p) {
        txt(W / 2 - 390, y, 'PLACE LIBRE', 15, '#5a6080', 0);
        continue;
      }
      txt(W / 2 - 390, y, (p.name || '?').toUpperCase().slice(0, 12) + (mine ? ' (TOI)' : ''), 16, mine ? '#ffe9a8' : '#fff', 0);
      if (!Online.ranked && j === Online.host) txt(W / 2 - 390, y + 19, 'CHEF', 10, '#ffd166', 0);
      txt(W / 2 + 20, y, p.char ? CHARS[p.char].name : '...', 15, '#cfd3ff');
      txt(W / 2 + 190, y, p.ready ? 'PRÊT' : '', 15, '#6ee7b7');
      if (team) {
        const t = p.team === 1 ? 1 : 0;
        const tc = TEAM_COLS[Online.tcols[t]] || TEAM_COLS[t];
        const col = Phaser.Display.Color.HexStringToColor(tc.css).color;
        const x = W / 2 + 360;
        this.ui.push(this.add.rectangle(x, y, 190, 40, col, 1).setStrokeStyle(3, 0x000000).setDepth(D + 1));
        txt(x, y, 'ÉQUIPE ' + tc.name, 12, '#fff');
        // le chef du salon place chaque joueur dans une équipe (toucher pour changer)
        if (isHost) this.uiBtns.push({ x, y, w: 190, h: 40, fn: () => Online.conn.send({ t: 'team', slot: j, team: 1 - t }) });
      }
    }
    // réglages du chef : mode, couleurs des équipes
    let yh = y0 + cap * rh + 6;
    if (isHost) {
      const other = Online.mode === 'team' ? 'ffa' : 'team';
      btn(W / 2 - (team ? 320 : 0), yh, 300, 50, 'MODE : ' + (team ? 'ÉQUIPES' : 'CHACUN POUR SOI'), 0xf72585, () => Online.conn.send({ t: 'mode', mode: other }), 12);
      if (team)
        [0, 1].forEach((t) => {
          const tc = TEAM_COLS[Online.tcols[t]];
          const next = () => {
            let c = Online.tcols[t];
            do c = (c + 1) % TEAM_COLS.length;
            while (c === Online.tcols[1 - t]);
            Online.conn.send({ t: 'tcol', team: t, col: c });
          };
          btn(W / 2 + (t === 0 ? 0 : 320), yh, 300, 50, `ÉQUIPE ${t + 1} : ${tc.name}`, Phaser.Display.Color.HexStringToColor(tc.css).color, next, 12);
        });
      yh += 44;
    }
    // pourquoi la partie ne démarre pas encore
    let hint = '';
    if (here.length < 2) hint = Online.ranked ? "EN ATTENTE DE L'ADVERSAIRE..." : 'EN ATTENTE DE JOUEURS (2 À 4)...';
    else if (team && new Set(here.map((p) => (p.team === 1 ? 1 : 0))).size < 2) hint = isHost ? 'TOUCHE LES ÉQUIPES POUR RÉPARTIR LES JOUEURS' : 'LE CHEF RÉPARTIT LES ÉQUIPES';
    else if (me && me.char && !me.ready) hint = 'TOUCHE PRÊT QUAND TU ES BON';
    else if (me && me.ready) hint = 'LA PARTIE DÉMARRE QUAND TOUT LE MONDE EST PRÊT';
    if (team && isHost && !hint) hint = 'TOUCHE UNE ÉQUIPE POUR CHANGER UN JOUEUR DE CAMP';
    if (hint) txt(W / 2, yh + 22, hint, 12, '#9aa0d0');
    // actions
    const acts = [];
    if (!me || !me.char || !me.ready) acts.push({ label: me && me.char ? 'CHANGER DE PERSO' : 'CHOISIR MON PERSO', col: 0xf72585, fn: () => this.lobbyPick() });
    if (me && me.char && !me.ready) acts.push({ label: 'PRÊT !', col: 0x6ee7b7, fn: () => Online.conn.send({ t: 'ready' }) });
    if (!Online.ranked) acts.push({ label: 'COPIER LE LIEN', col: 0x4cc9f0, fn: () => this.copyInvite() });
    acts.push({ label: 'QUITTER', col: 0x888888, fn: () => leaveOnline() });
    const bw = 280, gap = 20, by = this.H - 52;
    acts.forEach((a, k) => btn(W / 2 + (k - (acts.length - 1) / 2) * (bw + gap), by, bw, 62, a.label, a.col, a.fn, 14));
    if (!Online.picked && (!me || !me.char)) this.lobbyPick();
  },

  lobbyPick() {
    onlinePick = (id) => {
      onlinePick = null;
      Online.picked = id;
      Online.conn.send({ t: 'pick', char: id });
      this.showLobby();
    };
    this.showSelect();
  },

  copyInvite() {
    const url = location.origin + location.pathname + '?room=' + Online.code;
    const done = () => this.popup(this.W / 2, 240, 'LIEN COPIÉ', '#6ee7b7');
    if (navigator.clipboard) navigator.clipboard.writeText(url).then(done, () => prompt('Copie ce lien', url));
    else prompt('Copie ce lien', url);
  },

  // ----- Match ------------------------------------------------------------------------
  onlineStart(m) {
    this.clearUi();
    onlinePick = null;
    this.over = false;
    // même terrain sur les deux téléphones : tiré du code de la salle
    const stage = STAGES.includes(m.stage) ? m.stage : STAGES.includes(Online.stage) ? Online.stage : stageFromCode(Online.code);
    if (this.applyStage) this.applyStage(stage);
    if (typeof MUSIC !== 'undefined') MUSIC.play(stage === 'dune' ? 'desert' : stage === 'gala' ? 'gala' : 'night');
    Online.mode = m.mode || 'ffa';
    if (m.tcols) Online.tcols = m.tcols;
    const meIdx = m.order ? m.order.indexOf(Online.idx) : Online.idx;
    this.beginNetMatch({ me: meIdx, chars: m.chars, names: m.names, mode: Online.mode, teams: m.teams, tcols: Online.tcols, send: (o) => Online.conn && Online.conn.send(o), rtt: () => (Online.conn ? Online.conn.rtt : 0) });
    this.state = 'countdown';
    this.setControls(true);
    this.onDesync = (f) => this.onlineEndNoResult('DÉSYNCHRONISATION');
    const D = 120;
    const t = this.add.text(this.W / 2, this.H * 0.35, '3', { fontFamily: FONT, fontSize: '96px', color: '#fff', stroke: '#f72585', strokeThickness: 14 }).setOrigin(0.5).setDepth(D);
    const names = this.add.text(this.W / 2, this.H * 0.2, m.names.join('  VS  '), { fontFamily: FONT, fontSize: '22px', color: '#ffe9a8', stroke: '#000', strokeThickness: 5 }).setOrigin(0.5).setDepth(D);
    let c = 3;
    const ev = this.time.addEvent({
      delay: 800,
      repeat: 3,
      callback: () => {
        c--;
        if (c > 0) {
          t.setText(String(c));
          this.sfx('count');
        } else if (c === 0) {
          t.setText('GO !');
          this.sfx('go');
          this.state = 'play';
          this.acc = 0;
        } else {
          t.destroy();
          names.destroy();
        }
      },
    });
    this.netHud = this.add.text(this.W - 20, this.H - 20, '', { fontFamily: FONT, fontSize: '11px', color: '#9aa0d0' }).setOrigin(1, 1).setDepth(50);
  },

  onlineForfeit(msg) {
    if (this.over) return;
    this.over = true;
    this.net = this.net; // gardé pour le rapport
    const mine = this.net ? this.net.me : Online.idx;
    this.banner.setText('VICTOIRE !');
    this.sub.setText(msg);
    Online.conn && Online.conn.send({ t: 'result', winner: mine });
    this.onlineOverButtons();
  },

  onlineEndNoResult(msg) {
    if (this.over) return;
    this.over = true;
    this.banner.setText('MATCH ANNULÉ').setFontSize('36px');
    this.sub.setText(msg);

  },

  onlineFinish(winnerPlayer) {
    const widx = winnerPlayer.i;
    const me = this.pl(this.net ? this.net.me : 0);
    const multi = this.pls.length > 2;
    const won = winnerPlayer === me || (multi && winnerPlayer.team === me.team);
    this.banner.setText(won ? 'VICTOIRE !' : 'DÉFAITE...');
    if (multi) this.sub.setText(Online.mode === 'team' ? `ÉQUIPE ${TEAM_COLS[Online.tcols[winnerPlayer.team]].name} GAGNE` : `${winnerPlayer.name || winnerPlayer.def.name} GAGNE`);
    else this.sub.setText(Online.ranked ? 'CALCUL DU CLASSEMENT...' : '');
    Online.conn && Online.conn.send({ t: 'result', winner: widx });
    this.onlineOverButtons();
  },

  onlineOverButtons() {
    this.setControls(false);
    this.time.delayedCall(1400, () => {
      this.state = 'menu';
      this.menuButtons(
        [
          ...(Online.ranked ? [] : [{ label: 'REVANCHE', fn: () => { Online.rematchAsked = true; Online.conn && Online.conn.send({ t: 'rematch' }); this.sub.setText("EN ATTENTE DE L'ADVERSAIRE..."); } }]),
          { label: 'QUITTER', col: 0x888888, fn: () => leaveOnline() },
        ],
        this.H * 0.62
      );
    });
  },
});

// ===========================================================================
// BOTS : jouent avec les mêmes règles que le joueur.
// Le niveau règle le temps de réaction, la précision et les choix (jamais de bonus de dégâts).
// ===========================================================================
const BOT_LV = [
  { react: 430, acc: 0.6, aggr: 0.65, dodge: 0.3, punish: 0.35, di: 0.3, escape: 0.2 }, // facile

    ['sA', [30, 140], [-60, 60], 3], ['uA', [0, 90], [-160, 10], 2], ['dA', [0, 60], [30, 160], 1.5],

  bigzinzin: [
    ['nL', [0, 100], [-60, 50], 4], ['sL', [50, 160], [-50, 50], 2.5], ['uL', [0, 90], [-170, -20], 2], ['dL', [0, 110], [-20, 60], 2],
    ['sA', [30, 140], [-60, 60], 3], ['uA', [0, 90], [-160, 10], 2], ['dA', [0, 60], [30, 160], 1.5],
    ['nS', [0, 80], [-220, -20], 1.5], ['sS', [140, 520], [-60, 60], 2, { any: true }], ['dS', [60, 200], [-20, 60], 1, { tgtGround: true }],
    ['uS', [0, 140], [-80, 80], 0.4], ['dAS', [0, 60], [60, 260], 1],
  ],
  ln4: [
    ['nL', [0, 120], [-60, 50], 4], ['sL', [60, 190], [-50, 50], 2.5], ['uL', [0, 110], [-170, -20], 2], ['dL', [0, 140], [-20, 60], 2],
    ['sA', [30, 170], [-60, 60], 3], ['uA', [0, 110], [-160, 10], 2], ['dA', [0, 70], [30, 160], 1.5],
    ['nS', [160, 560], [-60, 60], 2, { any: true }], ['sS', [80, 320], [-50, 50], 2], ['dS', [380, 900], [-200, 200], 0.4],
    ['uS', [0, 100], [-220, -20], 0.6], ['dAS', [0, 60], [60, 260], 1],
  ],
  natanax: [
    ['nL', [0, 100], [-60, 50], 4], ['sL', [50, 160], [-50, 50], 2.5], ['uL', [0, 90], [-170, -20], 2], ['dL', [0, 110], [-20, 60], 2],
    ['sA', [30, 140], [-60, 60], 3], ['uA', [0, 90], [-160, 10], 2], ['dA', [0, 60], [30, 160], 1.5],
    ['nS', [0, 120], [-40, 60], 1.2], ['sS', [120, 380], [-60, 60], 2, { any: true }], ['dS', [0, 150], [-40, 60], 1, { tgtGround: true }],
    ['uS', [0, 100], [-220, -20], 0.6], ['dAS', [0, 60], [60, 260], 1],
  ],
  astra: [
    ['nL', [0, 80], [-60, 50], 2], ['sL', [60, 190], [-40, 40], 3], ['uL', [0, 90], [-170, -20], 2], ['dL', [0, 110], [-20, 60], 1.5],
    ['sH', [200, 650], [-60, 60], 1.5], ['uH', [60, 320], [-260, -60], 2], ['dH', [0, 110], [-60, 60], 2],
    ['sA', [30, 150], [-60, 60], 2], ['uA', [0, 90], [-160, 10], 2], ['dA', [0, 60], [30, 160], 1.5],
    ['nS', [160, 620], [-60, 60], 4, { any: true }], ['dS', [40, 260], [-20, 60], 1, { tgtGround: true }],
  ],
  nini: [
    ['nL', [0, 90], [-60, 50], 4], ['sL', [50, 160], [-50, 50], 2], ['uL', [0, 90], [-170, -20], 2], ['dL', [0, 110], [-20, 60], 2],
    ['sH', [50, 170], [-50, 50], 2], ['uH', [0, 90], [-200, -20], 2], ['dH', [30, 140], [-40, 50], 1.2],
    ['sA', [30, 140], [-60, 60], 3], ['uA', [0, 90], [-160, 10], 2], ['dA', [0, 60], [30, 160], 1.5], ['dAH', [0, 80], [40, 260], 1],
    ['nS', [160, 520], [-60, 60], 1.2, { tgtGround: true }], ['dS', [160, 600], [-40, 60], 1.2, { tgtGround: true }],
  ],
};
const BOT_AIR = { sA: 1, uA: 1, dA: 1, uAH: 1, dAH: 1, dAS: 1 };
const BOT_KIND = { sH: 'H', uH: 'H', dH: 'H', uAH: 'H', dAH: 'H', nS: 'S', sS: 'S', uS: 'S', dS: 'S', dAS: 'S', uSA: 'S' };
for (const id in BOT_MOVES)
  BOT_MOVES[id] = BOT_MOVES[id].map(([k, dx, dy, w, ex]) => Object.assign({ k, dx, dy, w, air: !!BOT_AIR[k], kind: BOT_KIND[k] || 'L' }, ex || {}));
const BOT_PREF = { toro: 70, astra: 330, grom: 60, deadlulu: 200, denodoom: 160, nini: 90, adieulescure: 90, bigzinzin: 120, ln4: 120, natanax: 110 };
// le coup peut-il servir dans cette situation (au sol / en l'air) ?
const botFits = (o, grounded) => o.any || o.air === !grounded;

Object.assign(GameScene.prototype, {
  botInput(bot, tgt, now) {
    const i = { sx: 0, sy: 0, jump: false, attack: false, heavy: false, special: false, hold: false, block: false };
    if (bot.stocks <= 0 || tgt.stocks <= 0) return i;
    if (this.nxBot) { const nx = this.nxBot(bot, tgt, now); if (nx) return nx; } // NATANAX : le TABLEAU
    const lv = BOT_LV[bot.lvl === undefined ? 1 : bot.lvl];
    const aggr = lv.aggr * (bot.aggr || 1);
    const s = bot.sprite, b = s.body, ts = tgt.sprite, tb = ts.body;
    // adversaire invisible (DOUBLURE) : le bot ne voit que la silhouette de billets
    const dcy = now < (tgt.invisUntil || 0) && this.projs.find((q) => !q.dead && q.id === tgt.decoyId);
    const tx = dcy ? dcy.x : ts.x, ty = dcy ? dcy.y : ts.y;
    const dx = tx - s.x, dy = ty - s.y, adx = Math.abs(dx), dir = Math.sign(dx) || 1;
    const cx = this.W / 2, half = L.mainW / 2;
    const grounded = b.blocked.down || b.touching.down;
    const tGround = tb.blocked.down || tb.touching.down;
    const offstage = Math.abs(s.x - cx) > half - 4 || s.y > L.baseY + 6;
    const press = () => {
      // un appui d'esquive = un front montant : on relâche une image sur deux
      i.block = !bot.botBlockPrev;
    };
    bot.botBlockPrev = false;

    // ballon de handball : on maintient le temps voulu
    if (bot.atk && bot.atk.charging) {
      i.hold = now - bot.atk.start < (bot.botCharge || 400);
      return i;
    }
    // lourd chargé : on garde LOURD appuyé un moment
    if (bot.atk && bot.atk.m.chargeMax && now < (bot.botHoldUntil || 0) && bot.atk.start >= (bot.botHoldFrom || 0)) {
      i.hold = true;
      return i;
    }
    // accroché au rebord : on attend un peu, puis on remonte, on saute, on attaque ou on roule
    if (bot.ledgeSide) {
      if (bot.botLedgeAt !== bot.ledgeAt) {
        bot.botLedgeAt = bot.ledgeAt;
        bot.botLedgeWait = lv.react * 0.6 + Math.random() * 500;
        bot.botLedgeHow = Math.random();
      }
      if (now - bot.ledgeAt > bot.botLedgeWait) {
        const h = bot.botLedgeHow;
        if (h < 0.45) i.sx = -Math.sign(bot.ledgeSide);
        else if (h < 0.7) i.jump = true;
        else if (h < 0.85) i.attack = true;
        else press();
      }
      bot.botBlockPrev = i.block;
      return i;
    }
    // éjecté : influence directionnelle vers le terrain, et sortie d'éjection quand ça devient dangereux
    if (now < bot.stunUntil) {
      if (Math.random() < lv.di) {
        i.sx = Math.sign(cx - s.x) || 0;
        i.sy = -0.5;
      }
      const fast = hyp(b.velocity.x, b.velocity.y) > 700;
      if (fast && now - bot.stunStart >= STUN_ESCAPE && !bot.airDodged && Math.random() < lv.escape * 0.2) press();
      bot.botBlockPrev = i.block;
      return i;
    }
    // enchaînement (jab x3 de Toro, griffes de Nini) : on rappuie pendant le coup
    if (bot.atk && bot.atk.chainKey && now >= bot.atk.hitAt && bot.atk.chainIdx < bot.def.moves[bot.atk.chainKey].chain.length) {
      if (bot.botChainFor !== bot.atk.id) {
        bot.botChainFor = bot.atk.id;
        bot.botChainGo = Math.random() < lv.acc;
      }
      if (bot.botChainGo) {
        i.attack = true;
        i.sx = dir * 0.3; // sans direction (sinon ce serait un autre coup)
        return i;
      }
    }
    // hors du terrain : on revient
    if (offstage && !grounded) {
      this.botRecover(bot, i, now, lv);
      bot.botBlockPrev = i.block;
      return i;
    }

    // --- défense : esquiver ce qu'on a vu venir (après le temps de réaction)
    const ta = tgt.atk;
    if (ta && ta.id !== bot.botSeenAtk && now - ta.start >= lv.react && !ta.charging) {
      bot.botSeenAtk = ta.id;
      const m = ta.m;
      const reach = (m.ox || 0) + (m.w || 0) / 2 + 40;
      const coming = now < ta.hitAt + (m.active || 0) && (m.type === 'melee' || m.type === 'grab') && adx < reach + 30 && Math.abs(dy) < 140;
      // contre (OBJECTION !, CONTRÔLE) : en bas + SPÉCIAL
      const ctr = bot.def.moves.dS;
      if (coming && ctr && (ctr.type === 'counter' || ctr.type === 'catch') && !bot.atk && now > bot.cdUntil && this.botReady(bot, { k: 'dS' }, grounded, now) && Math.random() < lv.dodge * 0.35) {
        i.special = true;
        i.sy = 1;
        i.sx = dir * 0.3;
        return i;
      }
      if (coming && Math.random() < lv.dodge && now >= bot.dodgeCd && !bot.atk) {
        const r = Math.random();
        if (r < 0.5) i.sx = 0;
        else i.sx = r < 0.8 ? -dir : dir;
        press();
        bot.botBlockPrev = i.block;
        return i;
      }
      // punition : le coup adverse va rater et sa fin est longue
      if (!coming && m.type !== 'proj' && adx < 170 && Math.random() < lv.punish) bot.botPunish = ta.id;
    }
    for (const p of this.projs) {
      if (p.dead || p.owner !== tgt || p.id === bot.botSeenProj) continue;
      const pdx = s.x - p.x;
      const approaching = Math.sign(p.vx || 0) === Math.sign(pdx) || (p.spec.kind === 'book' && Math.abs(pdx) < 110);
      if (approaching && Math.abs(pdx) < 220 && Math.abs(p.y - s.y) < 120 && now - p.born >= lv.react * 0.5) {
        bot.botSeenProj = p.id;
        const cm = bot.def.moves.dS;
        if (cm && cm.type === 'catch' && !bot.atk && now > bot.cdUntil && this.botReady(bot, { k: 'dS' }, grounded, now) && Math.random() < lv.dodge * 0.7) {
          i.sx = dir * 0.3;
          i.sy = 1;
          i.special = true;
          return i;
        }
        if (Math.random() < lv.dodge) {
          if (grounded && Math.random() < 0.5 && bot.jumps > 0) i.jump = true;
          else press();
          bot.botBlockPrev = i.block;
          return i;
        }
      }
    }
    // punir un coup raté (pendant sa fin)
    if (ta && bot.botPunish === ta.id && now >= ta.hitAt + (ta.m.active || 0) && !bot.atk) {
      bot.botPunish = 0;
      const opts = (BOT_MOVES[bot.char] || []).filter((o) => botFits(o, grounded) && adx >= o.dx[0] - 30 && adx <= o.dx[1] + 20 && !o.charge && o.kind !== 'S');
      if (opts.length) return this.botUse(bot, i, opts[0], dir, lv);
    }

    // --- déplacement : distance préférée, sans tomber du terrain
    const pref = BOT_PREF[bot.char] || 90;
    const tOff = Math.abs(tx - cx) > half || ty > L.baseY + 10;
    if (tOff) {
      // l'adversaire est dehors : on se place près du bord pour le gêner
      const ex = cx + Math.sign(tx - cx) * (half - 50);
      if (Math.abs(ex - s.x) > 20) i.sx = Math.sign(ex - s.x) * 0.9;
    } else if (adx > pref + 40) i.sx = dir * 0.9;
    else if (adx < pref - 40) i.sx = -dir * 0.7;
    if (Math.abs(s.x + i.sx * 60 - cx) > half - 30 && !tOff) i.sx = 0; // pas de chute volontaire
    // monter sur une plateforme / en descendre
    if (dy < -110 && grounded && adx < 260 && Math.random() < 0.025 * aggr) i.jump = true;
    // CÉRÉMONIE : bloqué contre un mur (le pupitre, un balcon) -> on saute par dessus
    if (this.stageId === 'gala' && grounded && bot.jumps > 0 && ((b.blocked.left && i.sx < -0.2) || (b.blocked.right && i.sx > 0.2))) i.jump = true;
    // CÉRÉMONIE : balcons plus hauts qu'un saut -> en l'air, on relance un saut pour rejoindre la cible
    if (this.stageId === 'gala' && GALA.botClimb !== false && !grounded && !bot.atk && dy < -90 && adx < 240 && bot.jumps > 0 && s.body.velocity.y > -150 && now - bot.lastJump > 200 && Math.random() < 0.25) {
      i.jump = true;
      i.sx = dir * 0.6;
    }
    if (dy > 110 && grounded && s.y < L.baseY - 60 && adx < 200 && Math.random() < 0.5) {
      i.sy = 1;
      i.sx = 0;
    }

    // l'adversaire est charmé : on en profite avec un coup fort
    if (tgt.charmUntil > now && !bot.atk && now > bot.cdUntil && adx < 200) {
      const o = grounded ? { k: adx < 90 ? 'uL' : 'sL', kind: 'L' } : { k: 'sA', air: true, kind: 'L' };
      return this.botUse(bot, i, o, dir, { acc: 1 });
    }
    // combo : un léger vient de toucher -> on finit par un lourd (coupe le léger)
    // combo : un léger vient de toucher -> on le coupe : léger bas (pour jongler), lourd ou spéciale pour finir
    if (bot.atk && bot.atk.landed && bot.atk.m.light && now >= bot.atk.landed + 40 && (bot.atk.cancels || 0) < 2 && bot.botCancelFor !== bot.atk.id) {
      bot.botCancelFor = bot.atk.id;
      if (Math.random() < lv.acc * 0.6) {
        const r = Math.random();
        let k;
        if (!grounded) k = dy < -40 ? 'uA' : 'sA';
        else if (r < 0.3 && bot.atk.key !== 'dL') k = 'dL';
        else if (r < 0.75) k = dy < -60 ? 'uL' : 'sS';
        else k = 'nS';
        const o = { k, air: !grounded, kind: BOT_KIND[k] || 'L', any: true };
        if (k !== bot.atk.key && bot.def.moves[k] && this.botReady(bot, o, grounded, now)) return this.botUse(bot, i, o, dir, { acc: 1 });
      }
    }
    // combo : l'adversaire est sonné juste au-dessus -> on saute et on enchaîne en l'air
    if (now < tgt.stunUntil && adx < 120 && !bot.atk && now > bot.cdUntil && Math.random() < lv.acc) {
      if (grounded && dy < -40 && dy > -260 && bot.jumps > 0) {
        i.jump = true;
        i.sx = dir * 0.5;
        return i;
      }
      if (!grounded && Math.abs(dy) < 90) {
        const k = adx > 60 ? 'sA' : 'uA';
        if (this.botReady(bot, { k }, grounded, now)) return this.botUse(bot, i, { k, air: true, kind: 'L' }, dir, lv);
      }
    }
    // --- attaque
    if (!bot.atk && now > bot.cdUntil) {
      const opts = (BOT_MOVES[bot.char] || []).filter(
        (o) =>
          botFits(o, grounded) &&
          adx >= o.dx[0] && adx <= o.dx[1] &&
          dy >= o.dy[0] && dy <= o.dy[1] &&
          (!o.tgtGround || tGround) &&
          (!o.heatMin || (bot.heat || 0) >= o.heatMin) &&
          this.botReady(bot, o, grounded, now)
      );
      if (opts.length && Math.random() < 0.055 * aggr) {
        let tot = opts.reduce((a, o) => a + o.w, 0), r = Math.random() * tot, pick = opts[0];
        for (const o of opts) {
          r -= o.w;
          if (r <= 0) { pick = o; break; }
        }
        return this.botUse(bot, i, pick, dir, lv);
      }
    }
    bot.botBlockPrev = i.block;
    return i;
  },

  // le coup est-il disponible (recharge, objets déjà à l'écran) ?
  botReady(bot, o, grounded, now) {
    const mv = bot.def.moves;
    const key = o.k;
    const m = mv[key];
    if (!m) return false;
    if ((m.cd || m.cooldown) && now < (bot.moveCd[m.cdKey || key] || 0)) return false;
    if (m.type === 'burst' && (bot.heat || 0) < (m.minHeat || 25)) return false;
    if (!grounded && m.onceAir && bot[m.onceAir + 'Used']) return false;
    if (!grounded && m.helpless && bot.recUsed) return false;
    if (m.max && m.proj && !m.replace && this.projs.filter((p) => !p.dead && p.owner === bot && p.spec.kind === m.proj.kind && p.spec.tex === m.proj.tex).length >= m.max) return false;
    return true;
  },

  botUse(bot, i, o, dir, lv) {
    let k = o.k;
    let kind = o.kind || BOT_KIND[k] || 'L';
    // erreur de précision : mauvais coup de temps en temps
    if (Math.random() > lv.acc) {
      k = (o.air ? ['uA', 'sA', 'dA'] : ['nL', 'sL', 'uL', 'dL'])[Math.floor(Math.random() * (o.air ? 3 : 4))];
      kind = BOT_KIND[k] || 'L';
    }
    i.attack = kind === 'L';
    i.heavy = false;
    i.special = kind === 'S';
    i.sy = 0;
    const a = k[0];
    // neutre : on effleure le joystick vers la cible (pour se tourner) sans sortir de la zone morte
    i.sx = a === 's' ? dir : dir * 0.3;
    if (a === 'd') i.sy = 1;
    if (a === 'u') i.sy = -1;
    if (o.charge) bot.botCharge = 200 + Math.random() * 800;
    // lourd : on le charge parfois
    const m = bot.def.moves[k];
    if (m && m.chargeMax && Math.random() < 0.45) {
      bot.botHoldUntil = this.simNow + m.startup + 60 + Math.random() * 420;
      bot.botHoldFrom = this.simNow;
      i.hold = true;
    }
    bot.botBlockPrev = false;
    return i;
  },

  botRecover(bot, i, now, lv) {
    const s = bot.sprite, b = s.body;
    const cx = this.W / 2, half = L.mainW / 2;
    const side = Math.sign(s.x - cx) || 1;
    const edgeX = cx + side * half;
    const out = (s.x - edgeX) * side; // distance hors du terrain
    const below = s.y > L.baseY - 30;
    i.sx = -side;
    // Grom : grappin vers le bord quand il est assez près
    if (bot.char === 'grom' && !bot.atk && this.botReady(bot, { k: 'sS' }, false, now) && out < 330 && Math.abs(s.y - L.baseY) < 110 && now > bot.cdUntil && Math.random() < 0.3) {
      i.special = true; // GRAPPIN (spéciale), vers le terrain
      i.sx = -side;
      i.sy = 0;
      return;
    }
    if (b.velocity.y > -80) {
      if (bot.jumps > 0 && now - bot.lastJump > 220 && (below || out > 160)) i.jump = true;
      else if (bot.jumps === 0 && (s.y > L.baseY - 60 || out > 140) && this.botRecoverSpecial(bot, i, now, side)) {
        // SPÉCIAL haut (remonter) ou spéciale de côté qui donne de l'élan, en visant le terrain
      } else if (bot.jumps === 0 && !bot.airDodged && s.y > L.baseY + 20 && out < 260 && Math.random() < lv.escape) {
        i.block = !bot.botBlockPrev;
        i.sx = -side;
        i.sy = -0.8;
      }
    }
  },

  // spéciale de retour : haut si elle fait monter (ou CTRL+Z), sinon la spéciale de côté si elle donne de l'élan
  botRecoverSpecial(bot, i, now, side) {
    if (bot.atk || now <= bot.cdUntil) return false;
    for (const k0 of ['uS', 'sS']) {
      const k = bot.def.moves[k0 + 'A'] ? k0 + 'A' : k0; // en l'air : la version aérienne si elle existe
      const m = bot.def.moves[k];
      if (!m) continue;
      const mobile = m.rise || m.type === 'blink' || m.type === 'vanish' || m.type === 'float' || m.type === 'carry' || (k0 === 'sS' && (m.dashV || m.lunge));
      if (!mobile || !this.botReady(bot, { k }, false, now)) continue;
      i.special = true;
      i.sy = k0 === 'uS' ? -1 : 0;
      i.sx = k0 === 'sS' ? -side : -side * 0.3;
      return true;
    }
    return false;
  },

  // Mannequin du mode entraînement
  dummyInput(pl, other, now) {
    const i = { sx: 0, sy: 0, jump: false, attack: false, hold: false, block: false };
    const mode = this.dummyMode || 0;
    if (mode === 1) {
      // saute régulièrement
      if ((pl.sprite.body.blocked.down || pl.sprite.body.touching.down) && Math.floor(now / 900) !== pl.dumJump) {
        pl.dumJump = Math.floor(now / 900);
        i.jump = true;
      }
    } else if (mode === 2) {
      // esquive dès qu'une attaque part
      const a = other.atk;
      if (a && a.id !== pl.dumSeen && now - a.start > 60) {
        pl.dumSeen = a.id;
        i.block = true;
      }
    } else if (mode === 3) return this.botInput(pl, other, now);
    // revient au centre s'il est poussé hors du terrain
    const cx = this.W / 2;
    if (Math.abs(pl.sprite.x - cx) > L.mainW / 2 - 10 || pl.sprite.y > L.baseY + 6) this.botRecover(pl, i, now, BOT_LV[2]);
    return i;
  },
});

// SON, VIBRATION, INDICATEURS, RÉGLAGES, ENTRAÎNEMENT
// ===========================================================================

// --- Sons synthétisés (aucun fichier à charger) --------------------------------
const SFX = {
  ctx: null,
  noise: null,
  last: {},
  init() {
    if (this.ctx) return this.ctx;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    try {
      this.ctx = new AC();
      const n = this.ctx.sampleRate * 0.5;
      this.noise = this.ctx.createBuffer(1, n, this.ctx.sampleRate);
      const d = this.noise.getChannelData(0);
      let seed = 12345;
      for (let i = 0; i < n; i++) {
        seed = (seed * 1103515245 + 12345) & 0x7fffffff;
        d[i] = (seed / 0x3fffffff - 1) * 0.9;
      }
    } catch (e) {
      this.ctx = null;
    }
    return this.ctx;
  },
  tone(type, f0, f1, dur, vol, t0) {
    const c = this.ctx, t = c.currentTime + (t0 || 0);
    const o = c.createOscillator(), g = c.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(f1, 20), t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(c.destination);
    o.start(t);
    o.stop(t + dur + 0.02);
  },
  hiss(filter, freq, dur, vol, sweep) {
    const c = this.ctx, t = c.currentTime;
    const src = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    src.buffer = this.noise;
    f.type = filter;
    f.frequency.setValueAtTime(freq, t);
    if (sweep) f.frequency.exponentialRampToValueAtTime(sweep, t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    src.connect(f).connect(g).connect(c.destination);
    src.start(t);
    src.stop(t + dur + 0.02);
  },
  play(name, k) {
    if (!this.ctx || this.ctx.state !== 'running') return;
    const now = performance.now();
    if (now - (this.last[name] || 0) < 45) return;
    this.last[name] = now;
    k = k || 0.5;
    try {
      if (name === 'hit') {
        this.hiss('bandpass', 700 + k * 700, 0.09, 0.22 + 0.2 * k);
        this.tone('sine', 140, 55, 0.12, 0.35 + 0.2 * k);
      } else if (name === 'ko') {
        this.tone('sine', 100, 35, 0.45, 0.55);
        this.hiss('lowpass', 900, 0.35, 0.3, 200);
      } else if (name === 'jump') this.tone('square', 330, 620, 0.08, 0.05);
      else if (name === 'dodge') this.hiss('highpass', 1800, 0.13, 0.12, 5000);
      else if (name === 'swing') this.hiss('bandpass', 1400, 0.06, 0.05, 2600);
      else if (name === 'parry') this.tone('triangle', 900, 1500, 0.12, 0.14);
      else if (name === 'armor') this.tone('square', 210, 160, 0.09, 0.09);
      else if (name === 'charm') this.tone('sine', 700, 1150, 0.18, 0.1);
      else if (name === 'count') this.tone('square', 660, 660, 0.12, 0.08);
      else if (name === 'go') this.tone('square', 990, 990, 0.25, 0.1);
      else if (name === 'ui') this.tone('triangle', 520, 640, 0.05, 0.06);
      else if (name === 'rumble') {
        this.tone('sine', 55, 38, 1.4, 0.3);
        this.hiss('lowpass', 260, 1.6, 0.22, 120);
      }
    } catch (e) {}
  },
};
// le son ne peut démarrer qu'après un toucher
['pointerdown', 'touchstart', 'keydown'].forEach((ev) =>
  window.addEventListener(
    ev,
    () => {
      const c = SFX.init();
      if (c && c.state !== 'running') c.resume().catch(() => {});
    },
    { passive: true }
  )
);

Object.assign(GameScene.prototype, {
  sfx(name, k) {
    if (this.resim || !SETTINGS.sound) return;
    SFX.play(name, k);
  },
  buzz(ms) {
    if (this.resim || !SETTINGS.vib || !navigator.vibrate) return;
    try {
      navigator.vibrate(Math.round(ms));
    } catch (e) {}
  },

  // --- Indicateurs : perso hors de l'écran, changement de côté --------------------
  overlayFx(now) {
    if (this.resim || !this.p1 || !this.p2 || !this.pls) return;
    if (!this.ovl) this.ovl = {};
    this.pls.forEach((pl, i) => {
      const s = pl.sprite;
      let o = this.ovl[i];
      if (!o) {
        o = this.ovl[i] = {
          bg: this.add.circle(0, 0, 30, 0x0b0d1f, 0.85).setStrokeStyle(3, pl.human ? 0xffe9a8 : 0xff8fa3).setDepth(65),
          ico: this.add.image(0, 0, `stock_${pl.char}`).setScale(5).setDepth(66),
          arrow: this.add.triangle(0, 0, 0, -10, 18, 0, 0, 10, pl.human ? 0xffe9a8 : 0xff8fa3).setDepth(66),
          side: this.add.text(0, 0, '', { fontFamily: FONT, fontSize: '14px', color: '#ffe9a8', stroke: '#000', strokeThickness: 4 }).setOrigin(0.5).setDepth(41),
        };
      }
      const m = 40;
      // position à l'écran (la caméra du combat zoome et se déplace)
      const cam = this.cameras.main, wv = cam.worldView;
      const px = (s.x - wv.x) * cam.zoom, py = (s.y - wv.y) * cam.zoom;
      const out = pl.stocks > 0 && !(now < (pl.invisUntil || 0)) && wv.width > 0 && (px < 0 || px > this.W || py < 0 || py > this.H);
      [o.bg, o.ico, o.arrow].forEach((g) => g.setVisible(out));
      if (out) {
        const x = Phaser.Math.Clamp(px, m, this.W - m), y = Phaser.Math.Clamp(py, m, this.H - m);
        o.bg.setPosition(x, y);
        o.ico.setPosition(x, y);
        const a = Math.atan2(py - y, px - x);
        o.arrow.setPosition(x + Math.cos(a) * 40, y + Math.sin(a) * 40).setRotation(a);
      }
      // petite flèche sous les pieds quand AVANT / ARRIÈRE changent de sens
      const flip = pl.flipAt && now - pl.flipAt < 450 && pl.stocks > 0;
      o.side.setVisible(!!flip).setText(pl.facing > 0 ? '>' : '<').setPosition(s.x, s.y + 52);
    });
    if (this.net && this.updateNetHud) this.updateNetHud();
  },

  // --- Réglages -------------------------------------------------------------------
  showSettings() {
    this.menuBase('RÉGLAGES');
    const D = 120;
    const lab = {
      sound: () => 'BRUITAGES : ' + (SETTINGS.sound ? 'OUI' : 'NON'),
      music: () => 'MUSIQUE : ' + (SETTINGS.music !== false ? 'OUI' : 'NON'),
      zoom: () => 'CAMÉRA : ' + (SETTINGS.zoom !== false ? 'ZOOM' : 'FIXE'),
      vib: () => 'VIBRATION : ' + (SETTINGS.vib ? 'OUI' : 'NON'),
      btnSize: () => 'BOUTONS : ' + ['PETITS', 'MOYENS', 'GRANDS'][SETTINGS.btnSize],
      flip: () => 'MAINS : ' + (SETTINGS.flip ? 'GAUCHER' : 'DROITIER'),
      timer: () => 'CHRONO : ' + (SETTINGS.timer ? '8 MIN' : 'AUCUN'),
      botLevel: () => 'BOT : ' + ['FACILE', 'MOYEN', 'DIFFICILE'][SETTINGS.botLevel],
    };
    const next = {
      sound: () => (SETTINGS.sound = !SETTINGS.sound),
      music: () => { SETTINGS.music = SETTINGS.music === false; if (typeof MUSIC !== 'undefined') MUSIC.setVolume(); },
      zoom: () => (SETTINGS.zoom = SETTINGS.zoom === false),
      vib: () => (SETTINGS.vib = !SETTINGS.vib),
      // taille / côté par défaut : remet aussi les boutons placés à la main à leur place d'origine
      btnSize: () => { SETTINGS.btnSize = (SETTINGS.btnSize + 1) % 3; delete SETTINGS.layout; },
      flip: () => { SETTINGS.flip = !SETTINGS.flip; delete SETTINGS.layout; },
      timer: () => (SETTINGS.timer = !SETTINGS.timer),
      botLevel: () => (SETTINGS.botLevel = (SETTINGS.botLevel + 1) % 3),
    };
    const keys = Object.keys(lab);
    this.uiBtns = [];
    const two = !L.portrait;
    const bw = two ? 440 : Math.min(this.W - 80, 520), bh = two ? 66 : 76, gap = two ? 18 : 18;
    const y0 = two ? this.H * 0.36 : this.H * 0.3;
    keys.forEach((k, idx) => {
      const col = two ? idx % 2 : 0, row = two ? Math.floor(idx / 2) : idx;
      const x = two ? this.W / 2 + (col ? 1 : -1) * (bw / 2 + 14) : this.W / 2;
      const y = y0 + row * (bh + gap);
      const r = this.add.rectangle(x, y, bw, bh, 0x1a1d33, 1).setStrokeStyle(4, 0x4cc9f0).setDepth(D);
      const t = this.add.text(x, y, lab[k](), { fontFamily: FONT, fontSize: '17px', color: '#fff', stroke: '#000', strokeThickness: 4 }).setOrigin(0.5).setDepth(D + 1);
      this.ui.push(r, t);
      this.uiBtns.push({ x, y, w: bw, h: bh, fn: () => { next[k](); saveSettings(); t.setText(lab[k]()); } });
    });
    const rows = two ? Math.ceil(keys.length / 2) : keys.length;
    const yb = y0 + rows * (bh + gap) + 10;
    // placer chaque bouton tactile soi-même (sur une fausse partie)
    const pw = two ? bw * 2 + 28 : bw;
    const rp = this.add.rectangle(this.W / 2, yb, pw, bh, 0x1a1d33, 1).setStrokeStyle(4, 0xf72585).setDepth(D);
    const tp = this.add.text(this.W / 2, yb, 'PLACER LES BOUTONS' + (SETTINGS.layout ? ' (PERSO)' : ''), { fontFamily: FONT, fontSize: '17px', color: '#fff', stroke: '#000', strokeThickness: 4 }).setOrigin(0.5).setDepth(D + 1);
    this.ui.push(rp, tp);
    this.uiBtns.push({ x: this.W / 2, y: yb, w: pw, h: bh, fn: () => { saveSettings(); this.showButtonEditor(); } });
    const yr = yb + bh + gap;
    const r = this.add.rectangle(this.W / 2, yr, 360, bh, 0x1a1d33, 1).setStrokeStyle(4, 0x888888).setDepth(D);
    const t = this.add.text(this.W / 2, yr, 'RETOUR', { fontFamily: FONT, fontSize: '17px', color: '#fff', stroke: '#000', strokeThickness: 4 }).setOrigin(0.5).setDepth(D + 1);
    this.ui.push(r, t);
    // les boutons de combat changent de taille / de côté : on recrée la scène en revenant
    this.uiBtns.push({ x: this.W / 2, y: yr, w: 360, h: bh, fn: () => this.scene.restart() });
  },

  // --- Éditeur de boutons : on déplace et on redimensionne chaque commande sur une fausse partie -----------------
  // Glisser = déplacer (les boutons se contournent : jamais deux l'un sur l'autre) ; toucher = choisir, puis - / + = taille.
  showButtonEditor() {
    // une fausse partie immobile derrière (on garde la recréation de scène pour les boutons d'origine)
    editButtons = true;
    this.scene.restart();
  },

  startButtonEditor() {
    editButtons = false;
    this.editing = true;
    this.beginMatch(chosen || playable()[0]);
    for (let i = 0; i < 40; i++) this.simTick();
    this.updateHud();
    this.state = 'editor';
    KB.used = false;
    this.setControls(true);
    if (this.touchObjs) this.touchObjs.forEach((o) => o.setVisible(true));
    this.edPos = this.ctrlLayout();
    this.edSel = null;
    this.edDrag = null;
    this.edUi = [];
    this.edRing = this.add.circle(0, 0, 10).setStrokeStyle(4, 0xffd166).setFillStyle(0xffd166, 0.12).setDepth(89).setVisible(false);
    this.drawEditorBar();
  },

  // la barre d'outils (en haut au centre, sous le chrono)
  drawEditorBar() {
    (this.edUi || []).forEach((o) => o.destroy());
    this.edUi = [];
    this.edBtns = [];
    const D = 96, W = this.W, P = L.portrait;
    const cy = P ? 230 : 190;
    const add = (o) => (this.edUi.push(o), o);
    add(this.add.rectangle(W / 2, cy, Math.min(W - 40, 680), 170, 0x0b0d1f, 0.86).setStrokeStyle(3, 0xf72585).setDepth(D));
    const txt = (x, y, s, size, col) => add(this.add.text(x, y, s, { fontFamily: FONT, fontSize: size + 'px', color: col || '#fff', stroke: '#000', strokeThickness: 4, align: 'center' }).setOrigin(0.5).setDepth(D + 2));
    const btn = (x, y, w, label, col, fn) => {
      add(this.add.rectangle(x, y, w, 44, 0x1a1d33, 1).setStrokeStyle(3, col).setDepth(D + 1));
      txt(x, y, label, 13);
      this.edBtns.push({ x, y, w, h: 44, fn });
    };
    const sel = this.edSel;
    const NAMES = { stick: 'JOYSTICK', attack: 'COUP', special: 'SPÉCIAL', jump: 'SAUT', block: 'ESQUIVE' };
    txt(W / 2, cy - 62, sel ? NAMES[sel] : 'PLACE TES BOUTONS', 15, '#ffd166');
    txt(W / 2, cy - 34, sel ? 'GLISSE-LE OU CHANGE SA TAILLE' : 'GLISSE UN BOUTON POUR LE DÉPLACER\nTOUCHE-LE POUR CHANGER SA TAILLE', 10, '#cfd3ff');
    if (sel) {
      const s = this.edPos[sel].s;
      btn(W / 2 - 120, cy + 12, 70, '-', 0x4cc9f0, () => this.editorResize(-0.1));
      txt(W / 2, cy + 12, Math.round(s * 100) + ' %', 15);
      btn(W / 2 + 120, cy + 12, 70, '+', 0x4cc9f0, () => this.editorResize(0.1));
    }
    const bw = P ? 200 : 210;
    btn(W / 2 - bw / 2 - 8, cy + 60, bw, 'PAR DÉFAUT', 0x888888, () => this.editorReset());
    btn(W / 2 + bw / 2 + 8, cy + 60, bw, 'TERMINÉ', 0x6ee7b7, () => this.editorDone());
    this.edTop = cy + 85 + 8; // les boutons restent sous la barre d'outils
  },

  editorR(k, s) {
    return CTRL_R[k] * s;
  },

  // pose une commande à (x, y) sans chevaucher les autres : elle glisse autour d'elles, et reste dans l'écran
  editorFit(k, x, y, s) {
    const r = this.editorR(k, s), GAP = 10;
    const top = this.edTop + r, bot = this.H - r - 4, lef = r + 4, rig = this.W - r - 4;
    const clamp = () => {
      x = Phaser.Math.Clamp(x, lef, rig);
      y = Phaser.Math.Clamp(y, top, bot);
    };
    clamp();
    for (let it = 0; it < 12; it++) {
      let moved = false;
      for (const o of CTRL_KEYS) {
        if (o === k) continue;
        const q = this.edPos[o], ro = this.editorR(o, q.s);
        let dx = x - q.x, dy = y - q.y;
        let d = Math.hypot(dx, dy);
        const min = r + ro + GAP;
        if (d < min) {
          if (d < 0.01) { dx = 1; dy = 0; d = 1; }
          x = q.x + (dx / d) * min;
          y = q.y + (dy / d) * min;
          moved = true;
        }
      }
      clamp();
      if (!moved) break;
    }
    // encore un chevauchement (coincé contre le bord) : refusé
    for (const o of CTRL_KEYS) {
      if (o === k) continue;
      const q = this.edPos[o];
      if (Math.hypot(x - q.x, y - q.y) < r + this.editorR(o, q.s) + GAP - 0.5) return null;
    }
    return { x, y };
  },

  // applique la position / taille d'une commande à son image
  editorApply(k) {
    const c = this.edPos[k];
    if (k === 'stick') {
      this.stickHome = { x: c.x, y: c.y };
      this.stickS = c.s;
      this.stickBase.setPosition(c.x, c.y).setScale(PX * c.s);
      this.stickKnob.setPosition(c.x, c.y).setScale(PX * c.s);
    } else {
      const b = this.btn[k];
      b.x = c.x;
      b.y = c.y;
      b.s = c.s;
      this.sizeBtn(b);
      if (k === 'special') this.placeSpDots();
    }
    if (this.edSel === k) this.edRing.setPosition(c.x, c.y).setRadius(this.editorR(k, c.s) + 8).setVisible(true);
  },

  editorDown(p) {
    for (const b of this.edBtns || []) {
      if (Math.abs(p.x - b.x) <= b.w / 2 && Math.abs(p.y - b.y) <= b.h / 2) {
        if (SETTINGS.sound && typeof SFX !== 'undefined') SFX.play('ui');
        return b.fn();
      }
    }
    let best = null, bd = 1e9;
    for (const k of CTRL_KEYS) {
      const c = this.edPos[k];
      const d = Math.hypot(p.x - c.x, p.y - c.y);
      if (d < this.editorR(k, c.s) + 12 && d < bd) { best = k; bd = d; }
    }
    if (!best) {
      this.edSel = null;
      this.edRing.setVisible(false);
      return this.drawEditorBar();
    }
    const c = this.edPos[best];
    this.edDrag = { id: p.id, k: best, dx: c.x - p.x, dy: c.y - p.y };
    if (this.edSel !== best) {
      this.edSel = best;
      this.drawEditorBar();
    }
    this.editorApply(best);
  },

  editorMove(p) {
    const g = this.edDrag;
    if (!g || g.id !== p.id) return;
    const c = this.edPos[g.k];
    const at = this.editorFit(g.k, p.x + g.dx, p.y + g.dy, c.s);
    if (!at) return;
    c.x = at.x;
    c.y = at.y;
    this.editorApply(g.k);
  },

  editorUp(p) {
    if (this.edDrag && this.edDrag.id === p.id) this.edDrag = null;
  },

  editorResize(ds) {
    const k = this.edSel;
    if (!k) return;
    const c = this.edPos[k];
    const s = Phaser.Math.Clamp(Math.round((c.s + ds) * 10) / 10, 0.7, 1.4);
    const at = this.editorFit(k, c.x, c.y, s);
    if (!at) return this.popup(this.W / 2, this.edTop + 40, 'PAS ASSEZ DE PLACE', '#ff8fa3');
    c.s = s;
    c.x = at.x;
    c.y = at.y;
    this.editorApply(k);
    this.drawEditorBar();
  },

  editorReset() {
    this.edPos = this.defaultLayout();
    CTRL_KEYS.forEach((k) => this.editorApply(k));
    if (SETTINGS.layout) delete SETTINGS.layout[L.portrait ? 'P' : 'L'];
    this.edSel = null;
    this.edRing.setVisible(false);
    this.drawEditorBar();
  },

  editorDone() {
    const o = {};
    for (const k of CTRL_KEYS) {
      const c = this.edPos[k];
      o[k] = { fx: Math.round((c.x / this.W) * 1000) / 1000, fy: Math.round((c.y / this.H) * 1000) / 1000, s: c.s };
    }
    // disposition différente de celle par défaut : on la garde (une pour le téléphone en largeur, une en hauteur)
    const def = this.defaultLayout();
    const same = CTRL_KEYS.every((k) => Math.abs(def[k].x - this.edPos[k].x) < 1 && Math.abs(def[k].y - this.edPos[k].y) < 1 && def[k].s === this.edPos[k].s);
    SETTINGS.layout = SETTINGS.layout || {};
    if (same) delete SETTINGS.layout[L.portrait ? 'P' : 'L'];
    else SETTINGS.layout[L.portrait ? 'P' : 'L'] = o;
    if (!Object.keys(SETTINGS.layout).length) delete SETTINGS.layout;
    saveSettings();
    this.editing = false;
    reopenSettings = true;
    this.scene.restart();
  },

  // --- Entraînement ---------------------------------------------------------------
  trainSetup() {
    const D = 55;
    this.trainBtns = [];
    const labels = [
      ['% À ZÉRO', () => { this.p1.damage = 0; this.p2.damage = 0; }],
      [() => 'MANNEQUIN : ' + ['IMMOBILE', 'SAUTE', 'ESQUIVE', 'BOT'][trainDummyMode], () => { trainDummyMode = (trainDummyMode + 1) % 4; this.dummyMode = trainDummyMode; }],
      [() => 'FACE À : ' + CHARS[trainDummy].name, () => { { const R = playable(); trainDummy = R[(R.indexOf(trainDummy) + 1) % R.length]; } this.scene.restart(); }],
      ['COUPS', () => this.toggleMoveList()],
      ['QUITTER', () => { trainingMode = false; chosen = null; goSelect = false; this.scene.restart(); }],
    ];
    this.dummyMode = trainDummyMode;
    const portrait = L.portrait;
    const bw = portrait ? 220 : 172, bh = 34;
    labels.forEach(([lab, fn], i) => {
      const per = portrait ? 3 : 5;
      const row = Math.floor(i / per), col = i % per;
      const n = Math.min(per, labels.length - row * per);
      const x = this.W / 2 + (col - (n - 1) / 2) * (bw + 8);
      const y = (portrait ? 220 : 128) + row * (bh + 8);
      const r = this.add.rectangle(x, y, bw, bh, 0x0b0d1f, 0.8).setStrokeStyle(2, 0x4cc9f0).setDepth(D);
      const t = this.add.text(x, y, typeof lab === 'function' ? lab() : lab, { fontFamily: FONT, fontSize: '10px', color: '#fff' }).setOrigin(0.5).setDepth(D + 1);
      this.trainBtns.push({ x, y, w: bw, h: bh, fn: () => { fn(); if (typeof lab === 'function' && t.active) t.setText(lab()); } });
    });
    this.trainInfo = this.add
      .text(this.W / 2, (portrait ? 220 : 128) + (portrait ? 2 : 1) * (bh + 8) + 6, 'TOUCHE LE MANNEQUIN POUR VOIR LES CHIFFRES', { fontFamily: FONT, fontSize: '11px', color: '#ffe9a8', stroke: '#000', strokeThickness: 4, align: 'center' })
      .setOrigin(0.5, 0)
      .setDepth(D);
  },

  trainReport(att, vic, spec, stunMs, rem, combo) {
    if (!this.trainInfo || att !== this.p1) return;
    this.trainCombo = combo ? (this.trainCombo || 1) + 1 : 1;
    this.trainComboDmg = combo ? (this.trainComboDmg || 0) + spec.dmg : spec.dmg;
    const adv = rem === undefined ? null : Math.round((stunMs - rem) / STEP_MS);
    const advTxt = adv === null ? '' : `  AVANCE ${adv >= 0 ? '+' : ''}${adv}`;
    const cTxt = this.trainCombo > 1 ? `\nENCHAÎNEMENT : ${this.trainCombo} COUPS, ${Math.round(this.trainComboDmg)} %` : '';
    this.trainInfo.setText(`COUP : ${Math.round(spec.dmg)} %${advTxt}  ÉTOURDI ${Math.round(stunMs / STEP_MS)} IMAGES${cTxt}`);
  },

  toggleMoveList() {
    if (this.moveList) {
      this.moveList.forEach((o) => o.destroy());
      this.moveList = null;
      return;
    }
    const def = this.p1.def;
    const txt = def.name + '\n\n' + def.help.join('\n') + "\n\nSPÉCIAL TENU = CHARGE (CERTAINES)\nESQUIVE EN L'AIR + ATTAQUE = COUP DU SOL";
    const bg = this.add.rectangle(this.W / 2, this.H * 0.45, Math.min(this.W - 60, 560), 330, 0x0b0d1f, 0.9).setStrokeStyle(3, 0xffe9a8).setDepth(80);
    const t = this.add.text(this.W / 2, this.H * 0.45, txt, { fontFamily: FONT, fontSize: '12px', color: '#cfd3ff', align: 'left', lineSpacing: 8 }).setOrigin(0.5).setDepth(81);
    this.moveList = [bg, t];
  },
});

// --- Bouton QUITTER pendant le combat ---------------------------------------------
Object.assign(GameScene.prototype, {
  buildQuitBtn(D) {
    this.quitBtn = { x: this.W / 2 + 74, y: 40, w: 56, h: 46 };
    const r = this.add.rectangle(this.quitBtn.x, this.quitBtn.y, 46, 38, 0x000000, 0.45).setStrokeStyle(2, 0xffffff, 0.6).setDepth(D);
    const t = this.add.text(this.quitBtn.x, this.quitBtn.y + 1, 'X', { fontFamily: FONT, fontSize: '20px', color: '#ffffff' }).setOrigin(0.5).setDepth(D + 1).setAlpha(0.85);
    this.ctrlObjs.push(r, t);
    this.quitUi = null;
  },

  // renvoie true si le toucher a été pris par le bouton ou par la question « quitter ? »
  quitTap(p) {
    const inside = (b) => Math.abs(p.x - b.x) <= b.w / 2 && Math.abs(p.y - b.y) <= b.h / 2;
    if (this.quitUi) {
      for (const b of this.quitUi.btns) if (inside(b)) { b.fn(); return true; }
      return true; // la question est ouverte : on ignore le reste
    }
    if (this.over || this.state !== 'play' || !this.quitBtn || !inside(this.quitBtn)) return false;
    if (this.ctrlObjs && this.ctrlObjs[0] && !this.ctrlObjs[0].visible) return false;
    this.askQuit();
    return true;
  },

  askQuit() {
    const D = 130, cx = this.W / 2, cy = this.H * 0.42;
    const objs = [];
    objs.push(this.add.rectangle(cx, this.H / 2, this.W, this.H, 0x000000, 0.55).setDepth(D));
    const bw = Math.min(600, this.W - 40);
    objs.push(this.add.rectangle(cx, cy, bw, 250, 0x1a1d33, 1).setStrokeStyle(4, 0xf72585).setDepth(D + 1));
    const q = this.net ? 'ABANDONNER ?\n(DÉFAITE)' : 'QUITTER LE COMBAT ?';
    objs.push(this.add.text(cx, cy - 64, q, { fontFamily: FONT, fontSize: '22px', color: '#ffffff', stroke: '#000', strokeThickness: 5, align: 'center', lineSpacing: 10 }).setOrigin(0.5).setDepth(D + 2));
    const btns = [];
    const half = Math.min(125, bw / 4 + 10), w = Math.min(220, bw / 2 - 20);
    const mk = (x, label, col, fn) => {
      objs.push(this.add.rectangle(x, cy + 54, w, 66, 0x0b0d1f, 1).setStrokeStyle(4, col).setDepth(D + 2));
      objs.push(this.add.text(x, cy + 54, label, { fontFamily: FONT, fontSize: '16px', color: '#ffffff', stroke: '#000', strokeThickness: 4 }).setOrigin(0.5).setDepth(D + 3));
      btns.push({ x, y: cy + 54, w, h: 66, fn });
    };
    mk(cx - half, 'QUITTER', 0xff5a5a, () => this.doQuit());
    mk(cx + half, 'CONTINUER', 0x6ee7b7, () => this.closeQuit());
    this.quitUi = { objs, btns };
    // pas de coup « fantôme » au retour
    if (this.stick) { this.stick.id = null; this.stick.sx = this.stick.sy = 0; }
    if (this.btn) Object.values(this.btn).forEach((b) => { b.id = null; b.img.setAlpha(0.75); });
    if (this.queue) this.queue.attack = this.queue.heavy = this.queue.jump = false;
  },

  closeQuit() {
    if (!this.quitUi) return;
    this.quitUi.objs.forEach((o) => o.destroy());
    this.quitUi = null;
    this.acc = 0;
  },

  doQuit() {
    this.closeQuit();
    if (this.net) {
      // en ligne : abandon immédiat (l'adversaire gagne), puis retour au menu
      try { Online.conn && Online.conn.send({ t: 'leave' }); } catch (e) {}
      Online.leaving = true;
      setTimeout(() => leaveOnline(), 150);
      return;
    }
    trainingMode = false;
    camp = null;
    chosen = null;
    goSelect = false;
    this.scene.restart();
  },
});

// MUSIQUE ET BRUITAGES (tout est synthétisé dans le navigateur : aucun fichier à télécharger)
//  - MUSIC : petit séquenceur (4 voix + batterie) qui joue des morceaux originaux écrits note par note
//  - SFX.play : bruitages en couches (impact, craquement, souffle, réverbération)
// Le son ne touche jamais la simulation : rien ici n'influence le combat.
// ===========================================================================
const AUDIO = {
  ready: false,
  setup(ctx) {
    if (this.ready || !ctx) return;
    this.ready = true;
    this.ctx = ctx;
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -14;
    comp.ratio.value = 4;
    comp.attack.value = 0.004;
    comp.release.value = 0.2;
    comp.connect(ctx.destination);
    this.master = ctx.createGain();
    this.master.gain.value = 0.9;
    this.master.connect(comp);
    this.sfx = ctx.createGain();
    this.sfx.gain.value = 1;
    this.sfx.connect(this.master);
    this.mus = ctx.createGain();
    this.mus.gain.value = SETTINGS.music === false ? 0 : 0.42;
    this.mus.connect(this.master);
    // petite réverbération (salle) : bruit qui s'éteint
    const len = Math.floor(ctx.sampleRate * 1.4);
    const ir = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const d = ir.getChannelData(ch);
      let seed = 777 + ch * 31;
      for (let i = 0; i < len; i++) {
        seed = (seed * 1103515245 + 12345) & 0x7fffffff;
        d[i] = (seed / 0x3fffffff - 1) * Math.pow(1 - i / len, 3.2);
      }
    }
    this.rev = ctx.createConvolver();
    this.rev.buffer = ir;
    this.revIn = ctx.createGain();
    this.revIn.gain.value = 0.32;
    this.revIn.connect(this.rev).connect(this.master);
  },
};

Object.assign(SFX, {
  out(rev) {
    AUDIO.setup(this.ctx);
    if (!rev) return AUDIO.sfx;
    const g = this.ctx.createGain();
    g.connect(AUDIO.sfx);
    g.connect(AUDIO.revIn);
    return g;
  },
  // oscillateur avec chute de hauteur et enveloppe percussive

    const c = this.ctx, t = c.currentTime + (t0 || 0);
    const o = c.createOscillator(), g = c.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(f1, 20), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.004);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(this.out(rev));
    o.start(t);
    o.stop(t + dur + 0.03);
  },
