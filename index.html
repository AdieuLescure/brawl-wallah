<script>
// ---------------------------------------------------------------------------
// SPR48 : moteur de sprites pixel art NATIF 48 x 40 (aucun lissage, aucun upscale)
// Source unique : utilisé par le jeu ET par le script generate_spritesheet.js
//   SPR48.draw(id, poseName) -> Uint8ClampedArray RGBA de 48*40*4
// Repères des poses : grille 24x20 (x2 ici). Personnages tournés vers la droite.
// ---------------------------------------------------------------------------
var SPR48 = (function () {
  const W = 48, H = 40;
  const hex = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16), 255];
  const mixc = (a, b, t) => [Math.round(a[0] + (b[0] - a[0]) * t), Math.round(a[1] + (b[1] - a[1]) * t), Math.round(a[2] + (b[2] - a[2]) * t), 255];
  const OUT = hex('#14121c');
  const ramp = (h) => {
    const base = hex(h);
    return { hi: mixc(base, [255, 255, 255], 0.26), base, lo: mixc(base, [10, 6, 24], 0.4) };
  };
  const pal = (o) => {
    const r = {};
    Object.keys(o).forEach((k) => (r[k] = hex(o[k])));
    return r;
  };

  // ---------------- peintre : chaque partie du corps est posée avec son contour ----------------
  function makeGfx() {
    const buf = new Array(W * H).fill(null);
    const g = {
      buf,
      commit(map, outline) {
        if (outline !== false) {
          map.forEach((_, k) => {
            const x = k % W, y = (k / W) | 0;
            [[1, 0], [-1, 0], [0, 1], [0, -1]].forEach(([dx, dy]) => {
              const xx = x + dx, yy = y + dy;
              if (xx < 0 || yy < 0 || xx >= W || yy >= H) return;
              const kk = yy * W + xx;
              if (!map.has(kk)) buf[kk] = OUT;
            });
          });
        }
        map.forEach((col, k) => (buf[k] = col));
      },
      // capsule ombrée (bras, jambes, doigts…)
      capsule(x1, y1, x2, y2, r, rp) {
        const m = new Map();
        const minx = Math.floor(Math.min(x1, x2) - r - 1), maxx = Math.ceil(Math.max(x1, x2) + r + 1);
        const miny = Math.floor(Math.min(y1, y2) - r - 1), maxy = Math.ceil(Math.max(y1, y2) + r + 1);
        const dx = x2 - x1, dy = y2 - y1, l2 = dx * dx + dy * dy || 1;
        for (let y = miny; y <= maxy; y++)
          for (let x = minx; x <= maxx; x++) {
            if (x < 0 || y < 0 || x >= W || y >= H) continue;
            const px = x + 0.5, py = y + 0.5;
            let t = ((px - x1) * dx + (py - y1) * dy) / l2;
            t = Math.max(0, Math.min(1, t));
            const cx = x1 + dx * t, cy = y1 + dy * t;
            if (Math.hypot(px - cx, py - cy) > r) continue;
            const s = ((px - cx) * -0.55 + (py - cy) * -0.83) / r;
            m.set(y * W + x, s > 0.42 ? rp.hi : s < -0.3 ? rp.lo : rp.base);
          }
        return m;
      },
      poly(pts, colFn) {
        const m = new Map();
        let minx = 1e9, maxx = -1e9, miny = 1e9, maxy = -1e9;
        pts.forEach(([x, y]) => ((minx = Math.min(minx, x)), (maxx = Math.max(maxx, x)), (miny = Math.min(miny, y)), (maxy = Math.max(maxy, y))));
        for (let y = Math.max(0, Math.floor(miny)); y <= Math.min(H - 1, Math.ceil(maxy)); y++)
          for (let x = Math.max(0, Math.floor(minx)); x <= Math.min(W - 1, Math.ceil(maxx)); x++) {
            const px = x + 0.5, py = y + 0.5;
            let ok = false;
            for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
              const [xi, yi] = pts[i], [xj, yj] = pts[j];
              if (yi > py !== yj > py && px < ((xj - xi) * (py - yi)) / (yj - yi) + xi) ok = !ok;
            }
            if (ok) {
              const c = typeof colFn === 'function' ? colFn(x, y) : colFn;
              if (c) m.set(y * W + x, c);
            }
          }
        return m;
      },
      bmp(rows, pl, x0, y0) {
        const m = new Map();
        rows.forEach((row, j) => {
          for (let i = 0; i < row.length; i++) {
            const ch = row[i];
            if (ch === '.' || !pl[ch]) continue;
            const x = x0 + i, y = y0 + j;
            if (x < 0 || y < 0 || x >= W || y >= H) continue;
            m.set(y * W + x, pl[ch]);
          }
        });
        return m;
      },
      dot(x, y, col) {
        x = Math.round(x);
        y = Math.round(y);
        if (x >= 0 && y >= 0 && x < W && y < H) buf[y * W + x] = col;
      },
      rect(x, y, w, h, col) {
        for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) g.dot(x + i, y + j, col);
      },
      line(x1, y1, x2, y2, col) {
        const n = Math.max(Math.abs(x2 - x1), Math.abs(y2 - y1), 1);
        for (let i = 0; i <= n; i++) g.dot(x1 + ((x2 - x1) * i) / n, y1 + ((y2 - y1) * i) / n, col);
      },
    };
    return g;
  }

  // ---------------- poses (articulations en grille 24x20) ----------------
  const POSES = {
  idle0: { oy: 0, ox: 0, bA: [11, 10, 10, 14, 2], fA: [14, 10, 15, 14, 2], bL: [11, 14, 10, 18], fL: [14, 14, 15, 18] },
  idle1: { oy: 1, ox: 0, bA: [11, 11, 10, 14, 2], fA: [14, 11, 15, 14, 2], bL: [11, 15, 10, 18], fL: [14, 15, 15, 18] },
  run0: { oy: 0, ox: 0, bA: [11, 10, 8, 12, 2], fA: [14, 10, 17, 12, 2], bL: [11, 14, 8, 17], fL: [14, 14, 18, 18] },
  run1: { oy: 1, ox: 0, bA: [11, 11, 14, 13, 2], fA: [14, 11, 11, 13, 2], bL: [11, 15, 12, 18], fL: [14, 15, 14, 18] },
  jump: { oy: 0, ox: 0, bA: [11, 10, 8, 7, 2], fA: [14, 10, 18, 7, 2], bL: [11, 14, 9, 17], fL: [14, 14, 17, 16] },
  hurt: { oy: 0, ox: -1, bA: [10, 10, 6, 7, 2], fA: [13, 10, 17, 12, 2], bL: [11, 14, 8, 18], fL: [14, 14, 16, 18] },
  jab: { oy: 0, ox: 0, bA: [11, 10, 14, 12, 2], fA: [14, 10, 20, 10, 3], bL: [11, 14, 9, 18], fL: [14, 14, 16, 18] },
  heavy: { oy: 1, ox: 1, bA: [12, 11, 9, 13, 2], fA: [15, 11, 21, 11, 4], bL: [12, 15, 7, 18], fL: [15, 15, 19, 18] },
  up: { oy: 1, ox: 0, bA: [12, 11, 10, 15, 2], fA: [15, 11, 18, 3, 3], bL: [12, 15, 9, 18], fL: [15, 15, 17, 18] },
  sweep: { oy: 4, ox: 0, bA: [11, 14, 8, 17, 2], fA: [14, 14, 15, 17, 2], bL: [11, 18, 9, 18], fL: [14, 18, 21, 18] },
  stomp: { oy: 0, ox: 0, bA: [11, 10, 9, 6, 2], fA: [14, 10, 16, 6, 2], bL: [11, 14, 10, 18], fL: [14, 14, 19, 18] },
  rkick: { oy: 0, ox: -1, bA: [10, 10, 7, 12, 2], fA: [13, 10, 11, 13, 2], bL: [11, 14, 10, 18], fL: [14, 14, 21, 13] },
  cast: { oy: 0, ox: 0, orb: 3, bA: [11, 10, 9, 12, 2], fA: [14, 10, 19, 9, 2], bL: [11, 14, 9, 18], fL: [14, 14, 16, 18] },
  castBig: { oy: 0, ox: 1, orb: 4, bA: [12, 10, 17, 10, 2], fA: [15, 10, 18, 9, 2], bL: [12, 14, 9, 18], fL: [15, 14, 17, 18] },
  castUp: { oy: 0, ox: 0, orb: 4, bA: [11, 10, 10, 6, 2], fA: [14, 10, 15, 6, 2], bL: [11, 14, 9, 18], fL: [14, 14, 16, 18] },
  castDown: { oy: 3, ox: 0, orb: 3, bA: [11, 13, 13, 18, 2], fA: [14, 13, 19, 18, 2], bL: [11, 17, 9, 18], fL: [14, 17, 17, 18] },
  grab: { oy: 1, ox: 1, bA: [12, 11, 20, 11, 3], fA: [15, 11, 21, 10, 3], bL: [12, 15, 8, 18], fL: [15, 15, 18, 18] },
  slam: { oy: 0, ox: 0, bA: [12, 10, 13, 2, 3], fA: [15, 10, 16, 2, 3], bL: [11, 14, 8, 18], fL: [14, 14, 17, 18] },
  hook: { oy: 0, ox: 0, bA: [11, 10, 9, 12, 3], fA: [14, 10, 20, 8, 3], bL: [11, 14, 9, 18], fL: [14, 14, 16, 18] },
  // DEAD LULU : guitare en main (gtr = caisse + bout du manche), coup de pied haut, plongeon
  guitar: { oy: 0, ox: 0, gtr: { bx: 21, by: 8, nx: 15, ny: 9 }, bA: [11, 10, 15, 11, 2], fA: [14, 10, 17, 9, 2], bL: [11, 14, 9, 18], fL: [14, 14, 16, 18] },
  guitarBig: { oy: 1, ox: 1, gtr: { bx: 21, by: 16, nx: 15, ny: 11 }, bA: [12, 11, 16, 13, 2], fA: [15, 11, 17, 11, 2], bL: [12, 15, 8, 18], fL: [15, 15, 19, 18] },
  kickUp: { oy: 0, ox: -1, bA: [10, 10, 8, 13, 2], fA: [13, 10, 10, 7, 2], bL: [11, 14, 10, 18], fL: [14, 14, 18, 2] },
  plunge: { oy: 0, ox: 0, bA: [11, 10, 9, 5, 2], fA: [14, 10, 16, 5, 2], bL: [11, 14, 11, 19], fL: [14, 14, 14, 19] },
  // DENODOOM : pistolets, sabre, aigle (main levée), hermine (main au sol), ballon chargé, poêle
  shoot: { oy: 0, ox: 0, guns: [[17, 11], [19, 9]], bA: [11, 10, 17, 11, 2], fA: [14, 10, 19, 9, 2], bL: [11, 14, 9, 18], fL: [14, 14, 16, 18] },
  saber: { oy: 1, ox: 1, saber: [18, 11, 23, 5], bA: [12, 11, 10, 14, 2], fA: [15, 11, 18, 11, 2], bL: [12, 15, 8, 18], fL: [15, 15, 19, 18] },
  summon: { oy: 0, ox: 0, bA: [11, 10, 10, 14, 2], fA: [14, 10, 16, 2, 2], bL: [11, 14, 9, 18], fL: [14, 14, 16, 18] },
  pointDown: { oy: 3, ox: 0, bA: [11, 13, 9, 18, 2], fA: [14, 13, 19, 18, 2], bL: [11, 17, 9, 18], fL: [14, 17, 17, 18] },
  charge: { oy: 0, ox: -1, ball: [7, 2, 4], bA: [10, 10, 8, 13, 2], fA: [13, 10, 9, 4, 2], bL: [11, 14, 7, 18], fL: [14, 14, 17, 18] },
  block: { oy: 2, ox: 0, bA: [11, 11, 14, 8, 2], fA: [14, 11, 17, 7, 2], bL: [11, 15, 9, 18], fL: [14, 15, 16, 18] },
  throwBall: { oy: 0, ox: 1, bA: [11, 10, 9, 12, 2], fA: [15, 10, 20, 8, 2], bL: [11, 14, 8, 18], fL: [14, 14, 18, 18] },
  plungePan: { oy: 0, ox: 0, pan: true, bA: [11, 10, 12, 14, 2], fA: [14, 10, 13, 13, 2], bL: [11, 14, 8, 16, 0], fL: [14, 14, 17, 16] },
};

  // poses propres à NINI (jamais de coup porté par ses bras : c'est le chat, le corgi ou la bague)
  POSES.claw = { oy: 0, ox: 0, only: 'nini', claw: 1, bA: [11, 10, 10, 14, 2], fA: [14, 10, 15, 14, 2], bL: [11, 14, 9, 18], fL: [14, 14, 16, 18] };
  POSES.call = { oy: 0, ox: 0, only: 'nini', bA: [11, 10, 10, 14, 2], fA: [14, 10, 20, 9, 2], bL: [11, 14, 9, 18], fL: [14, 14, 16, 18] };
  POSES.ringT = { oy: 0, ox: 0, only: 'nini', bA: [11, 10, 10, 14, 2], fA: [14, 10, 19, 5, 2], bL: [11, 14, 9, 18], fL: [14, 14, 16, 18] };
  POSES.purr = { oy: 1, ox: 0, only: 'nini', purr: 1, bA: [11, 11, 13, 13, 2], fA: [14, 11, 16, 13, 2], bL: [11, 15, 9, 18], fL: [14, 15, 16, 18] };
  POSES.float = { oy: 0, ox: 0, only: 'nini', bA: [11, 10, 8, 13, 2], fA: [14, 10, 16, 3, 2], bL: [11, 14, 10, 17], fL: [14, 14, 15, 17] };
  Object.keys(POSES).forEach((k) => (POSES[k].__n = k));
  const CH = {};

  // ---------------- dessin d'une frame ----------------
  function draw(id, poseName, opts) {
    const pose = POSES[poseName];
    if (pose.only && pose.only !== id) return null;
    const C = CH[id];
    const g = makeGfx();
    const ox = pose.ox * 2, oy = pose.oy * 2;
    const ctx = { g, pose, ox, oy, C, rage: !!(opts && opts.rage) };
    const th = C.th || 2;
    const armR = C.armR || 2.3, legR = C.legR || 2.5;
    const joint = (a) => [2 * (a[0] + th / 2), 2 * (a[1] + th / 2), 2 * (a[2] + th / 2), 2 * (a[3] + th / 2)];

    const arm = (a, rp, back) => {
      let [sx, sy, ex, ey] = joint(a);
      const gs = a[4] || 2;
      const hr = Math.min(3.2, gs * 0.95 + 0.4);
      let hx = 2 * (a[2] + gs / 2), hy = 2 * (a[3] + gs / 2);
      // la main (contour compris) reste dans la cellule 48 x 40
      const m = hr + 1.2;
      let f = 1;
      if (hx > W - m) f = Math.min(f, (W - m - sx) / (hx - sx));
      if (hy < m) f = Math.min(f, (sy - m) / (sy - hy));
      if (hy > H - m) f = Math.min(f, (H - m - sy) / (hy - sy));
      if (f < 1) {
        hx = sx + (hx - sx) * f; hy = sy + (hy - sy) * f;
        ex = sx + (ex - sx) * f; ey = sy + (ey - sy) * f;
      }
      g.commit(g.capsule(sx, sy, ex, ey, armR, rp));
      if (C.cap) g.commit(g.capsule(sx, sy, sx + (ex - sx) * 0.34, sy + (ey - sy) * 0.34, armR + 0.5, back ? C.capBack || C.cap : C.cap));
      g.commit(g.capsule(hx, hy, hx, hy, hr, back ? C.handBack : C.hand));
      return { sx, sy, hx, hy, dx: hx - sx, dy: hy - sy };
    };
    const leg = (a, rp) => {
      const [sx, sy] = joint(a);
      const ex = 2 * (a[2] + th / 2), by = 2 * a[3] + 1.8;
      g.commit(g.capsule(sx, sy, ex, by - 1.4, legR, rp));
      const toe = Math.max(0, Math.min(4.2, W - 3.4 - ex - 1));
      g.commit(g.capsule(ex - 1.2, by, ex + toe, by, C.bootR || 2.2, C.boot));
      return { ex, by };
    };

    C.pre && C.pre(ctx);
    const aB = arm(pose.bA, C.sleeveBack || C.sleeve, true);
    ctx.aB = aB;
    C.backHand && C.backHand(ctx, aB);
    const lB = leg(pose.bL, C.legBack || C.pants);
    C.torso && C.torso(ctx);
    C.head && C.head(ctx);
    const lF = leg(pose.fL, C.pants);
    ctx.lB = lB;
    ctx.lF = lF;
    C.post && C.post(ctx);
    const aF = arm(pose.fA, C.sleeve, false);
    ctx.aF = aF;
    C.frontHand && C.frontHand(ctx, aF);
    C.acc && C.acc(ctx);

    if (C.final) C.final(ctx);
    const out = new Uint8ClampedArray(W * H * 4);
    g.buf.forEach((c, i) => {
      if (!c) return;
      out[i * 4] = c[0]; out[i * 4 + 1] = c[1]; out[i * 4 + 2] = c[2]; out[i * 4 + 3] = c[3] === undefined ? 255 : c[3];
    });
    return out;
  }

  return { W, H, hex, mixc, ramp, pal, makeGfx, OUT, POSES, CH, draw, names: Object.keys(POSES), namesFor: (id) => Object.keys(POSES).filter((k) => !POSES[k].only || POSES[k].only === id) };
})();
if (typeof module !== 'undefined') module.exports = SPR48;

// Personnages 48x40 : DENODOOM, TORO, ASTRA, GROM, DEAD LULU
(function (S) {
  const { pal, ramp, hex } = S;

  // =====================================================================
  // DENODOOM : crâne rasé dégradé, barbe pleine, long manteau noir doublé de rouge, deux pistolets
  // =====================================================================
  const DN = pal({
    h: '#1b1714', H: '#3a322c', f: '#6a4a38', F: '#4c372b',
    s: '#c18a60', l: '#d9a47a', S: '#9a6a46', D: '#7a4f34',
    b: '#241c18', B: '#40342c', w: '#f3efe7', e: '#24130a', m: '#7a3f33', g: '#eef1f8',
    K: '#2a2a35', k: '#454553', d: '#15151c', R: '#b3202e', r: '#701220', Q: '#d63a48',
    Y: '#0f0f15', y: '#23232d', n: '#6b4a2a', G: '#e0b030', t: '#8a5a3a',
  });
  const DN_HEAD = [
    '....hhhhhh....',
    '..hhhHHhhhhh..',
    '.hhhhHhhhhhhh.',
    '.hhhhhhhhhhhh.',
    '.fhhhhhsssss..',
    '.fFhhsshhhhhs.',
    '.FFSSsswesslss',
    '..SgSssssssssl',
    '..SDbssssssssl',
    '..bbbbbbBbbssS',
    '..bBbbbmmbbbb.',
    '...bbbbbbbbbb.',
    '....bbbbbbbb..',
    '.....SSSSSS...',
  ];
  const DN_TORSO = [
    '..kkkkkkkkkk..',
    '.kKKKKKKKKKKK.',
    '.KKKKKKKKQRrKK',
    '.KKKKKKKQRrYKK',
    '.KKKKKKKQRYYYK',
    '.KKKKKKKQRYYYK',
    '.KKKKKKKQRYYYK',
    '.KKKKKKKKRYYKK',
    '.dKKKKKKKKRrKK',
    '.dKKKKKKKKRrKK',
    '.dKKKKKKKKKKKK',
    '.dnnnnnnGnnnnK',
    '.ddKKKKKKKKKKK',
    '..ddKKKKKKKKK.',
  ];
  const DNC = {
    th: 2, armR: 2.3, legR: 2.5,
    sleeve: ramp('#2a2a35'),
    sleeveBack: ramp('#1b1b24'),
    hand: ramp('#c18a60'),
    handBack: ramp('#9a6a46'),
    pants: ramp('#2c2c3a'),
    legBack: ramp('#1c1c27'),
    boot: ramp('#17171f'),
    head(c) {
      c.g.commit(c.g.bmp(DN_HEAD, DN, 18 + c.ox, 2 + c.oy));
    },
    torso(c) {
      c.g.commit(c.g.bmp(DN_TORSO, DN, 18 + c.ox, 16 + c.oy));
    },
    // pan arrière du manteau, doublure rouge visible quand il flotte
    pre(c) {
      const { g, ox, oy, pose } = c;
      const sw = Math.max(-5, Math.min(5, ((pose.bL[2] + pose.fL[2]) / 2 - 12.5) * 1.6));
      const top = 25 + oy, hem = Math.min(37, 34 + oy);
      const pts = [[19 + ox, top], [25 + ox, top], [27 + ox + sw * 0.4, hem - 1], [22 + ox + sw, hem + 1], [15 + ox + sw * 1.2, hem], [17 + ox + sw * 0.6, top + 4]];

// Résolution des textures : RES sous-pixels par pixel d'art (la taille à l'écran ne change pas)
const RES = 2;

// Lissage « Scale2x » (EPX) : double la résolution en affinant les diagonales
function epxUpscale(src, w, h, dst) {
  const a = src.getImageData(0, 0, w, h).data;
  const out = dst.createImageData(w * 2, h * 2);
  const o = out.data;
  const same = (i, j) => a[i] === a[j] && a[i + 1] === a[j + 1] && a[i + 2] === a[j + 2] && a[i + 3] === a[j + 3];
  const at = (x, y) => (Math.min(h - 1, Math.max(0, y)) * w + Math.min(w - 1, Math.max(0, x))) * 4;
  const put = (x, y, i) => {
    const k = (y * w * 2 + x) * 4;
    o[k] = a[i]; o[k + 1] = a[i + 1]; o[k + 2] = a[i + 2]; o[k + 3] = a[i + 3];
  };
  for (let y = 0; y < h; y++)
    for (let x = 0; x < w; x++) {
      const P = at(x, y), A = at(x, y - 1), B = at(x + 1, y), C = at(x - 1, y), D = at(x, y + 1);
      put(x * 2, y * 2, same(C, A) && !same(C, D) && !same(A, B) ? A : P);
      put(x * 2 + 1, y * 2, same(A, B) && !same(A, C) && !same(B, D) ? B : P);
      put(x * 2, y * 2 + 1, same(D, C) && !same(D, B) && !same(C, A) ? C : P);
      put(x * 2 + 1, y * 2 + 1, same(B, D) && !same(B, A) && !same(D, C) ? D : P);
    }
  dst.putImageData(out, 0, 0);
}

// mode : 'epx' (dessin 1x lissé en 2x), 'native' (le dessin se fait directement en RESx), 'raw' (tel quel)
function mkCanvas(scene, key, w, h, fn, mode) {
  mode = mode || 'epx';
  if (scene.textures.exists(key)) scene.textures.remove(key);
  const r = mode === 'raw' ? 1 : RES;
  const t = scene.textures.createCanvas(key, w * r, h * r);
  const c = t.getContext();
  c.imageSmoothingEnabled = false;
  if (mode === 'native') fn(c, r);
  else if (mode === 'epx') {
    const tmp = document.createElement('canvas');
    tmp.width = w;
    tmp.height = h;
    const tc = tmp.getContext('2d');
    tc.imageSmoothingEnabled = false;
    fn(tc, 1);
    epxUpscale(tc, w, h, c);
  } else fn(c, 1);
  t.refresh();
  if (r !== 1) HRTEX.add(key);
  else HRTEX.delete(key);
  return t;
}

// Les textures haute résolution (RES x plus de pixels) sont affichées avec une échelle divisée par RES :
// tout le reste du jeu continue de raisonner en « pixels d'art » logiques.
const HRTEX = new Set();
const texK = (o) => (o && o.texture && HRTEX.has(o.texture.key) ? 1 / RES : 1);
['Image', 'Sprite'].forEach((n) => {
  const P = Phaser.GameObjects[n].prototype;
  const orig = P.setScale;
  P.setScale = function (x, y) {
    if (x === undefined) x = 1;
    if (y === undefined) y = x;
    const k = texK(this);
    return orig.call(this, x * k, y * k);
  };
});
{
  const addTween = Phaser.Tweens.TweenManager.prototype.add;
  Phaser.Tweens.TweenManager.prototype.add = function (cfg) {
    const t = cfg && cfg.targets;
    const k = texK(Array.isArray(t) ? t[0] : t);
    if (k !== 1) {
      cfg = Object.assign({}, cfg);
      ['scale', 'scaleX', 'scaleY'].forEach((p) => {
        const v = cfg[p];
        if (typeof v === 'number') cfg[p] = v * k;
        else if (v && typeof v === 'object') {
          const o = Object.assign({}, v);
          ['from', 'to', 'start'].forEach((q) => typeof o[q] === 'number' && (o[q] *= k));
          cfg[p] = o;
        }
      });
    }
    return addTween.call(this, cfg);
  };
}

// Parcourt chaque sous-pixel : f(xLogique, yLogique) -> couleur ou null
function hiPx(c, R, w, h, f) {
  for (let j = 0; j < h * R; j++)
    for (let i = 0; i < w * R; i++) {
      const col = f((i + 0.5) / R, (j + 0.5) / R);
      if (col) {
        c.fillStyle = col;
        c.fillRect(i, j, 1, 1);
      }
    }
}

function circleTex(scene, key, n, fill, stroke, ring) {
  mkCanvas(scene, key, n, n, (c, R) => {
    const r = n / 2;
    hiPx(c, R, n, n, (x, y) => {
      const d = hyp(x - r, y - r);
      return d <= r ? (d > r - ring ? stroke : fill) : null;
    });
  }, 'native');
}

function iconTex(scene, key, rows, color, colors) {
  mkCanvas(scene, key, rows[0].length, rows.length, (c) => {
    rows.forEach((row, y) =>
      [...row].forEach((ch, x) => {
        if (ch === '.') return;
        c.fillStyle = colors && colors[ch] ? colors[ch] : color;
        c.fillRect(x, y, 1, 1);
      })
    );
  });
}

// Orbe lumineuse : cols = [halo, extérieur, intérieur, coeur]
function orbTex(scene, key, n, cols) {
  mkCanvas(scene, key, n, n, (c, R) => {
    const r = n / 2;
    hiPx(c, R, n, n, (x, y) => {
      const d = hyp(x - r, y - r) / r;
      return d > 1 ? null : d > 0.82 ? cols[0] : d > 0.55 ? cols[1] : d > 0.28 ? cols[2] : cols[3];
    });
  }, 'native');
}

// Croissant de coup (ouvert à gauche, bombé à droite)
function crescentTex(scene, key, cols) {
  const n = 28;
  mkCanvas(scene, key, n, n, (c, R) => {
    hiPx(c, R, n, n, (x, y) => {
      const o = hyp(x - 12, y - 14);
      const i = hyp(x - 5, y - 14);
      if (o <= 13 && i > 12) {
        const edge = 13 - o;
        return edge < 1.6 ? cols[0] : edge < 3.6 ? cols[1] : cols[2];
      }
      return null;
    });
  }, 'native');
}

// Sprite pixel à partir de polygones (test du centre de chaque pixel -> bords nets) + contour automatique
function polyTex(scene, key, w, h, layers, outline) {
  const inside = (x, y, pts) => {
    let ok = false;
    for (let i = 0, j = pts.length - 1; i < pts.length; j = i++) {
      const [xi, yi] = pts[i], [xj, yj] = pts[j];
      if (yi > y !== yj > y && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi) ok = !ok;
    }
    return ok;
  };
  mkCanvas(scene, key, w, h, (c, R) => {
    const W = w * R, H = h * R;
    const g = Array.from({ length: H }, () => Array(W).fill(null));
    layers.forEach(([col, pts]) => {
      for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (inside((x + 0.5) / R, (y + 0.5) / R, pts)) g[y][x] = col;
    });
    for (let y = 0; y < H; y++)
      for (let x = 0; x < W; x++) {
        let col = g[y][x];
        if (!col && outline) {
          for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
            const yy = y + dy, xx = x + dx;
            if (yy >= 0 && yy < H && xx >= 0 && xx < W && g[yy][xx]) col = outline;
          }
        }
        if (col) {
          c.fillStyle = col;
          c.fillRect(x, y, 1, 1);
        }
      }
  }, 'native');
}

      f(0, 7, 17, 3, '#ffe9a8');
      f(7, 0, 3, 17, '#ffe9a8');
      for (let i = 2; i < 15; i++) {
        f(i, i, 2, 2, '#ffe9a8');
        f(16 - i, i, 2, 2, '#ffe9a8');
      }
      f(3, 8, 11, 1, '#ffffff');
      f(8, 3, 1, 11, '#ffffff');
      f(6, 6, 5, 5, '#ffffff');
    });
    orbTex(this, 'orb_s', 8, ['#4b2fbf', '#7a5cff', '#9ff3ff', '#ffffff']);
    orbTex(this, 'orb_l', 14, ['#3b2a8c', '#7a5cff', '#9ff3ff', '#ffffff']);
    mkCanvas(this, 'comet', 11, 11, (c) => {
      const f = (x, y, w, h, col) => ((c.fillStyle = col), c.fillRect(x, y, w, h));
      f(4, 0, 3, 11, '#ffb703');
      f(0, 4, 11, 3, '#ffb703');
      f(3, 3, 5, 5, '#ffd166');
      f(4, 4, 3, 3, '#ffffff');
    });
    mkCanvas(this, 'mine', 12, 8, (c) => {
      for (let y = 0; y < 8; y++)
        for (let x = 0; x < 12; x++) {
          const d = hyp((x + 0.5 - 6) / 6, (y + 0.5 - 4) / 4);
          if (d > 1) continue;
          c.fillStyle = d > 0.78 ? '#7df9ff' : d > 0.35 ? '#3b2a8c' : '#ffffff';
          c.fillRect(x, y, 1, 1);
        }
      c.fillStyle = '#7a5cff';
      c.fillRect(5, 1, 2, 6);
      c.fillRect(2, 3, 8, 2);
      c.fillStyle = '#ffffff';
      c.fillRect(5, 3, 2, 2);
    });
    mkCanvas(this, 'hook', 8, 8, (c) => {
      const rows = ['...XX...', '..XXXX..', '.XXXXXX.', 'XXXXXXXX', '..XXXX..', '..XXXX..', '...XX...', '...XX...'];
      rows.forEach((r, y) =>
        [...r].forEach((ch, x) => {
          if (ch === 'X') {
            c.fillStyle = x < 3 ? '#e5e9f0' : x > 4 ? '#6b7280' : '#aab2bd';
            c.fillRect(x, y, 1, 1);
          }
        })
      );
    });
  }

  buildBackground() {
    const w = Math.ceil(this.W / PX);
    const h = Math.ceil(this.H / PX);
    const horizon = Math.round(L.baseY / PX) + 6;
    let seed = 7;
    const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
    mkCanvas(this, 'bg', w, h, (c) => {
      const stops = [[11, 13, 31], [42, 27, 77], [91, 42, 99]];
      for (let y = 0; y < h; y++) {
        const t = Math.min(y / horizon, 1);
        const q = Math.floor(t * 9) / 9;
        const seg = q < 0.5 ? 0 : 1;
        const u = q < 0.5 ? q * 2 : (q - 0.5) * 2;
        const a = stops[seg], b = stops[seg + 1];
        c.fillStyle = `rgb(${a.map((v, i) => Math.round(v + (b[i] - v) * u)).join(',')})`;
        c.fillRect(0, y, w, 1);
      }
      for (let i = 0; i < w * 0.35; i++) {
        c.fillStyle = rnd() > 0.8 ? '#ffe9a8' : '#cfd3ff';
        c.fillRect(Math.floor(rnd() * w), Math.floor(rnd() * horizon * 0.7), 1, 1);
      }
      const mx = Math.round(w * 0.8), my = Math.round(horizon * 0.28);
      for (let y = -9; y <= 9; y++)
        for (let x = -9; x <= 9; x++)
          if (x * x + y * y <= 81) {
            c.fillStyle = x * x + y * y > 64 ? '#d9d4ff' : '#f5f0ff';
            c.fillRect(mx + x, my + y, 1, 1);
          }
      c.fillStyle = '#cfc8f0';
      [[-3, -2], [2, 3], [3, -4], [-4, 4]].forEach(([x, y]) => c.fillRect(mx + x, my + y, 2, 2));
      for (let x = 0; x < w; x++) {
        const top = horizon - (8 + 6 * Math.sin(x * 0.06) + 4 * Math.sin(x * 0.17 + 1));
        c.fillStyle = '#231a45';
        c.fillRect(x, Math.round(top), 1, h);
      }
      let x = 0;
      while (x < w) {
        const bw = 4 + Math.floor(rnd() * 5);
        const bh = 8 + Math.floor(rnd() * 16);
        const top = horizon + 2 - bh;
        c.fillStyle = '#120e26';
        c.fillRect(x, top, bw, h);
        for (let wy = top + 2; wy < horizon; wy += 3)
          for (let wx = x + 1; wx < x + bw - 1; wx += 2)
            if (rnd() > 0.72) {
              c.fillStyle = rnd() > 0.5 ? '#ffd166' : '#8be9fd';
              c.fillRect(wx, wy, 1, 1);
            }
        x += bw + (rnd() > 0.6 ? 1 : 0);
      }
      c.fillStyle = '#0a0818';
      c.fillRect(0, horizon + 2, w, h);
    });
    this.add.image(0, 0, 'bg').setOrigin(0).setScale(PX).setDepth(-10);
  }

  buildStage() {
    const mw = L.mainW;
    const tw = Math.round(mw / PX);
    mkCanvas(this, 'main', tw, 14, (c) => {
      for (let y = 0; y < 14; y++)
        for (let x = 0; x < tw; x++) {
          let col;
          if (y === 0) col = '#86e06f';
          else if (y === 1) col = '#3f9e4a';
          else if (y === 13) col = '#241810';
          else {
            const row = y - 2;
            const off = Math.floor(row / 3) % 2 ? 3 : 0;
            const brickEdge = row % 3 === 2 || (x + off) % 7 === 0;
            col = brickEdge ? '#4e3428' : (x * 7 + y * 13) % 11 === 0 ? '#7a5a46' : '#6b4a3a';
          }
          c.fillStyle = col;
          c.fillRect(x, y, 1, 1);
        }
    });
    mkCanvas(this, 'soft', 50, 5, (c) => {
      for (let y = 0; y < 5; y++)
        for (let x = 0; x < 50; x++) {
          c.fillStyle = y === 0 ? '#e0b46c' : y === 4 ? '#4d2f1c' : x % 10 === 0 ? '#5e3a22' : '#8a5a36';
          c.fillRect(x, y, 1, 1);
        }
    });

    this.platforms = this.physics.add.staticGroup();
    const main = this.platforms.create(this.W / 2, L.baseY + 28, 'main').setScale(PX).refreshBody();
    main.setDepth(5);
    main.body.checkCollision.left = false;
    main.body.checkCollision.right = false;
    const sx = mw * 0.3;
    [
      [this.W / 2 - sx, L.baseY - 170],
      [this.W / 2 + sx, L.baseY - 170],
      [this.W / 2, L.baseY - 310],
    ].forEach(([x, y]) => {
      const p = this.platforms.create(x, y, 'soft').setScale(PX).refreshBody();
      p.setDepth(5);
      p.body.checkCollision.down = false;
      p.body.checkCollision.left = false;
      p.body.checkCollision.right = false;
    });
  }

  // ----- Joueurs ----------------------------------------------------------
  makePlayer(charId, x, y, isHuman) {
    const def = CHARS[charId];
    const sprite = this.physics.add.sprite(x, y, `${charId}_idle0`).setScale(PX).setDepth(10);
    const bw = charId === 'grom' ? 9 : charId === 'astra' ? 6 : 7;
    const bh = charId === 'grom' ? 16 : 15;
    sprite.body.setSize(bw * RES, bh * RES, false).setOffset((12 - bw / 2) * RES, (20 - bh) * RES);
    sprite.body.setGravityY(GRAVITY);
    this.physics.add.collider(sprite, this.platforms);
    const tag = this.add
      .text(x, y, isHuman ? 'TOI' : 'BOT', { fontFamily: FONT, fontSize: '12px', color: isHuman ? '#ffe9a8' : '#ff8fa3', stroke: '#000', strokeThickness: 4 })
      .setOrigin(0.5)
      .setDepth(40);
    return {
      char: charId,
      def,
      sprite,
      tag,
      human: isHuman,
      facing: isHuman ? 1 : -1,
      damage: 0,
      stocks: STOCKS,
      jumps: def.jumps,
      stunUntil: 0,
      cdUntil: 0,
      invulnUntil: 0,
      lastJump: 0,
      lastGhost: 0,
      atk: null,
      grab: null,
      guard: 100,
      blocking: false,
      prevBlock: false,
      rollUntil: 0,
      rollCd: 0,
      rollDir: 1,
      dodgeUntil: 0,
      airDodged: false,
      guardBreakUntil: 0,
      rage: 0,
      rageUntil: 0,
      charmUntil: 0,
      moveCd: {},
      upUsed: false,
    };
  }

  beginMatch(charId) {
    const others = ORDER.filter((c) => c !== charId);
    const botChar = this.forceBot || others[Math.floor(Math.random() * others.length)];
    this.p1 = this.makePlayer(charId, this.W / 2 - 150, L.baseY - 110, true);
    this.p2 = this.makePlayer(botChar, this.W / 2 + 150, L.baseY - 110, false);
    this.p1.i = 0;
    this.p2.i = 1;
    this.buildHud();
  }

  // ----- HUD --------------------------------------------------------------
  buildHud() {
    const k = L.portrait ? 1.35 : 1;
    const mk = (pl, x, align) => {
      const ox = align === 'left' ? 0 : 1;
      const name = this.add
        .text(x, 20, pl.def.name, { fontFamily: FONT, fontSize: `${Math.round(16 * k)}px`, color: '#ffffff', stroke: '#000', strokeThickness: 4 })
        .setOrigin(ox, 0)
        .setDepth(50);
      const dmg = this.add
        .text(x, 20 + 26 * k, '0%', { fontFamily: FONT, fontSize: `${Math.round(34 * k)}px`, color: '#ffffff', stroke: '#000', strokeThickness: 6 })
        .setOrigin(ox, 0)
        .setDepth(50);
      const icons = [];
      for (let i = 0; i < STOCKS; i++) {
        const ix = align === 'left' ? x + 14 * k + i * 34 * k : x - 14 * k - i * 34 * k;
        icons.push(this.add.image(ix, 20 + 86 * k, `stock_${pl.char}`).setScale(4 * k).setDepth(50));
      }
      // jauge de garde
      const gw = 120 * k, gy = 20 + 112 * k;
      const gx = align === 'left' ? x : x - gw;
      const gbg = this.add.rectangle(gx, gy, gw, 8 * k, 0x000000, 0.55).setOrigin(0, 0.5).setDepth(50).setStrokeStyle(2, 0xffffff, 0.5);
      const gfg = this.add.rectangle(gx, gy, gw, 8 * k, 0x7df9ff).setOrigin(0, 0.5).setDepth(51);
      let rfg = null;
      if (pl.char === 'nini') {
        const ry = gy + 14 * k;
        this.add.rectangle(gx, ry, gw, 8 * k, 0x000000, 0.55).setOrigin(0, 0.5).setDepth(50).setStrokeStyle(2, 0xffffff, 0.5);
        rfg = this.add.rectangle(gx, ry, 1, 8 * k, 0xff4d8d).setOrigin(0, 0.5).setDepth(51);
      }
      pl.hud = { name, dmg, icons, gfg, gw, rfg };
    };
    mk(this.p1, 24, 'left');
    mk(this.p2, this.W - 24, 'right');

    this.banner = this.add
      .text(this.W / 2, L.baseY - 150, '', { fontFamily: FONT, fontSize: '48px', color: '#ffffff', stroke: '#000', strokeThickness: 8, align: 'center' })
      .setOrigin(0.5)
      .setDepth(60);
    this.sub = this.add
      .text(this.W / 2, L.baseY - 80, '', { fontFamily: FONT, fontSize: '18px', color: '#ffe9a8', stroke: '#000', strokeThickness: 5, align: 'center' })
      .setOrigin(0.5)
      .setDepth(60);
  }

  updateHud() {
    [this.p1, this.p2].forEach((pl) => {
      const d = Math.round(pl.damage);
      const t = Math.min(d / 150, 1);
      const col = t < 0.5 ? this.lerpCol(0xffffff, 0xffd166, t * 2) : this.lerpCol(0xffd166, 0xff3b3b, (t - 0.5) * 2);
      pl.hud.dmg.setText(`${d}%`).setColor('#' + col.toString(16).padStart(6, '0'));
      pl.hud.icons.forEach((im, i) => im.setVisible(i < pl.stocks));
      const gk = Math.max(pl.guard, 0) / 100;
      pl.hud.gfg.width = Math.max(pl.hud.gw * gk, 1);
      pl.hud.gfg.setFillStyle(gk > 0.5 ? 0x7df9ff : gk > 0.25 ? 0xffd166 : 0xff5a5a);
      if (pl.hud.rfg) {
        const raging = this.nowT < pl.rageUntil;
        const rk = raging ? (pl.rageUntil - this.nowT) / RAGE_MS : Math.min(pl.rage / RAGE_MAX, 1);
        pl.hud.rfg.width = Math.max(pl.hud.gw * rk, 1);
        pl.hud.rfg.setFillStyle(raging ? (Math.floor(this.nowT / 100) % 2 ? 0xff2b2b : 0xffd166) : rk > 0.75 ? 0xff7a45 : 0xff4d8d);
      }
    });
  }

  lerpCol(a, b, t) {
    const ch = (s) => Math.round(((a >> s) & 255) + ((((b >> s) & 255) - ((a >> s) & 255)) * t));
    return (ch(16) << 16) | (ch(8) << 8) | ch(0);
  }

  // ----- Titre + sélection de personnage ---------------------------------
  clearUi() {
    this.ui.forEach((o) => o.destroy());
    this.ui = [];
    if (this.cardTimer) this.cardTimer.remove();
    if (this.roomPoll) {
      this.roomPoll.remove();
      this.roomPoll = null;
    }
  }

      this.add.rectangle(this.W / 2, this.H / 2, this.W, this.H, 0x0b0d1f, 0.78).setDepth(D),
      this.add
        .text(this.W / 2, this.H * 0.22, 'BRAWL\nPROTO', { fontFamily: FONT, fontSize: '60px', color: '#ffffff', stroke: '#f72585', strokeThickness: 12, align: 'center', lineSpacing: 12 })
        .setOrigin(0.5)
        .setDepth(D + 1),
      this.add
        .text(

        )

    );
