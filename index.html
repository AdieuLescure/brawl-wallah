      blob(20, 42, 8, '#a87848');
      for (const [x, y, r] of [[10, 14, 8], [20, 9, 10], [30, 14, 8], [14, 6, 6], [26, 6, 6]]) blob(x, y, r, '#ffb050');
      for (const [x, y, r] of [[12, 12, 5], [20, 7, 6], [28, 12, 5]]) blob(x, y, r, '#fff0b0');
      c.fillStyle = '#ff7030'; c.fillRect(6, 18, 28, 3);
    });
  },
});

(() => {
  const P = GameScene.prototype;
  const baseTex = P.makeExtraTextures;
  P.makeExtraTextures = function () {
    if (baseTex) baseTex.call(this);
    this.makeNxTextures();
  };
  const baseStep = P.bzStep;
  P.bzStep = function (pl, other, now) {
    if (baseStep) baseStep.call(this, pl, other, now);
    this.nxStep(pl, now);
  };
  const baseProj = P.bzProj;
  P.bzProj = function (p, now) {
    if (baseProj && baseProj.call(this, p, now)) return true;
    return this.nxProj(p, now);
  };
  // sans casquette, ses coups légers frappent moins fort
  const baseHit = P.bzHit;
  P.bzHit = function (att, vic, spec, now) {
    if (baseHit) spec = baseHit.call(this, att, vic, spec, now);
    if (att.def.cap && spec.light && this.nxCapOut(att)) spec = Object.assign({}, spec, { dmg: spec.dmg * NX.bare });
    return spec;
  };
  // perdre une vie efface la formule ; la casquette revient
  const baseDie = P.die;
  P.die = function (pl, now) {
    if (pl.def.cap) {
      pl.eqMs = 0;
      for (const p of this.projs) if (!p.dead && p.owner === pl && p.spec.kind === 'cap') this.killProj(p, false);
    }
    return baseDie.call(this, pl, now);
  };
  // effets des coups de NATANAX
  const baseFx = P.extraFx;
  P.extraFx = function (pl, m, fx, b, f) {
    if (baseFx) baseFx.call(this, pl, m, fx, b, f);
    if (fx.nuke) {
      // RÉACTION EN CHAÎNE : flash blanc, ondes, champignon
      this.cameras.main.flash(220, 255, 255, 255);
      this.cameras.main.shake(320, 0.018);
      this.popup(b.x, b.y - 130, 'JE SUIS DEVENU LA MORT', '#fff3a0');
      for (let i = 0; i < 3; i++) {
        const r = this.add.image(b.x, b.y + 10, 'ring').setTint(i % 2 ? 0xffd070 : 0xffffff).setDepth(30).setScale(0.6);
        this.tweens.add({ targets: r, scale: 9 + i * 3, alpha: 0, delay: i * 70, duration: 520, ease: 'Cubic.easeOut', onComplete: () => r.destroy() });
      }
      const mu = this.add.image(b.x, b.y + 34, 'mushroom').setOrigin(0.5, 1).setDepth(7).setScale(PX * 0.6).setAlpha(0.95);
      this.tweens.add({ targets: mu, scale: PX * 2.4, y: b.y + 20, duration: 700, ease: 'Cubic.easeOut' });
      this.tweens.add({ targets: mu, alpha: 0, delay: 650, duration: 600, onComplete: () => mu.destroy() });
      for (let i = 0; i < 16; i++) {
        const a = (i / 16) * Math.PI * 2;
        const q = this.add.rectangle(b.x, b.y, 9, 9, i % 2 ? 0xffd070 : 0x9ff4ff).setDepth(30);
        this.tweens.add({ targets: q, x: b.x + Math.cos(a) * 170, y: b.y + Math.sin(a) * 120, alpha: 0, duration: 480, onComplete: () => q.destroy() });
      }
      this.sfx('boom');
      this.sfx('rumble');
    }
    if (fx.atomFx) {
      // l'atome écrasé au sol
      const x = b.x + f * 24, y = b.y + 28;
      const r = this.add.image(x, y, 'ring').setTint(0x9ff4ff).setDepth(30).setScale(0.4);
      this.tweens.add({ targets: r, scale: 2.4, alpha: 0, duration: 240, onComplete: () => r.destroy() });
    }
    if (fx.dunkFx) {
      for (let i = 0; i < 6; i++) {
        const q = this.add.rectangle(b.x + (Math.random() - 0.5) * 30, b.y - 50, 6, 6, i % 2 ? 0xe8761e : 0xffffff).setDepth(30);
        this.tweens.add({ targets: q, y: q.y - 50 - Math.random() * 40, x: q.x + (Math.random() - 0.5) * 60, alpha: 0, duration: 380, onComplete: () => q.destroy() });
      }
    }
  };
})();

// ===========================================================================
// MOVESETS — 2 boutons d'attaque façon Brawlhalla (voir le doc « Brawl Proto — armes, spéciales et combos »).
// L'ancienne version (LÉGER / LOURD / SPÉCIAL) est gardée sur la branche git « trois-boutons ».
//
// COUP + direction = les coups de la FAMILLE D'ARME du perso (POINGS, OBJET EN MAIN, ALLONGE, TIR) : mêmes chiffres
// pour toute la famille, chaque perso garde ses postures et ses effets.
//  au sol  : nL (sans direction : enchaînement de 3 coups, chain), sL (avant), uL (haut), dL (bas, fait décoller)
//  en l'air: sA (avant ou neutre), uA (haut), dA (bas)
// SPÉCIAL + direction = les coups du perso :
//  au sol  : nS (sans direction), sS (avant), dS (bas), uS (haut = remonter)
//  en l'air: uS (ou uSA s'il existe) = remonter, dAS = plongeon, nS / sS (ou nSA / sSA s'ils existent)
//  charge: true = se charge en gardant SPÉCIAL (chargeMax) ; relance: true = si elle touche, on peut enchaîner sur
//  un COUP ; recovery: true = pas de recharge en l'air (on peut toujours remonter, une fois par saut).
// Règles de combo (game.js) : un COUP qui TOUCHE peut être coupé par un autre COUP, une spéciale ou l'esquive de
// poursuite (3 annulations au plus). Usure : un coup répété dans les 5 derniers qui ont touché perd de sa force.
//
// Chiffres des coups (en ms et px) : startup (démarrage), active (durée où il touche), total (fin comprise),
// w/h/ox/oy (zone de frappe), dmg (dégâts), kb/ks (recul de base / qui grandit avec les dégâts), ang (angle),
// stun (étourdissement), combo (avantage garanti en ms si le coup touche), pop (petit envol garanti).
// ===========================================================================
(() => {
  // ---- gabarits communs ---------------------------------------------------------------------------------------
  const J = (o) => Object.assign({ type: 'melee', startup: 50, active: 70, total: 230, w: 66, h: 48, ox: 52, oy: -4, dmg: 3, kb: 100, ks: 1.1, ang: -0.15, stun: 150, combo: 120 }, o);
  const FIN = (o) => Object.assign({ type: 'melee', startup: 80, active: 100, total: 400, w: 80, h: 58, ox: 56, oy: -6, dmg: 5, kb: 280, ks: 5.4, ang: -0.55, stun: 200, combo: 60 }, o);
  const SL = (o) => Object.assign({ type: 'melee', startup: 90, active: 100, total: 340, w: 84, h: 50, ox: 60, oy: -4, dmg: 5, kb: 150, ks: 2.4, ang: -0.3, stun: 180, combo: 150, lunge: 220 }, o);
  const UL = (o) => Object.assign({ type: 'melee', startup: 70, active: 110, total: 320, w: 80, h: 92, ox: 22, oy: -52, dmg: 5, kb: 130, ks: 1.6, ang: -1.42, stun: 210, pop: 500, combo: 280 }, o);
  const DL = (o) => Object.assign({ type: 'melee', startup: 70, active: 100, total: 330, w: 96, h: 34, ox: 50, oy: 24, dmg: 5, kb: 110, ks: 1.4, ang: -1.38, stun: 220, pop: 560, combo: 330 }, o);
  const SA = (o) => Object.assign({ type: 'melee', startup: 70, active: 110, total: 380, w: 84, h: 56, ox: 54, oy: -4, dmg: 6, kb: 200, ks: 3.2, ang: -0.4, stun: 170, combo: 140 }, o);
  const UA = (o) => Object.assign({ type: 'melee', startup: 60, active: 120, total: 380, w: 86, h: 74, ox: 14, oy: -52, dmg: 6, kb: 210, ks: 3.2, ang: -1.35, stun: 170, combo: 140, pop: 380 }, o);
  const DA = (o) => Object.assign({ type: 'melee', startup: 70, active: 120, total: 380, w: 62, h: 62, ox: 10, oy: 44, dmg: 6, kb: 210, ks: 4, ang: 1.2, stun: 170, combo: 120 }, o);
  // plongeon (SPÉCIAL bas en l'air)
  const GP = (o) => Object.assign({ type: 'melee', startup: 80, active: 220, total: 580, w: 64, h: 72, ox: 8, oy: 50, dmg: 10, kb: 320, ks: 7, ang: 1.15, stun: 210, dive: 820 }, o);

  // ---- FAMILLES D'ARMES : ce qui change d'une famille à l'autre ----------------------------------------------
  //  spd : démarrage plus lent (ms) ; reach : allonge en plus (px) ; combo : avantage en plus ou en moins (ms)
  //  fin / sa : le 3e coup de l'enchaînement et le coup avant en l'air (ce sont eux qui envoient hors de l'arène)
  const FAMILY = {
    poings: { name: 'POINGS', spd: 0, reach: 0, combo: 0, lunge: 240, fin: { dmg: 6, kb: 310, ks: 7.4 }, sa: { dmg: 7, kb: 240, ks: 6 } },
    objet: { name: 'OBJET EN MAIN', spd: 15, reach: 14, combo: -10, lunge: 270, fin: { dmg: 6, kb: 320, ks: 7.8 }, sa: { dmg: 7, kb: 250, ks: 6.4 } },
    allonge: { name: 'ALLONGE', spd: 30, reach: 36, combo: -30, lunge: 170, fin: { dmg: 7, kb: 330, ks: 8.2 }, sa: { dmg: 8, kb: 260, ks: 6.8 }, bounce: 460 },
  };
  // P : postures et effets du perso pour chaque coup { n1, n2, n3, s, u, d, sa, ua, da }
  const lights = (fam, P) => {
    const F = FAMILY[fam];
    const adj = (m) => {
      m.startup += F.spd;
      m.total += F.spd;
      m.w += F.reach;
      m.ox += Math.round(F.reach * 0.6);
      if (m.combo) m.combo = Math.max(40, m.combo + F.combo);
      return m;
    };
    return {
      nL: adj(J(Object.assign({}, P.n1, { chain: [adj(J(P.n2)), adj(FIN(Object.assign({}, P.n3, F.fin)))] }))),
      sL: adj(SL(Object.assign({ lunge: F.lunge }, P.s))),
      uL: adj(UL(P.u)),
      dL: adj(DL(P.d)),
      sA: adj(SA(Object.assign({}, P.sa, F.sa))),
      uA: adj(UA(P.ua)),
      dA: adj(DA(Object.assign({}, P.da, F.bounce ? { bounce: F.bounce } : {}))),
    };
  };
  // TIR : 2 munitions (rechargement automatique), tir fort de près et faible de loin (falloff), recul en l'air.
  // Les coups de crosse marchent toujours. Pensé pour d'autres armes à distance : seules les postures changent.
  const PELLET = { kind: 'pellet', tex: 'pellet', s: 3, vx: 1500, life: 170, w: 64, h: 52, ox: 46, oy: -8, dmg: 9, kb: 240, ks: 4.4, ang: -0.35, stun: 210, small: true, falloff: true };
  const SHOT = (o, sp) => Object.assign({ type: 'proj', startup: 70, total: 300, shot: true, fx: { blast: 0 }, proj: Object.assign({}, PELLET, sp) }, o);
  const tirLights = (P) => ({
    nL: SHOT(Object.assign({}, P.n1, { chain: [
      SHOT(P.n2, { dmg: 8, kb: 140, ks: 1.6, ang: -0.2, stun: 240 }),
      FIN(Object.assign({}, P.n3, { w: 74, ox: 46, dmg: 7, kb: 330, ks: 8.4 })), // coup de crosse (sans munition)
    ] }), { dmg: 8, kb: 140, ks: 1.6, ang: -0.2, stun: 240 }),
    sL: SL(Object.assign({ lunge: 240, w: 74, ox: 46, dmg: 6 }, P.s)), // crosse en avançant
    uL: SHOT(Object.assign({ fx: { blast: -55 } }, P.u), { vx: 800, vy: -1150, ox: 30, oy: -50, w: 80, h: 76, dmg: 7, kb: 200, ks: 3.6, ang: -1.45 }),
    dL: SHOT(Object.assign({ fx: { blast: 25 } }, P.d), { vx: 1100, life: 170, ground: true, w: 60, h: 30, dmg: 6, kb: 90, ks: 1.2, ang: -1.52, stun: 260, pop: 520 }),
    sA: SHOT(Object.assign({ recoil: { x: -320, y: -60 } }, P.sa), { dmg: 8, kb: 260, ks: 6.6 }),
    uA: SHOT(Object.assign({ fx: { blast: -55 } }, P.ua), { vx: 800, vy: -1150, ox: 30, oy: -50, w: 80, h: 76, dmg: 7, kb: 210, ks: 3.4, ang: -1.4 }),
    dA: SHOT(Object.assign({ recoil: { y: -560, once: 'recoil' }, fx: { blast: 90 } }, P.da), { vx: 0, vy: 1400, life: 150, ox: 4, oy: 50, w: 48, h: 60, dmg: 6, kb: 220, ks: 3.8, ang: 1.2 }),
  });

  const K = {};
  const BARE = {};
  const O = {};
  for (const id of Object.keys(CHARS)) O[id] = CHARS[id].moves;
  const set = (id, stats, moves, help) => {
    K[id] = moves;
    Object.assign(CHARS[id], stats);
    CHARS[id].help = help;
  };

  // ---------------- TORO (POINGS) : poings en feu, jauge CHAUFFE ----------------
  {

        proj: { kind: 'cap', tex: 'capProj', s: 3.6, vx: 980, decel: 2300, fallAt: 900, life: 5000, w: 44, h: 30, ox: 30, oy: -14, dmg: 4, kb: 150, ks: 2.8, ang: -0.5, stun: 210, blockable: true } },
      // FISSION (appui court) ; SPÉCIAL + BAS tenu au sol = TABLEAU (dSW) ; formule complète = RÉACTION EN CHAÎNE (dSX)

        proj: { kind: 'ball', tex: 'bball', s: 3, vx: 240, vy: 560, grav: 900, life: 1500, w: 34, h: 34, ox: 22, oy: -46, dmg: 7, kb: 230, ks: 4.4, ang: 1.0, stun: 220 } },
      dAS: GP({ pose: 'stomp', fx: { ghosts: 2 } }), // COUP DE BOTTE
    }), ['COUP   OBJET (CASQUETTE)', 'SPÉCIAL TOUPIE', 'SPÉ AV CASQUETTE', 'SPÉ H/B ALLEY-OOP/FISSION', 'AIR BAS COUP DE BOTTE', 'BAS TENU : TABLEAU E=MC²']);
    // sans sa casquette (lancée), ses COUPS sont ceux des POINGS
    BARE.natanax = lights('poings', NXP);

  // ---- finitions communes : catégories, identifiants (usure), charge, tirs que le mur arrête ----
  const LIGHTS = ['nL', 'sL', 'uL', 'dL', 'sA', 'uA', 'dA'];
  const HEAVIES = ['sH', 'uH', 'dH', 'uAH', 'dAH']; // (Astra et Nini, en réserve, gardent l'ancienne grammaire)
  const SPECIALS = ['nS', 'sS', 'uS', 'dS', 'dAS', 'nSA', 'sSA', 'uSA', 'dSA', 'dSW', 'dSX'];
  const BLOCKABLE = { pellet: 1, neutron: 1, orb: 1, comet: 1, bullet: 1, bottle: 1, tomato: 1, ball: 1, kiss: 1, corgi: 1, suitcase: 1, paper: 1, shuttle: 1 };
  const finish = (id, mv) => {
    for (const k of Object.keys(mv)) {
      const mid = id + '.' + k;
      const m = Object.assign({}, mv[k], { mid });
      if (LIGHTS.includes(k)) m.light = true;
      if (HEAVIES.includes(k)) {
        m.heavy = true;
        if ((k === 'sH' || k === 'uH' || k === 'dH') && (m.type === 'melee' || m.type === 'proj')) m.chargeMax = 500;
      }
      if (SPECIALS.includes(k)) m.special = true;
      // spéciale qui se charge en gardant SPÉCIAL (0,5 s au plus)
      if (m.charge && (m.type === 'melee' || m.type === 'proj')) m.chargeMax = 500;
      const tag = (sp, mm) => sp && Object.assign({}, sp, { mid: mm.mid, heavy: !!mm.heavy, special: !!mm.special, blockable: !!BLOCKABLE[sp.kind] || sp.blockable });
      if (m.chain) m.chain = m.chain.map((c, i) => { const cc = Object.assign({}, c, { mid: mid + (i + 2), light: true }); if (cc.proj) cc.proj = tag(cc.proj, cc); return cc; });
      if (m.proj) m.proj = tag(m.proj, m);
      if (m.book) m.book = tag(m.book, m);
      if (m.ball) m.ball = tag(m.ball, m);
      if (m.neutron) m.neutron = tag(m.neutron, m);
      if (m.throw) m.throw = Object.assign({}, m.throw, { mid, heavy: !!m.heavy, special: !!m.special });
      mv[k] = m;
    }
    return mv;
  };
  for (const id of Object.keys(K)) {
    CHARS[id].moves = finish(id, K[id]);
    CHARS[id].jumps = 3; // un saut au sol + deux en l'air
  }
  for (const id of Object.keys(BARE)) CHARS[id].bareAll = Object.assign({}, CHARS[id].moves, finish(id, BARE[id]));

  // textures de MÉNÈS : le MUR DE PRISON et le MICRO
  const baseExtra = GameScene.prototype.makeExtraTextures;

      'kdkkkkkkkdk', 'kdkwbwbwkdk', 'kdkwbwbwkdk', 'kdkwbwbwkdk', 'kdkwbwbwkdk', 'kdkwbwbwkdk', 'kdkwbwbwkdk', 'kdkkkkkkkdk', 'kdddddddddk',
      'klllldllllk', 'kmmmmdmmmmk', 'kdddddddddk', 'kldllllldlk', 'kmdmmmmmdmk', 'kdddddddddk', 'klllldllllk', 'kmmmmdmmmmk', 'kdddddddddk', 'kkkkkkkkkkk',
    ], '#000', { k: '#14121c', c: '#c9ccd4', d: '#4a4d58', m: '#7d818e', l: '#a4a8b4', w: '#0d1530', b: '#9aa0ac' });
    // micro : la grille en haut (le jeu le tourne vers l'avant), le manche en bas
    iconTex(this, 'mic', ['.kkkk.', 'kLgLgk', 'kgLgGk', 'kLgGGk', '.kkkk.', '.kBBk.', '.kBBk.', '.kRBk.', '.kBBk.', '..kk..'], '#000',
      { k: '#14121c', L: '#e6e8ee', g: '#9aa0ac', G: '#5a5f6a', B: '#2a2a34', R: '#e63946' });

// ===========================================================================
// FAMILLES D'ARMES : ce qui se passe pendant le combat
//  - NATANAX sans sa casquette : ses COUPS sont ceux des POINGS (famMoves)
//  - TIR : 2 munitions (pl.ammo), rechargement automatique (vide : 0,8 s ; une seule : 1,5 s sans tirer),
//    tir à vide = « CLIC », recul en l'air (recoil), plombs plus faibles de loin (falloff)
//  - ALLONGE : le coup bas en l'air fait rebondir sur l'adversaire (bounce)
// Tout l'état est en champs simples (ammo, reloadAt, lastShot, recoilUsed) : sauvegardé en ligne.
// ===========================================================================
(() => {
  const TIR = { ammo: 2, reloadEmpty: 650, reloadOne: 1200, falloff: 0.3 };
  const P = GameScene.prototype;

  // les coups utilisables en ce moment (famille d'arme du perso, ou celle sans objet)
  P.famMoves = function (pl) {
    if (pl.def.bareAll && this.nxCapOut && this.nxCapOut(pl)) return pl.def.bareAll;
    return pl.def.moves;
  };

  // tir : munitions et recul (au moment où le plomb part)
  const baseSpawn = P.spawnProj;
  P.spawnProj = function (pl, target, m, now, dy, spOverride) {
    if (m && m.shot && !spOverride && pl.def.tir) {
      const ammo = pl.ammo === undefined ? TIR.ammo : pl.ammo;
      const c = pl.sprite.body.center;
      if (ammo <= 0) {
        this.popup(c.x + pl.facing * 30, c.y - 70, 'CLIC', '#c9ccd4');
        this.sfx('ui', 0.4);
        return;
      }
      pl.ammo = ammo - 1;
      pl.lastShot = now;
      if (pl.ammo <= 0) pl.reloadAt = now + TIR.reloadEmpty;
      const r = m.recoil;
      if (r && (!r.once || !pl[r.once + 'Used'])) {
        const b = pl.sprite.body;
        if (r.x) pl.sprite.setVelocityX(pl.facing * r.x);
        if (r.y) pl.sprite.setVelocityY(Math.min(b.velocity.y, r.y));
        if (r.once) pl[r.once + 'Used'] = true;
      }
    }
    return baseSpawn.call(this, pl, target, m, now, dy, spOverride);
  };

  // à chaque image : rechargement, recul rendu au sol, affichage des cartouches
  const baseStep = P.bzStep;
  P.bzStep = function (pl, other, now) {
    if (baseStep) baseStep.call(this, pl, other, now);
    if (!pl.def.tir) return;
    const b = pl.sprite.body;
    if (b.blocked.down || b.touching.down) pl.recoilUsed = false;
    const ammo = pl.ammo === undefined ? TIR.ammo : pl.ammo;
    if (ammo < TIR.ammo && ((ammo <= 0 && now >= (pl.reloadAt || 0)) || (ammo > 0 && now - (pl.lastShot || 0) >= TIR.reloadOne))) {
      pl.ammo = TIR.ammo;
      if (!this.resim) this.sfx('ui', 0.25);
    }
    // affichage seulement : les cartouches au-dessus de la tête quand il en manque
    const show = pl.stocks > 0 && (pl.ammo === undefined ? TIR.ammo : pl.ammo) < TIR.ammo;
    if (show) {
      if (!pl.ammoImg && !this.resim) pl.ammoImg = [0, 1].map(() => this.add.rectangle(0, 0, 7, 12, 0xe8b030).setStrokeStyle(2, 0x000000).setDepth(41));
      if (pl.ammoImg) pl.ammoImg.forEach((r, i) => r.setPosition(pl.sprite.x - 6 + i * 12, pl.sprite.y - 92).setFillStyle(i < pl.ammo ? 0xe8b030 : 0x3a3a44));
    } else if (pl.ammoImg) {
      pl.ammoImg.forEach((r) => r.destroy());
      pl.ammoImg = null;
    }
  };

  // plombs du fusil : plus faibles de loin, s'arrêtent sur le premier touché
  const baseProj = P.bzProj;
  P.bzProj = function (p, now) {
    if (baseProj && baseProj.call(this, p, now)) return true;
    const sp = p.spec;
    if (sp.kind !== 'pellet') return false;
    if (now - p.born > sp.life) { this.killProj(p, false); return true; }
    p.sprite.setAlpha(1 - 0.6 * ((now - p.born) / sp.life));
    const victims = this.pls.length > 2 ? this.enemiesOf(p.owner) : [p.target];
    for (const v of victims) {
      if (now < v.invulnUntil || v.stocks <= 0 || v.grab) continue;
      if (v.atk && v.atk.m.projImmune && now < v.atk.end) continue;
      const vb = v.sprite.body;
      if (!(p.x + sp.w / 2 > vb.x && p.x - sp.w / 2 < vb.right && p.y + sp.h / 2 > vb.y && p.y - sp.h / 2 < vb.bottom)) continue;
      if (v.atk && v.atk.m.type === 'catch' && now >= v.atk.cFrom && now <= v.atk.cTo) { this.catchProj(v, p, now); return true; }
      const k = 1 - TIR.falloff * Math.min((now - p.born) / sp.life, 1);
      const spec = Object.assign({}, sp, { dmg: sp.dmg * k, kb: sp.kb * (0.5 + 0.5 * k), ks: sp.ks * k });
      const dir = sp.vx ? Math.sign(p.vx) || p.f : Math.sign(v.sprite.x - p.owner.sprite.x) || p.f;
      this.applyHit(p.owner, v, spec, now, dir, { x: p.x, y: p.y });
      this.killProj(p, false);
      return true;
    }
    return true;
  };

  // ALLONGE : le coup bas en l'air rebondit sur l'adversaire
  const baseHit = P.bzHit;
  P.bzHit = function (att, vic, spec, now) {
    if (baseHit) spec = baseHit.call(this, att, vic, spec, now);
    if (spec.bounce && att !== vic) {
      const b = att.sprite.body;
      if (!(b.blocked.down || b.touching.down)) att.sprite.setVelocityY(-spec.bounce);
    }
    return spec;
  };

  // effets : éclair au bout du canon
  const baseFx = P.extraFx;
  P.extraFx = function (pl, m, fx, b, f) {
    if (baseFx) baseFx.call(this, pl, m, fx, b, f);
    if (fx.blast !== undefined) {
      const a = (fx.blast * Math.PI) / 180;
      const ux = Math.cos(a) * f, uy = Math.sin(a);
      const x = b.x + ux * 46, y = b.y - 8 + uy * 46;
      const fl = this.add.image(x, y, 'burst').setScale(PX * 0.45).setTint(0xffe27a).setDepth(31);
      this.tweens.add({ targets: fl, scale: PX * 0.8, alpha: 0, duration: 120, onComplete: () => fl.destroy() });
      for (let i = 0; i < 5; i++) {
        const q = this.add.rectangle(x, y, 5, 5, i % 2 ? 0xffe27a : 0xffffff).setDepth(31);
        const sp = (Math.random() - 0.5) * 0.6;
        const vx = Math.cos(a + sp) * f, vy = Math.sin(a + sp);
        this.tweens.add({ targets: q, x: x + vx * (60 + Math.random() * 60), y: y + vy * (60 + Math.random() * 60), alpha: 0, duration: 160, onComplete: () => q.destroy() });
      }
      const sm = this.add.circle(x, y, 7, 0xb8b8c0, 0.7).setDepth(30);
      this.tweens.add({ targets: sm, y: y - 16, scale: 2, alpha: 0, duration: 380, onComplete: () => sm.destroy() });
      this.sfx('shoot', 0.8);
    }
  };

  const baseTex = P.makeExtraTextures;
  P.makeExtraTextures = function () {
    if (baseTex) baseTex.call(this);
    // plombs du fusil à pompe (gerbe)
    iconTex(this, 'pellet', ['....kY', '..kY..', 'kYkkYk', '..kY..', '....kY'], '#000', { k: '#3a2a10', Y: '#ffe27a' });
  };
})();

// ===========================================================================
// ANIMATION D'AFFICHAGE : chaque perso a deux objets
//  - pl.sprite : le corps physique (invisible), seul à compter pour le combat
//  - pl.view   : l'image qu'on voit, qui suit le corps et ajoute la souplesse : écrasement à l'atterrissage,
//    étirement au saut, préparation et détente des coups, tremblement quand on est touché, vrille quand on est
//    éjecté fort, petit balancement en courant, respiration à l'arrêt.
// Rien ici ne touche la simulation : en ligne, les deux téléphones restent identiques.
// Postures en plus (si le dessin existe) : '<coup>Pre' pendant la préparation, 'fall' en chute, 'crouch' à
// l'atterrissage, course en 4 temps (run0, run2, run1, run3).
// ===========================================================================
(() => {
  const P = GameScene.prototype;
  const baseMake = P.makePlayer;
  P.makePlayer = function (charId, x, y, isHuman) {
    const pl = baseMake.call(this, charId, x, y, isHuman);
    const s = pl.sprite;
    pl.view = this.add.image(s.x, s.y, s.texture.key).setDepth(s.depth);
    s.setVisible(false);
    pl.anim = { sx: 1, sy: 1, ang: 0, spin: 0, ox: 0, oy: 0, wasGround: true, prevVy: 0, stunSeen: 0, shake: 0, land: 0, t: 0, key: '' };
    return pl;
  };
  const baseUpdate = P.update;
  P.update = function (time, delta) {
    baseUpdate.call(this, time, delta);
    const dt = Math.min(delta, 50) / 1000;
    if (this.pls && this.p1 && this.p1.view) this.pls.forEach((pl) => this.syncView(pl, dt));
    this.updateCamera(dt);
  };

  const lerp = (a, b, k) => a + (b - a) * k;
  // la posture existe-t-elle vraiment dans la planche dessinée ? (sinon la texture n'est qu'une copie de la garde)
  const PNG_HAS = (ch, n) => !(typeof PNG_CHARS !== 'undefined' && PNG_CHARS[ch]) || PNG_CHARS[ch].names.includes(n);

  const CAM_MIN_Z = 0.72; // dézoom maximal quand les persos sont très loin (plus de place sur les côtés et en haut)
  Object.assign(P, {
    // --- CAMÉRA À LA BRAWLHALLA : elle suit les deux persos et zoome quand ils sont proches.
    // Une deuxième caméra, fixe, affiche l'interface (profondeur >= 50 : barre de vie, boutons, menus).
    updateCamera(dt) {
      const cam = this.cameras.main;
      if (!this.uiCam || !this.cameras.cameras.includes(this.uiCam)) {
        this.uiCam = this.cameras.add(0, 0, this.W, this.H);
        this.uiCam.transparent = true;
        cam.setBounds(0, 0, this.W, this.H);
        this.camZ = 1;
        this.camX = this.W / 2;
        this.camY = this.H / 2;
      }
      const ui = this.uiCam;
      // 3e caméra, dessinée en premier : le décor du fond (profondeur <= -5). Quand la caméra du combat
      // dézoome (persos très loin), le fond, lui, ne rapetisse pas : il couvre toujours tout l'écran.
      if (!this.bgCam || !this.cameras.cameras.includes(this.bgCam)) {
        this.bgCam = this.cameras.add(0, 0, this.W, this.H);
        const arr = this.cameras.cameras;
        arr.splice(arr.indexOf(this.bgCam), 1);
        arr.unshift(this.bgCam);
      }
      const bgc = this.bgCam;
      const list = this.children.list;
      for (let i = 0; i < list.length; i++) {
        const o = list[i];
        o.cameraFilter = o.depth >= 50 ? cam.id | bgc.id : o.depth <= -5 ? cam.id | ui.id : ui.id | bgc.id;
      }
      // cible : les deux persos (vivants) avec de la marge
      let tz = 1, tx = this.W / 2, ty = this.H / 2;
      const inMatch = this.p1 && this.p2 && this.p1.view && (this.state === 'play' || this.state === 'countdown') && !this.over;
      if (inMatch && SETTINGS.zoom !== false) {
        // un perso invisible (DOUBLURE) : la caméra suit sa silhouette de billets, pas lui
        const pts = this.pls.filter((p) => p.stocks > 0 || this.training).map((p) => {
          const d = (this.nowT || 0) < (p.invisUntil || 0) && this.projs.find((q) => !q.dead && q.id === p.decoyId);
          return d ? { x: d.x, y: d.y } : p.sprite;
        });
        if (pts.length) {
          const x0 = Math.min(...pts.map((p) => p.x)), x1 = Math.max(...pts.map((p) => p.x));
          const y0 = Math.min(...pts.map((p) => p.y)), y1 = Math.max(...pts.map((p) => p.y));
          const w = x1 - x0 + 520, h = y1 - y0 + 380;
          tz = Math.max(CAM_MIN_Z, Math.min(L.portrait ? 1.9 : 1.75, this.W / w, this.H / h));
          tx = (x0 + x1) / 2;
          ty = (y0 + y1) / 2 - 30;
        }
      }
      const k = Math.min(1, dt * 4);
      this.camZ += (tz - this.camZ) * k;
      this.camX += (tx - this.camX) * Math.min(1, dt * 6);
      this.camY += (ty - this.camY) * Math.min(1, dt * 6);
      cam.setZoom(this.camZ);
      // dézoomé (< 1) : on peut voir un peu au-delà de l'écran de base (zone de jeu plus grande)
      const zo = Math.min(this.camZ, 1);
      const vw = this.W / zo, vh = this.H / zo;
      cam.setBounds(this.W / 2 - vw / 2, L.baseY - L.baseY / zo, vw, vh);
      cam.centerOn(this.camX, this.camY);
      // le fond suit la caméra du combat quand elle zoome (> 1), reste fixe quand elle dézoome
      if (this.camZ >= 1) {
        bgc.setZoom(this.camZ);
        bgc.setBounds(0, 0, this.W, this.H);
        bgc.centerOn(cam.midPoint.x, cam.midPoint.y);
      } else {
        bgc.setZoom(1);
        bgc.centerOn(this.W / 2, this.H / 2);
      }
    },

    hasTex(key) {
      if (!this._texOk) this._texOk = new Map();
      let v = this._texOk.get(key);
      if (v === undefined) {
        v = this.textures.exists(key);
        this._texOk.set(key, v);
      }
      return v;
    },

    syncView(pl, dt) {
      const s = pl.sprite, v = pl.view, a = pl.anim, b = s.body;
      if (!v || !v.active) return;
      const now = this.nowT || 0;
      const frozen = this.freezeLeft > 0 || this.over || this.state !== 'play';
      a.t += dt;
      const grounded = !pl.ledgeSide && (b.blocked.down || b.touching.down);
      const vx = b.velocity.x, vy = b.velocity.y;
      const stunned = now < pl.stunUntil;
      let tsx = 1, tsy = 1, tang = 0, tox = 0;
      // --- événements
      if (!frozen) {
        if (a.wasGround && !grounded && vy < -150 && !stunned) { a.sx = 0.84; a.sy = 1.18; }
        if (!a.wasGround && grounded && a.prevVy > 220) {
          const k = Math.min(a.prevVy / 1300, 1);
          a.sx = 1.12 + 0.12 * k;
          a.sy = 0.86 - 0.1 * k;
          a.land = 0.09;
          this.sfx('land', k);
          if (k > 0.3) this.dust(s.x, b.bottom, 0, 3, pl.def.fx);
        }
        a.wasGround = grounded;
        a.prevVy = vy;
      }
      // coup reçu : petit écrasement et tremblement
      if (pl.stunStart && pl.stunStart !== a.stunSeen && stunned) {
        a.stunSeen = pl.stunStart;
        a.shake = 0.18;
        a.sx = 0.86;
        a.sy = 1.12;
      }
      a.land = Math.max(0, a.land - dt);
      // --- cibles selon l'état
      const atk = pl.atk;
      if (atk && !stunned) {
        const m = atk.m;
        const hitAt = atk.hitAt, act = m.active || 120;
        if (atk.charging) { tsx = 1.05; tsy = 0.96; tang = -pl.facing * 4; }
        else if (atk.chg && now < hitAt) {
          // lourd en charge : ramassé, et il tremble de plus en plus
          tsx = 1.1; tsy = 0.9; tang = -pl.facing * 8; tox = -pl.facing * 4;
          a.shake = Math.max(a.shake, 0.03 * Math.min(atk.chg / (m.chargeMax || 500), 1) + 0.01);
        }
        else if (now < hitAt) {
          // préparation : on se ramasse et on recule le buste
          const k = Math.min((now - atk.start) / Math.max(hitAt - atk.start, 1), 1);
          tsx = 1 + 0.07 * k; tsy = 1 - 0.06 * k; tang = -pl.facing * 6 * k; tox = -pl.facing * 3 * k;
        } else if (now < hitAt + act) {
          // détente : on s'étire dans le sens du coup
          tsx = 1.1; tsy = 0.94; tang = pl.facing * 5; tox = pl.facing * 5;
          if ((m.oy || 0) < -40) { tsx = 0.94; tsy = 1.1; tang = 0; tox = 0; } // coups vers le haut
        } else { tang = pl.facing * 2; }
      } else if (stunned) {
        const sp = Math.hypot(vx, vy);
        if (sp > 950 && !grounded) a.spin += (vx >= 0 ? 1 : -1) * dt * Math.min(sp, 2200) * 0.9;
        tang = Math.max(-20, Math.min(20, vx / 60));
      } else if (!grounded) {
        tsy = 1 + Math.min(Math.abs(vy) / 9000, 0.07);
        tsx = 1 - Math.min(Math.abs(vy) / 12000, 0.05);
        tang = Math.max(-6, Math.min(6, vx / 120));
      } else if (Math.abs(vx) > 60) {
        tang = Math.max(-5, Math.min(5, vx / 70));
      } else {
        tsy = 1 + 0.012 * Math.sin(a.t * 3.2);
      }
      if (!stunned) a.spin = lerp(a.spin, Math.round(a.spin / 360) * 360, Math.min(1, dt * 10));
      // --- lissage (ressort amorti)
      if (!frozen) {
        const k = Math.min(1, dt * 16);
        a.sx = lerp(a.sx, tsx, k);
        a.sy = lerp(a.sy, tsy, k);
        a.ang = lerp(a.ang, tang, Math.min(1, dt * 12));
        a.ox = lerp(a.ox, tox, Math.min(1, dt * 14));
      }
      let jx = 0, jy = 0;
      if (a.shake > 0) {
        a.shake -= dt;
        jx = (Math.random() - 0.5) * 7;
        jy = (Math.random() - 0.5) * 4;
      }
      // course : petit rebond
      const running = grounded && Math.abs(vx) > 60 && !atk && !stunned;
      const bob = running ? -Math.abs(Math.sin(a.t * 11)) * 2.5 : 0;

      // --- posture affichée (variantes dessinées si elles existent)
      let key = s.texture.key;
      const ch = pl.char;
      // version dorée (BIGZINZIN en JACKPOT) : même posture, suffixe « _g »
      const gs = VARIANTS.find((v) => key.endsWith(v)) || '';
      const name = key.slice(ch.length + 1, key.length - gs.length);
      if (atk && !stunned && now < atk.hitAt && !atk.m.prePose && !atk.charging) {
        const pre = `${ch}_${atk.pose || atk.m.pose}Pre${gs}`;
        if (this.hasTex(pre) && PNG_HAS(ch, `${atk.pose || atk.m.pose}Pre`)) key = pre;
      } else if (name === 'jump' && vy > 140 && this.hasTex(`${ch}_fall${gs}`)) key = `${ch}_fall${gs}`;
      else if ((name === 'idle0' || name === 'idle1') && a.land > 0 && this.hasTex(`${ch}_crouch${gs}`)) key = `${ch}_crouch${gs}`;
      else if ((name === 'run0' || name === 'run1') && this.hasTex(`${ch}_run2${gs}`)) {
        key = `${ch}_${['run0', 'run2', 'run1', 'run3'][Math.floor(now / 85) % 4]}${gs}`;
      }
      // couleur d'équipe : même posture, planche recolorée (« toro~2_run0 »)
      if (pl.tex && key.startsWith(ch + '_')) key = pl.tex + key.slice(ch.length);
      if (key !== a.key) {
        v.setTexture(key);
        a.key = key;
      }
      // --- recopie de l'apparence du corps
      const h = s.displayHeight;
      v.scaleX = s.scaleX * a.sx;
      v.scaleY = s.scaleY * a.sy;
      v.setFlipX(s.flipX);
      v.angle = s.angle + a.ang + a.spin;
      v.x = s.x + a.ox + jx;
      v.y = s.y + (h / 2) * (1 - a.sy) + bob + jy;
      v.alpha = s.alpha;
      v.visible = pl.stocks > 0 || this.training;
      v.depth = s.depth;
      if (s.tintFill) v.setTintFill(s.tintTopLeft);
      else if (s.isTinted) v.setTint(s.tintTopLeft);
      else if (v.isTinted) v.clearTint();
    },
  });
})();

// ART HD (vectoriel, dessiné en canvas) pour les cinématiques de coup final
// Style "cel" : aplats + gros contour encre, dans la même palette que les sprites pixel.
// ===========================================================================
const INK = '#14121c';

function hdSeg(x, y, a, l) {
  const r = (a * Math.PI) / 180;
  return [x + Math.sin(r) * l, y + Math.cos(r) * l];
}

function hdStroke(c, pts, w, col) {
  c.lineCap = 'round';
  c.lineJoin = 'round';
  c.beginPath();
  c.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) c.lineTo(pts[i][0], pts[i][1]);
  c.strokeStyle = INK;
  c.lineWidth = w + 10;
  c.stroke();
  c.strokeStyle = col;
  c.lineWidth = w;
  c.stroke();
}

function hdPoly(c, pts, fill, lw) {
  c.beginPath();
  c.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) c.lineTo(pts[i][0], pts[i][1]);
  c.closePath();
  if (fill) {
    c.fillStyle = fill;
    c.fill();
  }
  if (lw) {
    c.lineJoin = 'round';
    c.strokeStyle = INK;
    c.lineWidth = lw;
    c.stroke();
  }
}

function hdEllipse(c, x, y, rx, ry, fill, lw, rot) {
  c.beginPath();
  c.ellipse(x, y, rx, ry, rot || 0, 0, Math.PI * 2);
  if (fill) {
    c.fillStyle = fill;
    c.fill();
  }
  if (lw) {
    c.strokeStyle = INK;
    c.lineWidth = lw;
    c.stroke();
  }
}

// --- Tête vue de profil (tournée vers la droite) -----------------------------
function hdHoodHead(c, S, mood) {
  // pointe de capuche vers l'arrière
  hdPoly(c, [[-56, -14], [-104, 26], [-52, 40]], S.jacketDk, 6);
  // capuche
  c.beginPath();
  c.moveTo(-52, 34);
  c.quadraticCurveTo(-82, -52, -20, -80);
  c.quadraticCurveTo(44, -94, 64, -28);
  c.quadraticCurveTo(72, 12, 44, 40);
  c.quadraticCurveTo(10, 58, -52, 34);
  c.closePath();
  c.fillStyle = S.jacket;
  c.fill();
  c.lineJoin = 'round';
  c.strokeStyle = INK;
  c.lineWidth = 6;
  c.stroke();
  // visage dans l'ombre
  c.beginPath();
  c.ellipse(26, 2, 32, 40, 0, 0, Math.PI * 2);
  c.fillStyle = '#24173f';
  c.fill();
  // yeux lumineux
  hdEllipse(c, 36, -6, 10, 7, '#7df9ff', 0);
  hdEllipse(c, 39, -6, 4, 4, '#ffffff', 0);
  if (mood === 'yell') hdEllipse(c, 34, 26, 9, 6, '#0f0a22', 0);
  // liseré doré de la capuche
  c.strokeStyle = '#ffd166';
  c.lineWidth = 5;
  c.lineCap = 'round';
  c.beginPath();
  c.moveTo(-18, -76);
  c.quadraticCurveTo(44, -90, 62, -28);
  c.quadraticCurveTo(66, 4, 50, 28);
  c.stroke();
}

function hdHeadSide(c, S, mood) {
  if (S.hood) {
    hdHoodHead(c, S, mood);
    return;
  }
  // oreille
  hdEllipse(c, -12, 8, 10, 15, S.skin2, 5);
  // crâne
  hdEllipse(c, 0, 0, 40, 47, S.skin, 6);
  // nez
  hdPoly(c, [[36, 4], [56, 24], [38, 28]], S.skin, 5);
  // menton / ombre
  c.beginPath();
  c.ellipse(0, 0, 36, 43, 0, 0.15 * Math.PI, 0.85 * Math.PI);
  c.strokeStyle = S.skin2;
  c.lineWidth = 6;
  c.stroke();
  // cheveux
  c.beginPath();
  if (S.hairStyle === 'messy') {
    c.moveTo(-42, 10);
    c.quadraticCurveTo(-60, -42, -22, -60);
    c.lineTo(-30, -80);
    c.lineTo(-8, -64);
    c.lineTo(-4, -88);
    c.lineTo(14, -66);
    c.lineTo(26, -84);
    c.lineTo(36, -58);
    c.lineTo(56, -48);
    c.quadraticCurveTo(44, -34, 32, -32);
    c.lineTo(36, -22);
    c.quadraticCurveTo(8, -42, -12, -26);
    c.quadraticCurveTo(-24, -10, -30, 10);
  } else {
    c.moveTo(-42, 8);
    c.quadraticCurveTo(-56, -46, -10, -58);
    c.quadraticCurveTo(30, -66, 44, -30);
    c.lineTo(38, -24);
    c.quadraticCurveTo(10, -38, -16, -24);
    c.quadraticCurveTo(-26, -8, -30, 8);
  }
  c.closePath();
  c.fillStyle = S.hair;
  c.fill();
  c.strokeStyle = INK;
  c.lineWidth = 6;
  c.lineJoin = 'round';
  c.stroke();
  c.strokeStyle = S.hairHl;
  c.lineWidth = 4;
  c.beginPath();
  c.moveTo(-18, -50);
  c.quadraticCurveTo(4, -64, 24, -56);
  c.stroke();
  // oeil
  hdEllipse(c, 18, -2, 10, 8, '#ffffff', 4);
  hdEllipse(c, 22, -2, 5, 5, INK, 0);
  c.fillStyle = '#fff';
  c.fillRect(21, -5, 3, 3);
  // sourcil
  c.strokeStyle = S.hair;
  c.lineWidth = 9;
  c.lineCap = 'round';
  c.beginPath();
  c.moveTo(6, mood === 'yell' ? -18 : -16);
  c.lineTo(32, -8);
  c.stroke();
  // moustache fine
  if (S.mustache) {
    c.strokeStyle = S.hair;
    c.lineWidth = 6;
    c.beginPath();
    c.moveTo(14, 20);
    c.quadraticCurveTo(30, 16, 46, 22);
    c.stroke();
  }
  // serre-tête
  if (S.headband) {
    hdPoly(c, [[-40, -42], [-104, -34], [-76, -16], [-108, 6], [-42, -6]], S.headband, 5);
    hdPoly(c, [[-42, -26], [40, -40], [44, -22], [-42, -6]], S.headband, 5);
  }
  // barbe
  if (S.beard) {
    hdPoly(c, [[-14, 6], [26, 2], [60, 12], [56, 40], [28, 66], [-4, 52]], S.beard, 6);
    c.strokeStyle = S.hairHl;
    c.lineWidth = 4;
    c.beginPath();
    c.moveTo(6, 26);
    c.quadraticCurveTo(26, 40, 46, 30);
    c.stroke();
  }
  // bouche
  c.strokeStyle = INK;
  c.lineWidth = 5;
  c.beginPath();
  if (S.beard) {
    // bouche cachée dans la barbe
    c.moveTo(28, 28);
  } else if (mood === 'yell') {
    c.ellipse(26, 33, 10, 8, 0, 0, Math.PI * 2);
    c.fillStyle = '#7a1f2b';
    c.fill();
    c.stroke();
  } else {
    c.moveTo(16, 33);
    c.lineTo(38, 31);
    c.stroke();
  }
}

// --- Silhouette complète en squelette (angles en degres depuis "vers le bas", + = vers l'avant) ---
// P = { lean, tilt, mood, armF:[a1,a2], armB:[a1,a2], legF:[a1,a2], legB:[a1,a2], flap }
function hdHuman(c, ox, oy, S, P) {
  c.save();
  c.translate(ox, oy);
  const lean = (P.lean * Math.PI) / 180;
  const up = [Math.sin(lean), -Math.cos(lean)];
  const nrm = [Math.cos(lean), Math.sin(lean)];
  const sh = [up[0] * 128, up[1] * 128];
  const limb = (st, a1, a2, l1, l2) => {
    const m = hdSeg(st[0], st[1], a1, l1);
    return [st, m, hdSeg(m[0], m[1], a2, l2)];
  };
  const aB = limb(sh, P.armB[0], P.armB[1], 92, 86);
  const aF = limb(sh, P.armF[0], P.armF[1], 92, 86);
  const lB = limb([0, 0], P.legB[0], P.legB[1], 118, 116);
  const lF = limb([0, 0], P.legF[0], P.legF[1], 118, 116);

  const hand = (p) => hdEllipse(c, p[0], p[1], 18, 17, S.hand || S.skin, 5);
  const shoe = (l, a2) => {
    const e = l[2];
    const r = (a2 * Math.PI) / 180;
    const f = [Math.cos(r), -Math.sin(r)];
    const sx = e[0] + f[0] * 16 - Math.sin(r) * 2;
    const sy = e[1] + f[1] * 16 - Math.cos(r) * 2;
    hdEllipse(c, sx, sy, 34, 15, S.shoe, 5, Math.atan2(f[1], f[0]));
  };
  const arm = (a, dark) => {
    const sl = dark ? S.backArm || S.jacketDk : S.sleeve;
    if (S.foreSleeve === null) {
      hdStroke(c, [a[1], a[2]], 28, dark ? S.backArm || S.skin : S.skin);
      hdStroke(c, [a[0], a[1]], 34, sl);
    } else hdStroke(c, a, 32, sl);
    hand(a[2]);
  };
  const leg = (l, a2, dark) => {
    if (S.thigh === S.shin) hdStroke(c, l, 44, dark ? S.jacketDk : S.thigh);
    else {
      hdStroke(c, [l[1], l[2]], 36, S.shin);
      hdStroke(c, [l[0], l[1]], 50, S.thigh);
    }
    shoe(l, a2);
  };

  arm(aB, true);
  leg(lB, P.legB[1], true);
  // torse
  hdStroke(c, [[0, 0], sh], 84, S.jacket);
  // détails veste / chemise / cravate
  const pt = (k, n) => [sh[0] - up[0] * k + nrm[0] * n, sh[1] - up[1] * k + nrm[1] * n];
  if (S.shirt) {
    hdPoly(c, [pt(-16, 10), pt(-16, 30), pt(70, 22)], S.shirt, 5);
    hdPoly(c, [pt(-16, 10), pt(30, 12), pt(-16, 34)], S.shirt, 0);
    // revers
    hdPoly(c, [pt(-18, 36), pt(80, 24), pt(40, 40)], S.jacketLt, 5);
  } else if (!S.noStripe) {
    // maillot : bande + manche
    hdPoly(c, [pt(-10, -34), pt(-10, 36), pt(130, 36), pt(130, -34)], null, 0);
    c.strokeStyle = '#ffffff';
    c.lineWidth = 10;
    c.beginPath();
    c.moveTo(pt(30, 40)[0], pt(30, 40)[1]);
    c.lineTo(pt(100, 40)[0], pt(100, 40)[1]);
    c.stroke();
  }
  c.strokeStyle = INK;
  c.lineWidth = 5;
  c.beginPath();
  c.moveTo(pt(80, 40)[0], pt(80, 40)[1]);
  c.lineTo(pt(80, 44)[0] - 2, pt(80, 44)[1] + 2);
  c.stroke();
  if (S.tie) {
    const t0 = pt(-4, 24), t1 = pt(80, 30);
    const fl = P.flap || 0;
    hdPoly(c, [t0, [t0[0] - 8, t0[1] + 6], [t1[0] - fl - 8, t1[1] + 6], [t1[0] - fl + 8, t1[1] - 6]], S.tie, 4);
  }
  if (S.skirt) {
    // robe (ASTRA)
    hdPoly(c, [[-46, -6], [54, -6], [74, 150], [-68, 158]], S.jacket, 6);
    c.strokeStyle = S.hem || '#ffd166';
    c.lineWidth = 6;
    c.beginPath();
    c.moveTo(-66, 150);
    c.lineTo(72, 144);
    c.stroke();
  }
  leg(lF, P.legF[1], false);
  if (S.pauldron) hdEllipse(c, sh[0] + 4, sh[1] + 10, 40, 30, S.pauldron, 6);
  // cou + tête
  const hc = [sh[0] + up[0] * 56 + nrm[0] * 6, sh[1] + up[1] * 56 + nrm[1] * 6];
  hdStroke(c, [sh, hc], 36, S.skin2);
  c.save();
  c.translate(hc[0], hc[1]);
  c.rotate(lean * 0.6 + ((P.tilt || 0) * Math.PI) / 180);
  hdHeadSide(c, S, P.mood);
  c.restore();
  arm(aF, false);
  c.restore();
  return { hip: [ox, oy], hand: [ox + aF[2][0], oy + aF[2][1]], foot: [ox + lF[2][0], oy + lF[2][1]], head: hc };
}

// --- Ballon ------------------------------------------------------------------
function drawBall(c, n) {
  c.clearRect(0, 0, n, n);
  const r = n / 2 - 5;
  const cx = n / 2, cy = n / 2;
  c.save();
  c.beginPath();
  c.arc(cx, cy, r, 0, Math.PI * 2);
  c.fillStyle = '#ffffff';
  c.fill();
  c.clip();
  const pent = (x, y, R, rot) => {
    c.beginPath();
    for (let i = 0; i < 5; i++) {
      const a = rot + (i * 2 * Math.PI) / 5;
      c.lineTo(x + Math.cos(a) * R, y + Math.sin(a) * R);
    }
    c.closePath();
    c.fillStyle = '#1b1822';
    c.fill();
  };
  pent(cx, cy, r * 0.34, -Math.PI / 2);
  for (let i = 0; i < 5; i++) {
    const a = -Math.PI / 2 + (i * 2 * Math.PI) / 5 + Math.PI / 5;
    pent(cx + Math.cos(a) * r * 0.95, cy + Math.sin(a) * r * 0.95, r * 0.3, a + Math.PI);
    c.strokeStyle = '#1b1822';
    c.lineWidth = 3;
    c.beginPath();
    c.moveTo(cx + Math.cos(a - Math.PI / 5) * r * 0.31, cy + Math.sin(a - Math.PI / 5) * r * 0.31);
    c.lineTo(cx + Math.cos(a - Math.PI / 5) * r * 0.66, cy + Math.sin(a - Math.PI / 5) * r * 0.66);
    c.stroke();
  }
  // ombrage
  const g = c.createRadialGradient(cx - r * 0.35, cy - r * 0.35, r * 0.1, cx, cy, r);
  g.addColorStop(0, 'rgba(255,255,255,0)');
  g.addColorStop(1, 'rgba(60,60,110,0.38)');
  c.fillStyle = g;
  c.fillRect(0, 0, n, n);
  c.restore();
  c.beginPath();
  c.arc(cx, cy, r, 0, Math.PI * 2);
  c.strokeStyle = INK;
  c.lineWidth = 7;
  c.stroke();
}

// --- Vague d'énergie (poussée) ----------------------------------------------------
function drawWave(c, W, H) {
  c.clearRect(0, 0, W, H);
  const cy = H / 2;
  const layers = [
    [1.0, 'rgba(30,170,255,0.45)'],
    [0.76, 'rgba(110,225,255,0.8)'],
    [0.48, '#e2fcff'],
    [0.22, '#ffffff'],
  ];
  layers.forEach(([k, col]) => {
    c.beginPath();
    for (let x = 0; x <= W; x += 6) {
      const taper = Math.min(1, x / 90);
      const hh = (H / 2) * k * taper * (0.78 + 0.22 * Math.sin(x / 31 + k * 4));
      if (x === 0) c.moveTo(x, cy - hh);
      else c.lineTo(x, cy - hh);
    }
    for (let x = W; x >= 0; x -= 6) {
      const taper = Math.min(1, x / 90);
      const hh = (H / 2) * k * taper * (0.78 + 0.22 * Math.sin(x / 27 + k * 3));
      c.lineTo(x, cy + hh);
    }
    c.closePath();
    c.fillStyle = col;
    c.fill();
  });
  // arcs d'énergie
  c.strokeStyle = 'rgba(255,255,255,0.85)';
  c.lineWidth = 4;
  for (let i = 0; i < 9; i++) {
    const x = 90 + i * 90;
    c.beginPath();
    c.ellipse(x, cy, 22, (H / 2) * 0.8, 0, -1.2, 1.2);
    c.stroke();
  }
}

// --- Code pénal (livre) -------------------------------------------------------------

// --- Fonds ------------------------------------------------------------------------
function drawGradBg(c, W, H, stops) {
  const g = c.createLinearGradient(0, 0, 0, H);
  stops.forEach(([p, col]) => g.addColorStop(p, col));
  c.fillStyle = g;
  c.fillRect(0, 0, W, H);
}

function drawHalftone(c, n) {
  c.clearRect(0, 0, n, n);
  c.fillStyle = '#ffffff';
  c.beginPath();
  c.arc(n / 2, n / 2, n * 0.26, 0, Math.PI * 2);
  c.fill();
  c.beginPath();
  c.arc(0, 0, n * 0.26, 0, Math.PI * 2);
  c.arc(n, 0, n * 0.26, 0, Math.PI * 2);
  c.arc(0, n, n * 0.26, 0, Math.PI * 2);
  c.arc(n, n, n * 0.26, 0, Math.PI * 2);
  c.fill();
}

const SAVE_KEY = 'brawl_campaign_v1';
function campSave() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify({ hero: camp.hero, ch: camp.ch })); } catch (e) {}
}
function campLoad() {
  try {
    const s = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null');
    if (s && playable().includes(s.hero) && s.ch >= 0 && s.ch < 6) return s;
  } catch (e) {}
  return null;
}
function campClear() {
  try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
}

function campOpp(hero, ch) {
  const others = playable().filter((x) => x !== hero);
  return ch < 5 ? others[ch] : hero;
}
function campChapterLines(ch) {
  const hero = camp.hero;
  const opp = campOpp(hero, ch);
  const key = ch < 5 ? opp : 'ombre';
  const title = ch < 5 ? `CHAPITRE ${ch + 1} : ${CHARS[opp].name}` : 'CHAPITRE FINAL : L\'OMBRE';
  const lines = [['title', title], ...STORY.intro[key]];
  return ch === 0 ? [...STORY.prologue, ...lines] : lines;
}

Object.assign(GameScene.prototype, {
  // ----- Menu principal ---------------------------------------------------
  menuButtons(list, y0) {
    const D = 120;
    this.uiBtns = [];
    const bw = Math.min(this.W - 80, 520), bh = L.portrait ? 84 : 70, gap = 22;
    list.forEach((b, i) => {
      const y = y0 + i * (bh + gap);
      const r = this.add.rectangle(this.W / 2, y, bw, bh, 0x1a1d33, 1).setStrokeStyle(4, b.col || 0xf72585).setDepth(D);
      const t = this.add.text(this.W / 2, y, b.label, { fontFamily: FONT, fontSize: L.portrait ? '20px' : '18px', color: '#ffffff', stroke: '#000', strokeThickness: 5, align: 'center' }).setOrigin(0.5).setDepth(D + 1);
      this.ui.push(r, t);
      this.uiBtns.push({ x: this.W / 2, y, w: bw, h: bh, fn: b.fn });
    });
  },

  menuBase(title, opts) {
    opts = opts || {};
    if (typeof MUSIC !== 'undefined') MUSIC.play('menu');
    this.clearUi();
    this.state = 'menu';
    this.barBtn = null;
    const small = !!opts.small;
    this.ui.push(
      this.add.rectangle(this.W / 2, this.H / 2, this.W, this.H, 0x0b0d1f, 0.88).setDepth(100),
      this.add.text(this.W / 2, small ? 100 : this.H * (L.portrait ? 0.14 : 0.21), title, { fontFamily: FONT, fontSize: small ? '36px' : L.portrait ? '44px' : '48px', color: '#ffffff', stroke: '#f72585', strokeThickness: small ? 8 : 10, align: 'center', lineSpacing: 10 }).setOrigin(0.5).setDepth(101)
    );
    if (typeof ONLINE_OK !== 'undefined' && ONLINE_OK && !opts.noBar && Auth.name) this.drawBar();
  },

  // encart pseudo en haut : un toucher ouvre le profil
  drawBar() {
    const p = Auth.profile;
    let txt = Auth.name.toUpperCase().slice(0, 16);
    txt += Auth.session ? (p ? `  -  ${p.rating} PTS` : '') : '  (INVITÉ)';
    const w = Math.min(Math.max(300, txt.length * 20 + 80), this.W - 40), h = 46, x = this.W / 2, y = 32;
    this.ui.push(
      this.add.rectangle(x, y, w, h, 0x1a1d33, 1).setStrokeStyle(3, 0xffe9a8).setDepth(130),
      this.add.text(x, y, txt + '  >', { fontFamily: FONT, fontSize: '15px', color: '#ffe9a8', stroke: '#000', strokeThickness: 4 }).setOrigin(0.5).setDepth(131)
    );
    this.barBtn = { x, y, w, h, fn: () => this.showProfile() };
  },

  showMenu() {
    this.menuBase('BRAWL\nPROTO');
    const y0 = this.H * (L.portrait ? 0.38 : 0.5);
    this.menuButtons(
      [
        { label: 'JOUER', fn: () => this.showPlayMenu() },
        { label: 'CAMPAGNE', col: 0x4cc9f0, fn: () => this.showCampMenu() },
        { label: 'RÉGLAGES', col: 0xffb703, fn: () => this.showSettings() },
        { label: 'COMMENT JOUER', col: 0x6ee7b7, fn: () => this.showHelp() },
      ],
      y0
    );
  },

  showHelp() {
    this.menuBase('COMMENT\nJOUER');
    this.ui.push(
      this.add
        .text(this.W / 2, this.H * (L.portrait ? 0.3 : 0.315), HELP_TXT + (window.matchMedia && matchMedia('(pointer: fine)').matches ? '\n\n' + HELP_KB : ''), { fontFamily: FONT, fontSize: L.portrait ? '18px' : '13px', color: '#cfd3ff', align: 'center', lineSpacing: 7 })
        .setOrigin(0.5, 0)
        .setDepth(101)
    );
    this.menuButtons([{ label: 'RETOUR', col: 0x888888, fn: () => this.showMenu() }], this.H * (L.portrait ? 0.86 : 0.9));
  },

  showPlayMenu() {
    this.menuBase('JOUER');
    const list = [{ label: 'VS BOT', fn: () => { campPick = false; camp = null; trainingMode = false; this.training = false; this.showStagePick(() => this.showSelect()); } }];
    if (typeof ONLINE_OK !== 'undefined' && ONLINE_OK)
      list.push({ label: 'EN LIGNE', col: 0xffb703, fn: async () => { if (await Auth.ensure()) setTimeout(goOnline, 0); } });
    list.push({ label: 'ENTRAÎNEMENT', col: 0x6ee7b7, fn: () => { campPick = false; camp = null; trainingMode = true; this.training = true; this.showStagePick(() => this.showSelect()); } });
    list.push({ label: 'RETOUR', col: 0x888888, fn: () => this.showMenu() });
    this.menuButtons(list, this.H * (L.portrait ? 0.38 : 0.5));
  },

  showCampMenu() {
    const save = campLoad();
    if (!save) {
      campPick = true;
      this.showSelect();
      return;
    }
    this.menuBase('CAMPAGNE');
    const y0 = this.H * (L.portrait ? 0.36 : 0.46);
    this.menuButtons(
      [
        { label: `CONTINUER\n${CHARS[save.hero].name} - CHAP. ${save.ch + 1}/6`, fn: () => this.campResume(save) },

        { label: 'RETOUR', col: 0x888888, fn: () => this.showMenu() },

      y0
    );

  uiTap(p) {
    if (this.state === 'story' && this.storyTap) {
      this.storyTap();
      return;

    if (SETTINGS.sound) SFX.play('ui');
    const bb = this.barBtn;
    if (bb && Math.abs(p.x - bb.x) <= bb.w / 2 && Math.abs(p.y - bb.y) <= bb.h / 2) {
      bb.fn();
      return;
    }
    for (const b of this.uiBtns || []) {
      if (Math.abs(p.x - b.x) <= b.w / 2 && Math.abs(p.y - b.y) <= b.h / 2) {
        b.fn();
        return;
      }
    }
  },

  // ----- Déroulement de la campagne ----------------------------------------
  campNew(hero) {
    campPick = false;
    camp = { hero, ch: 0 };
    campSave();
    this.campChapter();
  },

  campResume(save) {
    camp = { hero: save.hero, ch: save.ch };
    campPick = false;
    this.campChapter(true);
  },

  campChapter(skipPrologue) {
    camp.phase = 'story';
    camp.after = 'match';
    camp.opp = campOpp(camp.hero, camp.ch);
    let lines = campChapterLines(camp.ch);
    if (skipPrologue && camp.ch === 0) lines = lines.slice(STORY.prologue.length);
    camp.lines = lines;
    chosen = camp.hero;
    goSelect = false;
    this.scene.restart();
  },

  campEnter() {
    const c = camp;
    this.setControls(false);
    if (c.phase === 'story') {
      this.state = 'story';
      this.campStory();
    } else if (c.phase === 'match') {
      this.setControls(true);
      this.state = 'play';
      chosen = c.hero;
      this.forceBot = c.opp;
      this.beginMatch(c.hero);
      this.campApply();
    } else if (c.phase === 'lost') {
      this.showCampLost();
    }
  },

  campApply() {
    const d = CAMP_DIFF[camp.ch];
    const e = this.p2;
    e.stocks = d.stocks;
    e.aggr = d.aggr;
    e.lvl = d.lvl;
    if (d.dmg) e.dmgMul = d.dmg;
    if (camp.ch === 5) {
      e.shade = 0x7c6bd6;
      e.tag.setText('OMBRE');
      e.hud.name.setText('OMBRE');
    }
    this.add
      .text(this.W / 2, 78, camp.ch === 5 ? 'CHAPITRE FINAL' : `CHAPITRE ${camp.ch + 1}/6`, { fontFamily: FONT, fontSize: '14px', color: '#ffe9a8', stroke: '#000', strokeThickness: 4 })
      .setOrigin(0.5)
      .setDepth(50);
  },

  campFinish(won) {
    const c = camp;
    let fired = false;
    const go = () => {
      if (fired) return;
      fired = true;
      this.campSkip = null;
      if (won) {
        c.phase = 'story';
        const key = c.ch < 5 ? c.opp : null;
        c.lines = key ? STORY.outro[key] : STORY.epilogue;
        c.after = key ? 'advance' : 'quit';
      } else c.phase = 'lost';
      if (won && c.ch === 5) campClear();
      this.scene.restart();
    };
    this.campSkip = go;
    this.sub.setText(won ? 'TOUCHE POUR CONTINUER' : '');
    this.time.delayedCall(won ? 3500 : 2200, go);
  },

  showCampLost() {
    this.state = 'menu';
    this.ui.push(this.add.rectangle(this.W / 2, this.H / 2, this.W, this.H, 0x0b0d1f, 0.92).setDepth(100));
    this.ui.push(this.add.text(this.W / 2, this.H * 0.2, 'DÉFAITE...', { fontFamily: FONT, fontSize: '44px', color: '#ff5a6e', stroke: '#000', strokeThickness: 8 }).setOrigin(0.5).setDepth(101));
    this.menuButtons(
      [
        { label: 'RÉESSAYER', fn: () => { camp.phase = 'match'; this.scene.restart(); } },
        { label: 'MENU PRINCIPAL', col: 0x888888, fn: () => { camp = null; chosen = null; goSelect = false; this.scene.restart(); } },
      ],
      this.H * (L.portrait ? 0.4 : 0.5)
    );
  },

  // ----- Dialogues ---------------------------------------------------------
  setControls(v) {
    (this.ctrlObjs || []).forEach((o) => o.setVisible(v));
  },

  campStory() {
    const c = camp;
    const D = 110;
    const W = this.W, H = this.H;
    const lines = c.lines.slice();
    const heroName = CHARS[c.hero].name;
    const oppId = c.opp;
    const gy = L.baseY - 34;

    // les deux personnages sur la scène
    const hs = this.add.image(W / 2 - 150, gy, `${c.hero}_idle0`).setScale(PX).setDepth(10);
    const os = this.add.image(W / 2 + 150, gy, `${oppId}_idle0`).setScale(PX).setDepth(10).setFlipX(true);
    if (c.ch === 5) os.setTint(0x7c6bd6);
    this.ui.push(hs, os);
    this.tweens.add({ targets: [hs, os], y: gy + 3, duration: 450, yoyo: true, repeat: -1 });

    const ph = L.portrait ? 270 : 190;
    const py = H - ph / 2 - 16;
    this.ui.push(this.add.rectangle(W / 2, py, W - 32, ph, 0x0b0d1f, 0.94).setStrokeStyle(4, 0xffffff, 0.8).setDepth(D));
    const fs = L.portrait ? 20 : 17;
    const name = this.add.text(32 + 18, py - ph / 2 + 16, '', { fontFamily: FONT, fontSize: fs + 2 + 'px', color: '#fff', stroke: '#000', strokeThickness: 5 }).setDepth(D + 1);
    const body = this.add
      .text(32 + 18, py - ph / 2 + 16 + fs + 20, '', { fontFamily: FONT, fontSize: fs + 'px', color: '#ffffff', lineSpacing: 10, wordWrap: { width: W - 100 } })
      .setDepth(D + 1);
    const more = this.add.text(W - 52, py + ph / 2 - 22, '▼', { fontFamily: FONT, fontSize: '18px', color: '#ffe9a8' }).setOrigin(0.5).setDepth(D + 1);
    this.tweens.add({ targets: more, alpha: 0.2, duration: 450, yoyo: true, repeat: -1 });
    this.ui.push(name, body, more);

    let cur = null, typing = null, full = '';
    const finish = () => {
      if (typing) typing.remove();
      typing = null;
      body.setText(full);
      more.setVisible(true);
    };
    const next = () => {
      const ln = lines.shift();
      if (!ln) {
        this.storyTap = null;
        const a = c.after;
        if (a === 'match') c.phase = 'match';
        else if (a === 'advance') {
          c.ch++;
          campSave();
          c.opp = campOpp(c.hero, c.ch);
          c.phase = 'story';
          c.after = 'match';
          c.lines = campChapterLines(c.ch);
        } else {
          camp = null;
          chosen = null;
          goSelect = false;
        }
        this.scene.restart();
        return;
      }
      const [who, raw] = ln;
      if (who === 'title') {
        // carte de chapitre
        name.setText('');
        full = raw;
        body.setText('').setFontSize(fs + 6);
        body.setColor('#ffe9a8');
      } else {
        body.setFontSize(fs).setColor('#ffffff');
        let spk = SPEAKER[who];
        if (who === 'hero') spk = { n: heroName, c: '#ffe9a8' };
        else if (!spk) spk = { n: CHARS[who].name, c: CHARS[who].roleCol };
        name.setText(spk.n).setColor(spk.c);
        full = raw;
        body.setText('');
        const isHero = who === 'hero';
        hs.setAlpha(who === 'nar' || isHero ? 1 : 0.55);
        os.setAlpha(who === 'nar' || (!isHero && who !== 'nar') ? 1 : 0.55);
      }
      more.setVisible(false);
      let i = 0;
      typing = this.time.addEvent({
        delay: 26,
        loop: true,
        callback: () => {
          i++;
          body.setText(full.slice(0, i));
          if (i >= full.length) finish();
        },
      });
    };
    this.storyTap = () => (typing ? finish() : next());
    next();
  },
});

// ===========================================================================
// NETCODE : rollback (type GGPO) pour les combats en ligne (duel 1v1, salons jusqu'à 4 joueurs)
//  - snapshot()/restore() : état complet du combat, restauré à l'identique
//  - netStep() : prédit l'adversaire, corrige et rejoue les images quand son vrai input arrive
//  - pendant un rejeu, aucun effet visuel (sinon on verrait chaque coup en double)
// ===========================================================================
const NET_DELAY = 2; // images de retard volontaire sur MES commandes (≈ 33 ms) : rend les prédictions presque toujours justes
const NET_MAX_PRED = 9; // on attend l'adversaire au-delà de 9 images prédites (≈ 150 ms)
const NET_KEEP = 40;

// Objet « neutre » : accepte n'importe quel appel et ne dessine rien (utilisé pendant les rejeux)
const NULLOBJ = new Proxy(function () {}, {
  get: (t, k) => (k === Symbol.toPrimitive ? () => 0 : k === 'then' ? undefined : NULLOBJ),
  apply: () => NULLOBJ,
  set: () => true,
});

// Etat d'un joueur : tous ses champs simples (nombres, booléens, textes) sont sauvegardés, sauf ceux-ci
const P_SKIP = new Set(['char', 'def', 'sprite', 'tag', 'human', 'hud', 'umb', 'chgBg', 'chgFg', 'chgRing', 'carryImg', 'atk', 'grab', 'moveCd', 'i', 'shade', 'lvl', 'aggr', 'dmgMul', 'spdMul', 'flashUntil', 'lastHeart', 'lastAura', 'charmFx', 'catImg', 'flashCol', 'lastPuff', 'markImg', 'heatFx', 'goldFx']);
const plainVal = (v) => v === null || typeof v === 'number' || typeof v === 'boolean' || typeof v === 'string';

// --- entrées : 1 entier par image (sx, sy sur 8 bits, + 4 boutons) -> identique des deux côtés
function packInput(i) {
  const q = (v) => Math.max(-127, Math.min(127, Math.round(v * 127))) + 127;
  return q(i.sx || 0) | (q(i.sy || 0) << 8) | (i.jump ? 1 << 16 : 0) | (i.attack ? 1 << 17 : 0) | (i.hold ? 1 << 18 : 0) | (i.block ? 1 << 19 : 0) | (i.heavy ? 1 << 20 : 0) | (i.special ? 1 << 21 : 0) | (i.shold ? 1 << 22 : 0);
}
function unpackInput(v) {
  return { sx: ((v & 255) - 127) / 127, sy: (((v >> 8) & 255) - 127) / 127, jump: !!(v & (1 << 16)), attack: !!(v & (1 << 17)), hold: !!(v & (1 << 18)), block: !!(v & (1 << 19)), heavy: !!(v & (1 << 20)), special: !!(v & (1 << 21)), shold: !!(v & (1 << 22)) };
}
const NEUTRAL_IN = packInput({});
// entrée spéciale « ce joueur a quitté la partie » (à plusieurs) : il est éliminé à cette image chez tout le monde
const LEFT_IN = 1 << 30;
// pour prédire : on garde la direction et les boutons maintenus, jamais les « appuis » ponctuels
const predictFrom = (v) => v & ~((1 << 16) | (1 << 17) | (1 << 20) | (1 << 21));

function hashStr(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) {
    h ^= s.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}

Object.assign(GameScene.prototype, {
  // ----- Etat ------------------------------------------------------------
  snapshot() {
    const pls = this.pls.map((pl) => {
      const b = pl.sprite.body;
      const o = {
        sx: pl.sprite.x, sy: pl.sprite.y,
        px: b.position.x, py: b.position.y, ppx: b.prev.x, ppy: b.prev.y, pfx: b.prevFrame.x, pfy: b.prevFrame.y,
        vx: b.velocity.x, vy: b.velocity.y, g: b.allowGravity ? 1 : 0,
        bd: b.blocked.down ? 1 : 0, bu: b.blocked.up ? 1 : 0, td: b.touching.down ? 1 : 0, tn: b.touching.none ? 1 : 0,
        atk: pl.atk ? JSON.parse(JSON.stringify(pl.atk)) : null,
        grab: pl.grab ? { v: pl.grab.victim.i, start: pl.grab.start, slamAt: pl.grab.slamAt, spec: pl.grab.spec } : null,
        moveCd: { ...pl.moveCd },
        f: {},
      };
      for (const k in pl) if (!P_SKIP.has(k) && plainVal(pl[k])) o.f[k] = pl[k];
      return o;
    });
    const projs = this.projs
      .filter((p) => !p.dead)
      .map((p) => ({
        id: p.id, o: p.owner.i, t: p.target.i, spec: p.spec, x: p.x, y: p.y, vx: p.vx, vy: p.vy, born: p.born, armedAt: p.armedAt, lastTrail: p.lastTrail, f: p.f,
        spent: !!p.spent, bounced: !!p.bounced, back: !!p.back, carry: p.carry ? { ...p.carry } : null, hits: p.hits ? [...p.hits].map((q) => q.i) : null,
      }));
    return JSON.stringify({ pls, projs, timers: this.timers, frame: this.frame, simFrames: this.simFrames, freeze: this.freezeLeft, atkSeq: this.atkSeq, projSeq: this.projSeq, sudden: !!this.sudden });
  },

  restore(str) {
    const S = JSON.parse(str);
    this.pls.forEach((pl, i) => {
      const o = S.pls[i];
      const s = pl.sprite, b = s.body;
      b.stop();
      s.setPosition(o.sx, o.sy);
      b.position.set(o.px, o.py);
      b.prev.set(o.ppx, o.ppy);
      b.prevFrame.set(o.pfx, o.pfy);
      b.updateCenter();
      b.velocity.set(o.vx, o.vy);
      b.allowGravity = !!o.g;
      b.blocked.down = !!o.bd; b.blocked.up = !!o.bu; b.touching.down = !!o.td; b.touching.none = !!o.tn;
      for (const k in pl) if (!P_SKIP.has(k) && plainVal(pl[k]) && !(k in o.f)) pl[k] = undefined;
      Object.assign(pl, o.f);
      pl.atk = o.atk;
      pl.moveCd = { ...o.moveCd };
      pl.grab = o.grab ? { victim: this.pl(o.grab.v), start: o.grab.start, slamAt: o.grab.slamAt, spec: o.grab.spec } : null;
      s.setFlipX(pl.facing < 0);
      if (!pl.grab) s.setAngle(0);
      // à plusieurs : un joueur éliminé n'a plus de corps (il peut revenir si le rejeu remonte avant son élimination)
      if (this.pls.length > 2) {
        b.enable = pl.stocks > 0;
        pl.tag.setVisible(pl.stocks > 0);
      }
    });
    // projectiles : on garde les sprites existants, on recrée ceux qui manquent
    const live = new Map(this.projs.map((p) => [p.id, p]));
    const keep = new Set();
    this.projs = S.projs.map((d) => {
      let p = live.get(d.id);
      keep.add(d.id);
      const owner = this.pl(d.o), target = this.pl(d.t);
      const fields = { owner, target, spec: d.spec, x: d.x, y: d.y, vx: d.vx, vy: d.vy, born: d.born, armedAt: d.armedAt, lastTrail: d.lastTrail, f: d.f, spent: d.spent, bounced: d.bounced, back: d.back, carry: d.carry, dead: false, hits: d.hits ? new Set(d.hits.map((j) => this.pl(j))) : null };
      if (!p) {
        p = { id: d.id, ...fields, sprite: null };
        p.sprite = this.makeProjSprite(p);
      } else {
        Object.assign(p, fields);
        // son image a pu être effacée entre-temps (projectile détruit puis ressuscité par le rejeu)
        if (p.sprite !== NULLOBJ && (!p.sprite || !p.sprite.active)) p.sprite = this.makeProjSprite(p);
      }
      return p;
    });
    live.forEach((p, id) => {
      if (!keep.has(id) && p.sprite && p.sprite !== NULLOBJ) p.sprite.destroy();
    });
    this.timers = S.timers;
    this.frame = S.frame;
    this.simFrames = S.simFrames;
    this.simNow = S.simFrames * STEP_MS;
    this.nowT = this.simNow;
    this.freezeLeft = S.freeze;
    this.atkSeq = S.atkSeq;
    this.projSeq = S.projSeq;
    this.sudden = !!S.sudden;
  },

  makeProjSprite(p) {
    const sp = p.spec;
    const img = this.add.image(p.x, p.y, sp.tex).setScale(sp.s || 3).setDepth(sp.kind === 'mine' ? 8 : 24);
    if (img === NULLOBJ) return NULLOBJ;
    if (sp.kind === 'hook') img.setAngle(p.f * 90);
    else if (sp.kind === 'eagle') img.setAngle(-90).setDepth(27);
    else if (sp.kind === 'ball') img.setDepth(25);
    else if (sp.kind === 'hermine' || sp.kind === 'wall') img.setOrigin(0.5, 1).setScale(sp.s, sp.s);
    else if (sp.kind === 'corgi') img.setFlipX(p.f < 0);
    else if (sp.kind === 'book') img.setDepth(26).setAngle(-12);
    else if (sp.kind === 'decoy') img.setDepth(9).setTint(0x5fbf5a).setFlipX(p.f < 0);
    return img;
  },

  // ----- Équipes : vêtements à la couleur de l'équipe ----------------------
  paintTeam(pl, col) {
    const tc = TEAM_COLS[col] || TEAM_COLS[0];
    pl.teamCol = col;
    pl.teamCss = tc.css;
    pl.tex = this.teamTex(pl.char, col);
    pl.tag.setColor(tc.css);
  },

  // planche du perso recolorée : les couleurs des vêtements (listées par export.py) prennent les tons de l'équipe
  teamTex(id, col) {
    const png = typeof PNG_CHARS !== 'undefined' && PNG_CHARS[id];
    const img = typeof PNG_IMG !== 'undefined' && PNG_IMG[id];
    if (!png || !img || !png.cloth) return null;
    const prefix = `${id}~${col}`;
    if (this.textures.exists(`${prefix}_idle0`)) return prefix;
    const cv = document.createElement('canvas');
    cv.width = img.width;
    cv.height = img.height;
    const c = cv.getContext('2d');
    c.drawImage(img, 0, 0);
    const d = c.getImageData(0, 0, cv.width, cv.height);
    const hex = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
    const ramp = (TEAM_COLS[col] || TEAM_COLS[0]).ramp.map(hex);
    const map = new Map();
    png.cloth.forEach(([tones, far]) =>
      tones.forEach((h, j) => {
        const k = Math.max(0, Math.min(3, Math.round((j * 3) / Math.max(tones.length - 1, 1)) - (far ? 1 : 0)));
        const [r, g, b] = hex(h);
        map.set((r << 16) | (g << 8) | b, ramp[k]);
      })
    );
    const px = d.data;
    for (let i = 0; i < px.length; i += 4) {
      if (!px[i + 3]) continue;
      const t = map.get((px[i] << 16) | (px[i + 1] << 8) | px[i + 2]);
      if (t) { px[i] = t[0]; px[i + 1] = t[1]; px[i + 2] = t[2]; }
    }
    c.putImageData(d, 0, 0);
    // une texture par posture (mêmes noms que les originales ; absente de la planche = garde)
    this.textures.getTextureKeys().filter((k) => k.startsWith(id + '_')).forEach((key) => {
      const name = key.slice(id.length + 1);
      const fi = png.names.indexOf(name) >= 0 ? png.names.indexOf(name) : png.names.indexOf('idle0' + (VARIANTS.find((v) => name.endsWith(v)) || ''));
      mkCanvas(this, `${prefix}_${name}`, png.w, png.h, (c2) => c2.drawImage(cv, fi * png.w, 0, png.w, png.h, 0, 0, png.w, png.h), 'raw');
      TEXSCALE[`${prefix}_${name}`] = TEXSCALE[key];
    });
    return prefix;
  },

  // ----- Rejeu silencieux --------------------------------------------------
  beginResim() {
    if (this.resim) return;
    this.resim = true;
    this._real = { add: this.add, tweens: this.tweens, time: this.time, cameras: this.cameras };
    this.add = NULLOBJ;
    this.tweens = NULLOBJ;
    this.time = NULLOBJ;
    this.cameras = NULLOBJ;
  },
  endResim() {
    if (!this.resim) return;
    Object.assign(this, this._real);
    this.resim = false;
    this.projs.forEach((p) => {
      if (p.sprite === NULLOBJ) p.sprite = this.makeProjSprite(p);
    });
  },

  // ----- Match en ligne ------------------------------------------------------
  // cfg : { me, chars: [...], names, mode: 'ffa'|'team', teams: [...], tcols: [c0, c1], send(msg) }
  beginNetMatch(cfg) {
    this.clearUi();
    this.state = 'play';
    this.setControls && this.setControls(true);
    const N = cfg.chars.length;
    // départs : face au centre
    const XS = N === 2 ? [-150, 150] : N === 3 ? [-230, 230, 0] : [-250, 250, -90, 90];
    this.pls = cfg.chars.map((c, i) => {
      const sp = this.spawnAt(this.W / 2 + XS[i]);
      const pl = this.makePlayer(c, sp.x, sp.y, cfg.me === i);
      pl.i = i;
      pl.facing = XS[i] <= 0 ? 1 : -1;
      pl.name = String((cfg.names && cfg.names[i]) || '').toUpperCase().slice(0, 12);
      pl.team = cfg.mode === 'team' && cfg.teams ? cfg.teams[i] : i;
      if (cfg.mode === 'team' && cfg.tcols) this.paintTeam(pl, cfg.tcols[pl.team]);
      return pl;
    });
    this.p1 = this.pls[0];
    this.p2 = this.pls[1];
    if (cfg.names) this.pls.forEach((pl) => pl.tag.setText(pl.name));
    this.projSeq = 0;
    this.timeLimit = MATCH_MS;
    this.sudden = false;
    this.buildHud();
    const D = NET_DELAY;
    this.net = {
      me: cfg.me, send: cfg.send, rtt: cfg.rtt || (() => 0), remoteMax: this.pls.map(() => -1), lastSkip: 0,
      inputs: this.pls.map(() => ({})), // inputs[joueur][image] = entier
      used: {}, snaps: {}, verified: -1, lastRemote: this.pls.map(() => NEUTRAL_IN), gone: {},
      hashes: { mine: {}, theirs: {} }, desync: false, stalled: 0, rollbacks: 0, maxRoll: 0,
    };
    for (let f = 0; f < D; f++) this.net.inputs.forEach((a) => (a[f] = NEUTRAL_IN)); // images 0..D-1 : neutre pour tous
    // les gestes de pistolet/charge utilisent le hasard des bots : jamais en ligne
    this.autoP1 = false;
    this.curIn = this.pls.map(() => NEUTRAL_IN);
    this.netInput = (i) => unpackInput(this.curIn[i]);
    this.snapAt = {};
  },

  // les autres joueurs de la partie
  netRemotes() {
    const n = this.net;
    return this.pls.map((_, i) => i).filter((i) => i !== n.me);
  },

  // entrée connue d'un joueur pour une image (undefined = pas encore reçue)
  netIn(r, f) {
    const n = this.net;
    if (n.gone[r] !== undefined && f > n.gone[r]) return LEFT_IN;
    return n.inputs[r][f];
  },

  // un joueur est parti (salon à plusieurs) : à partir de l'image qui suit sa dernière entrée, il est éliminé
  netGone(r, last) {
    const n = this.net;
    if (!n || r === n.me || n.gone[r] !== undefined) return;
    n.gone[r] = last;
  },

  netReceive(msg) {
    const n = this.net;
    if (!n) return;
    const r = msg.p !== undefined ? msg.p : 1 - n.me;
    if (r === n.me || r < 0 || r >= this.pls.length) return;
    if (msg.t === 'in') {
      msg.a.forEach(([f, v]) => {
        if (n.inputs[r][f] === undefined) n.inputs[r][f] = v;
        if (f > n.remoteMax[r]) n.remoteMax[r] = f;
      });
    } else if (msg.t === 'hash') {
      (n.hashes.theirs[msg.f] || (n.hashes.theirs[msg.f] = {}))[r] = msg.h;
      this.netCheckHash(msg.f);
    }
  },

  netCheckHash(f) {
    const n = this.net;
    const a = n.hashes.mine[f], th = n.hashes.theirs[f];
    if (a === undefined || !th) return;
    for (const r in th) {
      if (th[r] !== a && !n.desync) {
        n.desync = true;
        n.send({ t: 'desync', f });
        if (this.onDesync) this.onDesync(f);
      }
    }
    // tout le monde a répondu : on oublie cette image
    const want = this.netRemotes().filter((r) => n.gone[r] === undefined).length;
    if (Object.keys(th).length >= want) {
      delete n.hashes.mine[f];
      delete n.hashes.theirs[f];
    }
  },

  sampleLocal() {
    return packInput(this.localInput());
  },

  netUpdate(delta) {
    const n = this.net;
    this.acc = Math.min((this.acc || 0) + Math.min(delta, 100), STEP_MS * 6);
    while (this.acc >= STEP_MS && !this.over) {
      // trop d'images prédites sans nouvelles de l'adversaire : on patiente
      if (this.frame - n.verified > NET_MAX_PRED) {
        n.stalled++;
        this.netVerify(this.frame);
        if (n.stalled % 3 === 0) {
          // en attente : on renvoie nos dernières entrées (sinon blocage mutuel avec l'envoi à 30 Hz) ;
          // de temps en temps, tout l'historique gardé (utile après une coupure réseau)
          this.netResend(n.stalled % 30 === 0 ? NET_KEEP - 2 : 16);
        }
        break;
      }
      // recalage du rythme : si on est en avance sur l'adversaire, on ralentit d'une image de temps en temps
      const rms = this.netRemotes().filter((r) => n.gone[r] === undefined).map((r) => n.remoteMax[r]);
      const rmin = rms.length ? Math.min(...rms) : -1;
      if (rmin >= 0 && this.frame - n.lastSkip > 20) {
        const remoteNow = rmin - NET_DELAY + Math.round(n.rtt() / 2 / STEP_MS);
        if (this.frame - remoteNow > 2) {
          n.lastSkip = this.frame;
          this.acc -= STEP_MS;
          continue;
        }
      }
      this.acc -= STEP_MS;
      this.netStep();
    }
    this.updateHud();
  },

  netResend(win) {
    const n = this.net;
    if (!n) return;
    const pk = [];
    for (let k = this.frame + NET_DELAY; k > this.frame + NET_DELAY - win && k >= 0; k--) if (n.inputs[n.me][k] !== undefined) pk.push([k, n.inputs[n.me][k]]);
    n.send({ t: 'in', p: n.me, a: pk });
  },

  // vérifie les prédictions contre les vraies commandes reçues (rollback si besoin) + empreintes
  netVerify(f) {
    const n = this.net;
    const rem = this.netRemotes();
    const known = (v) => rem.every((r) => this.netIn(r, v) !== undefined);
    // 2. les autres ont-ils fait autre chose que prévu ?
    let mis = -1;
    let v = n.verified + 1;
    while (v < f && known(v)) {
      if (rem.some((r) => n.used[v][r] !== this.netIn(r, v))) {
        mis = v;
        break;
      }
      v++;
    }
    if (mis < 0) n.verified = v - 1;
    else {
      n.verified = mis - 1;
      this.netRollback(mis, f);
      // on revérifie ce qui vient d'être rejoué
      let w = mis;
      while (w < f && known(w)) w++;
      n.verified = w - 1;
    }
    // 3. empreinte de l'état (images confirmées) pour détecter une désynchronisation
    if (n.verified >= 30 && (n.verified % 30 === 0 || n.lastHashF === undefined)) {
      const F = n.verified - (n.verified % 30);
      if (F > (n.lastHashF || 0) && n.snaps[F]) {
        n.lastHashF = F;
        const h = hashStr(this.stateKey(n.snaps[F]));
        n.hashes.mine[F] = h;
        n.send({ t: 'hash', p: n.me, f: F, h });
        this.netCheckHash(F);
      }
    }
  },

  netStep() {
    const n = this.net;
    const me = n.me;
    const f = this.frame;
    // 1. mes commandes de l'image f+D, envoyées avec les 5 précédentes (redondance)
    n.inputs[me][f + NET_DELAY] = this.sampleLocal();
    const pk = [];
    for (let k = f + NET_DELAY; k > f + NET_DELAY - 6 && k >= 0; k--) if (n.inputs[me][k] !== undefined) pk.push([k, n.inputs[me][k]]);
    if ((f & 1) === 0) n.send({ t: 'in', p: me, a: pk }); // 30 Hz : économise le quota Cloudflare
    this.netVerify(f);
    // 4. on joue l'image f
    this.netPlay(f);
    // ménage
    const old = f - NET_KEEP;
    if (old >= 0) {
      delete n.snaps[old];
      delete n.used[old];
      n.inputs.forEach((a) => delete a[old]);
    }
  },

  netPlay(f) {
    const n = this.net;
    const me = n.me;
    n.snaps[f] = this.snapshot();
    const used = this.pls.map((_, r) => {
      if (r === me) return n.inputs[me][f] !== undefined ? n.inputs[me][f] : NEUTRAL_IN;
      const v = this.netIn(r, f);
      if (v === undefined) return n.lastRemote[r];
      n.lastRemote[r] = predictFrom(v);
      return v;
    });
    n.used[f] = used;
    this.curIn = used;
    this.simTick();
  },

  netRollback(from, to) {
    const n = this.net;
    n.rollbacks++;
    n.maxRoll = Math.max(n.maxRoll, to - from);
    this.restore(n.snaps[from]);
    this.beginResim();
    // la dernière entrée adverse connue AVANT l'image rejouée sert de base de prédiction
    for (let k = from; k < to; k++) this.netPlay(k);
    this.endResim();
  },

  // clé d'état stable (positions arrondies : le bruit de virgule flottante ne compte pas)
  stateKey(snapStr) {
    const S = JSON.parse(snapStr);
    const r = (x) => Math.round(x * 100) / 100;
    return JSON.stringify([S.frame, S.pls.map((o) => [r(o.sx), r(o.sy), r(o.vx), r(o.vy), o.f.damage, o.f.stocks, o.f.rage, o.f.jumps, o.f.ledgeSide, r(o.f.stunUntil)]), S.projs.map((p) => [p.id, r(p.x), r(p.y)])]);
  },
});

// Fenêtres de saisie (HTML par-dessus le jeu : clavier natif sur téléphone)

function domModal(title, fields, buttons, note) {
  return new Promise((resolve) => {
    const old = document.getElementById('dm');
    if (old) old.remove();
    const el = document.createElement('div');
    el.id = 'dm';
    el.innerHTML =
      `<form><h2>${title}</h2>${note ? `<p class="n">${note}</p>` : ''}` +
      fields.map((f) => `<label>${f.label}<input name="${f.name}" type="${f.type || 'text'}" autocapitalize="none" autocorrect="off" spellcheck="false" autocomplete="${f.ac || 'off'}" ${f.max ? `maxlength="${f.max}"` : ''} ${f.upper ? 'style="text-transform:uppercase"' : ''}></label>`).join('') +
      `<p class="e" id="dme"></p><div class="b">${buttons.map((b, i) => `<button type="button" data-i="${i}" class="${b.primary ? 'p' : ''}">${b.label}</button>`).join('')}</div></form>`;
    document.body.appendChild(el);
    const form = el.querySelector('form');
    const close = (v) => {
      el.remove();
      resolve(v);
    };
    el.querySelectorAll('button').forEach((bt) =>
      bt.addEventListener('click', () => {
        const b = buttons[+bt.dataset.i];
        const values = {};
        fields.forEach((f) => (values[f.name] = form.elements[f.name].value.trim()));
        if (b.cancel) return close(null);
        const err = (m) => (document.getElementById('dme').textContent = m || '');
        if (b.run) {
          bt.disabled = true;
          Promise.resolve(b.run(values, err))
            .then((ok) => {
              bt.disabled = false;
              if (ok) close({ button: b.label, values });
            })
            .catch((e) => {
              bt.disabled = false;
              err(String((e && e.message) || e));
            });
        } else close({ button: b.label, values });
      })
    );
    form.addEventListener('submit', (e) => e.preventDefault());
    const first = form.elements[0];
    if (first) setTimeout(() => first.focus(), 50);
  });
}
