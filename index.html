    this.tweens.add({ targets: sh, scaleX: 0.6, scaleY: 0.6, duration: m.warn, ease: 'Sine.easeIn' });
    this.tweens.add({ targets: ex, y: gy - 50, duration: 120, yoyo: true, repeat: 2 });
    this.time.delayedCall(m.warn + 250, () => {
      sh.destroy();
      ex.destroy();
    });
    this.sched(m.warn, 'book', { pi: pl.i, tx });
  }

  bookLand(pl, tgt, d, now) {
    const sp = pl.def.moves.down.book;
    if (this.over || pl.stocks <= 0 || !sp) return;
    const x = d.tx;
    const y = L.baseY - 40 + sp.oy;
    const img = this.add.image(x, y, sp.tex).setScale(sp.s).setDepth(26).setAngle(-12);
    this.projs.push({ id: ++this.projSeq, owner: pl, target: tgt, spec: sp, x, y, vx: 0, vy: sp.vy, born: now, armedAt: 0, lastTrail: 0, sprite: img, dead: false, f: pl.facing, label: null });
  }

  hitstop(ms) {
    this.freezeLeft = Math.max(this.freezeLeft, Math.round(ms / STEP_MS));
  }

  // Le coup est-il absorbé par la garde ? (les prises et l'aigle passent à travers)
  // ---- Dégâts --------------------------------------------------------------
  counterHit(lulu, att, spec, now) {
    const a = lulu.atk;
    a.cTo = 0;
    a.end = now + 250;
    lulu.cdUntil = a.end;
    lulu.invulnUntil = Math.max(lulu.invulnUntil, now + 300);
    const c = lulu.sprite.body.center;
    this.popup(c.x, c.y - 90, 'OBJECTION !', '#ffd166');
    const r = this.add.image(c.x, c.y, 'ring').setTint(0xffd166).setDepth(31).setScale(1);
    this.tweens.add({ targets: r, scale: 6, alpha: 0, duration: 320, onComplete: () => r.destroy() });
    this.hitstop(160);
    this.sfx('parry');
    const ac = att.sprite.body.center;
    if (Math.abs(ac.x - c.x) < 230 && Math.abs(ac.y - c.y) < 170 && now >= att.invulnUntil) {
      const cs = { dmg: Math.max(6, Math.round(spec.dmg * a.m.mul)), kb: 300, ks: 7, ang: -0.45, stun: 220 };
      this.applyHit(lulu, att, cs, now, Math.sign(ac.x - c.x) || lulu.facing, null, undefined, true);
    }
  }

  applyHit(att, vic, spec, now, dirSign, hitPos, rem, noCounter) {
    if (this.over) return;
    if (att.dmgMul) spec = { ...spec, dmg: spec.dmg * att.dmgMul };
    if (now < att.rageUntil) spec = { ...spec, dmg: spec.dmg * RAGE_DMG };
    // OBJECTION ! : la parade de Lulu annule le coup et riposte
    if (!noCounter && vic.atk && vic.atk.m.type === 'counter' && now >= vic.atk.cFrom && now <= vic.atk.cTo) return this.counterHit(vic, att, spec, now);
    // CONTRÔLE : AdieuLescure attrape l'attaquant et le projette
    if (!noCounter && vic.atk && vic.atk.m.type === 'catch' && now >= vic.atk.cFrom && now <= vic.atk.cTo) return this.catchMelee(vic, att, spec, now);
    // armure : on encaisse les dégâts sans être interrompu
    if (now < vic.armorUntil && spec.dmg <= (vic.armorMax || 0) && !this.sudden) {
      vic.damage += spec.dmg;
      this.gainRage(vic, spec.dmg, now);
      vic.flashUntil = now + 90;
      vic.flashCol = 0xffd166;
      vic.sprite.setTintFill(0xffd166);
      const c = vic.sprite.body.center;
      this.popup(c.x, c.y - 80, 'ARMURE', '#ffd166');
      this.hitstop(50);
      this.sfx('armor');
      return;
    }
    if (vic.grab) this.releaseGrab(vic);
    if (vic.ledgeSide) {
      vic.ledgeSide = 0;
      vic.sprite.body.allowGravity = true;
    }
    vic.charmUntil = 0;
    this.gainRage(vic, spec.dmg, now);
    vic.damage += spec.dmg;
    const power = (spec.kb * KB_BASE + vic.damage * spec.ks * KB_GROW) / vic.def.weight;
    let ux = dirSign * dcos(spec.ang), uy = dsin(spec.ang);
    // influence directionnelle : le joystick tenu dévie la trajectoire (15° au plus)
    const sx = vic.lastSx || 0, sy = vic.lastSy || 0;
    if (hyp(sx, sy) > 0.3) {
      const th = DI_MAX * Phaser.Math.Clamp(ux * sy - uy * sx, -1, 1);
      const c = dcos(th), sn = dsin(th);
      const nx = ux * c - uy * sn, ny = ux * sn + uy * c;
      ux = nx;
      uy = ny;
    }
    vic.sprite.setVelocity(ux * power, uy * power);
    const combo = now < vic.stunUntil;
    let stunMs = spec.stun * STUN_BASE + power * STUN_GROW;
    if (rem !== undefined) stunMs = Math.max(stunMs, rem + 2 * STEP_MS); // un coup qui touche laisse toujours l'avantage
    vic.stunUntil = now + stunMs;
    vic.stunStart = now;
    if (vic.atk && vic.atk.charging) this.clearCharge(vic);
    vic.atk = null;
    vic.helpless = false;
    vic.recUsed = false;
    vic.dodgeLock = 0;
    vic.rollUntil = 0;
    if (vic.jumps === 0) vic.jumps = 1; // être touché rend un saut
    if (this.training) this.trainReport(att, vic, spec, stunMs, rem, combo);
    const lethal = this.isLethal(vic, now);
    this.impactFx(att, vic, spec, hitPos, lethal);
    if (this.sudden) this.finish(att);
  }

  impactFx(att, vic, spec, hitPos, lethal) {
    const col = att.def.fx;
    const vc = vic.sprite.body.center;
    const x = hitPos ? hitPos.x : vc.x;
    const y = hitPos ? hitPos.y : vc.y;
    const power = Math.min(spec.dmg / 12, 1.2);

    // étoile d'impact
    const burst = this.add.image(x, y, 'burst').setScale(PX * (0.7 + power * 0.6)).setDepth(30).setAngle(Math.random() * 45);
    this.tweens.add({ targets: burst, scale: PX * (1.4 + power * 1.3), alpha: 0, angle: burst.angle + 40, duration: 190, onComplete: () => burst.destroy() });
    // anneau
    const ring = this.add.image(x, y, 'ring').setTint(col.main).setScale(0.8).setDepth(29);
    this.tweens.add({ targets: ring, scale: 2.6 + power * 2, alpha: 0, duration: 280, onComplete: () => ring.destroy() });
    // étincelles pixel dans les couleurs du combattant
    const n = 8 + Math.round(power * 8);
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const d = 30 + Math.random() * 70;
      const sz = 6 + Math.random() * 6;
      const r = this.add.rectangle(x, y, sz, sz, i % 2 ? col.main : col.alt).setDepth(30);
      this.tweens.add({ targets: r, x: x + Math.cos(a) * d, y: y + Math.sin(a) * d, alpha: 0, scale: 0.3, duration: 260 + Math.random() * 160, onComplete: () => r.destroy() });
    }
    if (att.char === 'toro') for (let i = 0; i < 3; i++) this.time.delayedCall(i * 40, () => this.flame(x + (Math.random() - 0.5) * 30, y + 10, col));

    // flash blanc de la victime
    vic.flashUntil = (this.nowT || 0) + 90;
    vic.flashCol = 0xffffff;
    vic.sprite.setTintFill(0xffffff);
    this.cameras.main.shake(90, Math.min(0.002 + vic.damage * 0.00003 + power * 0.002, 0.009));
    this.sfx('hit', power);
    if (vic.human || att.human) this.buzz(lethal ? 90 : 25 + power * 25);
    if (lethal) {
      // coup qui envoie au KO : gros arrêt sur image + flash (remplace l'ancienne cinématique)
      this.hitstop(320);
      const fl = this.add.rectangle(this.W / 2, this.H / 2, this.W, this.H, 0xffffff, 0.75).setDepth(70);
      this.tweens.add({ targets: fl, alpha: 0, duration: 300, onComplete: () => fl.destroy() });
      this.cameras.main.shake(300, 0.014);
      this.popup(vc.x, vc.y - 100, 'K.O. !', '#ffffff');
      this.sfx('ko');
    } else this.hitstop(40 + power * 50);
  }

  startGrab(pl, vic, m, now) {
    vic.atk = null;
    vic.stunUntil = now + 900;
    vic.sprite.body.allowGravity = false;
    vic.sprite.setVelocity(0, 0);
    pl.atk.pose = 'slam';
    pl.atk.end = now + 560;
    pl.atk.moveLock = now + 560;
    pl.sprite.setVelocityX(0);
    pl.grab = { victim: vic, start: now, slamAt: now + 400, spec: m.throw };
    const vc = vic.sprite.body.center;
    this.popup(vc.x, vc.y - 70, 'ATTRAPE !', '#6ee7b7');
    const g = this.add.image(vc.x, vc.y, 'ring').setTint(0x6ee7b7).setScale(1).setDepth(30);
    this.tweens.add({ targets: g, scale: 4, alpha: 0, duration: 300, onComplete: () => g.destroy() });
    this.hitstop(60);
  }

  updateGrab(pl, now) {
    const g = pl.grab;
    const v = g.victim;
    const t = Math.min((now - g.start) / (g.slamAt - g.start), 1);
    const f = pl.facing;
    v.sprite.setPosition(pl.sprite.x + f * (50 - 40 * dsin(t * Math.PI * 0.5)), pl.sprite.y - 14 - 70 * dsin(t * Math.PI));
    v.sprite.body.setVelocity(0, 0);
    v.sprite.setAngle(f * t * 300);
    v.stunUntil = Math.max(v.stunUntil, now + 120);
    if (now >= g.slamAt) {
      const spec = g.spec;
      this.releaseGrab(pl);
      v.sprite.setPosition(pl.sprite.x + f * 56, pl.sprite.y + 6);
      // suplex vers l'arrière par défaut ; joystick vers l'avant = projection devant
      const dir = pl.lastSx * f > 0.5 ? f : -f;
      this.applyHit(pl, v, spec, now, dir, null);
      this.shockwave(v.sprite.x, v.sprite.body.bottom, pl.def.fx);
      this.popup(v.sprite.x, v.sprite.y - 70, spec.name || 'SUPLEX !', '#ffd166');
    }
  }

  releaseGrab(pl) {
    if (!pl.grab) return;
    const v = pl.grab.victim;
    v.sprite.body.allowGravity = true;
    v.sprite.setAngle(0);
    pl.grab = null;
  }

  // =========================================================================
  // PROJECTILES (ASTRA, grappin de GROM)
  // =========================================================================
  spawnProj(pl, target, m, now, dy, spOverride) {
    let sp = spOverride || m.proj;
    let f = m && m.backFire ? -pl.facing : pl.facing;
    // grappin lancé hors du terrain, en l'air : il part vers le terrain (pour s'accrocher au bord)
    if (sp && sp.kind === 'hook') {
      const ob = pl.sprite.body;
      const air = !(ob.blocked.down || ob.touching.down);
      if (air && Math.abs(ob.center.x - this.W / 2) > L.mainW / 2 - 4) f = Math.sign(this.W / 2 - ob.center.x) || f;
    }
    const bc = pl.sprite.body.center;
    let x = bc.x + f * sp.ox;
    let y = bc.y + sp.oy + (dy || 0);
    if (sp.ground) y = pl.sprite.body.bottom - 14;
    if (sp.kind === 'corgi') {
      const gnd = pl.sprite.body.blocked.down || pl.sprite.body.touching.down;
      y = (gnd ? pl.sprite.body.bottom : L.baseY) - 24;
      if (now < pl.rageUntil) sp = { ...sp, s: sp.s * 1.35, w: sp.w * 1.35, h: sp.h * 1.35 };
    }
    let vx = (sp.vx || 0) * f;
    let vy = sp.vy || 0;
    if (sp.kind === 'ring') {
      const bv = pl.sprite.body.velocity.y;
      const gnd = pl.sprite.body.blocked.down || pl.sprite.body.touching.down;
      vy = gnd ? -110 : bv < -60 ? -430 : bv > 60 ? 430 : 120;
    }
    if (sp.kind === 'hermine') {
      // l'hermine surgit du sol à distance FIXE devant le lanceur
      y = pl.sprite.body.bottom + 2;
    }
    const img = this.add.image(x, y, sp.tex).setScale(sp.s || 3).setDepth(sp.kind === 'mine' ? 8 : 24);
    if (sp.kind === 'hook') img.setAngle(f * 90);
    if (sp.kind === 'corgi') { img.setFlipX(f < 0); this.dust(x - f * 30, y + 30, -f, 4, pl.def.fx); }
    if (sp.kind === 'eagle') {
      // l'aigle jaillit de la manche et monte droit vers le ciel (aucune visée)
      vx = 0;
      vy = -sp.speed;
      img.setScale(0.5).setAngle(-90).setDepth(27);
      this.tweens.add({ targets: img, scale: sp.s, duration: 160, ease: 'Back.easeOut' });
      for (let i = 0; i < 6; i++) {
        const q = this.add.rectangle(x, y, 7, 7, i % 2 ? 0xe70013 : 0xffffff).setDepth(26);
        const a = Math.random() * Math.PI * 2;
        this.tweens.add({ targets: q, x: x + Math.cos(a) * 50, y: y + Math.sin(a) * 50, alpha: 0, duration: 340, onComplete: () => q.destroy() });
      }
    }
    if (sp.kind === 'ball') img.setDepth(25);
    if (sp.kind === 'hermine') {
      img.setOrigin(0.5, 1).setScale(sp.s, 0.05);
      this.tweens.add({ targets: img, scaleY: sp.s, duration: 130, ease: 'Back.easeOut' });
      this.tweens.add({ targets: img, scaleY: 0.05, duration: 200, delay: Math.max((sp.act || 320) - 60, 100), ease: 'Cubic.easeIn' });
      this.dust(x, y - 4, -1, 6, pl.def.fx);
      this.dust(x, y - 4, 1, 6, pl.def.fx);
      const rg = this.add.image(x, y - 2, 'ring').setTint(0xf1eee2).setDepth(21).setScale(1.2, 0.3);
      this.tweens.add({ targets: rg, scaleX: 6, scaleY: 1, alpha: 0, duration: 340, onComplete: () => rg.destroy() });
      this.cameras.main.shake(110, 0.005);
    }
    const proj = {
      id: ++this.projSeq,
      owner: pl,
      target,
      spec: sp,
      x,
      y,
      vx,
      vy,
      born: now,
      armedAt: now + (sp.arm || 0),
      lastTrail: 0,
      sprite: img,
      dead: false,
      f,
      hits: sp.kind === 'corgi' ? new Set() : null,
    };
    this.projs.push(proj);
    if (!spOverride && sp.kind === 'bullet') this.muzzle(pl, 0);
    if (sp.kind === 'mine') {
      img.setAlpha(0);
      this.tweens.add({ targets: img, alpha: 1, duration: 200 });
      this.runeFx(x, y, pl.def.fx, 1.8);
    }
  }

  // vêtements qui volent quand la valise s'ouvre
  clothesFx(x, y) {
    const cols = [0xffffff, 0x6f93c9, 0xff8fb3, 0xffe08a, 0x6fbf5a];
    for (let i = 0; i < 8; i++) {
      const q = this.add.rectangle(x, y, 10, 8, cols[i % cols.length]).setDepth(27);
      const dx = (Math.random() - 0.5) * 220;
      this.tweens.add({ targets: q, x: x + dx, y: y - 60 - Math.random() * 70, angle: dx, duration: 260, ease: 'Quad.easeOut' });
      this.tweens.add({ targets: q, y: y + 20, alpha: 0, delay: 260, duration: 300, ease: 'Quad.easeIn', onComplete: () => q.destroy() });
    }
  }

  killProj(p, boom) {
    p.dead = true;
    if (p.carry) {
      p.target.sprite.body.allowGravity = true;
      p.target.sprite.setAngle(0);
      p.carry = null;
    }
    if (boom) {
      const col = p.owner.def.fx;
      const r = this.add.image(p.x, p.y, 'ring').setTint(col.alt).setDepth(30).setScale(1);
      this.tweens.add({ targets: r, scale: 7, alpha: 0, duration: 380, ease: 'Cubic.easeOut', onComplete: () => r.destroy() });
      const r2 = this.add.image(p.x, p.y, 'ring').setTint(col.main).setDepth(30).setScale(0.6);
      this.tweens.add({ targets: r2, scale: 4.5, alpha: 0, duration: 300, onComplete: () => r2.destroy() });
      for (let i = 0; i < 14; i++) {
        const a = Math.random() * Math.PI * 2;
        const d = 50 + Math.random() * 90;
        const q = this.add.rectangle(p.x, p.y, 8, 8, i % 2 ? col.main : col.alt).setDepth(30);
        this.tweens.add({ targets: q, x: p.x + Math.cos(a) * d, y: p.y + Math.sin(a) * d, alpha: 0, duration: 380, onComplete: () => q.destroy() });
      }
      this.cameras.main.shake(100, 0.004);
    }
    p.sprite.destroy();
  }

  updateProjs(now, dt) {
    this.chainGfx.clear();
    for (const p of this.projs) {
      if (p.dead) continue;
      const sp = p.spec;
      if (sp.grav) p.vy += sp.grav * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.sprite.setPosition(p.x, p.y);
      if (sp.spin) p.sprite.angle += sp.spin;
      if (sp.kind === 'orb' && sp.tex === 'orb_l') p.sprite.setScale((sp.s || 3) * (1 + 0.08 * Math.sin(now / 60)));
      if (sp.kind === 'mine' && now >= p.armedAt) p.sprite.setAlpha(0.65 + 0.35 * Math.sin(now / 90));

      // traînée
      if (sp.trail !== undefined && now - p.lastTrail > 32) {
        p.lastTrail = now;
        const sz = sp.tex === 'orb_l' ? 14 : 8;
        const q = this.add.rectangle(p.x, p.y, sz, sz, sp.trail, 0.8).setDepth(23);
        this.tweens.add({ targets: q, alpha: 0, scale: 0.2, duration: 260, onComplete: () => q.destroy() });
      }

      // grappin de Grom hors du terrain : s'il touche un coin, il ramène Grom au rebord
      if (sp.kind === 'hook') {
        const o = p.owner, ob = o.sprite.body;
        const offstage = Math.abs(ob.center.x - this.W / 2) > L.mainW / 2 - 4 || ob.bottom > L.baseY + 4;
        const airborne = !(ob.blocked.down || ob.touching.down);
        if (offstage && airborne && !o.ledgeSide && now >= o.stunUntil && o.stocks > 0) {
          let hit = 0;
          for (const side of [-1, 1]) {
            const ex = this.W / 2 + side * (L.mainW / 2);
            if (Math.abs(p.x - ex) < 60 && Math.abs(p.y - L.baseY) < 80 && (this.pl(1 - o.i).ledgeSide !== side)) hit = side;
          }
          if (hit) {
            this.grabLedge(o, hit, now);
            this.popup(p.x, p.y - 40, 'GRAPPIN !', '#6ee7b7');
            this.killProj(p, false);
            continue;
          }
        }
      }
      // chaîne du grappin
      if (sp.kind === 'hook') {
        const o = p.owner.sprite.body.center;
        const hx = o.x + p.f * 20, hy = o.y - 10;
        const n = Math.max(Math.floor(hyp(p.x - hx, p.y - hy) / 14), 1);
        this.chainGfx.fillStyle(0xaab2bd, 1);
        for (let i = 0; i < n; i++) {
          const t = i / n;
          this.chainGfx.fillRect(Math.round(hx + (p.x - hx) * t) - 3, Math.round(hy + (p.y - hy) * t) - 3, 6, 6);
        }
      }

      // --- DENODOOM : balle de handball qui rebondit une fois au sol
      if (sp.kind === 'ball' && p.vy > 0 && p.y > L.baseY - 16 && Math.abs(p.x - this.W / 2) < L.mainW / 2 + 10) {
        if (!p.bounced) {
          p.bounced = true;
          p.y = L.baseY - 16;
          p.vy *= -0.4;
          this.dust(p.x, L.baseY, -1, 3, p.owner.def.fx);
        } else {
          this.killProj(p, false);
          continue;
        }
      }
      // --- DENODOOM : l'aigle de Carthage (vol guidé, prise, drapeau, lancer)
      if (sp.kind === 'eagle') {
        const v = p.target;
        p.sprite.setTexture(Math.floor(now / 85) % 2 ? 'eagle1' : 'eagle0');
        if (!p.carry) {
          // vol vertical : l'aigle monte sans jamais viser l'adversaire
          p.sprite.setAngle(-90);
          if (now - p.born > sp.life) {
            this.killProj(p, false);
            continue;
          }
          if (now < v.invulnUntil || v.stocks <= 0 || v.grab) continue;
          const vb = v.sprite.body;
          if (p.x + sp.w / 2 > vb.x && p.x - sp.w / 2 < vb.right && p.y + sp.h / 2 > vb.y && p.y - sp.h / 2 < vb.bottom) {
            // PRISE réussie : l'aigle emporte l'adversaire, drapeau tunisien
            if (v.grab) this.releaseGrab(v);
            v.atk = null;
            v.sprite.body.allowGravity = false;
            v.sprite.setVelocity(0, 0);
            v.stunUntil = now + sp.carryMs + 300;
            p.carry = { t0: now, x0: p.x, y0: p.y, stocks: v.stocks };
            p.vx = p.vy = 0;
            this.flagFx(v.sprite.x, v.sprite.y);
            this.hitstop(70);
          }
          continue;
        }
        // en vol avec l'adversaire
        const k = Math.min((now - p.carry.t0) / sp.carryMs, 1);
        const e = 1 - (1 - k) * (1 - k);
        p.x = p.carry.x0 + p.f * 70 * e;
        p.y = p.carry.y0 - 130 * dsin(k * Math.PI * 0.5);
        p.sprite.setPosition(p.x, p.y).setAngle(0).setFlipX(p.f < 0);
        v.sprite.setPosition(p.x, p.y + 52).setAngle(p.f * k * 40);
        v.sprite.body.setVelocity(0, 0);
        v.stunUntil = Math.max(v.stunUntil, now + 120);
        if (v.stocks !== p.carry.stocks) {
          this.killProj(p, false);
          continue;
        }
        if (k >= 1) {
          v.sprite.body.allowGravity = true;
          v.sprite.setAngle(0);
          p.carry = null;
          p.dead = true;
          this.applyHit(p.owner, v, sp.throw, now, p.f, { x: p.x, y: p.y + 40 });
          const eg = p.sprite;
          this.tweens.add({ targets: eg, x: eg.x + p.f * 260, y: eg.y - 150, alpha: 0, duration: 420, onComplete: () => eg.destroy() });
        }
        continue;
      }
      if (sp.kind === 'corgi') {
        p.sprite.setTexture(Math.floor(now / 90) % 2 ? 'corgi1' : 'corgi0').setFlipX(p.f < 0);
        if (Math.abs(p.x - this.W / 2) > L.mainW / 2 + 40) {
          this.dust(p.x, p.y + 30, -p.f, 5, p.owner.def.fx);
          this.killProj(p, false);
          continue;
        }
        const v2 = p.target;
        const vb2 = v2.sprite.body;
        if (!p.hits.has(v2) && now >= v2.invulnUntil && v2.stocks > 0 && !v2.grab && p.x + sp.w / 2 > vb2.x && p.x - sp.w / 2 < vb2.right && p.y + sp.h / 2 > vb2.y && p.y - sp.h / 2 < vb2.bottom) {
          p.hits.add(v2);
          this.applyHit(p.owner, v2, sp, now, p.f, { x: p.x, y: p.y });
        }
        continue;
      }
      if (sp.kind === 'ring' && (p.y > L.baseY + 500 || p.y < L.baseY - 900)) { this.killProj(p, false); continue; }
      if (sp.kind === 'kiss') p.sprite.setScale((sp.s || 2) * (1 + 0.12 * Math.sin((now - p.born) / 70)));
      // VALISE : elle s'ouvre en touchant le sol
      if (sp.kind === 'suitcase' && p.vy > 0 && p.y > L.baseY - 22 && Math.abs(p.x - this.W / 2) < L.mainW / 2 + 16) {
        this.dust(p.x, L.baseY, -1, 5, p.owner.def.fx);
        this.dust(p.x, L.baseY, 1, 5, p.owner.def.fx);
        this.clothesFx(p.x, L.baseY - 20);
        this.cameras.main.shake(110, 0.005);
        this.killProj(p, false);
        continue;
      }
      if (sp.kind === 'hermine' && now - p.born > sp.act) p.spent = true;

      if (sp.kind === 'book' && p.y > L.baseY - 30 && Math.abs(p.x - this.W / 2) < L.mainW / 2 + 20) {
        // le livre s'écrase sur le sol
        this.dust(p.x, L.baseY, -1, 5, p.owner.def.fx);
        this.dust(p.x, L.baseY, 1, 5, p.owner.def.fx);
        this.cameras.main.shake(140, 0.006);
        this.killProj(p, false);
        continue;
      }
      if (sp.kind === 'book') p.sprite.angle = Math.max(p.sprite.angle * 0.94, -3);
      // bouteilles, tomates : éclatent en touchant le sol du terrain
      if (sp.breakGround && p.vy > 0 && p.y > L.baseY - 10 && Math.abs(p.x - this.W / 2) < L.mainW / 2 + 10) {
        this.splatFx(p);
        this.killProj(p, false);
        continue;
      }
      if (now - p.born > sp.life) {
        this.killProj(p, false);
        continue;
      }

      // collision avec l'adversaire
      const v = p.target;
      if (p.spent || now < p.armedAt || now < v.invulnUntil || v.stocks <= 0 || v.grab) continue;
      const vb = v.sprite.body;
      const pcy = sp.bottom ? p.y - sp.h / 2 : p.y;
      const hit = p.x + sp.w / 2 > vb.x && p.x - sp.w / 2 < vb.right && pcy + sp.h / 2 > vb.y && pcy - sp.h / 2 < vb.bottom;
      if (!hit) continue;
      // CONTRÔLE : AdieuLescure amortit le projectile et le renvoie de volée
      if (v.atk && v.atk.m.type === 'catch' && now >= v.atk.cFrom && now <= v.atk.cTo && sp.kind !== 'hermine' && sp.kind !== 'mine') {
        this.catchProj(v, p, now);
        continue;
      }

      if (sp.kind === 'ring' || sp.kind === 'kiss') {
        const vb3 = v.sprite.body;
        if (v.grab) this.releaseGrab(v);
        if ((vb3.blocked.down || vb3.touching.down) && !v.ledgeSide) {
          // au sol : charme court (attirée vers Nini, plus aucune commande)
          v.atk = null;
          v.charmUntil = now + sp.charm * (now < p.owner.rageUntil ? 1.3 : 1);
          v.sprite.setVelocityX(0);
          this.popup(v.sprite.x, v.sprite.y - 80, 'CHARME !', '#ff7eb6');
          for (let i = 0; i < 6; i++) this.time.delayedCall(i * 50, () => this.heartFx(v.sprite.x + (Math.random() - 0.5) * 50, v.sprite.y - 20, 1.6));
          this.shockwave(v.sprite.x, v.sprite.y, p.owner.def.fx);
        } else {
          // en l'air : seulement ralentie
          v.slowUntil = now + sp.slow;
          v.sprite.setVelocityX(v.sprite.body.velocity.x * 0.5);
          this.popup(v.sprite.x, v.sprite.y - 80, 'RALENTI', '#ff7eb6');
          this.heartFx(v.sprite.x, v.sprite.y - 30, 1.4);
        }
        this.sfx('charm');
        this.killProj(p, false);
      } else if (sp.kind === 'hook') {
        v.damage += sp.dmg;
        this.gainRage(v, sp.dmg, now);
        const toward = Math.sign(p.owner.sprite.x - v.sprite.x) || -p.f;
        v.sprite.setVelocity(toward * sp.pull, -140);
        v.stunUntil = now + sp.stun;
        v.atk = null;
        this.popup(v.sprite.x, v.sprite.y - 70, 'GRAPPIN !', '#6ee7b7');
        this.impactFx(p.owner, v, { dmg: 4 }, null);
        this.killProj(p, false);
      } else {
        const dir = sp.kind === 'comet' || sp.kind === 'mine' || sp.kind === 'book' || sp.kind === 'hermine' ? Math.sign(v.sprite.x - p.x) || p.f : Math.sign(p.vx) || p.f;
        this.applyHit(p.owner, v, sp, now, dir, { x: p.x, y: sp.bottom ? p.y - sp.h / 2 : p.y });
        if (sp.kind === 'hermine') p.spent = true; // elle retourne sous terre toute seule
        else {
          if (sp.breakGround) this.splatFx(p);
          this.killProj(p, !!sp.explode);
        }
      }
    }
    this.projs = this.projs.filter((p) => !p.dead);
  }

  // =========================================================================
  die(pl, now) {
    const s = pl.sprite;
    if (pl.grab) this.releaseGrab(pl);
    [this.p1, this.p2].forEach((o) => o.grab && o.grab.victim === pl && this.releaseGrab(o));
    s.body.allowGravity = true;
    s.setAngle(0).clearTint();
    pl.rage = 0; pl.rageUntil = 0; pl.charmUntil = 0; pl.slowUntil = 0; pl.armorUntil = 0;
    pl.ledgeSide = 0;
    this.landReset(pl);
    if (pl.umb) { pl.umb.destroy(); pl.umb = null; }
    if (pl.carryImg) { pl.carryImg.destroy(); pl.carryImg = null; }
    this.clearCharge(pl);
    const px = Phaser.Math.Clamp(s.x, 24, this.W - 24);
    const py = Phaser.Math.Clamp(s.y, 24, this.H - 24);
    for (let i = 0; i < 20; i++) {
      const a = Math.random() * Math.PI * 2;
      const d = 40 + Math.random() * 110;
      const r = this.add.rectangle(px, py, 10, 10, i % 2 ? 0xff5a5a : 0xffe9a8).setDepth(45);
      this.tweens.add({ targets: r, x: px + Math.cos(a) * d, y: py + Math.sin(a) * d, alpha: 0, duration: 420, onComplete: () => r.destroy() });
    }
    const star = this.add.image(px, py, 'burst').setScale(PX * 2).setDepth(45);
    this.tweens.add({ targets: star, scale: PX * 4, alpha: 0, duration: 300, onComplete: () => star.destroy() });
    this.cameras.main.shake(200, 0.01);
    this.sfx('ko');
    if (!this.training) pl.stocks--;
    pl.damage = 0;
    pl.atk = null;
    if (pl.stocks <= 0) {
      s.setVisible(false);
      s.body.enable = false;
      this.finish(pl === this.p1 ? this.p2 : this.p1);
      return;
    }
    s.setPosition(this.W / 2, L.baseY - 330).setVelocity(0, 0);
    pl.invulnUntil = now + 1800;
    pl.stunUntil = 0;
    pl.jumps = pl.def.jumps;
  }

  finish(winner) {
    this.over = true;
    if (this.net) {
      this.onlineFinish(winner);
    } else {
      this.banner.setText(winner === this.p1 ? 'VICTOIRE !' : 'DEFAITE...');
      this.sub.setText('TOUCHE POUR REJOUER');
    }
    this.clearCharge(this.p1);
    this.clearCharge(this.p2);
    this.p1.sprite.setVelocity(0, 0);
    this.p2.sprite.setVelocity(0, 0);
    this.projs.forEach((p) => !p.dead && this.killProj(p, false));
    this.projs = [];
    this.chainGfx.clear();
    if (camp && camp.phase === 'match') this.campFinish(winner === this.p1);
  }

  landReset(pl) {
    pl.jumps = pl.def.jumps;
    pl.airDodged = false;
    pl.helpless = false;
    pl.recUsed = false;
    pl.hopUsed = false;
    pl.floatUsed = false;
    pl.dashUsed = false;
    pl.ledgeInvUsed = false;
  }

  tryLedge(pl, other, now) {
    const b = pl.sprite.body;
    const cx = this.W / 2, half = L.mainW / 2;
    for (const side of [-1, 1]) {
      const edgeX = cx + side * half;
      const out = (b.center.x - edgeX) * side; // > 0 : dehors
      // sous le niveau du bord (contre le mur de terre ou juste dessous), la zone d'accroche est plus large
      // et si on se cogne sous le terrain près du coin, on attrape quand même le bord
      const ceiling = b.blocked.up || b.touching.up;
      const inner = ceiling ? b.halfWidth + 130 : b.top > L.baseY - 6 ? b.halfWidth + 36 : 8;
      if (out < -inner || out > b.halfWidth + 46) continue;
      if (b.top < L.baseY - 50 || b.top > L.baseY + 70) continue;
      if (other.ledgeSide === side) continue; // déjà pris par l'adversaire
      this.grabLedge(pl, side, now);
      return true;
    }
    return false;
  }

  grabLedge(pl, side, now) {
    const s = pl.sprite;
    if (pl.grab) this.releaseGrab(pl);
    pl.ledgeSide = side;
    pl.ledgeAt = now;
    pl.atk = null;
    pl.helpless = false;
    pl.rollUntil = 0;
    pl.dodgeLock = 0;
    pl.facing = -side;
    s.setFlipX(pl.facing < 0);
    if (!pl.ledgeInvUsed) {
      pl.invulnUntil = Math.max(pl.invulnUntil, now + 500);
      pl.ledgeInvUsed = true;
    }
    s.body.allowGravity = false;
    s.setVelocity(0, 0);
    this.placeOnLedge(pl);
    this.dust(s.x, L.baseY, -side, 3, pl.def.fx);
  }

  placeOnLedge(pl) {
    const s = pl.sprite, b = s.body, side = pl.ledgeSide;
    const edgeX = this.W / 2 + side * (L.mainW / 2);
    const dx = s.x - b.center.x, dy = s.y - b.center.y;
    const x = edgeX + side * (b.halfWidth + 2) + dx;
    const y = L.baseY - 6 + b.halfHeight + dy;
    this.putAt(s, x, y);
  }

  // déplace un perso d'un coup (le corps physique suit tout de suite, décalage compris)
  putAt(s, x, y) {
    const b = s.body;
    s.setPosition(x, y);
    b.reset(x, y);
    b.updateFromGameObject();
    b.prev.copy(b.position);
    b.prevFrame.copy(b.position);
  }

  ledgeStep(pl, other, now, inp) {
    const s = pl.sprite, side = pl.ledgeSide;
    s.body.allowGravity = false;
    s.setVelocity(0, 0);
    this.placeOnLedge(pl);
    pl.jumps = pl.def.jumps;
    pl.airDodged = false;
    pl.recUsed = false;
    pl.hopUsed = pl.floatUsed = pl.dashUsed = false;
    const t = now - pl.ledgeAt;
    if (t > 3000) return this.leaveLedge(pl, now, 'drop');
    if (t < 100) return;
    const toward = -side;
    if (pl.bufJump >= now) { pl.bufJump = 0; return this.leaveLedge(pl, now, 'jump'); }
    if (pl.bufAtk >= now) { pl.bufAtk = 0; return this.leaveLedge(pl, now, 'attack'); }
    if (pl.bufDodge >= now) { pl.bufDodge = 0; return this.leaveLedge(pl, now, 'roll'); }
    if (inp.sx * toward > 0.5 || inp.sy < -0.6) return this.leaveLedge(pl, now, 'climb');
    if (inp.sx * side > 0.5 || inp.sy > 0.6) return this.leaveLedge(pl, now, 'drop');
  }

  leaveLedge(pl, now, how) {
    const s = pl.sprite, b = s.body, side = pl.ledgeSide;
    pl.ledgeSide = 0;
    b.allowGravity = true;
    pl.ledgeCdUntil = now + 400;
    if (how === 'drop') {
      s.setVelocity(side * 60, 100);
      return;
    }
    if (how === 'jump') {
      s.setVelocity(-side * 120, -pl.def.jump * 1.05);
      pl.jumps = pl.def.jumps - 1;
      pl.lastJump = now;
      this.sfx('jump');
      return;
    }
    // remonte sur le terrain
    const edgeX = this.W / 2 + side * (L.mainW / 2);
    const dx = s.x - b.center.x, dy = s.y - b.center.y;
    const x = edgeX - side * (b.halfWidth + 10) + dx;
    const y = L.baseY - b.halfHeight - 1 + dy;
    this.putAt(s, x, y);
    s.setVelocity(0, 0);
    pl.facing = -side;
    if (how === 'climb') {
      pl.invulnUntil = Math.max(pl.invulnUntil, now + 150);
      pl.cdUntil = Math.max(pl.cdUntil, now + 150);
    } else if (how === 'roll') {
      pl.rollDir = -side;
      pl.rollUntil = now + 300;
      pl.dodgeUntil = pl.invulnUntil = Math.max(pl.invulnUntil, now + 280);
      pl.dodgeCd = now + 1000;
    } else if (how === 'attack') {
      pl.invulnUntil = Math.max(pl.invulnUntil, now + 120);
      const m = LEDGE_ATK;
      pl.atk = { id: ++this.atkSeq, m, key: 'ledge', pose: m.pose, start: now, hitAt: now + m.startup, end: now + m.total, moveLock: now + m.total, done: false };
      pl.cdUntil = now + m.total;
      this.attackFx(pl, m);
    }
  }

  startChain(pl, now) {
    const a0 = pl.atk;
    const base = pl.def.moves[a0.chainKey];
    let m = base.chain[a0.chainIdx];
    if (now < pl.rageUntil) m = { ...m, startup: m.startup * 0.75, total: m.total * 0.75, active: m.active * 0.75 };
    pl.atk = { id: ++this.atkSeq, m, key: a0.chainKey, pose: m.pose, start: now, hitAt: now + m.startup, end: now + m.total, moveLock: now + m.startup + (m.active || 0), done: false, chainKey: a0.chainKey, chainIdx: a0.chainIdx + 1 };
    pl.cdUntil = now + m.total;
    if (m.lunge) pl.sprite.setVelocityX(pl.facing * m.lunge);
    this.attackFx(pl, m);
    this.sfx('swing');
  }

  // Le coup va-t-il faire sortir la victime ? (prévision simple, identique sur les deux téléphones)
  isLethal(vic, now) {
    const b = vic.sprite.body;
    let x = vic.sprite.x, y = vic.sprite.y, vx = b.velocity.x, vy = b.velocity.y;
    const T = Math.max((vic.stunUntil - now) / 1000, 0);
    const cx = this.W / 2;
    for (let t = 0; t < T; t += 1 / 60) {
      vy += GRAVITY / 60;
      vx *= 1 - 0.8 / 60;
      x += vx / 60;
      y += vy / 60;
      if (x < cx - BLAST_X || x > cx + BLAST_X || y < L.baseY - BLAST_TOP) return true;
    }
    return false;
  }
}

// ---------------------------------------------------------------------------
// Plein écran + démarrage
// ---------------------------------------------------------------------------
function enterFullscreen() {
  try {
    const d = document;
    if (d.fullscreenElement || d.webkitFullscreenElement) return;
    const el = d.documentElement;
    const f = el.requestFullscreen || el.webkitRequestFullscreen;
    if (f) {
      const r = f.call(el);
      if (r && r.catch) r.catch(() => {});
    }
  } catch (e) {}
}
function toggleFullscreen() {
  try {
    const d = document;
    if (d.fullscreenElement || d.webkitFullscreenElement) {
      const x = d.exitFullscreen || d.webkitExitFullscreen;
      if (x) {
        const r = x.call(d);
        if (r && r.catch) r.catch(() => {});
      }
    } else enterFullscreen();
  } catch (e) {}
}

let trainingMode = false; // mode entraînement
let sessionReady = false; // connecté ou invité : on saute l'écran titre
let canonLayout = false; // jeu en ligne : géométrie identique sur tous les téléphones
function computeLayout() {
  if (canonLayout) return { W: 1280, H: 720, portrait: false, mainW: 760, baseY: 490 };
  const vw = Math.max(window.innerWidth, 320);
  const vh = Math.max(window.innerHeight, 240);
  const portrait = vh > vw;
  let W, H;
  if (portrait) {
    W = 720;
    H = Math.min(Math.round((720 * vh) / vw), 1800);
  } else {
    H = 720;
    W = Math.min(Math.round((720 * vw) / vh), 1800);
  }
  const mainW = Math.min(portrait ? 560 : 760, W - 80);
  const baseY = Math.round(portrait ? H * 0.45 : H * 0.68);
  return { W, H, portrait, mainW, baseY };
}

function boot() {
  if (game) {
    game.destroy(true);
    game = null;
  }
  document.getElementById('game').innerHTML = '';
  L = computeLayout();
  lastPortrait = L.portrait;
  game = new Phaser.Game({
    type: Phaser.AUTO,
    parent: 'game',
    width: L.W,
    height: L.H,
    pixelArt: true,
    backgroundColor: '#0b0d1f',
    scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
    input: { activePointers: 4, touch: { capture: true } },
    physics: { default: 'arcade', arcade: { gravity: { y: 0 }, debug: false } },
    scene: [GameScene],
  });
}

let resizeTimer = null;
function onResize() {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    if (!canonLayout && window.innerHeight > window.innerWidth !== lastPortrait) boot();
  }, 300);
}
window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', onResize);
document.addEventListener('contextmenu', (e) => e.preventDefault());

Promise.race([
  document.fonts ? document.fonts.load('16px "Press Start 2P"') : Promise.resolve(),
  new Promise((r) => setTimeout(r, 2000)),
])
  .catch(() => {})
  .then(() => (typeof loadPngChars === 'function' ? loadPngChars() : null))
  .then(boot);

// ===========================================================================
// TERRAINS : « NUIT » (la ville, d'origine) et « DÉSERT » (une planète de sable : dunes, deux lunes,
// dunes irrégulières, épice qui flotte, vers géants qui surgissent au loin, ornithoptère qui passe).
// Le décor ne change rien au combat : mêmes plateformes, mêmes dimensions.
// ===========================================================================
const STAGES = ['night', 'dune'];
const STAGE_NAMES = { night: 'NUIT', dune: 'DESERT' };
// salle sans arène choisie (duel classé) : tirée du code de la salle, identique sur les deux téléphones
function stageFromCode(code) {
  let h = 0;
  for (const ch of String(code || '')) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return STAGES[h % STAGES.length];
}

Object.assign(GameScene.prototype, {
  pickStage() {
    if (camp) return camp.ch % 2 ? 'dune' : 'night';
    const s = SETTINGS.stage === undefined ? 2 : SETTINGS.stage;
    if (s === 0) return 'night';
    if (s === 1) return 'dune';
    return Math.random() < 0.5 ? 'night' : 'dune';
  },

  // ----- écran de choix de l'arène (avant le choix du perso) -----
  // next(id) : appelé avec l'arène choisie ; back : bouton RETOUR (menu JOUER par défaut)
  showStagePick(next, back) {
    this.menuBase('CHOISIS L\'ARENE', { small: true, noBar: true });
    const D = 120;
    const port = L.portrait;
    const opts = [
      { id: 'night', name: 'NUIT', tex: 'bg', plat: 'main', soft: 'soft' },
      { id: 'dune', name: 'DESERT', tex: 'bg_dune', plat: 'main_dune', soft: 'soft_dune' },
      { id: 'rand', name: 'HASARD' },
    ];
    const cur = SETTINGS.stage === undefined ? 2 : SETTINGS.stage;
    let cw, ph;
    const top = port ? 170 : 160, lab = port ? 44 : 40;
    if (port) {
      cw = this.W - 80;
      ph = Math.min(Math.floor((this.H - top - 160) / 3) - lab - 18, Math.round(cw * 0.5));
    } else {
      cw = Math.min(420, Math.floor((this.W - 120) / 3));
      ph = Math.round(cw * 0.62);
    }
    this.uiBtns = [];
    opts.forEach((o, i) => {
      const cx = port ? this.W / 2 : this.W / 2 + (i - 1) * (cw + 30);
      const y0 = port ? top + i * (ph + lab + 18) : top + 20;
      const left = cx - cw / 2;
      const sel = cur === i;
      this.ui.push(this.add.rectangle(cx, y0 + (ph + lab) / 2, cw + 8, ph + lab + 8, 0x1a1d33, 1).setStrokeStyle(4, sel ? 0xffd166 : 0xf72585).setDepth(D));
      // aperçu : un morceau du décor autour de l'arène (half = 0/1 : seulement la moitié gauche/droite)
      const preview = (tex, plat, soft, half) => {
        const a = cw / ph;
        let wh = Math.min(this.H * 0.8, this.W / a), ww = wh * a;
        if (ww < L.mainW + 120) { ww = Math.min(this.W, L.mainW + 120); wh = ww / a; }
        const wx0 = this.W / 2 - ww / 2, wy0 = Math.max(0, Math.min(this.H - wh, L.baseY + 60 - wh * 0.78));
        const k = cw / ww;
        const img = this.add.image(0, 0, tex).setOrigin(0).setDepth(D + 1);
        const tk = img.width / this.bgImg.displayWidth; // pixels de texture par pixel d'écran
        const hx = half === 1 ? ww / 2 : 0, hw = half === undefined ? ww : ww / 2;
        img.setCrop((wx0 + hx) * tk, wy0 * tk, hw * tk, wh * tk);
        img.scale = k / tk; // échelle réelle (sans la correction automatique des textures HD)
        img.setPosition(left - wx0 * k, y0 - wy0 * k);
        this.ui.push(img);
        if (half !== undefined) return;
        const put = (key, x, y, w2, h2) => {
          const py = y0 + (y - wy0) * k;
          if (py - (h2 * k) / 2 < y0 || py + (h2 * k) / 2 > y0 + ph) return;
          this.ui.push(this.add.image(left + (x - wx0) * k, py, key).setDisplaySize(w2 * k, h2 * k).setDepth(D + 2));
        };
        const mp = this.mainPlat;
        put(plat, mp.x, mp.y, mp.displayWidth, mp.displayHeight);
        (this.softPlats || []).forEach((p) => put(soft, p.x, p.y, p.displayWidth, p.displayHeight));
      };
      if (o.tex) preview(o.tex, o.plat, o.soft);
      else {
        preview('bg', null, null, 0);
        preview('bg_dune', null, null, 1);
        this.ui.push(this.add.rectangle(cx, y0 + ph / 2, cw, ph, 0x0b0d1f, 0.45).setDepth(D + 2));
        this.ui.push(this.add.text(cx, y0 + ph / 2, '?', { fontFamily: FONT, fontSize: Math.round(ph * 0.5) + 'px', color: '#ffd166', stroke: '#000', strokeThickness: 8 }).setOrigin(0.5).setDepth(D + 3));
      }
      this.ui.push(this.add.text(cx, y0 + ph + lab / 2 + 2, o.name, { fontFamily: FONT, fontSize: port ? '22px' : '20px', color: sel ? '#ffd166' : '#ffffff', stroke: '#000', strokeThickness: 5 }).setOrigin(0.5).setDepth(D + 1));
      this.uiBtns.push({
        x: cx, y: y0 + (ph + lab) / 2, w: cw + 8, h: ph + lab + 8,
        fn: () => {
          SETTINGS.stage = i;
          if (typeof saveSettings === 'function') saveSettings();
          const id = this.pickStage();
          this.applyStage(id);
          next(id);
        },
      });
    });
    const yb = port ? this.H - 90 : this.H - 70;
    const r = this.add.rectangle(this.W / 2, yb, 300, 64, 0x1a1d33, 1).setStrokeStyle(4, 0x888888).setDepth(D);
    const t = this.add.text(this.W / 2, yb, 'RETOUR', { fontFamily: FONT, fontSize: '18px', color: '#fff', stroke: '#000', strokeThickness: 5 }).setOrigin(0.5).setDepth(D + 1);
    this.ui.push(r, t);
    this.uiBtns.push({ x: this.W / 2, y: yb, w: 300, h: 64, fn: () => (back ? back() : this.showPlayMenu()) });
  },

  applyStage(id) {
    this.stageId = id;
    const dune = id === 'dune';
    if (this.bgImg) this.bgImg.setTexture(dune ? 'bg_dune' : 'bg');
    if (this.mainPlat) this.mainPlat.setTexture(dune ? 'main_dune' : 'main');
    (this.softPlats || []).forEach((p) => p.setTexture(dune ? 'soft_dune' : 'soft'));
    if (this.stageFx) this.stageFx.forEach((o) => o.remove ? o.remove(false) : o.destroy());
    this.stageFx = [];
    if (dune) this.duneAmbience();
  },

  // ----- dessin du désert (en pixels d'art, agrandis x4) -----
  buildDune() {
    const w = Math.ceil(this.W / PX), h = Math.ceil(this.H / PX);
    const horizon = Math.round(L.baseY / PX) + 6;
    let seed = 11;
    const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
    mkCanvas(this, 'bg_dune', w, h, (c) => {
      // ciel de fin de journée : indigo en haut, braise, ambre à l'horizon (par bandes)
      const stops = [[22, 14, 44], [86, 30, 52], [196, 84, 42], [244, 168, 86]];
      for (let y = 0; y < h; y++) {
        const t = Math.min(y / (horizon - 4), 1);
        const q = Math.floor(t * 12) / 12;
        const seg = Math.min(2, Math.floor(q * 3));
        const u = q * 3 - seg;
        const a = stops[seg], b = stops[seg + 1];
        c.fillStyle = `rgb(${a.map((v, i) => Math.round(v + (b[i] - v) * u)).join(',')})`;
        c.fillRect(0, y, w, 1);
      }
      // quelques étoiles tout en haut
      for (let i = 0; i < w * 0.12; i++) {
        c.fillStyle = '#ffd9b0';
        c.fillRect(Math.floor(rnd() * w), Math.floor(rnd() * horizon * 0.22), 1, 1);
      }
      // deux lunes
      const disc = (cx, cy, r, col, edge) => {
        for (let y = -r; y <= r; y++)
          for (let x = -r; x <= r; x++)
            if (x * x + y * y <= r * r) {
              c.fillStyle = x * x + y * y > (r - 1.2) * (r - 1.2) ? edge : col;
              c.fillRect(cx + x, cy + y, 1, 1);
            }
      };
      const m1x = Math.round(w * 0.18), m1y = Math.round(horizon * 0.32);
      disc(m1x, m1y, 7, '#f4e6d2', '#d8c2a8');
      c.fillStyle = '#d2b89c';
      [[-2, -1, 3, 2], [2, 2, 2, 2], [-1, 3, 2, 1]].forEach(([x, y, ww, hh]) => c.fillRect(m1x + x, m1y + y, ww, hh));
      disc(Math.round(w * 0.29), Math.round(horizon * 0.24), 3, '#ead6c0', '#c8ae94');
      // grand soleil bas, voilé par la poussière
      c.globalAlpha = 0.22;
      disc(Math.round(w * 0.62), horizon - 16, 22, '#ffd8a0', '#ffd8a0');
      c.globalAlpha = 1;
      disc(Math.round(w * 0.62), horizon - 16, 14, '#ffe2a8', '#f8c070');
      // dunes irrégulières : face raide à gauche (à l'ombre), longue pente douce vers la droite,
      // tailles et écarts au hasard, petites bosses sur les crêtes
      const layer = (base, minH, maxH, minW, maxW, col, crest, shade) => {
        const top = new Array(w + 1).fill(base), lee = new Array(w + 1).fill(false);
        let x0 = -Math.floor(rnd() * maxW * 0.5);
        while (x0 < w) {
          const dw = minW + Math.floor(rnd() * (maxW - minW)), dh = minH + rnd() * (maxH - minH);
          const cr = Math.max(3, Math.round(dw * (0.22 + rnd() * 0.16))); // la crête est près du bord gauche
          const wob = rnd() * 6;
          for (let i = 0; i <= dw; i++) {
            const xx = x0 + i;
            if (xx < 0 || xx > w) continue;
            const f = i < cr ? Math.sin((Math.PI / 2) * (i / cr)) : 0.5 * (1 + Math.cos((Math.PI * (i - cr)) / (dw - cr)));
            const bump = Math.sin(i * 0.45 + wob) * 0.6 * f;
            const y = Math.round(base - dh * f - bump);
            if (y < top[xx]) { top[xx] = y; lee[xx] = i < cr; }
          }
          x0 += Math.round(dw * (0.55 + rnd() * 0.4));
        }
        for (let xx = 0; xx < w; xx++) {
          const t = top[xx];
          c.fillStyle = col;
          c.fillRect(xx, t, 1, h);
          if (lee[xx]) {
            c.fillStyle = shade;
            c.fillRect(xx, t, 1, Math.max(1, Math.round((base - t) * 0.65)));
          } else {
            c.fillStyle = crest;
            c.fillRect(xx, t, 1, 1);
          }
        }
      };
      // très loin, dans la brume
      layer(horizon - 6, 3, 9, 30, 70, '#d48a4c', '#e8a868', '#c07a44');
      layer(horizon - 2, 3, 8, 22, 55, '#c8783e', '#f2b06a', '#a65c30');
      layer(horizon + 5, 4, 9, 26, 60, '#b4642f', '#e2a05c', '#8e4a24');
      layer(horizon + 13, 3, 8, 30, 70, '#94502a', '#c88448', '#743a1e');
      // avant-plan : dunes dans l'ombre, de plus en plus sombres vers le bas, rides de vent
      const deep = [['#6e3620', '#8a4a2a', '#5a2a18'], ['#5a2a18', '#743c22', '#48200f'], ['#46200f', '#5e301a', '#381809'], ['#36180b', '#4a2414', '#2a1207'], ['#2a1208', '#3a1c0e', '#200d05']];
      let base = horizon + 22, k = 0;
      while (base < h + 20) {
        const d = deep[Math.min(k, deep.length - 1)];
        layer(base, 2 + k, 5 + k * 2, 40 + k * 14, 90 + k * 26, d[0], d[1], d[2]);
        // rides
        for (let r = 0; r < w * 0.5; r++) {
          const rx = Math.floor(rnd() * w), ry = base + 4 + Math.floor(rnd() * (14 + k * 8));
          if (ry < h) { c.fillStyle = d[1]; c.fillRect(rx, ry, 2 + Math.floor(rnd() * 3), 1); }
        }
        base += 16 + k * 8;
        k++;
      }
    });
    // plateau principal : roche sombre (contraste avec le sable du fond), coiffée d'une couche de sable
    const tw = Math.round(L.mainW / PX);
    mkCanvas(this, 'main_dune', tw, 14, (c) => {
      for (let y = 0; y < 14; y++)
        for (let x = 0; x < tw; x++) {
          let col;
          const drift = 2 + (Math.sin(x * 0.21) > 0.6 ? 1 : 0); // le sable déborde un peu par endroits
          if (y === 0) col = (x * 5) % 9 === 0 ? '#fff0c0' : '#f8d490';
          else if (y < drift) col = (x + Math.floor(x / 6)) % 5 === 0 ? '#d09a58' : '#e4b46c';
          else if (y === drift) col = '#1c1824';
          else if (y === 13) col = '#141018';
          else {
            const band = Math.floor((y - 2 + Math.round(Math.sin(x * 0.15) * 1.2)) / 3) % 2;
            col = band ? '#3a3346' : '#463e56';
            if ((x * 13 + y * 7) % 19 === 0) col = '#262030';
            if (y > 4 && (x + y * 3) % 23 === 0) col = '#6a5e7e';
          }
          c.fillStyle = col;
          c.fillRect(x, y, 1, 1);
        }
    });
    // plateformes : dalles de pierre sombre gravées
    mkCanvas(this, 'soft_dune', 50, 5, (c) => {
      for (let y = 0; y < 5; y++)
        for (let x = 0; x < 50; x++) {
          let col = y === 0 ? '#b4a6c6' : y === 4 ? '#18141e' : '#4a4058';
          if (y === 1) col = '#6e6084';
          if (y === 2 && x % 8 === 3) col = '#2a2434';
          if (y === 2 && x % 8 === 4) col = '#8a7ca0';
          if (x === 0 || x === 49) col = '#2a2434';
          c.fillStyle = col;
          c.fillRect(x, y, 1, 1);
        }
    });
    // ver des sables : énorme corps annelé qui sort du sable, gueule ronde ouverte en trois lèvres
    mkCanvas(this, 'worm', 48, 72, (c) => {
      const px = (x, y, col) => { c.fillStyle = col; c.fillRect(Math.round(x), Math.round(y), 1, 1); };
      const OUT = '#2e140a';
      const body = [];
      for (let y = 71; y >= 16; y--) {
        const t = (71 - y) / 55;
        const cx = 22 + 5 * Math.sin(t * 2.2 + 0.3), r = 11 - t * 1.5;
        body.push([y, cx, r]);
      }
      // contour
      body.forEach(([y, cx, r]) => { for (let x = -r - 1; x <= r + 1; x++) px(cx + x, y, OUT); });
      body.forEach(([y, cx, r]) => {
        for (let x = -r; x <= r; x++) {
          const u = x / r;
          let col = u > 0.45 ? '#c8935e' : u > -0.1 ? '#9a6840' : u > -0.6 ? '#7a4e30' : '#5a3420';
          // anneaux : lignes courbes (cylindre)
          const ring = (y + Math.round(Math.sqrt(Math.max(0, 1 - u * u)) * 2.2)) % 5;
          if (ring === 0) col = u > 0.45 ? '#8e5c38' : '#4a2a18';
          else if (ring === 1 && u > 0.2) col = '#dcae78';
          px(cx + x, y, col);
        }
      });
      // gueule (vue un peu de dessus) : lèvre, trois volets ouverts, couronnes de dents
      const mx = 22 + 5 * Math.sin(2.5), my = 15;
      const flap = (ax, ay, bx, by, tx, ty) => {
        for (let y = Math.min(ay, by, ty) - 1; y <= Math.max(ay, by, ty) + 1; y++)
          for (let x = Math.min(ax, bx, tx) - 1; x <= Math.max(ax, bx, tx) + 1; x++) {
            const s1 = (bx - ax) * (y - ay) - (by - ay) * (x - ax), s2 = (tx - bx) * (y - by) - (ty - by) * (x - bx), s3 = (ax - tx) * (y - ty) - (ay - ty) * (x - tx);
            if ((s1 >= 0 && s2 >= 0 && s3 >= 0) || (s1 <= 0 && s2 <= 0 && s3 <= 0)) px(x, y, y < (ay + ty) / 2 ? '#b07a4c' : '#8a5a36');
          }
      };
      flap(mx - 12, my + 1, mx - 4, my - 4, mx - 19, my - 12);
      flap(mx + 12, my + 1, mx + 4, my - 4, mx + 19, my - 12);
      flap(mx - 4, my - 4, mx + 4, my - 4, mx, my - 15);
      for (let y = -6; y <= 6; y++)
        for (let x = -13; x <= 13; x++) {
          const d = Math.hypot(x / 13, y / 6);
          if (d > 1) continue;
          const tooth = Math.floor(((Math.atan2(y / 6, x / 13) + Math.PI) / (Math.PI * 2)) * 18) % 2 === 0;
          let col;
          if (d > 0.86) col = OUT;
          else if (d > 0.72) col = '#a8764c';
          else if (d > 0.56) col = tooth ? '#e6d2b0' : '#3a140c';
          else if (d > 0.4) col = '#3a120c';
          else if (d > 0.3) col = tooth ? '#b89a7c' : '#24080a';
          else col = '#120404';
          px(mx + x, my + y, col);
        }
    });
    // ornithoptère : fuselage, cockpit, deux paires d'ailes battantes (2 images)
    [0, 1].forEach((f) =>
      mkCanvas(this, 'thopter' + f, 30, 14, (c) => {
        const r = (x, y, ww, hh, col) => { c.fillStyle = col; c.fillRect(x, y, ww, hh); };
        // ailes arrière (derrière le fuselage), plus pâles
        if (f) { r(6, 1, 11, 1, '#b8a894'); r(8, 2, 8, 1, '#b8a894'); r(12, 3, 2, 3, '#4a4450'); }
        else { r(6, 11, 11, 1, '#b8a894'); r(8, 10, 8, 1, '#b8a894'); r(12, 8, 2, 3, '#4a4450'); }
        // fuselage
        r(1, 6, 4, 1, '#2a2430'); r(4, 5, 16, 4, '#2a2430'); r(5, 6, 14, 1, '#6a6070'); r(20, 5, 5, 4, '#2a2430');
        r(21, 5, 3, 2, '#ffcf7a'); r(22, 5, 1, 1, '#fff2c8'); r(25, 6, 2, 2, '#2a2430');
        r(8, 9, 1, 2, '#2a2430'); r(17, 9, 1, 2, '#2a2430');
        // ailes avant
        if (f) { r(9, 0, 13, 1, '#f0e6d8'); r(11, 1, 9, 1, '#f0e6d8'); r(14, 2, 2, 3, '#4a4450'); }
        else { r(9, 13, 13, 1, '#f0e6d8'); r(11, 12, 9, 1, '#f0e6d8'); r(14, 9, 2, 3, '#4a4450'); }
      })
    );
  },
  // ----- vie du décor (purement visuel, jamais dans la simulation) -----
  duneAmbience() {
    const horizonY = L.baseY + 6 * PX;
    // épice : poussière dorée qui monte doucement
    const spice = this.time.addEvent({
      delay: 140,
      loop: true,
      callback: () => {
        const x = Math.random() * this.W, y = this.H * (0.45 + Math.random() * 0.5);
        const q = this.add.rectangle(x, y, 4, 4, Math.random() < 0.5 ? 0xffb347 : 0xffd27a, 0.8).setDepth(-5);
        this.tweens.add({ targets: q, x: x + 40 + Math.random() * 60, y: y - 60 - Math.random() * 80, alpha: 0, duration: 3200 + Math.random() * 1600, onComplete: () => q.destroy() });
      },
    });
    this.stageFx.push(spice);
    // un ver surgit au loin de temps en temps
    const worm = () => {
      if (this.stageId !== 'dune') return;
      const x = this.W / 2 + (Math.random() - 0.5) * L.mainW * 0.9;
      const k = PX * (1.5 + Math.random() * 0.4);
      const hgt = 72 * k;
      const wImg = this.add.image(x, horizonY + 8 + hgt, 'worm').setOrigin(0.5, 1).setScale(k).setDepth(-9).setAlpha(0.92).setFlipX(Math.random() < 0.5);
      // le ver sort du sable : on cache tout ce qui est sous la ligne des dunes
      const mg = this.make.graphics({ add: false });
      mg.fillRect(0, 0, this.W, horizonY + 8);
      wImg.setMask(mg.createGeometryMask());
      // gerbe de sable
      for (let i = 0; i < 26; i++) {
        const d = this.add.rectangle(x + (Math.random() - 0.5) * 120, horizonY + 6, 8, 8, i % 3 ? 0xd89a5a : 0xf0c27a).setDepth(-8);
        this.tweens.add({ targets: d, x: d.x + (Math.random() - 0.5) * 260, y: d.y - 60 - Math.random() * 180, alpha: 0, duration: 1100 + Math.random() * 600, delay: 150 + Math.random() * 500, ease: 'Quad.easeOut', onComplete: () => d.destroy() });
      }
      this.tweens.add({ targets: wImg, y: horizonY + 8 + hgt * 0.22, duration: 1400, ease: 'Sine.easeOut', yoyo: true, hold: 1300, onComplete: () => { wImg.destroy(); mg.destroy(); } });
      this.cameras.main.shake(500, 0.003);
      if (this.sfx) this.sfx('rumble');
    };
    const wEv = this.time.addEvent({ delay: 22000, loop: true, callback: worm });
    this.stageFx.push(wEv);
    this.time.delayedCall(6000, worm);
    // ornithoptère qui traverse le ciel
    const fly = () => {
      const dir = Math.random() < 0.5 ? 1 : -1;
      const y = this.H * (0.12 + Math.random() * 0.15);
      const t = this.add.image(dir > 0 ? -60 : this.W + 60, y, 'thopter0').setScale(PX).setDepth(-8).setFlipX(dir < 0);
      const flap = this.time.addEvent({ delay: 70, loop: true, callback: () => t.active && t.setTexture(t.texture.key === 'thopter0' ? 'thopter1' : 'thopter0') });
      this.tweens.add({ targets: t, x: dir > 0 ? this.W + 60 : -60, y: y + (Math.random() - 0.5) * 60, duration: 9000, onComplete: () => { flap.remove(false); t.destroy(); } });
    };
    const fEv = this.time.addEvent({ delay: 31000, loop: true, callback: fly });
    this.stageFx.push(fEv);
    this.time.delayedCall(2500, () => this.stageId === 'dune' && fly());
  },
});

  // --- CTRL+Z : trace de la dernière seconde (10 points, un toutes les 6 images) --------------------------
  zRecord(pl, now) {
    if (this.simFrames % 6) return;
    const s = pl.sprite, i = pl.zi || 0;
    pl['zx' + i] = Math.round(s.x * 10) / 10;
    pl['zy' + i] = Math.round(s.y * 10) / 10;
    pl['zd' + i] = pl.damage;
    pl['zf' + i] = pl.facing;
    pl.zi = (i + 1) % 10;
    pl.zn = Math.min((pl.zn || 0) + 1, 10);
  },

  doRewind(pl, now) {
    if (!pl.zn) return;
    const i = pl.zn < 10 ? 0 : pl.zi || 0; // le point le plus ancien
    const x = pl['zx' + i], y = pl['zy' + i];
    const s = pl.sprite;
    const from = { x: s.x, y: s.y };
    if (pl.grab) this.releaseGrab(pl);
    [this.p1, this.p2].forEach((o) => o.grab && o.grab.victim === pl && this.releaseGrab(o));
    pl.ledgeSide = 0;
    s.body.allowGravity = true;
    this.putAt(s, x, y);
    s.body.setVelocity(0, 0);
    const undone = Math.max(0, pl.damage - pl['zd' + i]);
    pl.damage = Math.min(pl.damage, pl['zd' + i]);
    pl.stunUntil = 0;
    pl.helpless = false;
    pl.invulnUntil = Math.max(pl.invulnUntil, now + 250);
    pl.zn = 0; // on ne peut pas remonter plus loin
    if (this.resim) return;
    // visuel : la silhouette reste au départ, une ligne de curseur rejoint l'arrivée
    const g = this.add.image(from.x, from.y, s.texture.key).setScale(PX).setFlipX(s.flipX).setTint(0x7fb2ff).setAlpha(0.55).setDepth(9);
    this.tweens.add({ targets: g, alpha: 0, duration: 420, onComplete: () => g.destroy() });
    const n = 8;
    for (let k = 0; k <= n; k++) {
      const q = this.add.rectangle(from.x + ((x - from.x) * k) / n, from.y - 30 + ((y - from.y) * k) / n, 8, 8, k % 2 ? 0x7fb2ff : 0xffffff).setDepth(30);
      this.tweens.add({ targets: q, alpha: 0, scale: 0.2, duration: 300, delay: k * 18, onComplete: () => q.destroy() });
    }
    const u = this.add.image(x, y - 90, 'undo').setScale(PX).setDepth(40);
    this.tweens.add({ targets: u, y: y - 120, angle: -360, alpha: 0, duration: 520, onComplete: () => u.destroy() });
    this.popup(x, y - 70, undone >= 1 ? `CTRL+Z  -${Math.round(undone)}%` : 'CTRL+Z', '#7fb2ff');
    this.sfx('parry');
  },

  // --- CONTRÔLE ---------------------------------------------------------------------------------------
  catchProj(v, p, now) {
    const a = v.atk;
    a.cTo = 0;
    a.pose = 'volley';
    a.end = now + 320;
    v.cdUntil = a.end;
    this.killProj(p, false);
    const o = p.owner;
    v.facing = Math.sign(o.sprite.x - v.sprite.x) || v.facing;
    v.sprite.setFlipX(v.facing < 0);
    const sp = { kind: 'volley', tex: 'football', s: 3, vx: 1250, life: 750, w: 30, h: 30, ox: 34, oy: -4, spin: 20,
      dmg: Math.max(5, Math.min(12, Math.round(p.spec.dmg || 6))), kb: 300, ks: 7, ang: -0.3, stun: 200, small: true };
    this.spawnProj(v, o, null, now, 0, sp);
    v.invulnUntil = Math.max(v.invulnUntil, now + 120);
    this.hitstop(60);
    if (this.resim) return;
    const c = v.sprite.body.center;
    this.popup(c.x, c.y - 90, 'CONTROLE !', '#7fb2ff');
    const r = this.add.image(c.x, c.y - 10, 'ring').setTint(0xffffff).setDepth(31).setScale(0.8);
    this.tweens.add({ targets: r, scale: 4, alpha: 0, duration: 280, onComplete: () => r.destroy() });
    this.sfx('parry');
  },

  catchMelee(v, att, spec, now) {
    const a = v.atk;
    a.cTo = 0;
    v.facing = Math.sign(att.sprite.x - v.sprite.x) || v.facing;
    v.sprite.setFlipX(v.facing < 0);
    if (att.grab) this.releaseGrab(att);
    this.startGrab(v, att, a.m, now);
    v.invulnUntil = Math.max(v.invulnUntil, now + 300);
    this.sfx('parry');
  },

  // --- effets visuels ----------------------------------------------------------------------------------
  extraFx(pl, m, fx, b, f) {
    if (fx.foam) {
      // geyser de mousse au-dessus de la tête
      for (let i = 0; i < 16; i++) {
        const q = this.add.rectangle(b.x + f * 8 + (Math.random() - 0.5) * 20, b.y - 40, 8 + Math.random() * 8, 8 + Math.random() * 8, i % 3 ? 0xfff6e0 : 0xf0b030).setDepth(22);
        this.tweens.add({ targets: q, x: q.x + (Math.random() - 0.5) * 90, y: b.y - 120 - Math.random() * 90, alpha: 0, duration: 380 + Math.random() * 200, delay: i * 10, onComplete: () => q.destroy() });
      }
    }
    if (fx.rooster) {
      const r = this.add.image(b.x, b.y - 20, 'rooster').setScale(PX * 0.6).setDepth(22).setFlipX(f < 0).setAlpha(0.95);
      this.tweens.add({ targets: r, y: b.y - 150, scale: PX * 1.1, alpha: 0, duration: 520, ease: 'Cubic.easeOut', onComplete: () => r.destroy() });
      this.popup(b.x, b.y - 110, 'COCORICO !', '#ffffff');
    }
    if (fx.donkey) {
      const d = this.add.image(b.x - f * 80, b.y + 4, 'donkey').setScale(PX * 0.5).setDepth(22).setFlipX(f > 0);
      this.tweens.add({ targets: d, scale: PX * 1.1, alpha: 0, duration: 380, onComplete: () => d.destroy() });
      this.dust(b.x - f * 60, b.y + 10, -f, 4, pl.def.fx);
    }
    if (fx.bike) this.dust(b.x - f * 30, b.y + 34, -f, 6, pl.def.fx);
    if (fx.violin) for (let i = 0; i < 6; i++) this.noteFx(b.x + Math.cos(i) * 50, b.y - 10 + Math.sin(i * 1.7) * 40, i % 2 ? 1 : -1, i);
  },

  // éclats de verre / jus de tomate
  splatFx(p) {
    if (this.resim) return;
    const sp = p.spec, col = sp.splat || 0xffffff;
    for (let i = 0; i < 10; i++) {
      const a = -Math.PI * Math.random();
      const d = 20 + Math.random() * 50;
      const q = this.add.rectangle(p.x, p.y, 6, 6, i % 3 === 0 ? 0xffffff : col).setDepth(30);
      this.tweens.add({ targets: q, x: p.x + Math.cos(a) * d, y: p.y + Math.sin(a) * d + 20, alpha: 0, duration: 340, onComplete: () => q.destroy() });
    }
  },

  // cigarette : petites bouffées de fumée quand il attend
  idleFx(pl, name, now) {
    if (name !== 'idle0' && name !== 'idle1') return;
    if (now - (pl.lastPuff || 0) < 700) return;
    pl.lastPuff = now;
    const s = pl.sprite;
    const x = s.x + pl.facing * 24, y = s.y - 50;
    const q = this.add.circle(x, y, 5, 0xdedad4, 0.7).setDepth(12);
    this.tweens.add({ targets: q, x: x + pl.facing * 10 + (Math.random() - 0.5) * 10, y: y - 40, scale: 2.4, alpha: 0, duration: 1200, onComplete: () => q.destroy() });
  },
});

// ART HD (vectoriel, dessiné en canvas) pour les cinématiques de coup final
// Style "cel" : aplats + gros contour encre, dans la même palette que les sprites pixel.

const INK = '#14121c';

function hdSeg(x, y, a, l) {
  const r = (a * Math.PI) / 180;
  return [x + Math.sin(r) * l, y + Math.cos(r) * l];
}

function hdStroke(c, pts, w, col) {
  c.lineCap = 'round';
  c.lineJoin = 'round';
  c.beginPath();
  c.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) c.lineTo(pts[i][0], pts[i][1]);
  c.strokeStyle = INK;
  c.lineWidth = w + 10;
  c.stroke();
  c.strokeStyle = col;
  c.lineWidth = w;
  c.stroke();
}

function hdPoly(c, pts, fill, lw) {
  c.beginPath();
  c.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) c.lineTo(pts[i][0], pts[i][1]);
  c.closePath();
  if (fill) {
    c.fillStyle = fill;
    c.fill();
  }
  if (lw) {
    c.lineJoin = 'round';
    c.strokeStyle = INK;
    c.lineWidth = lw;
    c.stroke();
  }
}

function hdEllipse(c, x, y, rx, ry, fill, lw, rot) {
  c.beginPath();
  c.ellipse(x, y, rx, ry, rot || 0, 0, Math.PI * 2);
  if (fill) {
    c.fillStyle = fill;
    c.fill();
  }
  if (lw) {
    c.strokeStyle = INK;
    c.lineWidth = lw;
    c.stroke();
  }
}

function hdHoodHead(c, S, mood) {
  // pointe de capuche vers l'arrière
  hdPoly(c, [[-56, -14], [-104, 26], [-52, 40]], S.jacketDk, 6);

  c.beginPath();
  c.moveTo(-52, 34);
  c.quadraticCurveTo(-82, -52, -20, -80);
  c.quadraticCurveTo(44, -94, 64, -28);
  c.quadraticCurveTo(72, 12, 44, 40);
  c.quadraticCurveTo(10, 58, -52, 34);
  c.closePath();
  c.fillStyle = S.jacket;
  c.fill();
  c.lineJoin = 'round';
  c.strokeStyle = INK;
  c.lineWidth = 6;
  c.stroke();
  // visage dans l'ombre
  c.beginPath();
  c.ellipse(26, 2, 32, 40, 0, 0, Math.PI * 2);
  c.fillStyle = '#24173f';
  c.fill();
  // yeux lumineux
  hdEllipse(c, 36, -6, 10, 7, '#7df9ff', 0);

  c.strokeStyle = '#ffd166';
  c.lineWidth = 5;
  c.lineCap = 'round';
  c.beginPath();
  c.moveTo(-18, -76);
  c.quadraticCurveTo(44, -90, 62, -28);
  c.quadraticCurveTo(66, 4, 50, 28);
  c.stroke();
}

// --- Silhouette complète en squelette (angles en degres depuis "vers le bas", + = vers l'avant) ---
// P = { lean, tilt, mood, armF:[a1,a2], armB:[a1,a2], legF:[a1,a2], legB:[a1,a2], flap }
function hdHuman(c, ox, oy, S, P) {
  c.save();
  c.translate(ox, oy);
  const lean = (P.lean * Math.PI) / 180;
  const up = [Math.sin(lean), -Math.cos(lean)];
  const nrm = [Math.cos(lean), Math.sin(lean)];
  const sh = [up[0] * 128, up[1] * 128];
  const limb = (st, a1, a2, l1, l2) => {
    const m = hdSeg(st[0], st[1], a1, l1);
    return [st, m, hdSeg(m[0], m[1], a2, l2)];
  };
  const aB = limb(sh, P.armB[0], P.armB[1], 92, 86);
  const aF = limb(sh, P.armF[0], P.armF[1], 92, 86);
  const lB = limb([0, 0], P.legB[0], P.legB[1], 118, 116);
  const lF = limb([0, 0], P.legF[0], P.legF[1], 118, 116);

  const hand = (p) => hdEllipse(c, p[0], p[1], 18, 17, S.hand || S.skin, 5);
  const shoe = (l, a2) => {
    const e = l[2];
    const r = (a2 * Math.PI) / 180;
    const f = [Math.cos(r), -Math.sin(r)];
    const sx = e[0] + f[0] * 16 - Math.sin(r) * 2;
    const sy = e[1] + f[1] * 16 - Math.cos(r) * 2;
    hdEllipse(c, sx, sy, 34, 15, S.shoe, 5, Math.atan2(f[1], f[0]));
  };
  const arm = (a, dark) => {
    const sl = dark ? S.backArm || S.jacketDk : S.sleeve;
    if (S.foreSleeve === null) {
      hdStroke(c, [a[1], a[2]], 28, dark ? S.backArm || S.skin : S.skin);
      hdStroke(c, [a[0], a[1]], 34, sl);
    } else hdStroke(c, a, 32, sl);
    hand(a[2]);
  };
  const leg = (l, a2, dark) => {
    if (S.thigh === S.shin) hdStroke(c, l, 44, dark ? S.jacketDk : S.thigh);
    else {
      hdStroke(c, [l[1], l[2]], 36, S.shin);
      hdStroke(c, [l[0], l[1]], 50, S.thigh);
    }
    shoe(l, a2);
  };

  arm(aB, true);
  leg(lB, P.legB[1], true);
  // torse
  hdStroke(c, [[0, 0], sh], 84, S.jacket);
  // détails veste / chemise / cravate
  const pt = (k, n) => [sh[0] - up[0] * k + nrm[0] * n, sh[1] - up[1] * k + nrm[1] * n];
  if (S.shirt) {
    hdPoly(c, [pt(-16, 10), pt(-16, 30), pt(70, 22)], S.shirt, 5);
    hdPoly(c, [pt(-16, 10), pt(30, 12), pt(-16, 34)], S.shirt, 0);
    // revers
    hdPoly(c, [pt(-18, 36), pt(80, 24), pt(40, 40)], S.jacketLt, 5);
  } else if (!S.noStripe) {
    // maillot : bande + manche
    hdPoly(c, [pt(-10, -34), pt(-10, 36), pt(130, 36), pt(130, -34)], null, 0);
    c.strokeStyle = '#ffffff';
    c.lineWidth = 10;
    c.beginPath();
    c.moveTo(pt(30, 40)[0], pt(30, 40)[1]);
    c.lineTo(pt(100, 40)[0], pt(100, 40)[1]);
    c.stroke();
  }
  c.strokeStyle = INK;
  c.lineWidth = 5;
  c.beginPath();
  c.moveTo(pt(80, 40)[0], pt(80, 40)[1]);
  c.lineTo(pt(80, 44)[0] - 2, pt(80, 44)[1] + 2);
  c.stroke();
  if (S.tie) {
    const t0 = pt(-4, 24), t1 = pt(80, 30);
    const fl = P.flap || 0;
    hdPoly(c, [t0, [t0[0] - 8, t0[1] + 6], [t1[0] - fl - 8, t1[1] + 6], [t1[0] - fl + 8, t1[1] - 6]], S.tie, 4);
  }
  if (S.skirt) {
    // robe (ASTRA)
    hdPoly(c, [[-46, -6], [54, -6], [74, 150], [-68, 158]], S.jacket, 6);
    c.strokeStyle = S.hem || '#ffd166';
    c.lineWidth = 6;
    c.beginPath();
    c.moveTo(-66, 150);
    c.lineTo(72, 144);
    c.stroke();
  }
  leg(lF, P.legF[1], false);
  if (S.pauldron) hdEllipse(c, sh[0] + 4, sh[1] + 10, 40, 30, S.pauldron, 6);
  // cou + tête
  const hc = [sh[0] + up[0] * 56 + nrm[0] * 6, sh[1] + up[1] * 56 + nrm[1] * 6];
  hdStroke(c, [sh, hc], 36, S.skin2);
  c.save();
  c.translate(hc[0], hc[1]);
  c.rotate(lean * 0.6 + ((P.tilt || 0) * Math.PI) / 180);
  hdHeadSide(c, S, P.mood);
  c.restore();
  arm(aF, false);
  c.restore();
  return { hip: [ox, oy], hand: [ox + aF[2][0], oy + aF[2][1]], foot: [ox + lF[2][0], oy + lF[2][1]], head: hc };
}

// --- Ballon ------------------------------------------------------------------
function drawBall(c, n) {
  c.clearRect(0, 0, n, n);
  const r = n / 2 - 5;
  const cx = n / 2, cy = n / 2;
  c.save();
  c.beginPath();
  c.arc(cx, cy, r, 0, Math.PI * 2);
  c.fillStyle = '#ffffff';
  c.fill();
  c.clip();
  const pent = (x, y, R, rot) => {
    c.beginPath();
    for (let i = 0; i < 5; i++) {
      const a = rot + (i * 2 * Math.PI) / 5;
      c.lineTo(x + Math.cos(a) * R, y + Math.sin(a) * R);
    }
    c.closePath();
    c.fillStyle = '#1b1822';
    c.fill();
  };
  pent(cx, cy, r * 0.34, -Math.PI / 2);
  for (let i = 0; i < 5; i++) {
    const a = -Math.PI / 2 + (i * 2 * Math.PI) / 5 + Math.PI / 5;
    pent(cx + Math.cos(a) * r * 0.95, cy + Math.sin(a) * r * 0.95, r * 0.3, a + Math.PI);
    c.strokeStyle = '#1b1822';
    c.lineWidth = 3;
    c.beginPath();
    c.moveTo(cx + Math.cos(a - Math.PI / 5) * r * 0.31, cy + Math.sin(a - Math.PI / 5) * r * 0.31);
    c.lineTo(cx + Math.cos(a - Math.PI / 5) * r * 0.66, cy + Math.sin(a - Math.PI / 5) * r * 0.66);
    c.stroke();
  }
  // ombrage
  const g = c.createRadialGradient(cx - r * 0.35, cy - r * 0.35, r * 0.1, cx, cy, r);
  g.addColorStop(0, 'rgba(255,255,255,0)');
  g.addColorStop(1, 'rgba(60,60,110,0.38)');
  c.fillStyle = g;
  c.fillRect(0, 0, n, n);
  c.restore();
  c.beginPath();
  c.arc(cx, cy, r, 0, Math.PI * 2);
  c.strokeStyle = INK;
  c.lineWidth = 7;
  c.stroke();
}

// --- Vague d'énergie (poussée) ----------------------------------------------------
function drawWave(c, W, H) {
  c.clearRect(0, 0, W, H);
  const cy = H / 2;
  const layers = [
    [1.0, 'rgba(30,170,255,0.45)'],
    [0.76, 'rgba(110,225,255,0.8)'],
    [0.48, '#e2fcff'],
    [0.22, '#ffffff'],
  ];
  layers.forEach(([k, col]) => {
    c.beginPath();
    for (let x = 0; x <= W; x += 6) {
      const taper = Math.min(1, x / 90);
      const hh = (H / 2) * k * taper * (0.78 + 0.22 * Math.sin(x / 31 + k * 4));
      if (x === 0) c.moveTo(x, cy - hh);
      else c.lineTo(x, cy - hh);
    }
    for (let x = W; x >= 0; x -= 6) {
      const taper = Math.min(1, x / 90);
      const hh = (H / 2) * k * taper * (0.78 + 0.22 * Math.sin(x / 27 + k * 3));
      c.lineTo(x, cy + hh);
    }
    c.closePath();
    c.fillStyle = col;
    c.fill();
  });
  // arcs d'énergie
  c.strokeStyle = 'rgba(255,255,255,0.85)';
  c.lineWidth = 4;
  for (let i = 0; i < 9; i++) {
    const x = 90 + i * 90;
    c.beginPath();
    c.ellipse(x, cy, 22, (H / 2) * 0.8, 0, -1.2, 1.2);
    c.stroke();
  }
}

function drawGradBg(c, W, H, stops) {
  const g = c.createLinearGradient(0, 0, 0, H);
  stops.forEach(([p, col]) => g.addColorStop(p, col));
  c.fillStyle = g;
  c.fillRect(0, 0, W, H);

function drawHalftone(c, n) {
  c.clearRect(0, 0, n, n);
  c.fillStyle = '#ffffff';
  c.beginPath();
  c.arc(n / 2, n / 2, n * 0.26, 0, Math.PI * 2);
  c.fill();
  c.beginPath();
  c.arc(0, 0, n * 0.26, 0, Math.PI * 2);
  c.arc(n, 0, n * 0.26, 0, Math.PI * 2);
  c.arc(0, n, n * 0.26, 0, Math.PI * 2);
  c.arc(n, n, n * 0.26, 0, Math.PI * 2);
  c.fill();
}
