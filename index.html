        img.setCrop((wx0 + hx) * tk, wy0 * tk, hw * tk, wh * tk);
        img.scale = k / tk; // échelle réelle (sans la correction automatique des textures HD)
        img.setPosition(left - wx0 * k, y0 - wy0 * k);
        this.ui.push(img);
        if (half !== undefined) return;
        const put = (key, x, y, w2, h2) => {
          const py = y0 + (y - wy0) * k;
          if (py - (h2 * k) / 2 < y0 || py + (h2 * k) / 2 > y0 + ph) return;
          this.ui.push(this.add.image(left + (x - wx0) * k, py, key).setDisplaySize(w2 * k, h2 * k).setDepth(D + 2));
        };
        const mp = this.mainPlat;
        put(plat, mp.x, mp.y, mp.displayWidth, mp.displayHeight);
        (this.softPlats || []).forEach((p) => put(soft, p.x, p.y, p.displayWidth, p.displayHeight));
      };
      if (o.tex) preview(o.tex, o.plat, o.soft);
      else {
        preview('bg', null, null, 0);
        preview('bg_dune', null, null, 1);
        this.ui.push(this.add.rectangle(cx, y0 + ph / 2, cw, ph, 0x0b0d1f, 0.45).setDepth(D + 2));
        this.ui.push(this.add.text(cx, y0 + ph / 2, '?', { fontFamily: FONT, fontSize: Math.round(ph * 0.5) + 'px', color: '#ffd166', stroke: '#000', strokeThickness: 8 }).setOrigin(0.5).setDepth(D + 3));
      }
      this.ui.push(this.add.text(cx, y0 + ph + lab / 2 + 2, o.name, { fontFamily: FONT, fontSize: port ? '22px' : '20px', color: sel ? '#ffd166' : '#ffffff', stroke: '#000', strokeThickness: 5 }).setOrigin(0.5).setDepth(D + 1));
      this.uiBtns.push({
        x: cx, y: y0 + (ph + lab) / 2, w: cw + 8, h: ph + lab + 8,
        fn: () => {
          SETTINGS.stage = i;
          if (typeof saveSettings === 'function') saveSettings();
          const id = this.pickStage();
          this.applyStage(id);
          next(id);
        },
      });
    });
    const yb = port ? this.H - 90 : this.H - 70;
    const r = this.add.rectangle(this.W / 2, yb, 300, 64, 0x1a1d33, 1).setStrokeStyle(4, 0x888888).setDepth(D);
    const t = this.add.text(this.W / 2, yb, 'RETOUR', { fontFamily: FONT, fontSize: '18px', color: '#fff', stroke: '#000', strokeThickness: 5 }).setOrigin(0.5).setDepth(D + 1);
    this.ui.push(r, t);
    this.uiBtns.push({ x: this.W / 2, y: yb, w: 300, h: 64, fn: () => (back ? back() : this.showPlayMenu()) });
  },

  applyStage(id) {
    this.stageId = id;
    const dune = id === 'dune';
    if (this.bgImg) this.bgImg.setTexture(dune ? 'bg_dune' : 'bg');
    if (this.mainPlat) this.mainPlat.setTexture(dune ? 'main_dune' : 'main');
    (this.softPlats || []).forEach((p) => p.setTexture(dune ? 'soft_dune' : 'soft'));
    if (this.stageFx) this.stageFx.forEach((o) => o.remove ? o.remove(false) : o.destroy());
    this.stageFx = [];
    if (dune) this.duneAmbience();
  },

  // ----- dessin du désert (en pixels d'art, agrandis x4) -----
  buildDune() {
    const w = Math.ceil(this.W / PX), h = Math.ceil(this.H / PX);
    const horizon = Math.round(L.baseY / PX) + 6;
    let seed = 11;
    const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
    mkCanvas(this, 'bg_dune', w, h, (c) => {
      // ciel de fin de journée : indigo en haut, braise, ambre à l'horizon (par bandes)
      const stops = [[22, 14, 44], [86, 30, 52], [196, 84, 42], [244, 168, 86]];
      for (let y = 0; y < h; y++) {
        const t = Math.min(y / (horizon - 4), 1);
        const q = Math.floor(t * 12) / 12;
        const seg = Math.min(2, Math.floor(q * 3));
        const u = q * 3 - seg;
        const a = stops[seg], b = stops[seg + 1];
        c.fillStyle = `rgb(${a.map((v, i) => Math.round(v + (b[i] - v) * u)).join(',')})`;
        c.fillRect(0, y, w, 1);
      }
      // quelques étoiles tout en haut
      for (let i = 0; i < w * 0.12; i++) {
        c.fillStyle = '#ffd9b0';
        c.fillRect(Math.floor(rnd() * w), Math.floor(rnd() * horizon * 0.22), 1, 1);
      }
      // deux lunes
      const disc = (cx, cy, r, col, edge) => {
        for (let y = -r; y <= r; y++)
          for (let x = -r; x <= r; x++)
            if (x * x + y * y <= r * r) {
              c.fillStyle = x * x + y * y > (r - 1.2) * (r - 1.2) ? edge : col;
              c.fillRect(cx + x, cy + y, 1, 1);
            }
      };
      const m1x = Math.round(w * 0.18), m1y = Math.round(horizon * 0.32);
      disc(m1x, m1y, 7, '#f4e6d2', '#d8c2a8');
      c.fillStyle = '#d2b89c';
      [[-2, -1, 3, 2], [2, 2, 2, 2], [-1, 3, 2, 1]].forEach(([x, y, ww, hh]) => c.fillRect(m1x + x, m1y + y, ww, hh));
      disc(Math.round(w * 0.29), Math.round(horizon * 0.24), 3, '#ead6c0', '#c8ae94');
      // grand soleil bas, voilé par la poussière
      c.globalAlpha = 0.22;
      disc(Math.round(w * 0.62), horizon - 16, 22, '#ffd8a0', '#ffd8a0');
      c.globalAlpha = 1;
      disc(Math.round(w * 0.62), horizon - 16, 14, '#ffe2a8', '#f8c070');
      // dunes irrégulières : face raide à gauche (à l'ombre), longue pente douce vers la droite,
      // tailles et écarts au hasard, petites bosses sur les crêtes
      const layer = (base, minH, maxH, minW, maxW, col, crest, shade) => {
        const top = new Array(w + 1).fill(base), lee = new Array(w + 1).fill(false);
        let x0 = -Math.floor(rnd() * maxW * 0.5);
        while (x0 < w) {
          const dw = minW + Math.floor(rnd() * (maxW - minW)), dh = minH + rnd() * (maxH - minH);
          const cr = Math.max(3, Math.round(dw * (0.22 + rnd() * 0.16))); // la crête est près du bord gauche
          const wob = rnd() * 6;
          for (let i = 0; i <= dw; i++) {
            const xx = x0 + i;
            if (xx < 0 || xx > w) continue;
            const f = i < cr ? Math.sin((Math.PI / 2) * (i / cr)) : 0.5 * (1 + Math.cos((Math.PI * (i - cr)) / (dw - cr)));
            const bump = Math.sin(i * 0.45 + wob) * 0.6 * f;
            const y = Math.round(base - dh * f - bump);
            if (y < top[xx]) { top[xx] = y; lee[xx] = i < cr; }
          }
          x0 += Math.round(dw * (0.55 + rnd() * 0.4));
        }
        for (let xx = 0; xx < w; xx++) {
          const t = top[xx];
          c.fillStyle = col;
          c.fillRect(xx, t, 1, h);
          if (lee[xx]) {
            c.fillStyle = shade;
            c.fillRect(xx, t, 1, Math.max(1, Math.round((base - t) * 0.65)));
          } else {
            c.fillStyle = crest;
            c.fillRect(xx, t, 1, 1);
          }
        }
      };
      // très loin, dans la brume
      layer(horizon - 6, 3, 9, 30, 70, '#d48a4c', '#e8a868', '#c07a44');
      layer(horizon - 2, 3, 8, 22, 55, '#c8783e', '#f2b06a', '#a65c30');
      layer(horizon + 5, 4, 9, 26, 60, '#b4642f', '#e2a05c', '#8e4a24');
      layer(horizon + 13, 3, 8, 30, 70, '#94502a', '#c88448', '#743a1e');
      // avant-plan : dunes dans l'ombre, de plus en plus sombres vers le bas, rides de vent
      const deep = [['#6e3620', '#8a4a2a', '#5a2a18'], ['#5a2a18', '#743c22', '#48200f'], ['#46200f', '#5e301a', '#381809'], ['#36180b', '#4a2414', '#2a1207'], ['#2a1208', '#3a1c0e', '#200d05']];
      let base = horizon + 22, k = 0;
      while (base < h + 20) {
        const d = deep[Math.min(k, deep.length - 1)];
        layer(base, 2 + k, 5 + k * 2, 40 + k * 14, 90 + k * 26, d[0], d[1], d[2]);
        // rides
        for (let r = 0; r < w * 0.5; r++) {
          const rx = Math.floor(rnd() * w), ry = base + 4 + Math.floor(rnd() * (14 + k * 8));
          if (ry < h) { c.fillStyle = d[1]; c.fillRect(rx, ry, 2 + Math.floor(rnd() * 3), 1); }
        }
        base += 16 + k * 8;
        k++;
      }
    });
    // plateau principal : roche sombre (contraste avec le sable du fond), coiffée d'une couche de sable
    const tw = Math.round(L.mainW / PX);
    mkCanvas(this, 'main_dune', tw, 14, (c) => {
      for (let y = 0; y < 14; y++)
        for (let x = 0; x < tw; x++) {
          let col;
          const drift = 2 + (Math.sin(x * 0.21) > 0.6 ? 1 : 0); // le sable déborde un peu par endroits
          if (y === 0) col = (x * 5) % 9 === 0 ? '#fff0c0' : '#f8d490';
          else if (y < drift) col = (x + Math.floor(x / 6)) % 5 === 0 ? '#d09a58' : '#e4b46c';
          else if (y === drift) col = '#1c1824';
          else if (y === 13) col = '#141018';
          else {
            const band = Math.floor((y - 2 + Math.round(Math.sin(x * 0.15) * 1.2)) / 3) % 2;
            col = band ? '#3a3346' : '#463e56';
            if ((x * 13 + y * 7) % 19 === 0) col = '#262030';
            if (y > 4 && (x + y * 3) % 23 === 0) col = '#6a5e7e';
          }
          c.fillStyle = col;
          c.fillRect(x, y, 1, 1);
        }
    });
    // plateformes : dalles de pierre sombre gravées
    mkCanvas(this, 'soft_dune', 50, 5, (c) => {
      for (let y = 0; y < 5; y++)
        for (let x = 0; x < 50; x++) {
          let col = y === 0 ? '#b4a6c6' : y === 4 ? '#18141e' : '#4a4058';
          if (y === 1) col = '#6e6084';
          if (y === 2 && x % 8 === 3) col = '#2a2434';
          if (y === 2 && x % 8 === 4) col = '#8a7ca0';
          if (x === 0 || x === 49) col = '#2a2434';
          c.fillStyle = col;
          c.fillRect(x, y, 1, 1);
        }
    });
    // ver des sables : énorme corps annelé qui sort du sable, gueule ronde ouverte en trois lèvres
    mkCanvas(this, 'worm', 48, 72, (c) => {
      const px = (x, y, col) => { c.fillStyle = col; c.fillRect(Math.round(x), Math.round(y), 1, 1); };
      const OUT = '#2e140a';
      const body = [];
      for (let y = 71; y >= 16; y--) {
        const t = (71 - y) / 55;
        const cx = 22 + 5 * Math.sin(t * 2.2 + 0.3), r = 11 - t * 1.5;
        body.push([y, cx, r]);
      }
      // contour
      body.forEach(([y, cx, r]) => { for (let x = -r - 1; x <= r + 1; x++) px(cx + x, y, OUT); });
      body.forEach(([y, cx, r]) => {
        for (let x = -r; x <= r; x++) {
          const u = x / r;
          let col = u > 0.45 ? '#c8935e' : u > -0.1 ? '#9a6840' : u > -0.6 ? '#7a4e30' : '#5a3420';
          // anneaux : lignes courbes (cylindre)
          const ring = (y + Math.round(Math.sqrt(Math.max(0, 1 - u * u)) * 2.2)) % 5;
          if (ring === 0) col = u > 0.45 ? '#8e5c38' : '#4a2a18';
          else if (ring === 1 && u > 0.2) col = '#dcae78';
          px(cx + x, y, col);
        }
      });
      // gueule (vue un peu de dessus) : lèvre, trois volets ouverts, couronnes de dents
      const mx = 22 + 5 * Math.sin(2.5), my = 15;
      const flap = (ax, ay, bx, by, tx, ty) => {
        for (let y = Math.min(ay, by, ty) - 1; y <= Math.max(ay, by, ty) + 1; y++)
          for (let x = Math.min(ax, bx, tx) - 1; x <= Math.max(ax, bx, tx) + 1; x++) {
            const s1 = (bx - ax) * (y - ay) - (by - ay) * (x - ax), s2 = (tx - bx) * (y - by) - (ty - by) * (x - bx), s3 = (ax - tx) * (y - ty) - (ay - ty) * (x - tx);
            if ((s1 >= 0 && s2 >= 0 && s3 >= 0) || (s1 <= 0 && s2 <= 0 && s3 <= 0)) px(x, y, y < (ay + ty) / 2 ? '#b07a4c' : '#8a5a36');
          }
      };
      flap(mx - 12, my + 1, mx - 4, my - 4, mx - 19, my - 12);
      flap(mx + 12, my + 1, mx + 4, my - 4, mx + 19, my - 12);
      flap(mx - 4, my - 4, mx + 4, my - 4, mx, my - 15);
      for (let y = -6; y <= 6; y++)
        for (let x = -13; x <= 13; x++) {
          const d = Math.hypot(x / 13, y / 6);
          if (d > 1) continue;
          const tooth = Math.floor(((Math.atan2(y / 6, x / 13) + Math.PI) / (Math.PI * 2)) * 18) % 2 === 0;
          let col;
          if (d > 0.86) col = OUT;
          else if (d > 0.72) col = '#a8764c';
          else if (d > 0.56) col = tooth ? '#e6d2b0' : '#3a140c';
          else if (d > 0.4) col = '#3a120c';
          else if (d > 0.3) col = tooth ? '#b89a7c' : '#24080a';
          else col = '#120404';
          px(mx + x, my + y, col);
        }
    });
    // ornithoptère : fuselage, cockpit, deux paires d'ailes battantes (2 images)
    [0, 1].forEach((f) =>
      mkCanvas(this, 'thopter' + f, 30, 14, (c) => {
        const r = (x, y, ww, hh, col) => { c.fillStyle = col; c.fillRect(x, y, ww, hh); };
        // ailes arrière (derrière le fuselage), plus pâles
        if (f) { r(6, 1, 11, 1, '#b8a894'); r(8, 2, 8, 1, '#b8a894'); r(12, 3, 2, 3, '#4a4450'); }
        else { r(6, 11, 11, 1, '#b8a894'); r(8, 10, 8, 1, '#b8a894'); r(12, 8, 2, 3, '#4a4450'); }
        // fuselage
        r(1, 6, 4, 1, '#2a2430'); r(4, 5, 16, 4, '#2a2430'); r(5, 6, 14, 1, '#6a6070'); r(20, 5, 5, 4, '#2a2430');
        r(21, 5, 3, 2, '#ffcf7a'); r(22, 5, 1, 1, '#fff2c8'); r(25, 6, 2, 2, '#2a2430');
        r(8, 9, 1, 2, '#2a2430'); r(17, 9, 1, 2, '#2a2430');
        // ailes avant
        if (f) { r(9, 0, 13, 1, '#f0e6d8'); r(11, 1, 9, 1, '#f0e6d8'); r(14, 2, 2, 3, '#4a4450'); }
        else { r(9, 13, 13, 1, '#f0e6d8'); r(11, 12, 9, 1, '#f0e6d8'); r(14, 9, 2, 3, '#4a4450'); }
      })
    );
  },
  // ----- vie du décor (purement visuel, jamais dans la simulation) -----
  duneAmbience() {
    const horizonY = L.baseY + 6 * PX;
    // épice : poussière dorée qui monte doucement
    const spice = this.time.addEvent({
      delay: 140,
      loop: true,
      callback: () => {
        const x = Math.random() * this.W, y = this.H * (0.45 + Math.random() * 0.5);
        const q = this.add.rectangle(x, y, 4, 4, Math.random() < 0.5 ? 0xffb347 : 0xffd27a, 0.8).setDepth(-5);
        this.tweens.add({ targets: q, x: x + 40 + Math.random() * 60, y: y - 60 - Math.random() * 80, alpha: 0, duration: 3200 + Math.random() * 1600, onComplete: () => q.destroy() });
      },
    });
    this.stageFx.push(spice);
    // un ver surgit au loin de temps en temps
    const worm = () => {
      if (this.stageId !== 'dune') return;
      const x = this.W / 2 + (Math.random() - 0.5) * L.mainW * 0.9;
      const k = PX * (1.15 + Math.random() * 0.3);
      const hgt = 72 * k;
      const wImg = this.add.image(x, horizonY + 8 + hgt, 'worm').setOrigin(0.5, 1).setScale(k).setDepth(-9).setAlpha(0.92).setFlipX(Math.random() < 0.5);
      // le ver sort du sable : on cache tout ce qui est sous la ligne des dunes
      const mg = this.make.graphics({ add: false });
      mg.fillRect(0, 0, this.W, horizonY + 8);
      wImg.setMask(mg.createGeometryMask());
      // gerbe de sable
      for (let i = 0; i < 26; i++) {
        const d = this.add.rectangle(x + (Math.random() - 0.5) * 120, horizonY + 6, 8, 8, i % 3 ? 0xd89a5a : 0xf0c27a).setDepth(-8);
        this.tweens.add({ targets: d, x: d.x + (Math.random() - 0.5) * 260, y: d.y - 60 - Math.random() * 180, alpha: 0, duration: 1100 + Math.random() * 600, delay: 150 + Math.random() * 500, ease: 'Quad.easeOut', onComplete: () => d.destroy() });
      }
      this.tweens.add({ targets: wImg, y: horizonY + 8 + hgt * 0.22, duration: 1400, ease: 'Sine.easeOut', yoyo: true, hold: 1300, onComplete: () => { wImg.destroy(); mg.destroy(); } });
      this.cameras.main.shake(500, 0.003);
      if (this.sfx) this.sfx('rumble');
    };
    const wEv = this.time.addEvent({ delay: 22000, loop: true, callback: worm });
    this.stageFx.push(wEv);
    this.time.delayedCall(6000, worm);
    // ornithoptère qui traverse le ciel
    const fly = () => {
      const dir = Math.random() < 0.5 ? 1 : -1;
      const y = this.H * (0.12 + Math.random() * 0.15);
      const t = this.add.image(dir > 0 ? -60 : this.W + 60, y, 'thopter0').setScale(PX).setDepth(-8).setFlipX(dir < 0);
      const flap = this.time.addEvent({ delay: 70, loop: true, callback: () => t.active && t.setTexture(t.texture.key === 'thopter0' ? 'thopter1' : 'thopter0') });
      this.tweens.add({ targets: t, x: dir > 0 ? this.W + 60 : -60, y: y + (Math.random() - 0.5) * 60, duration: 9000, onComplete: () => { flap.remove(false); t.destroy(); } });
    };
    const fEv = this.time.addEvent({ delay: 31000, loop: true, callback: fly });
    this.stageFx.push(fEv);
    this.time.delayedCall(2500, () => this.stageId === 'dune' && fly());
  },
});

  // --- CTRL+Z : trace de la dernière seconde (10 points, un toutes les 6 images) --------------------------
  zRecord(pl, now) {
    if (this.simFrames % 6) return;
    const s = pl.sprite, i = pl.zi || 0;
    pl['zx' + i] = Math.round(s.x * 10) / 10;
    pl['zy' + i] = Math.round(s.y * 10) / 10;
    pl['zd' + i] = pl.damage;
    pl['zf' + i] = pl.facing;
    pl.zi = (i + 1) % 10;
    pl.zn = Math.min((pl.zn || 0) + 1, 10);
  },

  doRewind(pl, now) {
    if (!pl.zn) return;
    const i = pl.zn < 10 ? 0 : pl.zi || 0; // le point le plus ancien
    const x = pl['zx' + i], y = pl['zy' + i];
    const s = pl.sprite;
    const from = { x: s.x, y: s.y };
    if (pl.grab) this.releaseGrab(pl);
    [this.p1, this.p2].forEach((o) => o.grab && o.grab.victim === pl && this.releaseGrab(o));
    pl.ledgeSide = 0;
    s.body.allowGravity = true;
    this.putAt(s, x, y);
    s.body.setVelocity(0, 0);
    const undone = Math.max(0, pl.damage - pl['zd' + i]);
    pl.damage = Math.min(pl.damage, pl['zd' + i]);
    pl.stunUntil = 0;
    pl.helpless = false;
    pl.invulnUntil = Math.max(pl.invulnUntil, now + 250);
    pl.zn = 0; // on ne peut pas remonter plus loin
    if (this.resim) return;
    // visuel : la silhouette reste au départ, une ligne de curseur rejoint l'arrivée
    const g = this.add.image(from.x, from.y, s.texture.key).setScale(PX).setFlipX(s.flipX).setTint(0x7fb2ff).setAlpha(0.55).setDepth(9);
    this.tweens.add({ targets: g, alpha: 0, duration: 420, onComplete: () => g.destroy() });
    const n = 8;
    for (let k = 0; k <= n; k++) {
      const q = this.add.rectangle(from.x + ((x - from.x) * k) / n, from.y - 30 + ((y - from.y) * k) / n, 8, 8, k % 2 ? 0x7fb2ff : 0xffffff).setDepth(30);
      this.tweens.add({ targets: q, alpha: 0, scale: 0.2, duration: 300, delay: k * 18, onComplete: () => q.destroy() });
    }
    const u = this.add.image(x, y - 90, 'undo').setScale(PX).setDepth(40);
    this.tweens.add({ targets: u, y: y - 120, angle: -360, alpha: 0, duration: 520, onComplete: () => u.destroy() });
    this.popup(x, y - 70, undone >= 1 ? `CTRL+Z  -${Math.round(undone)}%` : 'CTRL+Z', '#7fb2ff');
    this.sfx('rewind');
  },

  // --- CONTRÔLE ---------------------------------------------------------------------------------------
  catchProj(v, p, now) {
    const a = v.atk;
    a.cTo = 0;
    a.pose = 'volley';
    a.end = now + 320;
    v.cdUntil = a.end;
    this.killProj(p, false);
    const o = p.owner;
    v.facing = Math.sign(o.sprite.x - v.sprite.x) || v.facing;
    v.sprite.setFlipX(v.facing < 0);
    const sp = { kind: 'volley', tex: 'football', s: 3, vx: 1250, life: 750, w: 30, h: 30, ox: 34, oy: -4, spin: 20,
      dmg: Math.max(5, Math.min(12, Math.round(p.spec.dmg || 6))), kb: 300, ks: 7, ang: -0.3, stun: 200, small: true };
    this.spawnProj(v, o, null, now, 0, sp);
    v.invulnUntil = Math.max(v.invulnUntil, now + 120);
    this.hitstop(60);
    if (this.resim) return;
    const c = v.sprite.body.center;
    this.popup(c.x, c.y - 90, 'CONTRÔLE !', '#7fb2ff');
    const r = this.add.image(c.x, c.y - 10, 'ring').setTint(0xffffff).setDepth(31).setScale(0.8);
    this.tweens.add({ targets: r, scale: 4, alpha: 0, duration: 280, onComplete: () => r.destroy() });
    this.sfx('catch');
  },

  catchMelee(v, att, spec, now) {
    const a = v.atk;
    a.cTo = 0;
    v.facing = Math.sign(att.sprite.x - v.sprite.x) || v.facing;
    v.sprite.setFlipX(v.facing < 0);
    if (att.grab) this.releaseGrab(att);
    this.startGrab(v, att, a.m, now);
    v.invulnUntil = Math.max(v.invulnUntil, now + 300);
    this.sfx('catch');
  },

  // --- effets visuels ----------------------------------------------------------------------------------
  extraFx(pl, m, fx, b, f) {
    if (fx.foam) {
      // geyser de mousse au-dessus de la tête
      for (let i = 0; i < 16; i++) {
        const q = this.add.rectangle(b.x + f * 8 + (Math.random() - 0.5) * 20, b.y - 40, 8 + Math.random() * 8, 8 + Math.random() * 8, i % 3 ? 0xfff6e0 : 0xf0b030).setDepth(22);
        this.tweens.add({ targets: q, x: q.x + (Math.random() - 0.5) * 90, y: b.y - 120 - Math.random() * 90, alpha: 0, duration: 380 + Math.random() * 200, delay: i * 10, onComplete: () => q.destroy() });
      }
    }
    if (fx.rooster) {
      const r = this.add.image(b.x, b.y - 20, 'rooster').setScale(PX * 0.6).setDepth(22).setFlipX(f < 0).setAlpha(0.95);
      this.tweens.add({ targets: r, y: b.y - 150, scale: PX * 1.1, alpha: 0, duration: 520, ease: 'Cubic.easeOut', onComplete: () => r.destroy() });
      this.popup(b.x, b.y - 110, 'COCORICO !', '#ffffff');
      this.sfx('rooster');
    }
    if (fx.donkey) {
      const d = this.add.image(b.x - f * 80, b.y + 4, 'donkey').setScale(PX * 0.5).setDepth(22).setFlipX(f > 0);
      this.tweens.add({ targets: d, scale: PX * 1.1, alpha: 0, duration: 380, onComplete: () => d.destroy() });
      this.dust(b.x - f * 60, b.y + 10, -f, 4, pl.def.fx);
    }
    if (fx.bike) { this.dust(b.x - f * 30, b.y + 34, -f, 6, pl.def.fx); this.sfx('bike'); }
    if (fx.violin || fx.notes) this.sfx('note');
    if (fx.violin) for (let i = 0; i < 6; i++) this.noteFx(b.x + Math.cos(i) * 50, b.y - 10 + Math.sin(i * 1.7) * 40, i % 2 ? 1 : -1, i);
  },

  // éclats de verre / jus de tomate
  splatFx(p) {
    if (this.resim) return;
    const sp = p.spec, col = sp.splat || 0xffffff;
    this.sfx(sp.kind === 'bottle' ? 'glass' : 'splat');
    for (let i = 0; i < 10; i++) {
      const a = -Math.PI * Math.random();
      const d = 20 + Math.random() * 50;
      const q = this.add.rectangle(p.x, p.y, 6, 6, i % 3 === 0 ? 0xffffff : col).setDepth(30);
      this.tweens.add({ targets: q, x: p.x + Math.cos(a) * d, y: p.y + Math.sin(a) * d + 20, alpha: 0, duration: 340, onComplete: () => q.destroy() });
    }
  },

  // cigarette : petites bouffées de fumée quand il attend
  idleFx(pl, name, now) {
    if (name !== 'idle0' && name !== 'idle1') return;
    if (now - (pl.lastPuff || 0) < 700) return;
    pl.lastPuff = now;
    const s = pl.sprite;
    const x = s.x + pl.facing * 24, y = s.y - 50;
    const q = this.add.circle(x, y, 5, 0xdedad4, 0.7).setDepth(12);
    this.tweens.add({ targets: q, x: x + pl.facing * 10 + (Math.random() - 0.5) * 10, y: y - 40, scale: 2.4, alpha: 0, duration: 1200, onComplete: () => q.destroy() });
  },
});

// ===========================================================================
// BIGZINZIN : costume bleu ciel, petite antenne, lunettes rondes, téléphone à la main (ses coups légers).
// Monteur vidéo et homme d'affaires. Mécaniques :
//  - ARGENT / JACKPOT : il gagne de l'argent en touchant (1,7 € par % infligé) et en perd en étant touché
//    (1 € par % reçu). À 100 € : JACKPOT, costume et antenne en or pendant 8 s : +20 % de dégâts, -15 % de dégâts
//    et de recul reçus. La cagnotte repart de zéro (et est divisée par deux s'il perd une vie).
//  - DOUBLURE (SPÉCIAL haut) : il se téléporte 240 px plus haut et devient invisible ; à sa place, une silhouette
//    en billets verts. La silhouette encaisse UN coup (corps-à-corps ou tir), puis les billets tombent et il
//    réapparaît. Il réapparaît aussi s'il attaque, s'il est touché, ou au bout de 6 s.
//  - KEY FRAME (SPÉCIAL bas) : il pose une image clé au sol (4 s) ; qui marche dessus reste figé un instant.
//  - FEUILLE A4 (SPÉCIAL) : une feuille qui plane en ondulant ; elle coupe et ralentit.
// Tout l'état de jeu est en champs simples (money, goldUntil, invisUntil, decoyId, freezeUntil) : sauvegardé en ligne.
// ===========================================================================
const BZ = { max: 100, gain: 1.7, loss: 1, goldMs: 8000, dmgUp: 1.2, dmgDown: 0.85, invisMs: 6000, dist: 240 };

CHARS.bigzinzin = {
  id: 'bigzinzin', name: 'BIGZINZIN', role: 'MONTEUR EN OR', roleCol: '#8fd0ff', cardCol: '#5c98d0',
  speed: 355, jump: 690, weight: 1.0, jumps: 3, money: true,
  pal: { main: '#5c98d0', dark: '#2e5a88', skin: '#f8d4b8', skin2: '#e8b896', hair: '#a8823a', accent: '#e04050', glove: '#f8d4b8' },
  fx: { main: 0x5c98d0, alt: 0xcfe8ff, core: 0xffffff, cres: 'cres_white' },
  help: [],
  moves: {},
};
ORDER.push('bigzinzin');

Object.assign(GameScene.prototype, {
  // --- argent et JACKPOT (appelé par applyHit, avant les dégâts) ---------------------------------------------
  bzHit(att, vic, spec, now) {
    if (att.def.money && att !== vic && now < (att.goldUntil || 0)) spec = Object.assign({}, spec, { dmg: spec.dmg * BZ.dmgUp });
    if (vic.def.money && now < (vic.goldUntil || 0)) spec = Object.assign({}, spec, { dmg: spec.dmg * BZ.dmgDown });
    if (att.def.money && att !== vic && !(now < (att.goldUntil || 0))) {
      att.money = (att.money || 0) + spec.dmg * BZ.gain;
      if (!this.resim) {
        const c = att.sprite.body.center;
        this.moneyFx(c.x, c.y - 40, '+' + Math.round(spec.dmg * BZ.gain) + ' €', '#7cff7c');
      }
      if (att.money >= BZ.max) this.bzJackpot(att, now);
    }
    if (vic.def.money && !(now < (vic.goldUntil || 0))) {
      const lost = Math.min(vic.money || 0, spec.dmg * BZ.loss);
      vic.money = (vic.money || 0) - lost;
      if (lost >= 1 && !this.resim) {
        const c = vic.sprite.body.center;
        this.moneyFx(c.x, c.y - 40, '-' + Math.round(lost) + ' €', '#ff7070');
      }
    }
    // touché pendant la DOUBLURE : il réapparaît
    if (now < (vic.invisUntil || 0)) this.bzReveal(vic, now);
    return spec;
  },

  bzJackpot(pl, now) {
    pl.money = 0;
    pl.goldUntil = now + BZ.goldMs;
    if (this.resim) return;
    const c = pl.sprite.body.center;
    this.popup(c.x, c.y - 110, 'JACKPOT !', '#ffd23a');
    this.shockwave(c.x, c.y + 20, { main: 0xffd23a, alt: 0xfff3a0 });
    for (let i = 0; i < 14; i++) this.coinFx(c.x, c.y - 10, i);
    this.sfx('crowd');
    this.cameras.main.shake(200, 0.008);
  },

  // petit texte « +6 € » qui monte (affichage seulement)
  moneyFx(x, y, txt, col) {
    const t = this.add.text(x + (Math.random() - 0.5) * 20, y, txt, { fontFamily: FONT, fontSize: '13px', color: col, stroke: '#000', strokeThickness: 4 }).setOrigin(0.5).setDepth(42);
    this.tweens.add({ targets: t, y: y - 40, alpha: 0, duration: 700, onComplete: () => t.destroy() });
  },

  coinFx(x, y, i) {
    const q = this.add.rectangle(x, y, 7, 7, i % 3 ? 0xffd23a : 0xfff3a0).setDepth(31).setAngle(45);
    const a = -Math.PI * (0.1 + 0.8 * Math.random()), d = 60 + Math.random() * 90;
    this.tweens.add({ targets: q, x: x + Math.cos(a) * d, y: y + Math.sin(a) * d, duration: 260, ease: 'Quad.easeOut' });
    this.tweens.add({ targets: q, y: y + 40, alpha: 0, angle: 360, delay: 260, duration: 380, ease: 'Quad.easeIn', onComplete: () => q.destroy() });
  },

  // --- à chaque image (après le reste de step) -----------------------------------------------------------------
  bzStep(pl, other, now) {
    const s = pl.sprite;
    // KEY FRAME : image figée (tous les persos peuvent la subir)
    if (now < (pl.freezeUntil || 0)) {
      s.body.setVelocity(0, 0);
      s.setTint(0x9fd8ff);
    }
    if (!pl.def.money) return;
    // DOUBLURE : invisible pour l'adversaire (le joueur, lui, voit une silhouette très pâle)
    if (now < (pl.invisUntil || 0)) {
      const decoy = this.projs.find((p) => !p.dead && p.id === pl.decoyId);
      if (!decoy) this.bzReveal(pl, now);
      else s.setAlpha(pl.human ? 0.22 : 0);
    } else if (pl.invisUntil) {
      this.bzReveal(pl, now);
    }
    // JACKPOT : paillettes d'or
    if (now < (pl.goldUntil || 0) && !this.resim && !(now < (pl.invisUntil || 0)) && now - (pl.goldFx || 0) > 70) {
      pl.goldFx = now;
      const q = this.add.rectangle(s.x + (Math.random() - 0.5) * 50, s.y + (Math.random() - 0.5) * 70, 5, 5, Math.random() < 0.5 ? 0xffd23a : 0xffffff).setDepth(12).setAngle(45);
      this.tweens.add({ targets: q, y: q.y - 30, scale: 0.2, alpha: 0, duration: 500, onComplete: () => q.destroy() });
    }
  },

  // --- DOUBLURE ---------------------------------------------------------------------------------------------
  bzVanish(pl, now) {
    const s = pl.sprite;
    const x0 = s.x, y0 = s.y;
    // la silhouette en billets reste à sa place (un « projectile » immobile, sauvegardé en ligne comme les autres)
    const sp = { kind: 'decoy', tex: `${pl.char}_idle0`, s: PX, vx: 0, life: BZ.invisMs, w: 44, h: 76, ox: 0, oy: 0, dmg: 0 };
    const img = this.add.image(x0, y0, sp.tex).setScale(PX).setDepth(9).setTint(0x5fbf5a).setFlipX(pl.facing < 0);
    this.projs.push({ id: ++this.projSeq, owner: pl, target: this.pl(1 - pl.i), spec: sp, x: x0, y: y0, vx: 0, vy: 0, born: now, armedAt: now, lastTrail: 0, sprite: img, dead: false, f: pl.facing });
    pl.decoyId = this.projSeq;
    pl.invisUntil = now + BZ.invisMs;
    // téléport vers le haut (sans sortir par le haut de l'écran)
    const y1 = Math.max(y0 - BZ.dist, L.baseY - BLAST_TOP + 140);
    if (pl.ledgeSide) { pl.ledgeSide = 0; s.body.allowGravity = true; }
    this.putAt(s, x0, y1);
    s.body.setVelocity(0, -60);
    if (this.resim) return;
    for (let i = 0; i < 12; i++) this.billFx(x0, y0, i, false);
    this.popup(x0, y0 - 80, 'DOUBLURE', '#7cff7c');
    this.sfx('magic', 0.6);
  },

  // il réapparaît ; la silhouette (si elle est encore là) s'effondre en billets
  bzReveal(pl, now) {
    pl.invisUntil = 0;
    const d = this.projs.find((p) => !p.dead && p.id === pl.decoyId);
    pl.decoyId = 0;
    if (d) {
      if (!this.resim) for (let i = 0; i < 14; i++) this.billFx(d.x, d.y, i, true);
      this.killProj(d, false);
    }
    if (!this.resim) {
      const s = pl.sprite;
      this.runeFx(s.x, s.y - 10, { main: 0x5fbf5a, alt: 0xb8f0a0 }, 1.6);
    }
  },

  // billets verts qui volent (départ) ou tombent (silhouette détruite)
  billFx(x, y, i, fall) {
    const q = this.add.image(x + (Math.random() - 0.5) * 40, y + (Math.random() - 0.5) * 70, 'bill').setScale(PX * 0.6).setDepth(28).setAngle(Math.random() * 360);
    if (fall) this.tweens.add({ targets: q, y: L.baseY + 10, x: q.x + (Math.random() - 0.5) * 60, angle: q.angle + 200, alpha: 0, duration: 700 + Math.random() * 300, ease: 'Quad.easeIn', onComplete: () => q.destroy() });
    else this.tweens.add({ targets: q, y: q.y - 40 - Math.random() * 40, x: q.x + (Math.random() - 0.5) * 80, angle: q.angle + 120, alpha: 0, duration: 500, onComplete: () => q.destroy() });
  },

  // un coup au corps-à-corps de « pl » touche-t-il la silhouette de « other » ? (elle encaisse à sa place)
  bzDecoyHit(pl, other, box, now) {
    if (!other.def.money || !(now < (other.invisUntil || 0))) return false;
    const d = this.projs.find((p) => !p.dead && p.id === other.decoyId);
    if (!d) return false;
    const r = new Phaser.Geom.Rectangle(d.x - d.spec.w / 2, d.y - d.spec.h / 2, d.spec.w, d.spec.h);
    if (!Phaser.Geom.Intersects.RectangleToRectangle(box, r)) return false;
    if (!this.resim) {
      this.popup(d.x, d.y - 70, 'LEURRE !', '#7cff7c');
      this.sfx('hit', 0.3);
    }
    this.bzReveal(other, now);
    return true;
  },

  // --- projectiles propres à BIGZINZIN (true = déjà traité) ---------------------------------------------------
  bzProj(p, now) {
    const sp = p.spec;
    if (sp.kind === 'decoy') {
      // immobile ; un tir adverse qui la traverse s'arrête et la détruit
      for (const q of this.projs) {
        if (q.dead || q === p || q.owner === p.owner || q.spec.kind === 'decoy') continue;
        if (Math.abs(q.x - p.x) < (sp.w + q.spec.w) / 2 && Math.abs(q.y - p.y) < (sp.h + q.spec.h) / 2) {
          this.killProj(q, true);
          if (!this.resim) this.popup(p.x, p.y - 70, 'LEURRE !', '#7cff7c');
          this.bzReveal(p.owner, now);
          return true;
        }
      }
      if (now - p.born > sp.life) this.bzReveal(p.owner, now);
      return true;
    }
    if (sp.kind === 'paper') {
      // la feuille plane en ondulant (vitesse verticale tirée du temps : identique sur les deux téléphones)
      p.vy = (16 * 1000 / 130) * dcos((now - p.born) / 130);
      p.sprite.setAngle(10 * dsin((now - p.born) / 90));
    }
    if (sp.kind === 'keyframe' && now >= p.armedAt) p.sprite.setAlpha(0.7 + 0.3 * dsin(now / 80));
    return false;
  },

  makeBzTextures() {
    // feuille A4 (lignes de texte)
    iconTex(this, 'paper', ['kkkkkkkkk', 'kwwwwwwwk', 'kwggggwwk', 'kwwwwwwwk', 'kwgggggwk', 'kwwwwwwwk', 'kwggggwwk', 'kwwwwwwwk', 'kwgggwwwk', 'kwwwwwwwk', 'kkkkkkkkk'], '#000',
      { k: '#3a4050', w: '#ffffff', g: '#9aa4b8' });
    // image clé (losange de logiciel de montage)
    iconTex(this, 'keyframe', ['....k....', '...kyk...', '..kyyyk..', '.kyyhyyk.', 'kyyhhhyyk', '.kyyhyyk.', '..kyyyk..', '...kyk...', '....k....'], '#000',
      { k: '#1a1410', y: '#ffd23a', h: '#ffffff' });
    // billet vert
    iconTex(this, 'bill', ['kkkkkkk', 'kgglggk', 'kgldlgk', 'kgglggk', 'kkkkkkk'], '#000', { k: '#1e4a1e', g: '#5fbf5a', l: '#b8f0a0', d: '#2e7a2e' });
  },
});

// textures en plus + effets visuels des coups (flash du téléphone, éclair d'antenne, pièces)
(() => {
  const P = GameScene.prototype;
  const baseTex = P.makeExtraTextures;
  P.makeExtraTextures = function () {
    if (baseTex) baseTex.call(this);
    this.makeBzTextures();
  };
  const baseFx = P.extraFx;
  P.extraFx = function (pl, m, fx, b, f) {
    if (baseFx) baseFx.call(this, pl, m, fx, b, f);
    if (fx.flash) {
      const up = fx.flash === 'up';
      const x = b.x + f * (up ? 10 : (m.ox || 50)), y = b.y + (up ? (m.oy || -50) : (m.oy || 0) - 4);
      const g = this.add.image(x, y, 'burst').setScale(PX * 0.5).setTint(0xffffff).setDepth(31);
      this.tweens.add({ targets: g, scale: PX * 1.4, alpha: 0, duration: 160, onComplete: () => g.destroy() });
      const r = this.add.image(x, y, 'ring').setTint(0xcfe8ff).setDepth(30).setScale(0.6);
      this.tweens.add({ targets: r, scale: 3, alpha: 0, duration: 220, onComplete: () => r.destroy() });
    }
    if (fx.zap) this.zapFx(b.x + f * 4, b.y - 50, b.y + (m.oy || -80) - (m.h || 100) / 2);
    if (fx.coins) for (let i = 0; i < 12; i++) this.coinFx(b.x + (i - 6) * 10, b.y + 30, i);
  };
  // éclair qui part de l'antenne vers le haut
  P.zapFx = function (x, y0, y1) {
    let px = x, py = y0;
    for (let k = 0; k < 7; k++) {
      const ny = y0 + ((y1 - y0) * (k + 1)) / 7, nx = x + (k % 2 ? 10 : -10) * Math.random();
      const n = 5;
      for (let j = 0; j < n; j++) {
        const q = this.add.rectangle(px + ((nx - px) * j) / n, py + ((ny - py) * j) / n, 6, 6, j % 2 ? 0xffe27a : 0xffffff).setDepth(31);
        this.tweens.add({ targets: q, alpha: 0, duration: 240, delay: k * 12, onComplete: () => q.destroy() });
      }
      px = nx; py = ny;
    }
    this.sfx('magic', 0.5);
  };
})();

// ===========================================================================
// LN4 : pilote de F1 (combinaison noire et orange, gants, bottines, casque) et joueur de badminton (raquette, volant).
// Mécaniques :
//  - VOLANT (SPÉCIAL) : le volant part très vite puis freine d'un coup et retombe (comme un vrai volant).
//  - CHAMPAGNE (SPÉCIAL haut) : le podium ! le jet de champagne le propulse vers le haut et arrose en dessous.
//  - ARRÊT AU STAND (SPÉCIAL bas, au sol) : une demi-seconde immobile (attaquable), puis PNEUS NEUFS pendant 6 s :
//    il court 25 % plus vite et FEUX ÉTEINTS (LOURD) l'emmène 30 % plus loin.
//  - FEUX ÉTEINTS (LOURD) : départ arrêté, les 5 feux rouges s'éteignent et il fonce tout droit.
// Tout l'état de jeu est en champs simples (tyreUntil, spdMul) : sauvegardé en ligne.
// ===========================================================================
const LN = { tyreMs: 6000, spd: 1.25, dash: 1.3, drag: 0.94 };

CHARS.ln4 = {
  id: 'ln4', name: 'LN4', role: 'PILOTE SMASHEUR', roleCol: '#ffa040', cardCol: '#ff7a00',
  speed: 365, jump: 690, weight: 0.97, jumps: 3, f1: true,
  pal: { main: '#2c1a10', dark: '#1a1a22', skin: '#ecbc96', skin2: '#d09a74', hair: '#2c1a10', accent: '#ff7a00', glove: '#26262e' },
  fx: { main: 0xff7a00, alt: 0xffd09a, core: 0xffffff, cres: 'cres_ln' },
  help: [],
  moves: {},
};
ORDER.push('ln4');

Object.assign(GameScene.prototype, {
  // ARRÊT AU STAND terminé : pneus neufs
  lnPit(pl, now) {
    pl.tyreUntil = now + LN.tyreMs;
    if (this.resim) return;
    const c = pl.sprite.body.center;
    this.popup(c.x, c.y - 100, 'PNEUS NEUFS !', '#ffa040');
    this.shockwave(c.x, pl.sprite.body.bottom, { main: 0xff7a00, alt: 0xffd09a });
    for (let i = 0; i < 8; i++) this.smokeFx(c.x + (i - 4) * 10, pl.sprite.body.bottom - 4, i % 2 ? 1 : -1, 1);
    this.sfx('count');
  },

  // à chaque image (après le reste de step)
  lnStep(pl, now) {
    if (!pl.def.f1) return;
    const fresh = now < (pl.tyreUntil || 0);
    pl.spdMul = fresh ? LN.spd : 1;
    if (!fresh || this.resim) return;
    // pneus neufs : fumée de gomme quand il roule au sol
    const s = pl.sprite, b = s.body;
    if ((b.blocked.down || b.touching.down) && Math.abs(b.velocity.x) > 120 && now - (pl.tyreFx || 0) > 70) {
      pl.tyreFx = now;
      this.smokeFx(s.x - Math.sign(b.velocity.x) * 20, b.bottom - 4, -Math.sign(b.velocity.x), 0.6);
    }
  },

  // projectiles propres à LN4 (true = déjà traité)
  lnProj(p, now) {
    const sp = p.spec;
    if (sp.kind !== 'shuttle') return false;
    // le volant freine très vite (frottement de l'air sur les plumes) puis tombe
    p.vx *= LN.drag;
    p.sprite.setAngle((Math.atan2(p.vy, p.vx) * 180) / Math.PI);
    if (p.y > L.baseY - 12 && Math.abs(p.x - this.W / 2) < L.mainW / 2) {
      this.killProj(p, false);
      return true;
    }
    return false;
  },

  // petite bouffée de fumée grise (affichage seulement)
  smokeFx(x, y, dir, k) {
    const r = this.add.circle(x, y, 6 * k + Math.random() * 4, Math.random() < 0.5 ? 0xb8b8c0 : 0x8a8a94, 0.75).setDepth(13);
    this.tweens.add({ targets: r, x: x + dir * (20 + Math.random() * 30) * k, y: y - 10 - Math.random() * 16, scale: 2.2, alpha: 0, duration: 420 + Math.random() * 200, onComplete: () => r.destroy() });
  },

  makeLnTextures() {
    crescentTex(this, 'cres_ln', ['#ffffff', '#ffd09a', '#ff7a00']);
    // volant de badminton (le bouchon vers la droite = vers l'avant)
    iconTex(this, 'shuttle', ['.kkk....', 'kwwlkkk.', 'kwwwlwkk', 'kwwwlwwW', 'kwwwlwkk', 'kwwlkkk.', '.kkk....'], '#000',
      { k: '#3a3e4c', w: '#ffffff', l: '#c8ccd8', W: '#ffffff' });
    // feu rouge de départ
    iconTex(this, 'f1light', ['.kkk.', 'krrrk', 'krRrk', 'krrrk', '.kkk.'], '#000', { k: '#101014', r: '#e8202a', R: '#ff8a8a' });
  },
});

(() => {
  const P = GameScene.prototype;
  const baseTex = P.makeExtraTextures;
  P.makeExtraTextures = function () {
    if (baseTex) baseTex.call(this);
    this.makeLnTextures();
  };
  const baseStep = P.bzStep;
  P.bzStep = function (pl, other, now) {
    if (baseStep) baseStep.call(this, pl, other, now);
    this.lnStep(pl, now);
  };
  const baseProj = P.bzProj;
  P.bzProj = function (p, now) {
    if (baseProj && baseProj.call(this, p, now)) return true;
    return this.lnProj(p, now);
  };
  // effets des coups de LN4
  const baseFx = P.extraFx;
  P.extraFx = function (pl, m, fx, b, f) {
    if (baseFx) baseFx.call(this, pl, m, fx, b, f);
    if (fx.smoke) {
      const n = fx.smoke === 'big' ? 14 : 6;
      for (let i = 0; i < n; i++) {
        const dir = fx.smoke === 'big' ? (i % 2 ? 1 : -1) : -f;
        this.time.delayedCall(i * 25, () => this.smokeFx(b.x + dir * (10 + Math.random() * 20), b.y + 30, dir, fx.smoke === 'big' ? 1.4 : 0.8));
      }
    }
    if (fx.lights) {
      // les 5 feux rouges au-dessus de lui, qui s'éteignent d'un coup au départ
      for (let i = 0; i < 5; i++) {
        const q = this.add.image(b.x + (i - 2) * 22, b.y - 96, 'f1light').setScale(PX).setDepth(31);
        this.tweens.add({ targets: q, alpha: 0, delay: 80, duration: 120, onComplete: () => q.destroy() });
      }
    }
    if (fx.champ) {
      // jet de champagne vers le bas (il s'envole), mousse dorée
      for (let i = 0; i < 18; i++) {
        const q = this.add.rectangle(b.x + (Math.random() - 0.5) * 16, b.y + 20, 6, 6, i % 3 ? 0xfff0a0 : 0xffffff).setDepth(30);
        this.tweens.add({ targets: q, x: q.x + (Math.random() - 0.5) * 90, y: q.y + 60 + Math.random() * 90, alpha: 0, scale: 0.4, delay: i * 14, duration: 380, onComplete: () => q.destroy() });
      }
    }
    if (fx.shuttleFx) {
      const q = this.add.image(b.x + f * 40, b.y - 30, 'shuttle').setScale(PX * 0.7).setDepth(31).setAngle(f > 0 ? -45 : -135);
      this.tweens.add({ targets: q, x: q.x + f * 160, y: q.y - 120, alpha: 0, duration: 380, onComplete: () => q.destroy() });
    }
  };
})();

// ===========================================================================
// MOVESETS — grammaire commune à tous les persos (voir le doc « Brawl Proto — refonte du combat »)
//
// Commandes : LÉGER, LOURD, SPÉCIAL + direction du joystick (neutre / avant / haut / bas), lues au moment de l'appui.
//  LÉGER au sol   : nL (sans direction : enchaînement de 3 coups en rappuyant), sL (avant), uL (haut), dL (bas, fait décoller)
//  LÉGER en l'air : sA (avant ou neutre), uA (haut), dA (bas)
//  LOURD au sol   : sH (avant ou neutre), uH (haut), dH (bas) — se chargent en gardant LOURD appuyé (chargeMax)
//  LOURD en l'air : uAH (haut, avant ou neutre : coup vers le haut = retour, une fois par saut), dAH (bas : plongeon)
//  SPÉCIAL        : nS (neutre ou avant), uS (haut), dS (bas), chacune avec sa recharge (cd) ; en l'air la même
//                   (ou nSA/uSA/dSA si le perso en a une version aérienne). onceAir = une fois par saut.
// Règles de combo (game.js) : un léger qui TOUCHE peut être coupé par un autre léger, un lourd, une spéciale ou
// l'esquive de poursuite (3 annulations au plus). Usure : un coup répété dans les 5 derniers qui ont touché perd de
// sa force (mid = identifiant du coup). Gravity Cancel : esquive aérienne sur place puis attaque = coup du sol en l'air.
//
// Chiffres des coups (en ms et px) : startup (démarrage), active (durée où il touche), total (fin comprise),
// w/h/ox/oy (zone de frappe), dmg (dégâts), kb/ks (recul de base / qui grandit avec les dégâts), ang (angle),
// stun (étourdissement), combo (avantage garanti en ms si le coup touche), pop (petit envol garanti).
// ===========================================================================
(() => {
  // ---- gabarits communs (les persos les ajustent) ---------------------------------------------------------
  // coup d'enchaînement (1er et 2e coups)

// ===========================================================================
// ANIMATION D'AFFICHAGE : chaque perso a deux objets
//  - pl.sprite : le corps physique (invisible), seul à compter pour le combat
//  - pl.view   : l'image qu'on voit, qui suit le corps et ajoute la souplesse : écrasement à l'atterrissage,
//    étirement au saut, préparation et détente des coups, tremblement quand on est touché, vrille quand on est
//    éjecté fort, petit balancement en courant, respiration à l'arrêt.
// Rien ici ne touche la simulation : en ligne, les deux téléphones restent identiques.
// Postures en plus (si le dessin existe) : '<coup>Pre' pendant la préparation, 'fall' en chute, 'crouch' à
// l'atterrissage, course en 4 temps (run0, run2, run1, run3).
// ===========================================================================
(() => {
  const P = GameScene.prototype;
  const baseMake = P.makePlayer;
  P.makePlayer = function (charId, x, y, isHuman) {
    const pl = baseMake.call(this, charId, x, y, isHuman);
    const s = pl.sprite;
    pl.view = this.add.image(s.x, s.y, s.texture.key).setDepth(s.depth);
    s.setVisible(false);
    pl.anim = { sx: 1, sy: 1, ang: 0, spin: 0, ox: 0, oy: 0, wasGround: true, prevVy: 0, stunSeen: 0, shake: 0, land: 0, t: 0, key: '' };
    return pl;
  };
  const baseUpdate = P.update;
  P.update = function (time, delta) {
    baseUpdate.call(this, time, delta);
    const dt = Math.min(delta, 50) / 1000;
    if (this.p1 && this.p2 && this.p1.view) {
      this.syncView(this.p1, dt);
      this.syncView(this.p2, dt);
    }
    this.updateCamera(dt);
  };

  const lerp = (a, b, k) => a + (b - a) * k;
  // la posture existe-t-elle vraiment dans la planche dessinée ? (sinon la texture n'est qu'une copie de la garde)
  const PNG_HAS = (ch, n) => !(typeof PNG_CHARS !== 'undefined' && PNG_CHARS[ch]) || PNG_CHARS[ch].names.includes(n);

  const CAM_MIN_Z = 0.72; // dézoom maximal quand les persos sont très loin (plus de place sur les côtés et en haut)
  Object.assign(P, {
    // --- CAMÉRA À LA BRAWLHALLA : elle suit les deux persos et zoome quand ils sont proches.
    // Une deuxième caméra, fixe, affiche l'interface (profondeur >= 50 : barre de vie, boutons, menus).
    updateCamera(dt) {
      const cam = this.cameras.main;
      if (!this.uiCam || !this.cameras.cameras.includes(this.uiCam)) {
        this.uiCam = this.cameras.add(0, 0, this.W, this.H);
        this.uiCam.transparent = true;
        cam.setBounds(0, 0, this.W, this.H);
        this.camZ = 1;
        this.camX = this.W / 2;
        this.camY = this.H / 2;
      }
      const ui = this.uiCam;
      // 3e caméra, dessinée en premier : le décor du fond (profondeur <= -5). Quand la caméra du combat
      // dézoome (persos très loin), le fond, lui, ne rapetisse pas : il couvre toujours tout l'écran.
      if (!this.bgCam || !this.cameras.cameras.includes(this.bgCam)) {
        this.bgCam = this.cameras.add(0, 0, this.W, this.H);
        const arr = this.cameras.cameras;
        arr.splice(arr.indexOf(this.bgCam), 1);
        arr.unshift(this.bgCam);
      }
      const bgc = this.bgCam;
      const list = this.children.list;
      for (let i = 0; i < list.length; i++) {
        const o = list[i];
        o.cameraFilter = o.depth >= 50 ? cam.id | bgc.id : o.depth <= -5 ? cam.id | ui.id : ui.id | bgc.id;
      }
      // cible : les deux persos (vivants) avec de la marge
      let tz = 1, tx = this.W / 2, ty = this.H / 2;
      const inMatch = this.p1 && this.p2 && this.p1.view && (this.state === 'play' || this.state === 'countdown') && !this.over;
      if (inMatch && SETTINGS.zoom !== false) {
        // un perso invisible (DOUBLURE) : la caméra suit sa silhouette de billets, pas lui
        const pts = [this.p1, this.p2].filter((p) => p.stocks > 0 || this.training).map((p) => {
          const d = (this.nowT || 0) < (p.invisUntil || 0) && this.projs.find((q) => !q.dead && q.id === p.decoyId);
          return d ? { x: d.x, y: d.y } : p.sprite;
        });
        if (pts.length) {
          const x0 = Math.min(...pts.map((p) => p.x)), x1 = Math.max(...pts.map((p) => p.x));
          const y0 = Math.min(...pts.map((p) => p.y)), y1 = Math.max(...pts.map((p) => p.y));
          const w = x1 - x0 + 520, h = y1 - y0 + 380;
          tz = Math.max(CAM_MIN_Z, Math.min(L.portrait ? 1.9 : 1.75, this.W / w, this.H / h));
          tx = (x0 + x1) / 2;
          ty = (y0 + y1) / 2 - 30;
        }
      }
      const k = Math.min(1, dt * 4);
      this.camZ += (tz - this.camZ) * k;
      this.camX += (tx - this.camX) * Math.min(1, dt * 6);
      this.camY += (ty - this.camY) * Math.min(1, dt * 6);
      cam.setZoom(this.camZ);
      // dézoomé (< 1) : on peut voir un peu au-delà de l'écran de base (zone de jeu plus grande)
      const zo = Math.min(this.camZ, 1);
      const vw = this.W / zo, vh = this.H / zo;
      cam.setBounds(this.W / 2 - vw / 2, L.baseY - L.baseY / zo, vw, vh);
      cam.centerOn(this.camX, this.camY);
      // le fond suit la caméra du combat quand elle zoome (> 1), reste fixe quand elle dézoome
      if (this.camZ >= 1) {
        bgc.setZoom(this.camZ);
        bgc.setBounds(0, 0, this.W, this.H);
        bgc.centerOn(cam.midPoint.x, cam.midPoint.y);
      } else {
        bgc.setZoom(1);
        bgc.centerOn(this.W / 2, this.H / 2);
      }
    },

    hasTex(key) {
      if (!this._texOk) this._texOk = new Map();
      let v = this._texOk.get(key);
      if (v === undefined) {
        v = this.textures.exists(key);
        this._texOk.set(key, v);
      }
      return v;
    },

    syncView(pl, dt) {
      const s = pl.sprite, v = pl.view, a = pl.anim, b = s.body;
      if (!v || !v.active) return;
      const now = this.nowT || 0;
      const frozen = this.freezeLeft > 0 || this.over || this.state !== 'play';
      a.t += dt;
      const grounded = !pl.ledgeSide && (b.blocked.down || b.touching.down);
      const vx = b.velocity.x, vy = b.velocity.y;
      const stunned = now < pl.stunUntil;
      let tsx = 1, tsy = 1, tang = 0, tox = 0;
      // --- événements
      if (!frozen) {
        if (a.wasGround && !grounded && vy < -150 && !stunned) { a.sx = 0.84; a.sy = 1.18; }
        if (!a.wasGround && grounded && a.prevVy > 220) {
          const k = Math.min(a.prevVy / 1300, 1);
          a.sx = 1.12 + 0.12 * k;
          a.sy = 0.86 - 0.1 * k;
          a.land = 0.09;
          this.sfx('land', k);
          if (k > 0.3) this.dust(s.x, b.bottom, 0, 3, pl.def.fx);
        }
        a.wasGround = grounded;
        a.prevVy = vy;
      }
      // coup reçu : petit écrasement et tremblement
      if (pl.stunStart && pl.stunStart !== a.stunSeen && stunned) {
        a.stunSeen = pl.stunStart;
        a.shake = 0.18;
        a.sx = 0.86;
        a.sy = 1.12;
      }
      a.land = Math.max(0, a.land - dt);
      // --- cibles selon l'état
      const atk = pl.atk;
      if (atk && !stunned) {
        const m = atk.m;
        const hitAt = atk.hitAt, act = m.active || 120;
        if (atk.charging) { tsx = 1.05; tsy = 0.96; tang = -pl.facing * 4; }
        else if (atk.chg && now < hitAt) {
          // lourd en charge : ramassé, et il tremble de plus en plus
          tsx = 1.1; tsy = 0.9; tang = -pl.facing * 8; tox = -pl.facing * 4;
          a.shake = Math.max(a.shake, 0.03 * Math.min(atk.chg / (m.chargeMax || 500), 1) + 0.01);
        }
        else if (now < hitAt) {
          // préparation : on se ramasse et on recule le buste
          const k = Math.min((now - atk.start) / Math.max(hitAt - atk.start, 1), 1);
          tsx = 1 + 0.07 * k; tsy = 1 - 0.06 * k; tang = -pl.facing * 6 * k; tox = -pl.facing * 3 * k;
        } else if (now < hitAt + act) {
          // détente : on s'étire dans le sens du coup
          tsx = 1.1; tsy = 0.94; tang = pl.facing * 5; tox = pl.facing * 5;
          if ((m.oy || 0) < -40) { tsx = 0.94; tsy = 1.1; tang = 0; tox = 0; } // coups vers le haut
        } else { tang = pl.facing * 2; }
      } else if (stunned) {
        const sp = Math.hypot(vx, vy);
        if (sp > 950 && !grounded) a.spin += (vx >= 0 ? 1 : -1) * dt * Math.min(sp, 2200) * 0.9;
        tang = Math.max(-20, Math.min(20, vx / 60));
      } else if (!grounded) {
        tsy = 1 + Math.min(Math.abs(vy) / 9000, 0.07);
        tsx = 1 - Math.min(Math.abs(vy) / 12000, 0.05);
        tang = Math.max(-6, Math.min(6, vx / 120));
      } else if (Math.abs(vx) > 60) {
        tang = Math.max(-5, Math.min(5, vx / 70));
      } else {
        tsy = 1 + 0.012 * Math.sin(a.t * 3.2);
      }
      if (!stunned) a.spin = lerp(a.spin, Math.round(a.spin / 360) * 360, Math.min(1, dt * 10));
      // --- lissage (ressort amorti)
      if (!frozen) {
        const k = Math.min(1, dt * 16);
        a.sx = lerp(a.sx, tsx, k);
        a.sy = lerp(a.sy, tsy, k);
        a.ang = lerp(a.ang, tang, Math.min(1, dt * 12));
        a.ox = lerp(a.ox, tox, Math.min(1, dt * 14));
      }
      let jx = 0, jy = 0;
      if (a.shake > 0) {
        a.shake -= dt;
        jx = (Math.random() - 0.5) * 7;
        jy = (Math.random() - 0.5) * 4;
      }
      // course : petit rebond
      const running = grounded && Math.abs(vx) > 60 && !atk && !stunned;
      const bob = running ? -Math.abs(Math.sin(a.t * 11)) * 2.5 : 0;

      // --- posture affichée (variantes dessinées si elles existent)
      let key = s.texture.key;
      const ch = pl.char;
      // version dorée (BIGZINZIN en JACKPOT) : même posture, suffixe « _g »
      const gs = key.endsWith('_g') ? '_g' : '';
      const name = key.slice(ch.length + 1, key.length - gs.length);
      if (atk && !stunned && now < atk.hitAt && !atk.m.prePose && !atk.charging) {
        const pre = `${ch}_${atk.pose || atk.m.pose}Pre${gs}`;
        if (this.hasTex(pre) && PNG_HAS(ch, `${atk.pose || atk.m.pose}Pre`)) key = pre;
      } else if (name === 'jump' && vy > 140 && this.hasTex(`${ch}_fall${gs}`)) key = `${ch}_fall${gs}`;
      else if ((name === 'idle0' || name === 'idle1') && a.land > 0 && this.hasTex(`${ch}_crouch${gs}`)) key = `${ch}_crouch${gs}`;
      else if ((name === 'run0' || name === 'run1') && this.hasTex(`${ch}_run2${gs}`)) {
        key = `${ch}_${['run0', 'run2', 'run1', 'run3'][Math.floor(now / 85) % 4]}${gs}`;
      }
      if (key !== a.key) {
        v.setTexture(key);
        a.key = key;
      }
      // --- recopie de l'apparence du corps
      const h = s.displayHeight;
      v.scaleX = s.scaleX * a.sx;
      v.scaleY = s.scaleY * a.sy;
      v.setFlipX(s.flipX);
      v.angle = s.angle + a.ang + a.spin;
      v.x = s.x + a.ox + jx;
      v.y = s.y + (h / 2) * (1 - a.sy) + bob + jy;
      v.alpha = s.alpha;
      v.visible = pl.stocks > 0 || this.training;
      v.depth = s.depth;
      if (s.tintFill) v.setTintFill(s.tintTopLeft);
      else if (s.isTinted) v.setTint(s.tintTopLeft);
      else if (v.isTinted) v.clearTint();
    },
  });
})();

// Style "cel" : aplats + gros contour encre, dans la même palette que les sprites pixel.

const INK = '#14121c';

function hdSeg(x, y, a, l) {
  const r = (a * Math.PI) / 180;
  return [x + Math.sin(r) * l, y + Math.cos(r) * l];
}

function hdStroke(c, pts, w, col) {
  c.lineCap = 'round';
  c.lineJoin = 'round';
  c.beginPath();
  c.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) c.lineTo(pts[i][0], pts[i][1]);
  c.strokeStyle = INK;
  c.lineWidth = w + 10;
  c.stroke();
  c.strokeStyle = col;
  c.lineWidth = w;
  c.stroke();
}

function hdPoly(c, pts, fill, lw) {
  c.beginPath();
  c.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length; i++) c.lineTo(pts[i][0], pts[i][1]);
  c.closePath();
  if (fill) {
    c.fillStyle = fill;
    c.fill();
  }
  if (lw) {
    c.lineJoin = 'round';
    c.strokeStyle = INK;
    c.lineWidth = lw;
    c.stroke();
  }
}

function hdEllipse(c, x, y, rx, ry, fill, lw, rot) {
  c.beginPath();
  c.ellipse(x, y, rx, ry, rot || 0, 0, Math.PI * 2);
  if (fill) {
    c.fillStyle = fill;
    c.fill();
  }
  if (lw) {
    c.strokeStyle = INK;
    c.lineWidth = lw;
    c.stroke();
  }
}

  c.fillStyle = S.jacket;
  c.fill();
  c.lineJoin = 'round';
  c.strokeStyle = INK;

  c.beginPath();

// --- Silhouette complète en squelette (angles en degres depuis "vers le bas", + = vers l'avant) ---
// P = { lean, tilt, mood, armF:[a1,a2], armB:[a1,a2], legF:[a1,a2], legB:[a1,a2], flap }
function hdHuman(c, ox, oy, S, P) {
  c.save();
  c.translate(ox, oy);
  const lean = (P.lean * Math.PI) / 180;
  const up = [Math.sin(lean), -Math.cos(lean)];
  const nrm = [Math.cos(lean), Math.sin(lean)];
  const sh = [up[0] * 128, up[1] * 128];
  const limb = (st, a1, a2, l1, l2) => {
    const m = hdSeg(st[0], st[1], a1, l1);
    return [st, m, hdSeg(m[0], m[1], a2, l2)];
  };
  const aB = limb(sh, P.armB[0], P.armB[1], 92, 86);
  const aF = limb(sh, P.armF[0], P.armF[1], 92, 86);
  const lB = limb([0, 0], P.legB[0], P.legB[1], 118, 116);
  const lF = limb([0, 0], P.legF[0], P.legF[1], 118, 116);

  const hand = (p) => hdEllipse(c, p[0], p[1], 18, 17, S.hand || S.skin, 5);
  const shoe = (l, a2) => {
    const e = l[2];
    const r = (a2 * Math.PI) / 180;
    const f = [Math.cos(r), -Math.sin(r)];
    const sx = e[0] + f[0] * 16 - Math.sin(r) * 2;
    const sy = e[1] + f[1] * 16 - Math.cos(r) * 2;
    hdEllipse(c, sx, sy, 34, 15, S.shoe, 5, Math.atan2(f[1], f[0]));
  };
  const arm = (a, dark) => {
    const sl = dark ? S.backArm || S.jacketDk : S.sleeve;
    if (S.foreSleeve === null) {
      hdStroke(c, [a[1], a[2]], 28, dark ? S.backArm || S.skin : S.skin);
      hdStroke(c, [a[0], a[1]], 34, sl);
    } else hdStroke(c, a, 32, sl);
    hand(a[2]);
  };
  const leg = (l, a2, dark) => {
    if (S.thigh === S.shin) hdStroke(c, l, 44, dark ? S.jacketDk : S.thigh);
    else {
      hdStroke(c, [l[1], l[2]], 36, S.shin);
      hdStroke(c, [l[0], l[1]], 50, S.thigh);
    }
    shoe(l, a2);
  };

  arm(aB, true);
  leg(lB, P.legB[1], true);
  // torse
  hdStroke(c, [[0, 0], sh], 84, S.jacket);
  // détails veste / chemise / cravate
  const pt = (k, n) => [sh[0] - up[0] * k + nrm[0] * n, sh[1] - up[1] * k + nrm[1] * n];
  if (S.shirt) {
    hdPoly(c, [pt(-16, 10), pt(-16, 30), pt(70, 22)], S.shirt, 5);
    hdPoly(c, [pt(-16, 10), pt(30, 12), pt(-16, 34)], S.shirt, 0);
    // revers
    hdPoly(c, [pt(-18, 36), pt(80, 24), pt(40, 40)], S.jacketLt, 5);
  } else if (!S.noStripe) {
    // maillot : bande + manche
    hdPoly(c, [pt(-10, -34), pt(-10, 36), pt(130, 36), pt(130, -34)], null, 0);
    c.strokeStyle = '#ffffff';
    c.lineWidth = 10;
    c.beginPath();
    c.moveTo(pt(30, 40)[0], pt(30, 40)[1]);
    c.lineTo(pt(100, 40)[0], pt(100, 40)[1]);
    c.stroke();
  }
  c.strokeStyle = INK;
  c.lineWidth = 5;
  c.beginPath();
  c.moveTo(pt(80, 40)[0], pt(80, 40)[1]);
  c.lineTo(pt(80, 44)[0] - 2, pt(80, 44)[1] + 2);
  c.stroke();
  if (S.tie) {
    const t0 = pt(-4, 24), t1 = pt(80, 30);
    const fl = P.flap || 0;
    hdPoly(c, [t0, [t0[0] - 8, t0[1] + 6], [t1[0] - fl - 8, t1[1] + 6], [t1[0] - fl + 8, t1[1] - 6]], S.tie, 4);
  }
  if (S.skirt) {
    // robe (ASTRA)
    hdPoly(c, [[-46, -6], [54, -6], [74, 150], [-68, 158]], S.jacket, 6);
    c.strokeStyle = S.hem || '#ffd166';
    c.lineWidth = 6;
    c.beginPath();
    c.moveTo(-66, 150);
    c.lineTo(72, 144);
    c.stroke();
  }
  leg(lF, P.legF[1], false);
  if (S.pauldron) hdEllipse(c, sh[0] + 4, sh[1] + 10, 40, 30, S.pauldron, 6);
  // cou + tête
  const hc = [sh[0] + up[0] * 56 + nrm[0] * 6, sh[1] + up[1] * 56 + nrm[1] * 6];
  hdStroke(c, [sh, hc], 36, S.skin2);
  c.save();
  c.translate(hc[0], hc[1]);
  c.rotate(lean * 0.6 + ((P.tilt || 0) * Math.PI) / 180);
  hdHeadSide(c, S, P.mood);
  c.restore();
  arm(aF, false);
  c.restore();
  return { hip: [ox, oy], hand: [ox + aF[2][0], oy + aF[2][1]], foot: [ox + lF[2][0], oy + lF[2][1]], head: hc };
}

// --- Ballon ------------------------------------------------------------------
function drawBall(c, n) {
  c.clearRect(0, 0, n, n);
  const r = n / 2 - 5;
  const cx = n / 2, cy = n / 2;
  c.save();
  c.beginPath();
  c.arc(cx, cy, r, 0, Math.PI * 2);
  c.fillStyle = '#ffffff';
  c.fill();
  c.clip();
  const pent = (x, y, R, rot) => {
    c.beginPath();
    for (let i = 0; i < 5; i++) {
      const a = rot + (i * 2 * Math.PI) / 5;
      c.lineTo(x + Math.cos(a) * R, y + Math.sin(a) * R);
    }
    c.closePath();
    c.fillStyle = '#1b1822';
    c.fill();
  };
  pent(cx, cy, r * 0.34, -Math.PI / 2);
  for (let i = 0; i < 5; i++) {
    const a = -Math.PI / 2 + (i * 2 * Math.PI) / 5 + Math.PI / 5;
    pent(cx + Math.cos(a) * r * 0.95, cy + Math.sin(a) * r * 0.95, r * 0.3, a + Math.PI);
    c.strokeStyle = '#1b1822';
    c.lineWidth = 3;
    c.beginPath();
    c.moveTo(cx + Math.cos(a - Math.PI / 5) * r * 0.31, cy + Math.sin(a - Math.PI / 5) * r * 0.31);
    c.lineTo(cx + Math.cos(a - Math.PI / 5) * r * 0.66, cy + Math.sin(a - Math.PI / 5) * r * 0.66);
    c.stroke();
  }
  // ombrage
  const g = c.createRadialGradient(cx - r * 0.35, cy - r * 0.35, r * 0.1, cx, cy, r);
  g.addColorStop(0, 'rgba(255,255,255,0)');
  g.addColorStop(1, 'rgba(60,60,110,0.38)');
  c.fillStyle = g;
  c.fillRect(0, 0, n, n);
  c.restore();
  c.beginPath();
  c.arc(cx, cy, r, 0, Math.PI * 2);
  c.strokeStyle = INK;
  c.lineWidth = 7;
  c.stroke();
}

// --- Vague d'énergie (poussée) ----------------------------------------------------
function drawWave(c, W, H) {
  c.clearRect(0, 0, W, H);
  const cy = H / 2;
  const layers = [
    [1.0, 'rgba(30,170,255,0.45)'],
    [0.76, 'rgba(110,225,255,0.8)'],
    [0.48, '#e2fcff'],
    [0.22, '#ffffff'],
  ];
  layers.forEach(([k, col]) => {
    c.beginPath();
    for (let x = 0; x <= W; x += 6) {
      const taper = Math.min(1, x / 90);
      const hh = (H / 2) * k * taper * (0.78 + 0.22 * Math.sin(x / 31 + k * 4));
      if (x === 0) c.moveTo(x, cy - hh);
      else c.lineTo(x, cy - hh);
    }
    for (let x = W; x >= 0; x -= 6) {
      const taper = Math.min(1, x / 90);
      const hh = (H / 2) * k * taper * (0.78 + 0.22 * Math.sin(x / 27 + k * 3));
      c.lineTo(x, cy + hh);
    }
    c.closePath();
    c.fillStyle = col;
    c.fill();
  });
  // arcs d'énergie
  c.strokeStyle = 'rgba(255,255,255,0.85)';
  c.lineWidth = 4;
  for (let i = 0; i < 9; i++) {
    const x = 90 + i * 90;
    c.beginPath();
    c.ellipse(x, cy, 22, (H / 2) * 0.8, 0, -1.2, 1.2);
    c.stroke();
  }
}

// --- Code pénal (livre) -------------------------------------------------------------
function drawBook(c, W, H) {
  c.clearRect(0, 0, W, H);
  // tranche des pages
  hdPoly(c, [[14, H - 14], [W - 10, H - 14], [W - 10, H - 34], [14, H - 34]], '#f6efdc', 5);
  c.strokeStyle = '#c9bb96';
  c.lineWidth = 2;
  for (let i = 1; i < 4; i++) {
    c.beginPath();
    c.moveTo(18, H - 14 - i * 5);
    c.lineTo(W - 14, H - 14 - i * 5);
    c.stroke();
  }
  // couverture
  hdPoly(c, [[8, 10], [W - 16, 10], [W - 16, H - 34], [8, H - 34]], '#7a1f2b', 6);
  // dos
  hdPoly(c, [[8, 10], [30, 10], [30, H - 34], [8, H - 34]], '#541520', 6);
  // cadre doré
  c.strokeStyle = '#f2c14e';
  c.lineWidth = 3;
  c.strokeRect(42, 20, W - 70, H - 64);
  // titre
  c.fillStyle = '#f2c14e';
  c.textAlign = 'center';
  c.textBaseline = 'middle';
  c.font = 'bold 26px Georgia, "Times New Roman", serif';
  c.fillText('CODE', 42 + (W - 70) / 2, 42);
  c.fillText('PÉNAL', 42 + (W - 70) / 2, 74);
  // balance de la justice (simple)
  c.strokeStyle = '#f2c14e';
  c.lineWidth = 3;
  c.beginPath();
  c.moveTo(W / 2 + 6, 88);
  c.lineTo(W / 2 + 6, 98);
  c.moveTo(W / 2 - 16, 92);
  c.lineTo(W / 2 + 28, 92);
  c.stroke();
}

// --- Fonds ------------------------------------------------------------------------
function drawGradBg(c, W, H, stops) {
  const g = c.createLinearGradient(0, 0, 0, H);
  stops.forEach(([p, col]) => g.addColorStop(p, col));
  c.fillStyle = g;
  c.fillRect(0, 0, W, H);
}

function drawHalftone(c, n) {
  c.clearRect(0, 0, n, n);
  c.fillStyle = '#ffffff';
  c.beginPath();
  c.arc(n / 2, n / 2, n * 0.26, 0, Math.PI * 2);
  c.fill();
  c.beginPath();
  c.arc(0, 0, n * 0.26, 0, Math.PI * 2);
  c.arc(n, 0, n * 0.26, 0, Math.PI * 2);
  c.arc(0, n, n * 0.26, 0, Math.PI * 2);
  c.arc(n, n, n * 0.26, 0, Math.PI * 2);
  c.fill();
}

const SAVE_KEY = 'brawl_campaign_v1';
function campSave() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify({ hero: camp.hero, ch: camp.ch })); } catch (e) {}
}
function campLoad() {
  try {
    const s = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null');
    if (s && playable().includes(s.hero) && s.ch >= 0 && s.ch < 6) return s;
  } catch (e) {}
  return null;
}
function campClear() {
  try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
}

function campOpp(hero, ch) {
  const others = playable().filter((x) => x !== hero);
  return ch < 5 ? others[ch] : hero;
}
function campChapterLines(ch) {
  const hero = camp.hero;
  const opp = campOpp(hero, ch);
  const key = ch < 5 ? opp : 'ombre';
  const title = ch < 5 ? `CHAPITRE ${ch + 1} : ${CHARS[opp].name}` : 'CHAPITRE FINAL : L\'OMBRE';
  const lines = [['title', title], ...STORY.intro[key]];
  return ch === 0 ? [...STORY.prologue, ...lines] : lines;
}

  drawBar() {

    const w = Math.min(Math.max(300, txt.length * 20 + 80), this.W - 40), h = 46, x = this.W / 2, y = 32;

    );

    this.menuButtons(
      [
        { label: 'JOUER', fn: () => this.showPlayMenu() },
        { label: 'CAMPAGNE', col: 0x4cc9f0, fn: () => this.showCampMenu() },
        { label: 'RÉGLAGES', col: 0xffb703, fn: () => this.showSettings() },
        { label: 'COMMENT JOUER', col: 0x6ee7b7, fn: () => this.showHelp() },

        .text(this.W / 2, this.H * (L.portrait ? 0.3 : 0.315), HELP_TXT + (window.matchMedia && matchMedia('(pointer: fine)').matches ? '\n\n' + HELP_KB : ''), { fontFamily: FONT, fontSize: L.portrait ? '18px' : '13px', color: '#cfd3ff', align: 'center', lineSpacing: 7 })

    const save = campLoad();
    if (!save) {
      campPick = true;
      this.showSelect();

    }
    this.menuBase('CAMPAGNE');
    const y0 = this.H * (L.portrait ? 0.36 : 0.46);
    this.menuButtons(
      [
        { label: `CONTINUER\n${CHARS[save.hero].name} - CHAP. ${save.ch + 1}/6`, fn: () => this.campResume(save) },
        { label: 'NOUVELLE PARTIE', col: 0xffb703, fn: () => { campPick = true; this.showSelect(); } },
        { label: 'RETOUR', col: 0x888888, fn: () => this.showMenu() },
      ],

    );
