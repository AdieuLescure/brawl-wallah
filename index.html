// ===========================================================================
// TERRAINS : « NUIT » (la ville, d'origine), « DÉSERT » (une planète de sable : dunes, deux lunes,
// dunes irrégulières, épice qui flotte, vers géants qui surgissent au loin, ornithoptère qui passe)
// et « CÉRÉMONIE » (gala.js : palais du cinéma, plateformes à elle).
// Nuit et désert : même terrain, mêmes plateformes ; seul le décor change.
// ===========================================================================
const STAGES = ['night', 'dune', 'gala'];
const STAGE_NAMES = { night: 'NUIT', dune: 'DÉSERT', gala: 'CÉRÉMONIE' };
// salle sans arène choisie (duel classé) : tirée du code de la salle, identique sur les deux téléphones
function stageFromCode(code) {
  let h = 0;
  for (const ch of String(code || '')) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
  return STAGES[h % STAGES.length];
}

Object.assign(GameScene.prototype, {
  pickStage() {
    // campagne : nuit, désert, cérémonie, nuit, désert, cérémonie (la finale a lieu à la cérémonie)
    if (camp) return STAGES[camp.ch % STAGES.length];
    // réglage : 0 nuit, 1 désert, 2 hasard (valeur par défaut, gardée pour les anciens réglages), 3 cérémonie
    const s = SETTINGS.stage === undefined ? 2 : SETTINGS.stage;
    if (s === 0) return 'night';
    if (s === 1) return 'dune';
    if (s === 3) return 'gala';
    return STAGES[Math.floor(Math.random() * STAGES.length)];
  },

  // ----- écran de choix de l'arène (avant le choix du perso) -----
  // next(id) : appelé avec l'arène choisie ; back : bouton RETOUR (menu JOUER par défaut)
  showStagePick(next, back) {
    this.menuBase('CHOISIS L\'ARÈNE', { small: true, noBar: true });
    const D = 120;
    const port = L.portrait;
    // v = valeur gardée dans SETTINGS.stage (2 = hasard, valeur historique par défaut)
    const opts = [
      { id: 'night', v: 0, name: 'NUIT', tex: 'bg' },
      { id: 'dune', v: 1, name: 'DÉSERT', tex: 'bg_dune' },
      { id: 'gala', v: 3, name: 'CÉRÉMONIE', tex: 'bg_gala' },
      { id: 'rand', v: 2, name: 'HASARD' },
    ].filter((o) => !o.tex || this.textures.exists(o.tex));
    const N = opts.length;
    const cur = SETTINGS.stage === undefined ? 2 : SETTINGS.stage;
    // cartes : une rangée en largeur ; en hauteur, une colonne (3 arènes) ou une grille 2 x 2 (4 cartes)
    const cols = port ? (N > 3 ? 2 : 1) : N, rows = Math.ceil(N / cols);
    const top = 160, lab = 40, gap = port ? 20 : 24;
    const cw = Math.min(420, Math.floor((this.W - (port ? 80 : 60) - gap * (cols - 1)) / cols));
    const ph = Math.min(Math.round(cw * (port && cols === 1 ? 0.5 : 0.62)), Math.floor((this.H - top - 150) / rows) - lab - 16);
    this.uiBtns = [];
    opts.forEach((o, i) => {
      const col = i % cols, row = Math.floor(i / cols);
      const cx = this.W / 2 + (col - (cols - 1) / 2) * (cw + gap);
      const y0 = top + (port ? 0 : 20) + row * (ph + lab + 16);
      const left = cx - cw / 2;
      const sel = cur === o.v;
      this.ui.push(this.add.rectangle(cx, y0 + (ph + lab) / 2, cw + 8, ph + lab + 8, 0x1a1d33, 1).setStrokeStyle(4, sel ? 0xffd166 : 0xf72585).setDepth(D));
      // aperçu : un morceau du décor autour de l'arène (part = [i, n] : seulement la i-ème tranche sur n)
      const preview = (id, tex, part) => {
        const a = cw / ph;
        let wh = Math.min(this.H * 0.8, this.W / a), ww = wh * a;
        if (ww < L.mainW + 120) { ww = Math.min(this.W, L.mainW + 120); wh = ww / a; }
        // la CÉRÉMONIE se joue plus en hauteur (passerelle, écran géant) : on cadre un peu plus haut
        const wx0 = this.W / 2 - ww / 2, wy0 = Math.max(0, Math.min(this.H - wh, L.baseY + 60 - wh * (id === 'gala' ? 0.9 : 0.78)));
        const k = cw / ww;
        const img = this.add.image(0, 0, tex).setOrigin(0).setDepth(D + 1);
        const tk = img.width / this.bgImg.displayWidth; // pixels de texture par pixel d'écran
        const hx = part ? (ww / part[1]) * part[0] : 0, hw = part ? ww / part[1] : ww;
        img.setCrop((wx0 + hx) * tk, wy0 * tk, hw * tk, wh * tk);
        img.scale = k / tk; // échelle réelle (sans la correction automatique des textures HD)
        img.setPosition(left - wx0 * k, y0 - wy0 * k);
        this.ui.push(img);
        if (part) return;
        this.stageShapes(id).forEach((q) => {
          const py = y0 + (q.y - wy0) * k;
          if (py - (q.h * k) / 2 < y0 || py + (q.h * k) / 2 > y0 + ph) return;
          this.ui.push(this.add.image(left + (q.x - wx0) * k, py, q.key).setDisplaySize(q.w * k, q.h * k).setDepth(D + 2));
        });
      };
      if (o.tex) preview(o.id, o.tex);
      else {
        const texs = opts.filter((q) => q.tex);
        texs.forEach((q, j) => preview(q.id, q.tex, [j, texs.length]));
        this.ui.push(this.add.rectangle(cx, y0 + ph / 2, cw, ph, 0x0b0d1f, 0.45).setDepth(D + 2));
        this.ui.push(this.add.text(cx, y0 + ph / 2, '?', { fontFamily: FONT, fontSize: Math.round(ph * 0.5) + 'px', color: '#ffd166', stroke: '#000', strokeThickness: 8 }).setOrigin(0.5).setDepth(D + 3));
      }
      this.ui.push(this.add.text(cx, y0 + ph + lab / 2 + 2, o.name, { fontFamily: FONT, fontSize: cols > 1 && N > 3 ? '17px' : '20px', color: sel ? '#ffd166' : '#ffffff', stroke: '#000', strokeThickness: 5 }).setOrigin(0.5).setDepth(D + 1));
      this.uiBtns.push({
        x: cx, y: y0 + (ph + lab) / 2, w: cw + 8, h: ph + lab + 8,
        fn: () => {
          SETTINGS.stage = o.v;
          if (typeof saveSettings === 'function') saveSettings();
          const id = this.pickStage();
          this.applyStage(id);
          next(id);
        },
      });
    });
    const yb = port ? this.H - 80 : this.H - 70;
    const r = this.add.rectangle(this.W / 2, yb, 300, 64, 0x1a1d33, 1).setStrokeStyle(4, 0x888888).setDepth(D);
    const t = this.add.text(this.W / 2, yb, 'RETOUR', { fontFamily: FONT, fontSize: '18px', color: '#fff', stroke: '#000', strokeThickness: 5 }).setOrigin(0.5).setDepth(D + 1);
    this.ui.push(r, t);
    this.uiBtns.push({ x: this.W / 2, y: yb, w: 300, h: 64, fn: () => (back ? back() : this.showPlayMenu()) });
  },

  // formes posées sur l'aperçu d'une arène (terrain, plateformes, logos) : { key, x, y, w, h } en pixels du monde
  stageShapes(id) {
    const out = [];
    const mp = this.mainPlat;
    if (!mp) return out;
    const main = id === 'gala' ? 'main_gala' : id === 'dune' ? 'main_dune' : 'main';
    const mh = id === 'gala' && typeof GALA !== 'undefined' ? GALA.mainH : 56; // le parvis de la cérémonie est plus épais
    out.push({ key: main, x: mp.x, y: L.baseY + mh / 2, w: mp.displayWidth, h: mh });
    if (id === 'gala' && this.galaGeom) {
      const s = this.galaArt().scr;
      out.push({ key: 'gala_scr_logo', x: ((s.x0 + s.x1) / 2) * GPX, y: ((s.y0 + s.y1) / 2) * GPX, w: (s.x1 - s.x0) * GPX, h: (s.y1 - s.y0) * GPX });
      this.galaGeom().forEach((g) => out.push({ key: g.key, x: (g.x0 + g.x1) / 2, y: g.top + g.h / 2, w: g.x1 - g.x0, h: g.h }));
    } else (this.softPlats || []).forEach((p) => out.push({ key: id === 'dune' ? 'soft_dune' : 'soft', x: p.x, y: p.y, w: p.displayWidth, h: p.displayHeight }));
    return out;
  },

  applyStage(id) {
    if (id === 'gala' && !this.textures.exists('bg_gala')) id = 'night';
    this.stageId = id;
    const dune = id === 'dune', gala = id === 'gala';
    if (this.bgImg) this.bgImg.setTexture(gala ? 'bg_gala' : dune ? 'bg_dune' : 'bg');
    if (this.mainPlat) this.mainPlat.setTexture(gala ? 'main_gala' : dune ? 'main_dune' : 'main');
    (this.softPlats || []).forEach((p) => p.setTexture(dune ? 'soft_dune' : 'soft'));
    if (this.stageFx) this.stageFx.forEach((o) => o.remove ? o.remove(false) : o.destroy());
    this.stageFx = [];
    // plateformes propres à la CÉRÉMONIE (les autres arènes gardent les 3 plateformes d'origine)
    if (this.setGalaGeom) this.setGalaGeom(gala);
    if (dune) this.duneAmbience();
    if (gala) this.galaAmbience();
  },

  // ----- dessin du désert (en pixels d'art, agrandis x4) -----
  buildDune() {
    const w = Math.ceil(this.W / PX), h = Math.ceil(this.H / PX);
    const horizon = Math.round(L.baseY / PX) + 6;
    let seed = 11;
    const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
    mkCanvas(this, 'bg_dune', w, h, (c) => {
      // ciel de fin de journée : indigo en haut, braise, ambre à l'horizon (par bandes)
      const stops = [[22, 14, 44], [86, 30, 52], [196, 84, 42], [244, 168, 86]];
      for (let y = 0; y < h; y++) {
        const t = Math.min(y / (horizon - 4), 1);
        const q = Math.floor(t * 12) / 12;
        const seg = Math.min(2, Math.floor(q * 3));
        const u = q * 3 - seg;
        const a = stops[seg], b = stops[seg + 1];
        c.fillStyle = `rgb(${a.map((v, i) => Math.round(v + (b[i] - v) * u)).join(',')})`;
        c.fillRect(0, y, w, 1);
      }
      // quelques étoiles tout en haut
      for (let i = 0; i < w * 0.12; i++) {
        c.fillStyle = '#ffd9b0';
        c.fillRect(Math.floor(rnd() * w), Math.floor(rnd() * horizon * 0.22), 1, 1);
      }
      // deux lunes
      const disc = (cx, cy, r, col, edge) => {
        for (let y = -r; y <= r; y++)
          for (let x = -r; x <= r; x++)
            if (x * x + y * y <= r * r) {
              c.fillStyle = x * x + y * y > (r - 1.2) * (r - 1.2) ? edge : col;
              c.fillRect(cx + x, cy + y, 1, 1);
            }
      };
      const m1x = Math.round(w * 0.18), m1y = Math.round(horizon * 0.32);
      disc(m1x, m1y, 7, '#f4e6d2', '#d8c2a8');
      c.fillStyle = '#d2b89c';
      [[-2, -1, 3, 2], [2, 2, 2, 2], [-1, 3, 2, 1]].forEach(([x, y, ww, hh]) => c.fillRect(m1x + x, m1y + y, ww, hh));
      disc(Math.round(w * 0.29), Math.round(horizon * 0.24), 3, '#ead6c0', '#c8ae94');
      // grand soleil bas, voilé par la poussière
      c.globalAlpha = 0.22;
      disc(Math.round(w * 0.62), horizon - 16, 22, '#ffd8a0', '#ffd8a0');
      c.globalAlpha = 1;
      disc(Math.round(w * 0.62), horizon - 16, 14, '#ffe2a8', '#f8c070');
      // dunes irrégulières : face raide à gauche (à l'ombre), longue pente douce vers la droite,
      // tailles et écarts au hasard, petites bosses sur les crêtes
      const layer = (base, minH, maxH, minW, maxW, col, crest, shade) => {
        const top = new Array(w + 1).fill(base), lee = new Array(w + 1).fill(false);
        let x0 = -Math.floor(rnd() * maxW * 0.5);
        while (x0 < w) {
          const dw = minW + Math.floor(rnd() * (maxW - minW)), dh = minH + rnd() * (maxH - minH);
          const cr = Math.max(3, Math.round(dw * (0.22 + rnd() * 0.16))); // la crête est près du bord gauche
          const wob = rnd() * 6;
          for (let i = 0; i <= dw; i++) {
            const xx = x0 + i;
            if (xx < 0 || xx > w) continue;
            const f = i < cr ? Math.sin((Math.PI / 2) * (i / cr)) : 0.5 * (1 + Math.cos((Math.PI * (i - cr)) / (dw - cr)));
            const bump = Math.sin(i * 0.45 + wob) * 0.6 * f;
            const y = Math.round(base - dh * f - bump);
            if (y < top[xx]) { top[xx] = y; lee[xx] = i < cr; }
          }
          x0 += Math.round(dw * (0.55 + rnd() * 0.4));
        }
        for (let xx = 0; xx < w; xx++) {
          const t = top[xx];
          c.fillStyle = col;
          c.fillRect(xx, t, 1, h);
          if (lee[xx]) {
            c.fillStyle = shade;
            c.fillRect(xx, t, 1, Math.max(1, Math.round((base - t) * 0.65)));
          } else {
            c.fillStyle = crest;
            c.fillRect(xx, t, 1, 1);
          }
        }
      };
      // très loin, dans la brume
      layer(horizon - 6, 3, 9, 30, 70, '#d48a4c', '#e8a868', '#c07a44');
      layer(horizon - 2, 3, 8, 22, 55, '#c8783e', '#f2b06a', '#a65c30');
      layer(horizon + 5, 4, 9, 26, 60, '#b4642f', '#e2a05c', '#8e4a24');
      layer(horizon + 13, 3, 8, 30, 70, '#94502a', '#c88448', '#743a1e');
      // avant-plan : dunes dans l'ombre, de plus en plus sombres vers le bas, rides de vent
      const deep = [['#6e3620', '#8a4a2a', '#5a2a18'], ['#5a2a18', '#743c22', '#48200f'], ['#46200f', '#5e301a', '#381809'], ['#36180b', '#4a2414', '#2a1207'], ['#2a1208', '#3a1c0e', '#200d05']];
      let base = horizon + 22, k = 0;
      while (base < h + 20) {
        const d = deep[Math.min(k, deep.length - 1)];
        layer(base, 2 + k, 5 + k * 2, 40 + k * 14, 90 + k * 26, d[0], d[1], d[2]);
        // rides
        for (let r = 0; r < w * 0.5; r++) {
          const rx = Math.floor(rnd() * w), ry = base + 4 + Math.floor(rnd() * (14 + k * 8));
          if (ry < h) { c.fillStyle = d[1]; c.fillRect(rx, ry, 2 + Math.floor(rnd() * 3), 1); }
        }
        base += 16 + k * 8;
        k++;
      }
    });
    // plateau principal : roche sombre (contraste avec le sable du fond), coiffée d'une couche de sable
    const tw = Math.round(L.mainW / PX);
    mkCanvas(this, 'main_dune', tw, 14, (c) => {
      for (let y = 0; y < 14; y++)
        for (let x = 0; x < tw; x++) {
          let col;
          const drift = 2 + (Math.sin(x * 0.21) > 0.6 ? 1 : 0); // le sable déborde un peu par endroits
          if (y === 0) col = (x * 5) % 9 === 0 ? '#fff0c0' : '#f8d490';
          else if (y < drift) col = (x + Math.floor(x / 6)) % 5 === 0 ? '#d09a58' : '#e4b46c';
          else if (y === drift) col = '#1c1824';
          else if (y === 13) col = '#141018';
          else {
            const band = Math.floor((y - 2 + Math.round(Math.sin(x * 0.15) * 1.2)) / 3) % 2;
            col = band ? '#3a3346' : '#463e56';
            if ((x * 13 + y * 7) % 19 === 0) col = '#262030';
            if (y > 4 && (x + y * 3) % 23 === 0) col = '#6a5e7e';
          }
          c.fillStyle = col;
          c.fillRect(x, y, 1, 1);
        }
    });
    // plateformes : dalles de pierre sombre gravées
    mkCanvas(this, 'soft_dune', 50, 5, (c) => {
      for (let y = 0; y < 5; y++)
        for (let x = 0; x < 50; x++) {
          let col = y === 0 ? '#b4a6c6' : y === 4 ? '#18141e' : '#4a4058';
          if (y === 1) col = '#6e6084';
          if (y === 2 && x % 8 === 3) col = '#2a2434';
          if (y === 2 && x % 8 === 4) col = '#8a7ca0';
          if (x === 0 || x === 49) col = '#2a2434';
          c.fillStyle = col;
          c.fillRect(x, y, 1, 1);
        }
    });
    // ver des sables : énorme corps annelé qui sort du sable, gueule ronde ouverte en trois lèvres
    mkCanvas(this, 'worm', 48, 72, (c) => {
      const px = (x, y, col) => { c.fillStyle = col; c.fillRect(Math.round(x), Math.round(y), 1, 1); };
      const OUT = '#2e140a';
      const body = [];
      for (let y = 71; y >= 16; y--) {
        const t = (71 - y) / 55;
        const cx = 22 + 5 * Math.sin(t * 2.2 + 0.3), r = 11 - t * 1.5;
        body.push([y, cx, r]);
      }
      // contour
      body.forEach(([y, cx, r]) => { for (let x = -r - 1; x <= r + 1; x++) px(cx + x, y, OUT); });
      body.forEach(([y, cx, r]) => {
        for (let x = -r; x <= r; x++) {
          const u = x / r;
          let col = u > 0.45 ? '#c8935e' : u > -0.1 ? '#9a6840' : u > -0.6 ? '#7a4e30' : '#5a3420';
          // anneaux : lignes courbes (cylindre)
          const ring = (y + Math.round(Math.sqrt(Math.max(0, 1 - u * u)) * 2.2)) % 5;
          if (ring === 0) col = u > 0.45 ? '#8e5c38' : '#4a2a18';
          else if (ring === 1 && u > 0.2) col = '#dcae78';
          px(cx + x, y, col);
        }
      });
      // gueule (vue un peu de dessus) : lèvre, trois volets ouverts, couronnes de dents
      const mx = 22 + 5 * Math.sin(2.5), my = 15;
      const flap = (ax, ay, bx, by, tx, ty) => {
        for (let y = Math.min(ay, by, ty) - 1; y <= Math.max(ay, by, ty) + 1; y++)
          for (let x = Math.min(ax, bx, tx) - 1; x <= Math.max(ax, bx, tx) + 1; x++) {
            const s1 = (bx - ax) * (y - ay) - (by - ay) * (x - ax), s2 = (tx - bx) * (y - by) - (ty - by) * (x - bx), s3 = (ax - tx) * (y - ty) - (ay - ty) * (x - tx);
            if ((s1 >= 0 && s2 >= 0 && s3 >= 0) || (s1 <= 0 && s2 <= 0 && s3 <= 0)) px(x, y, y < (ay + ty) / 2 ? '#b07a4c' : '#8a5a36');
          }
      };
      flap(mx - 12, my + 1, mx - 4, my - 4, mx - 19, my - 12);
      flap(mx + 12, my + 1, mx + 4, my - 4, mx + 19, my - 12);
      flap(mx - 4, my - 4, mx + 4, my - 4, mx, my - 15);
      for (let y = -6; y <= 6; y++)
        for (let x = -13; x <= 13; x++) {
          const d = Math.hypot(x / 13, y / 6);
          if (d > 1) continue;

  duneAmbience() {
    const horizonY = L.baseY + 6 * PX;
    // épice : poussière dorée qui monte doucement
    const spice = this.time.addEvent({
      delay: 140,
      loop: true,
      callback: () => {
        const x = Math.random() * this.W, y = this.H * (0.45 + Math.random() * 0.5);
        const q = this.add.rectangle(x, y, 4, 4, Math.random() < 0.5 ? 0xffb347 : 0xffd27a, 0.8).setDepth(-5);
        this.tweens.add({ targets: q, x: x + 40 + Math.random() * 60, y: y - 60 - Math.random() * 80, alpha: 0, duration: 3200 + Math.random() * 1600, onComplete: () => q.destroy() });
      },
    });
    this.stageFx.push(spice);
    // un ver surgit au loin de temps en temps
    const worm = () => {
      if (this.stageId !== 'dune') return;
      const x = this.W / 2 + (Math.random() - 0.5) * L.mainW * 0.9;
      const k = PX * (1.15 + Math.random() * 0.3);
      const hgt = 72 * k;
      const wImg = this.add.image(x, horizonY + 8 + hgt, 'worm').setOrigin(0.5, 1).setScale(k).setDepth(-9).setAlpha(0.92).setFlipX(Math.random() < 0.5);
      // le ver sort du sable : on cache tout ce qui est sous la ligne des dunes
      const mg = this.make.graphics({ add: false });
      mg.fillRect(0, 0, this.W, horizonY + 8);
      wImg.setMask(mg.createGeometryMask());
      // gerbe de sable
      for (let i = 0; i < 26; i++) {
        const d = this.add.rectangle(x + (Math.random() - 0.5) * 120, horizonY + 6, 8, 8, i % 3 ? 0xd89a5a : 0xf0c27a).setDepth(-8);
        this.tweens.add({ targets: d, x: d.x + (Math.random() - 0.5) * 260, y: d.y - 60 - Math.random() * 180, alpha: 0, duration: 1100 + Math.random() * 600, delay: 150 + Math.random() * 500, ease: 'Quad.easeOut', onComplete: () => d.destroy() });
      }
      this.tweens.add({ targets: wImg, y: horizonY + 8 + hgt * 0.22, duration: 1400, ease: 'Sine.easeOut', yoyo: true, hold: 1300, onComplete: () => { wImg.destroy(); mg.destroy(); } });
      this.cameras.main.shake(500, 0.003);
      if (this.sfx) this.sfx('rumble');
    };
    const wEv = this.time.addEvent({ delay: 22000, loop: true, callback: worm });
    this.stageFx.push(wEv);
    this.time.delayedCall(6000, worm);
    // ornithoptère qui traverse le ciel
    const fly = () => {
      const dir = Math.random() < 0.5 ? 1 : -1;
      const y = this.H * (0.12 + Math.random() * 0.15);
      const t = this.add.image(dir > 0 ? -60 : this.W + 60, y, 'thopter0').setScale(PX).setDepth(-8).setFlipX(dir < 0);
      const flap = this.time.addEvent({ delay: 70, loop: true, callback: () => t.active && t.setTexture(t.texture.key === 'thopter0' ? 'thopter1' : 'thopter0') });
      this.tweens.add({ targets: t, x: dir > 0 ? this.W + 60 : -60, y: y + (Math.random() - 0.5) * 60, duration: 9000, onComplete: () => { flap.remove(false); t.destroy(); } });
    };
    const fEv = this.time.addEvent({ delay: 31000, loop: true, callback: fly });
    this.stageFx.push(fEv);
    this.time.delayedCall(2500, () => this.stageId === 'dune' && fly());
  },
});

// ARÈNE « CÉRÉMONIE » : la montée des marches d'un palais du cinéma, un soir de remise de prix (les LUCAS D'OR).
// Tout le décor est en pixel art à la résolution des persos (1 pixel d'art = GPX = 2 pixels du jeu), dessiné ici par
// code ; le logo et le sigle sont redessinés en pixels (gala_art.js, généré par tools/art/gala_export.py) et peints
// DANS le décor (bannières, plaque du parvis, écussons des plateformes, écran) — parfois en perspective (bannière de
// l'aile gauche, médaillons tissés dans le tapis rouge).
//
// Plateformes propres à l'arène (GALA.plats) : toutes se traversent par dessous et se quittent par BAS tenu ;
// leur face tournée vers le vide (wall) est un mur ; on s'accroche à leurs coins (ledgeBlocks) en tombant le long
// du bloc, joystick poussé vers lui. Le PUPITRE est posé sur la SCÈNE DES PRÉSENTATEURS (son côté droit fait mur).
// Pas de plafond ni de mur côté centre : un perso éjecté ne doit pas être « sauvé » par le décor. Plateformes dans
// les bords du parvis, pupitre bas (60 px) : sinon on s'y réfugie et les KO chutent (simulations de bots).
// Le parvis (terrain principal) est plus épais qu'ailleurs (GALA.mainH) ; bords et rebords au même endroit.
// Tout ce qui bouge (flashs, projecteurs, ampoules, écran) est purement visuel : jamais dans la simulation.
// ===========================================================================

// dessine un dessin de GALA_PIX (ou une liste de lignes) dans un contexte 2D, en pixels d'art
function galaSpr(c, spr, x, y, pal) {
  const rows = typeof spr === 'string' ? GALA_PIX[spr] : spr;
  if (!rows) return;
  x = Math.round(x);
  y = Math.round(y);
  for (let j = 0; j < rows.length; j++) {
    const r = rows[j];
    for (let i = 0; i < r.length; i++) {
      const ch = r[i];
      if (ch === '.') continue;
      c.fillStyle = pal[ch] || '#f0f';
      c.fillRect(x + i, y + j, 1, 1);
    }
  }
}

      const X = px + 0.5, Y = py + 0.5;
      const w = Gq * X + Hq * Y + I;
      const u = (A * X + B * Y + C) / w, v = (D * X + E * Y + F) / w;
      if (u < 0 || u >= 1 || v < 0 || v >= 1) continue;
      const ch = rows[Math.floor(v * sh)][Math.floor(u * sw)];
      if (ch === '.') continue;
      c.fillStyle = pal[ch] || '#f0f';
      c.fillRect(px, py, 1, 1);
    }
}

  galaGeom() {

    return GALA.plats.map((p) => {
      const x0 = Math.round((cx + p.a * H2) / GPX) * GPX;
      const tw = Math.round(((p.b - p.a) * H2) / GPX);
      return Object.assign({}, p, { key: 'gala_' + p.id, x0, x1: x0 + tw * GPX, tw, th: p.h / GPX, top: by - p.top });

          R(lx - 1, ly - 60, 3, 60, '#2a2236');
          R(lx - 4, ly - 68, 9, 7, GC.warm2);
          R(lx - 5, ly - 69, 11, 1, GC.gold2);
          R(lx - 3, ly - 2, 7, 3, '#2a2236');
        }
      }
      // palmiers, buissons aux coins
      const palm = (px, py, k) => {
        // tronc annelé, légèrement courbé
        const n = Math.round(66 * k);
        for (let i = 0; i < n; i++) {
          const x = px + Math.round(Math.sin((i / n) * 1.6) * 6 * k), tw = Math.max(3, Math.round((4 - i / n) * k));
          R(x, py - i, tw, 1, i % 3 === 0 ? '#1c140e' : '#3a2a1c');
          P(x, py - i, '#4a3826');
        }
        const tx = px + Math.round(Math.sin(1.6) * 6 * k) + 1, ty = py - n;
        // palmes : une nervure courbe et des folioles qui retombent
        [[-1, 0.9], [1, 0.9], [-1, 0.45], [1, 0.45], [-0.6, 1.25], [0.6, 1.25], [-1, 0.1], [1, 0.1]].forEach(([dir, lift]) => {
          const len = Math.round(26 * k * (lift > 1 ? 0.7 : 1));
          for (let i = 0; i < len; i++) {
            const t = i / len;
            const x = Math.round(tx + dir * i), y = Math.round(ty - lift * 10 * k * Math.sin(t * Math.PI * 0.75) + t * t * 14 * k);
            R(x, y, 2, 1, t < 0.3 ? '#3f7a48' : '#2c5e3a');
            if (i % 2 === 0 && t > 0.1) for (let l = 1; l <= 4 - Math.round(t * 2); l++) P(x + dir * Math.round(l * 0.5), y + l, l === 1 ? '#2c5e3a' : '#1c4028');
          }
        });
        R(tx - 2, ty - 1, 5, 3, '#4a3826');
      };
      if (F0 > 40) { palm(F0 - 30, by + 2, 1.2); palm(F0 - 70, by + 2, 1.0); }
      if (right) palm(F1 + 100, by + 2, 1.1);
      // écran en hauteur : grands palmiers au premier plan, en bas
      if (h - A.mainB > 200) { palm(18, h + 4, 2.2); palm(w - 26, h + 4, 2.0); }
      for (const s of [-1, 1])
        for (let i = 0; i < 14; i++) {
          const x = s < 0 ? Math.floor(rnd() * 70) : w - Math.floor(rnd() * 70), y = h - Math.floor(rnd() * 30);
          const r = 6 + Math.floor(rnd() * 8);
          for (let yy = -r; yy <= r; yy++) {
            const hw = Math.round(Math.sqrt(r * r - yy * yy));
            R(x - hw, y + yy, hw * 2, 1, yy < -r / 2 ? '#14261c' : '#0c1812');
          }
        }
    }, 'raw');

    // ---- le parvis : tapis rouge sur le dessus, rideaux drapés, plaque du logo, lampes ----
    const tw = Math.round(L.mainW / GPX), th = GALA.mainH / GPX;
    mkCanvas(this, 'main_gala', tw, th, (c) => galaDrape(c, tw, th, { carpet: true, plaque: 'logo', lamps: true }), 'raw');
    geo.forEach((g) => mkCanvas(this, g.key, g.tw, g.th, (c) => (g.pupitre ? galaPupitre(c, g.tw, g.th) : galaDrape(c, g.tw, g.th, { shield: g.shield })), 'raw'));
    // étincelle de flash (pixels)
    mkCanvas(this, 'gala_spark', 9, 9, (c) => {
      const S = ['....#....', '....#....', '...###...', '..#####..', '#########', '..#####..', '...###...', '....#....', '....#....'];
      S.forEach((r, y) => [...r].forEach((ch, x) => { if (ch === '#') { c.fillStyle = Math.abs(x - 4) + Math.abs(y - 4) < 2 ? '#ffffff' : '#fff0c0'; c.fillRect(x, y, 1, 1); } }));
    }, 'raw');
    // écran : le logo, et un plan de film (arbre sous la lune)
    const sw = scr.x1 - scr.x0, sh = scr.y1 - scr.y0;
    mkCanvas(this, 'gala_scr_logo', sw, sh, (c) => {
      c.fillStyle = '#06040f';
      c.fillRect(0, 0, sw, sh);
      const L0 = GALA_PIX.logoEd;
      galaSpr(c, L0, (sw - L0[0].length) / 2, 2, PAL_GOLD);
    }, 'raw');
    mkCanvas(this, 'gala_scr_film', sw, sh, (c) => {
      for (let y = 0; y < sh; y++) {
        const t = Math.floor((y / sh) * 6) / 6;
        c.fillStyle = `rgb(${Math.round(20 + 30 * t)},${Math.round(40 + 60 * t)},${Math.round(90 + 70 * t)})`;
        c.fillRect(0, y, sw, 1);
      }
      c.fillStyle = '#e8f0ff';
      c.fillRect(Math.round(sw * 0.75), 8, 8, 8);
      c.fillStyle = '#16284a';
      for (let x = 0; x < sw; x++) c.fillRect(x, Math.round(sh * 0.62 + Math.sin(x * 0.08) * 3), 1, sh);
      // le grand arbre
      const tx = Math.round(sw * 0.42), ty = Math.round(sh * 0.62);
      c.fillStyle = '#0e1a34';
      c.fillRect(tx - 2, ty - 22, 5, 24);
      [[0, -30, 26, 12], [-14, -24, 16, 9], [14, -25, 16, 9], [0, -38, 18, 8]].forEach(([dx, dy, rx, ry]) => {
        for (let yy = -ry; yy <= ry; yy++) {
          const ww = Math.round(rx * Math.sqrt(1 - (yy * yy) / (ry * ry)));
          c.fillRect(tx + dx - ww, ty + dy + yy, ww * 2, 1);
        }
      });
    }, 'raw');
    // faisceau de projecteur (dans le ciel)
    if (!this.textures.exists('gala_beam')) {
      const bt = this.textures.createCanvas('gala_beam', 48, 256);
      const c = bt.getContext();
      for (let y = 0; y < 256; y++) {
        const u = 1 - y / 255;
        const half = 2 + u * 22;
        const a = Math.round(((1 - u) * 0.9 + 0.08) * 6) / 6;
        c.fillStyle = `rgba(200,210,255,${(a * 0.6).toFixed(3)})`;
        c.fillRect(24 - half, y, half * 2, 1);
        c.fillStyle = `rgba(230,236,255,${a.toFixed(3)})`;
        c.fillRect(24 - half * 0.4, y, half * 0.8, 1);
      }
      bt.refresh();
    }
  },

  // plateformes de la CÉRÉMONIE : créées / retirées quand on change d'arène ; le parvis change d'épaisseur
  setGalaGeom(on) {
    (this.galaPlats || []).forEach((p) => p.destroy());
    this.galaPlats = [];
    this.ledgeBlocks = [];
    const ok = on && this.textures.exists('gala_loge');
    this.mainH = ok ? GALA.mainH : 56;
    if (this.mainPlat) {
      this.mainPlat.setY(L.baseY + this.mainH / 2);
      this.mainPlat.refreshBody();
    }
    (this.softPlats || []).forEach((p) => {
      p.stageOff = ok;
      p.setVisible(!ok);
      p.body.enable = !ok;
    });
    if (!ok) return;
    this.galaGeom().forEach((g) => {
      const p = this.platforms.create((g.x0 + g.x1) / 2, g.top + g.h / 2, g.key).setScale(GPX).refreshBody();
      p.setDepth(5);
      p.soft = true; // se traverse par dessous, se quitte par BAS tenu
      p.body.checkCollision.down = false;
      p.body.checkCollision.left = g.wall < 0;
      p.body.checkCollision.right = g.wall > 0;
      this.ledgeBlocks.push({ x0: g.x0, x1: g.x1, top: g.top });
      this.galaPlats.push(p);
    });
  },

  // debout sur une plateforme de la cérémonie ? (tests)
  solidUnder(pl) {
    if (!this.ledgeBlocks || !this.ledgeBlocks.length) return null;
    const b = pl.sprite.body;
    return this.ledgeBlocks.find((bl) => Math.abs(b.bottom - bl.top) < 4 && b.center.x > bl.x0 - 4 && b.center.x < bl.x1 + 4) || null;
  },

  // ----- vie du décor (purement visuel, jamais dans la simulation) -----
  galaAmbience() {
    const A = this.galaArt(), fx = this.stageFx;
    const keep = (o) => (fx.push(o), o);
    // faisceaux de projecteurs dans le ciel
    [[A.F1 + 30, -1, 0], [A.F1 + 60, 1, 1], [A.F0 - 20, 1, 2]].forEach(([xa, s, k]) => {
      const bx = Math.min(A.w - 4, Math.max(4, xa)) * GPX, by = (A.by - 120) * GPX;
      const beam = keep(this.add.image(bx, by, 'gala_beam').setOrigin(0.5, 1).setDepth(-9.8).setAlpha(0.16).setBlendMode(Phaser.BlendModes.ADD));
      beam.setDisplaySize(96, Math.max(520, by + 60));
      beam.angle = s * (14 + k * 6);
      keep(this.tweens.add({ targets: beam, angle: -s * 16, duration: 6000 + k * 1300, yoyo: true, repeat: -1, ease: 'Sine.easeInOut' }));
    });
    // l'écran : le logo, un plan de film, puis « EN DIRECT » avec chaque combattant…
    const s = A.scr;
    const scrImg = keep(this.add.image(s.x0 * GPX, s.y0 * GPX, 'gala_scr_logo').setOrigin(0).setScale(GPX).setDepth(-9));
    const live = this.add.container(0, 0).setDepth(-8.9).setVisible(false);
    keep({ remove: () => live.destroy() }); // (un Container a déjà une méthode remove : on l'enveloppe)
    const scrX = ((s.x0 + s.x1) / 2) * GPX, top = s.y0 * GPX;
    let slot = 0;
    const showScreen = () => {
      if (!scrImg.active) return;
      live.removeAll(true);
      const pls = this.state === 'play' ? (this.pls || []).filter((p) => p && p.char) : [];
      const seq = ['logo', 'film', 'logo'].concat(pls.map((p, i) => i));
      const it = seq[slot++ % seq.length];
      if (typeof it === 'string') {
        scrImg.setTexture(it === 'film' ? 'gala_scr_film' : 'gala_scr_logo').setVisible(true);
        live.setVisible(false);
        return;
      }
      const pl = pls[it];
      scrImg.setVisible(false);
      live.setVisible(true);
      live.add(this.add.rectangle(s.x0 * GPX, top, (s.x1 - s.x0) * GPX, (s.y1 - s.y0) * GPX, 0x06040f).setOrigin(0));
      const key = `${pl.char}_idle0`;
      if (this.textures.exists(key)) live.add(this.add.image(scrX, top + 70, key).setScale(1.6));
      live.add(this.add.text(scrX, top + 6, '● EN DIRECT', { fontFamily: FONT, fontSize: '16px', color: '#ff5a6e' }).setOrigin(0.5, 0));
      live.add(this.add.text(scrX, top + 112, 'NOMINÉ : ' + (pl.def && pl.def.name ? pl.def.name : pl.char).toUpperCase(), { fontFamily: FONT, fontSize: '16px', color: '#e0c27a' }).setOrigin(0.5, 1));
    };
    keep(this.time.addEvent({ delay: 4000, loop: true, callback: showScreen }));
    // ampoules autour de l'écran : chenillard (3 images toutes faites qu'on alterne)
    const pts = [];
    for (let x = s.x0 - 3; x <= s.x1 + 2; x += 3) pts.push([x, s.y0 - 4], [x, s.y1 + 3]);
    for (let y = s.y0 - 1; y <= s.y1; y += 3) pts.push([s.x0 - 4, y], [s.x1 + 3, y]);
    const bx0 = s.x0 - 4, by0 = s.y0 - 4, bw = s.x1 - s.x0 + 8, bh = s.y1 - s.y0 + 8;
    for (let ph = 0; ph < 3; ph++)
      mkCanvas(this, 'gala_bulbs' + ph, bw, bh, (c) => pts.forEach(([x, y], i) => {
        c.fillStyle = (i + ph) % 3 ? GC.warm3 : GC.gold0;
        c.fillRect(x - bx0, y - by0, 1, 1);
      }), 'raw');
    const bulbs = keep(this.add.image(bx0 * GPX, by0 * GPX, 'gala_bulbs0').setOrigin(0).setScale(GPX).setDepth(-8.8));
    let phase = 0;
    keep(this.time.addEvent({ delay: 200, loop: true, callback: () => bulbs.active && bulbs.setTexture('gala_bulbs' + (++phase % 3)) }));
    // flashs des photographes : dans la foule des marches et au premier plan
    keep(this.time.addEvent({
      delay: 140, loop: true,
      callback: () => {
        if (Math.random() > 0.5) return;
        let xA, yA;
        const side = Math.random() < 0.5 ? -1 : 1;
        if (Math.random() < 0.55) {
          yA = A.by - 36 + Math.random() * 34;
          xA = A.cx + side * (44 + Math.random() * (A.FW - 30));
        } else {
          if (A.h - A.mainB < 12) return;
          yA = A.mainB + 10 + Math.random() * (A.h - A.mainB - 10);
          xA = A.cx + side * (40 + Math.random() * (A.w / 2 - 40));
        }
        const g = this.add.image(Math.round(xA) * GPX, Math.round(yA) * GPX, 'gala_spark').setScale(GPX).setDepth(-6).setBlendMode(Phaser.BlendModes.ADD);
        this.tweens.add({ targets: g, alpha: 0, duration: 200, onComplete: () => g.destroy() });
      },
    }));
  },
});

// bannière de façade : tissu noir, bord doré, logo complet, pointe en bas (r = ombre du pli, y = bord)
function galaBanner(variant) {
  galaBanner.cache = galaBanner.cache || {};
  const ck = variant || 'full';
  if (galaBanner.cache[ck]) return galaBanner.cache[ck];
  const L0 = variant === 'short' ? galaShort() : GALA_PIX.banner, W = 60, H = 70, PT = 8;
  const rows = [];
  for (let y = 0; y < H + PT; y++) {
    let r = '';
    for (let x = 0; x < W; x++) {
      const dx = Math.abs(x - W / 2 + 0.5), lim = y >= H ? (W / 2) * (1 - (y - H) / PT) : W;
      if (dx > lim) { r += '.'; continue; }
      if (x < 2 || x >= W - 2 || y < 2 || (y >= H && lim - dx < 1.6)) r += 'y';
      else r += x === 2 || x === W - 3 ? 'r' : 'k';
    }
    rows.push(r);
  }
  const ox = Math.floor((W - L0[0].length) / 2), oy = variant === 'short' ? 10 : 6;
  L0.forEach((lr, j) => {
    const r = rows[oy + j].split('');
    [...lr].forEach((ch, i) => { if (ch !== '.') r[ox + i] = ch; });
    rows[oy + j] = r.join('');
  });
  galaBanner.cache[ck] = rows;
  return rows;
}
// sigle + « LUCAS D'OR » empilés (pour ce qui est vu de biais ou de loin)
function galaShort() {
  const sg = GALA_PIX.sig23, t = GALA_PIX.title, W = t[0].length;
  const pad = (r) => '.'.repeat(Math.floor((W - r.length) / 2)) + r + '.'.repeat(W - r.length - Math.floor((W - r.length) / 2));
  return sg.map(pad).concat(['.'.repeat(W), '.'.repeat(W), '.'.repeat(W), '.'.repeat(W)], t);
}

// plateforme drapée (et le parvis) : dessus doré, valance rouge, rideaux en festons, glands dorés, écusson
function galaDrape(c, w, h, o) {
  const R = (x, y, ww, hh, col) => { c.fillStyle = col; c.fillRect(Math.round(x), Math.round(y), Math.round(ww), Math.round(hh)); };
  let y0 = 0;
  if (o.carpet) {
    // dessus du parvis : le tapis rouge (on marche dessus)
    R(0, 0, w, 1, GC.red3);
    R(0, 1, w, 3, GC.red2);
    for (let x = 3; x < w; x += 7) R(x, 2, 2, 1, GC.red1);
    R(0, 0, 3, 4, GC.st4);
    R(w - 3, 0, 3, 4, GC.st4);
    y0 = 4;
  }
  // rebord doré (bien net : c'est là qu'on pose les pieds)
  R(0, y0, w, 1, GC.gold4);
  R(0, y0 + 1, w, 1, GC.gold3);
  R(0, y0 + 2, w, 1, GC.gold2);
  R(0, y0 + 3, w, 1, GC.gold0);
  for (let x = 2; x < w; x += 6) R(x, y0 + 2, 2, 1, GC.gold1);
  const f0 = y0 + 4;
  // fond du panneau
  R(0, f0, w, h - f0, GC.navy1);
  for (let x = 4; x < w; x += 8) R(x, f0, 1, h - f0, GC.navy0);
  // valance rouge
  const vh = Math.max(2, Math.round((h - f0) * 0.16));
  R(0, f0, w, vh, GC.red2);
  R(0, f0, w, 1, GC.red3);
  R(0, f0 + vh, w, 1, GC.red0);
  // festons entre les glands
  const n = Math.max(1, Math.round(w / (o.carpet ? 64 : 40))), sp = w / n;
  const depth = Math.round((h - f0 - vh) * (o.carpet ? 0.42 : 0.62));
  for (let k = 0; k < n; k++) {
    const xa = k * sp, xb = (k + 1) * sp;
    for (let x = Math.floor(xa); x < Math.ceil(xb); x++) {
      const t = (x - xa) / sp;
      const bot = f0 + vh + Math.round(Math.sin(t * Math.PI) * depth);
      for (let y = f0 + vh; y <= bot; y++) {
        const fold = Math.round((y - f0 - vh) * 0.9 + Math.abs(t - 0.5) * 6) % 4;
        R(x, y, 1, 1, y === bot ? GC.red0 : fold === 0 ? GC.red1 : y < f0 + vh + 2 ? GC.red3 : GC.red2);
      }
    }
  }
  // glands dorés aux points d'accroche
  for (let k = 0; k <= n; k++) {
    const x = Math.round(Math.min(w - 3, Math.max(1, k * sp - 1)));
    const len = Math.min(h - f0 - 4, Math.round((h - f0) * (o.carpet ? 0.4 : 0.6)));
    R(x, f0, 2, len, GC.gold2);
    R(x, f0, 1, len, GC.gold3);
    R(x - 1, f0 + len, 4, 3, GC.gold2);
    R(x - 1, f0 + len + 2, 4, 1, GC.gold0);
  }
  // bas du panneau
  R(0, h - 2, w, 1, GC.gold1);
  R(0, h - 1, w, 1, GC.navy0);
  // montants dorés aux deux bouts (on voit bien où s'arrête la plateforme)
  R(0, y0, 2, h - y0, GC.gold2);
  R(0, y0, 1, h - y0, GC.gold3);
  R(w - 2, y0, 2, h - y0, GC.gold1);
  // lampes au pied du parvis
  if (o.lamps) {
    for (const f of [0.1, 0.3, 0.7, 0.9]) {
      const x = Math.round(w * f);
      for (let r = 5; r >= 1; r--) { c.fillStyle = `rgba(255,210,130,${(0.06 * (6 - r)).toFixed(2)})`; c.fillRect(x - r * 2, h - 8 - r * 2, r * 4 + 1, r * 4); }
      R(x - 2, h - 9, 5, 5, GC.warm2);
      R(x - 1, h - 8, 3, 3, GC.warm3);
      R(x - 3, h - 4, 7, 2, GC.gold1);
      R(x - 2, h - 10, 5, 1, GC.gold3);
    }
  }
  // plaque du logo (parvis) ou écusson au sigle (plateformes)
  if (o.plaque) {
    const Lg = GALA_PIX[o.plaque], pw = Lg[0].length + 8, ph = h - y0 - 1;
    const px = Math.round((w - pw) / 2), py = y0 + 1;
    R(px - 1, py - 1, pw + 2, ph + 1, GC.gold0);
    R(px, py, pw, ph, GC.gold2);
    R(px, py, pw, 1, GC.gold3);
    R(px + 1, py + 1, pw - 2, ph - 2, '#0d0a16');
    R(px + 2, py + 2, pw - 4, 1, '#1a1426');
    galaSpr(c, Lg, px + 4, py + 1 + Math.floor((ph - 2 - Lg.length) / 2), PAL_GOLD);
  } else if (o.shield) {
    const sw = 17, sh = Math.min(h - f0 + 2, 18);
    const sx = Math.round((w - sw) / 2), sy = f0 - 2;
    for (let y = 0; y < sh; y++) {
      const narrow = y > sh - 7 ? (y - (sh - 7)) * 1.2 : 0;
      const x0 = Math.round(narrow), x1 = sw - Math.round(narrow);
      if (x1 <= x0) continue;
      R(sx + x0, sy + y, x1 - x0, 1, GC.gold2);
      if (y > 0 && x1 - x0 > 2 && y < sh - 1) R(sx + x0 + 1, sy + y, x1 - x0 - 2, 1, '#0d0a16');
    }
    R(sx, sy, sw, 1, GC.gold3);
    galaSpr(c, 'sig11', sx + 3, sy + 2, PAL_GOLD);
  }
}

// le pupitre des présentateurs : colonne sombre, dessus doré, écusson, socle
function galaPupitre(c, w, h) {
  const R = (x, y, ww, hh, col) => { c.fillStyle = col; c.fillRect(Math.round(x), Math.round(y), Math.round(ww), Math.round(hh)); };
  R(0, 0, w, 1, GC.gold4);
  R(0, 1, w, 1, GC.gold3);
  R(0, 2, w, 1, GC.gold2);
  R(0, 3, w, 1, GC.gold0);
  R(2, 4, w - 4, h - 4, GC.navy1);
  R(2, 4, 2, h - 4, GC.navy3);
  R(w - 4, 4, 2, h - 4, GC.navy0);
  R(0, 4, 2, h - 4, GC.gold2);
  R(0, 4, 1, h - 4, GC.gold3);
  R(w - 2, 4, 2, h - 4, GC.gold1);
  R(5, 5, w - 10, 1, GC.gold1);
  if (h - 52 > 2) for (let x = 6; x < w - 6; x += 4) R(x, 40, 2, h - 52, GC.navy2);
  R(5, h - 12, w - 10, 1, GC.gold1);
  R(0, h - 6, w, 6, GC.gold1);
  R(0, h - 6, w, 1, GC.gold3);
  R(0, h - 1, w, 1, GC.gold0);
  // écusson au sigle
  const sw = 19, sh = Math.min(24, h - 13), sx = Math.round((w - sw) / 2), sy = 6;
  for (let y = 0; y < sh; y++) {
    const narrow = y > sh - 8 ? (y - (sh - 8)) * 1.2 : 0;
    const x0 = Math.round(narrow), x1 = sw - Math.round(narrow);
    if (x1 <= x0) continue;
    R(sx + x0, sy + y, x1 - x0, 1, GC.gold2);
    if (y > 0 && x1 - x0 > 2 && y < sh - 1) R(sx + x0 + 1, sy + y, x1 - x0 - 2, 1, '#0d0a16');
  }
  R(sx, sy, sw, 1, GC.gold3);
  galaSpr(c, 'sig13', sx + 3, sy + 2, PAL_GOLD);
}

// ADIEULESCURE : maillot marine à scapulaire, jean, boucles et barbe rousse, clope au bec.

  // --- CTRL+Z : trace de la dernière seconde (10 points, un toutes les 6 images) --------------------------
  zRecord(pl, now) {
    if (this.simFrames % 6) return;
    const s = pl.sprite, i = pl.zi || 0;
    pl['zx' + i] = Math.round(s.x * 10) / 10;
    pl['zy' + i] = Math.round(s.y * 10) / 10;
    pl['zd' + i] = pl.damage;
    pl['zf' + i] = pl.facing;
    pl.zi = (i + 1) % 10;
    pl.zn = Math.min((pl.zn || 0) + 1, 10);
  },

  doRewind(pl, now) {
    if (!pl.zn) return;
    const i = pl.zn < 10 ? 0 : pl.zi || 0; // le point le plus ancien
    const x = pl['zx' + i], y = pl['zy' + i];
    const s = pl.sprite;
    const from = { x: s.x, y: s.y };
    if (pl.grab) this.releaseGrab(pl);
    this.pls.forEach((o) => o.grab && o.grab.victim === pl && this.releaseGrab(o));
    pl.ledgeSide = 0;
    s.body.allowGravity = true;
    this.putAt(s, x, y);
    s.body.setVelocity(0, 0);
    const undone = Math.max(0, pl.damage - pl['zd' + i]);
    pl.damage = Math.min(pl.damage, pl['zd' + i]);
    pl.stunUntil = 0;
    pl.helpless = false;
    pl.invulnUntil = Math.max(pl.invulnUntil, now + 250);
    pl.zn = 0; // on ne peut pas remonter plus loin
    if (this.resim) return;
    // visuel : la silhouette reste au départ, une ligne de curseur rejoint l'arrivée
    const g = this.add.image(from.x, from.y, s.texture.key).setScale(PX).setFlipX(s.flipX).setTint(0x7fb2ff).setAlpha(0.55).setDepth(9);
    this.tweens.add({ targets: g, alpha: 0, duration: 420, onComplete: () => g.destroy() });
    const n = 8;
    for (let k = 0; k <= n; k++) {
      const q = this.add.rectangle(from.x + ((x - from.x) * k) / n, from.y - 30 + ((y - from.y) * k) / n, 8, 8, k % 2 ? 0x7fb2ff : 0xffffff).setDepth(30);
      this.tweens.add({ targets: q, alpha: 0, scale: 0.2, duration: 300, delay: k * 18, onComplete: () => q.destroy() });
    }
    const u = this.add.image(x, y - 90, 'undo').setScale(PX).setDepth(40);
    this.tweens.add({ targets: u, y: y - 120, angle: -360, alpha: 0, duration: 520, onComplete: () => u.destroy() });
    this.popup(x, y - 70, undone >= 1 ? `CTRL+Z  -${Math.round(undone)}%` : 'CTRL+Z', '#7fb2ff');
    this.sfx('rewind');
  },

  // --- CONTRÔLE ---------------------------------------------------------------------------------------
  catchProj(v, p, now) {
    const a = v.atk;
    a.cTo = 0;
    a.pose = 'volley';
    a.end = now + 320;
    v.cdUntil = a.end;
    this.killProj(p, false);
    const o = p.owner;
    v.facing = Math.sign(o.sprite.x - v.sprite.x) || v.facing;
    v.sprite.setFlipX(v.facing < 0);
    const sp = { kind: 'volley', tex: 'football', s: 3, vx: 1250, life: 750, w: 30, h: 30, ox: 34, oy: -4, spin: 20,
      dmg: Math.max(5, Math.min(12, Math.round(p.spec.dmg || 6))), kb: 300, ks: 7, ang: -0.3, stun: 200, small: true };
    this.spawnProj(v, o, null, now, 0, sp);
    v.invulnUntil = Math.max(v.invulnUntil, now + 120);
    this.hitstop(60);
    if (this.resim) return;
    const c = v.sprite.body.center;
    this.popup(c.x, c.y - 90, 'CONTRÔLE !', '#7fb2ff');
    const r = this.add.image(c.x, c.y - 10, 'ring').setTint(0xffffff).setDepth(31).setScale(0.8);
    this.tweens.add({ targets: r, scale: 4, alpha: 0, duration: 280, onComplete: () => r.destroy() });
    this.sfx('catch');
  },

  catchMelee(v, att, spec, now) {
    const a = v.atk;
    a.cTo = 0;
    v.facing = Math.sign(att.sprite.x - v.sprite.x) || v.facing;
    v.sprite.setFlipX(v.facing < 0);
    if (att.grab) this.releaseGrab(att);
    this.startGrab(v, att, a.m, now);
    v.invulnUntil = Math.max(v.invulnUntil, now + 300);
    this.sfx('catch');
  },

  // --- effets visuels ----------------------------------------------------------------------------------
  extraFx(pl, m, fx, b, f) {
    if (fx.foam) {
      // geyser de mousse au-dessus de la tête
      for (let i = 0; i < 16; i++) {
        const q = this.add.rectangle(b.x + f * 8 + (Math.random() - 0.5) * 20, b.y - 40, 8 + Math.random() * 8, 8 + Math.random() * 8, i % 3 ? 0xfff6e0 : 0xf0b030).setDepth(22);
        this.tweens.add({ targets: q, x: q.x + (Math.random() - 0.5) * 90, y: b.y - 120 - Math.random() * 90, alpha: 0, duration: 380 + Math.random() * 200, delay: i * 10, onComplete: () => q.destroy() });
      }
    }
    if (fx.rooster) {
      const r = this.add.image(b.x, b.y - 20, 'rooster').setScale(PX * 0.6).setDepth(22).setFlipX(f < 0).setAlpha(0.95);
      this.tweens.add({ targets: r, y: b.y - 150, scale: PX * 1.1, alpha: 0, duration: 520, ease: 'Cubic.easeOut', onComplete: () => r.destroy() });
      this.popup(b.x, b.y - 110, 'COCORICO !', '#ffffff');
      this.sfx('rooster');
    }
    if (fx.donkey) {
      const d = this.add.image(b.x - f * 80, b.y + 4, 'donkey').setScale(PX * 0.5).setDepth(22).setFlipX(f > 0);
      this.tweens.add({ targets: d, scale: PX * 1.1, alpha: 0, duration: 380, onComplete: () => d.destroy() });
      this.dust(b.x - f * 60, b.y + 10, -f, 4, pl.def.fx);
    }
    if (fx.bike) { this.dust(b.x - f * 30, b.y + 34, -f, 6, pl.def.fx); this.sfx('bike'); }
    if (fx.violin || fx.notes) this.sfx('note');
    if (fx.violin) for (let i = 0; i < 6; i++) this.noteFx(b.x + Math.cos(i) * 50, b.y - 10 + Math.sin(i * 1.7) * 40, i % 2 ? 1 : -1, i);
  },

  // éclats de verre / jus de tomate
  splatFx(p) {
    if (this.resim) return;
    const sp = p.spec, col = sp.splat || 0xffffff;
    this.sfx(sp.kind === 'bottle' ? 'glass' : 'splat');
    for (let i = 0; i < 10; i++) {
      const a = -Math.PI * Math.random();
      const d = 20 + Math.random() * 50;
      const q = this.add.rectangle(p.x, p.y, 6, 6, i % 3 === 0 ? 0xffffff : col).setDepth(30);
      this.tweens.add({ targets: q, x: p.x + Math.cos(a) * d, y: p.y + Math.sin(a) * d + 20, alpha: 0, duration: 340, onComplete: () => q.destroy() });
    }
  },

  // cigarette : petites bouffées de fumée quand il attend
  idleFx(pl, name, now) {
    if (name !== 'idle0' && name !== 'idle1') return;
    if (now - (pl.lastPuff || 0) < 700) return;
    pl.lastPuff = now;
    const s = pl.sprite;
    const x = s.x + pl.facing * 24, y = s.y - 50;
    const q = this.add.circle(x, y, 5, 0xdedad4, 0.7).setDepth(12);
    this.tweens.add({ targets: q, x: x + pl.facing * 10 + (Math.random() - 0.5) * 10, y: y - 40, scale: 2.4, alpha: 0, duration: 1200, onComplete: () => q.destroy() });
  },

// BIGZINZIN : costume bleu ciel, petite antenne, lunettes rondes, téléphone à la main (ses coups légers).
// Monteur vidéo et homme d'affaires. Mécaniques :
//  - ARGENT / JACKPOT : il gagne de l'argent en touchant (1,7 € par % infligé) et en perd en étant touché
//    (1 € par % reçu). À 100 € : JACKPOT, costume et antenne en or pendant 8 s : +20 % de dégâts, -15 % de dégâts
//    et de recul reçus. La cagnotte repart de zéro (et est divisée par deux s'il perd une vie).
//  - DOUBLURE (SPÉCIAL haut) : il se téléporte 240 px plus haut et devient invisible ; à sa place, une silhouette
//    en billets verts. La silhouette encaisse UN coup (corps-à-corps ou tir), puis les billets tombent et il
//    réapparaît. Il réapparaît aussi s'il attaque, s'il est touché, ou au bout de 6 s.
//  - KEY FRAME (SPÉCIAL bas) : il pose une image clé au sol (4 s) ; qui marche dessus reste figé un instant.
//  - FEUILLE A4 (SPÉCIAL) : une feuille qui plane en ondulant ; elle coupe et ralentit.
// Tout l'état de jeu est en champs simples (money, goldUntil, invisUntil, decoyId, freezeUntil) : sauvegardé en ligne.
// ===========================================================================
const BZ = { max: 100, gain: 1.7, loss: 1, goldMs: 8000, dmgUp: 1.2, dmgDown: 0.85, invisMs: 6000, dist: 290 };

Object.assign(GameScene.prototype, {
  // --- argent et JACKPOT (appelé par applyHit, avant les dégâts) ---------------------------------------------
  bzHit(att, vic, spec, now) {
    if (att.def.money && att !== vic && now < (att.goldUntil || 0)) spec = Object.assign({}, spec, { dmg: spec.dmg * BZ.dmgUp });
    if (vic.def.money && now < (vic.goldUntil || 0)) spec = Object.assign({}, spec, { dmg: spec.dmg * BZ.dmgDown });
    if (att.def.money && att !== vic && !(now < (att.goldUntil || 0))) {
      att.money = (att.money || 0) + spec.dmg * BZ.gain;
      if (!this.resim) {
        const c = att.sprite.body.center;
        this.moneyFx(c.x, c.y - 40, '+' + Math.round(spec.dmg * BZ.gain) + ' €', '#7cff7c');
      }
      if (att.money >= BZ.max) this.bzJackpot(att, now);
    }
    if (vic.def.money && !(now < (vic.goldUntil || 0))) {
      const lost = Math.min(vic.money || 0, spec.dmg * BZ.loss);
      vic.money = (vic.money || 0) - lost;
      if (lost >= 1 && !this.resim) {
        const c = vic.sprite.body.center;
        this.moneyFx(c.x, c.y - 40, '-' + Math.round(lost) + ' €', '#ff7070');
      }
    }
    // touché pendant la DOUBLURE : il réapparaît
    if (now < (vic.invisUntil || 0)) this.bzReveal(vic, now);
    return spec;
  },

  bzJackpot(pl, now) {
    pl.money = 0;
    pl.goldUntil = now + BZ.goldMs;
    if (this.resim) return;
    const c = pl.sprite.body.center;
    this.popup(c.x, c.y - 110, 'JACKPOT !', '#ffd23a');
    this.shockwave(c.x, c.y + 20, { main: 0xffd23a, alt: 0xfff3a0 });
    for (let i = 0; i < 14; i++) this.coinFx(c.x, c.y - 10, i);
    this.sfx('crowd');
    this.cameras.main.shake(200, 0.008);
  },

  // petit texte « +6 € » qui monte (affichage seulement)
  moneyFx(x, y, txt, col) {
    const t = this.add.text(x + (Math.random() - 0.5) * 20, y, txt, { fontFamily: FONT, fontSize: '13px', color: col, stroke: '#000', strokeThickness: 4 }).setOrigin(0.5).setDepth(42);
    this.tweens.add({ targets: t, y: y - 40, alpha: 0, duration: 700, onComplete: () => t.destroy() });
  },

  coinFx(x, y, i) {
    const q = this.add.rectangle(x, y, 7, 7, i % 3 ? 0xffd23a : 0xfff3a0).setDepth(31).setAngle(45);
    const a = -Math.PI * (0.1 + 0.8 * Math.random()), d = 60 + Math.random() * 90;
    this.tweens.add({ targets: q, x: x + Math.cos(a) * d, y: y + Math.sin(a) * d, duration: 260, ease: 'Quad.easeOut' });
    this.tweens.add({ targets: q, y: y + 40, alpha: 0, angle: 360, delay: 260, duration: 380, ease: 'Quad.easeIn', onComplete: () => q.destroy() });
  },

  // --- à chaque image (après le reste de step) -----------------------------------------------------------------
  bzStep(pl, other, now) {
    const s = pl.sprite;
    // KEY FRAME : image figée (tous les persos peuvent la subir)
    if (now < (pl.freezeUntil || 0)) {
      s.body.setVelocity(0, 0);
      s.setTint(0x9fd8ff);
    }
    if (!pl.def.money) return;
    // DOUBLURE : invisible pour l'adversaire (le joueur, lui, voit une silhouette très pâle)
    if (now < (pl.invisUntil || 0)) {
      const decoy = this.projs.find((p) => !p.dead && p.id === pl.decoyId);
      if (!decoy) this.bzReveal(pl, now);
      else s.setAlpha(pl.human ? 0.22 : 0);
    } else if (pl.invisUntil) {
      this.bzReveal(pl, now);
    }
    // JACKPOT : paillettes d'or
    if (now < (pl.goldUntil || 0) && !this.resim && !(now < (pl.invisUntil || 0)) && now - (pl.goldFx || 0) > 70) {
      pl.goldFx = now;
      const q = this.add.rectangle(s.x + (Math.random() - 0.5) * 50, s.y + (Math.random() - 0.5) * 70, 5, 5, Math.random() < 0.5 ? 0xffd23a : 0xffffff).setDepth(12).setAngle(45);
      this.tweens.add({ targets: q, y: q.y - 30, scale: 0.2, alpha: 0, duration: 500, onComplete: () => q.destroy() });
    }
  },

  // --- DOUBLURE ---------------------------------------------------------------------------------------------
  bzVanish(pl, now) {
    const s = pl.sprite;
    const x0 = s.x, y0 = s.y;
    // la silhouette en billets reste à sa place (un « projectile » immobile, sauvegardé en ligne comme les autres)
    const sp = { kind: 'decoy', tex: `${pl.char}_idle0`, s: PX, vx: 0, life: BZ.invisMs, w: 44, h: 76, ox: 0, oy: 0, dmg: 0 };
    const img = this.add.image(x0, y0, sp.tex).setScale(PX).setDepth(9).setTint(0x5fbf5a).setFlipX(pl.facing < 0);
    this.projs.push({ id: ++this.projSeq, owner: pl, target: this.foeOf(pl), spec: sp, x: x0, y: y0, vx: 0, vy: 0, born: now, armedAt: now, lastTrail: 0, sprite: img, dead: false, f: pl.facing });
    pl.decoyId = this.projSeq;
    pl.invisUntil = now + BZ.invisMs;
    // téléport vers le haut (sans sortir par le haut de l'écran)
    const y1 = Math.max(y0 - BZ.dist, L.baseY - BLAST_TOP + 140);
    if (pl.ledgeSide) { pl.ledgeSide = 0; s.body.allowGravity = true; }
    this.putAt(s, x0, y1);
    s.body.setVelocity(0, -60);
    if (this.resim) return;
    for (let i = 0; i < 12; i++) this.billFx(x0, y0, i, false);
    this.popup(x0, y0 - 80, 'DOUBLURE', '#7cff7c');
    this.sfx('magic', 0.6);
  },

  // il réapparaît ; la silhouette (si elle est encore là) s'effondre en billets
  bzReveal(pl, now) {
    pl.invisUntil = 0;
    const d = this.projs.find((p) => !p.dead && p.id === pl.decoyId);
    pl.decoyId = 0;
    if (d) {
      if (!this.resim) for (let i = 0; i < 14; i++) this.billFx(d.x, d.y, i, true);
      this.killProj(d, false);
    }
    if (!this.resim) {
      const s = pl.sprite;
      this.runeFx(s.x, s.y - 10, { main: 0x5fbf5a, alt: 0xb8f0a0 }, 1.6);
    }
  },

  // billets verts qui volent (départ) ou tombent (silhouette détruite)
  billFx(x, y, i, fall) {
    const q = this.add.image(x + (Math.random() - 0.5) * 40, y + (Math.random() - 0.5) * 70, 'bill').setScale(PX * 0.6).setDepth(28).setAngle(Math.random() * 360);
    if (fall) this.tweens.add({ targets: q, y: L.baseY + 10, x: q.x + (Math.random() - 0.5) * 60, angle: q.angle + 200, alpha: 0, duration: 700 + Math.random() * 300, ease: 'Quad.easeIn', onComplete: () => q.destroy() });
    else this.tweens.add({ targets: q, y: q.y - 40 - Math.random() * 40, x: q.x + (Math.random() - 0.5) * 80, angle: q.angle + 120, alpha: 0, duration: 500, onComplete: () => q.destroy() });
  },

  // un coup au corps-à-corps de « pl » touche-t-il la silhouette de « other » ? (elle encaisse à sa place)
  bzDecoyHit(pl, other, box, now) {
    if (!other.def.money || !(now < (other.invisUntil || 0))) return false;
    const d = this.projs.find((p) => !p.dead && p.id === other.decoyId);
    if (!d) return false;
    const r = new Phaser.Geom.Rectangle(d.x - d.spec.w / 2, d.y - d.spec.h / 2, d.spec.w, d.spec.h);
    if (!Phaser.Geom.Intersects.RectangleToRectangle(box, r)) return false;
    if (!this.resim) {
      this.popup(d.x, d.y - 70, 'LEURRE !', '#7cff7c');
      this.sfx('hit', 0.3);
    }
    this.bzReveal(other, now);
    return true;
  },

  // --- projectiles propres à BIGZINZIN (true = déjà traité) ---------------------------------------------------
  bzProj(p, now) {
    const sp = p.spec;
    if (sp.kind === 'decoy') {
      // immobile ; un tir adverse qui la traverse s'arrête et la détruit
      for (const q of this.projs) {
        if (q.dead || q === p || q.owner === p.owner || q.spec.kind === 'decoy') continue;
        if (Math.abs(q.x - p.x) < (sp.w + q.spec.w) / 2 && Math.abs(q.y - p.y) < (sp.h + q.spec.h) / 2) {
          this.killProj(q, true);
          if (!this.resim) this.popup(p.x, p.y - 70, 'LEURRE !', '#7cff7c');
          this.bzReveal(p.owner, now);
          return true;
        }
      }
      if (now - p.born > sp.life) this.bzReveal(p.owner, now);
      return true;
    }
    if (sp.kind === 'paper') {
      // la feuille plane en ondulant (vitesse verticale tirée du temps : identique sur les deux téléphones)
      p.vy = (16 * 1000 / 130) * dcos((now - p.born) / 130);
      p.sprite.setAngle(10 * dsin((now - p.born) / 90));
    }
    if (sp.kind === 'keyframe' && now >= p.armedAt) p.sprite.setAlpha(0.7 + 0.3 * dsin(now / 80));
    return false;
  },

  makeBzTextures() {
    // feuille A4 (lignes de texte)
    iconTex(this, 'paper', ['kkkkkkkkk', 'kwwwwwwwk', 'kwggggwwk', 'kwwwwwwwk', 'kwgggggwk', 'kwwwwwwwk', 'kwggggwwk', 'kwwwwwwwk', 'kwgggwwwk', 'kwwwwwwwk', 'kkkkkkkkk'], '#000',
      { k: '#3a4050', w: '#ffffff', g: '#9aa4b8' });
    // image clé (losange de logiciel de montage)
    iconTex(this, 'keyframe', ['....k....', '...kyk...', '..kyyyk..', '.kyyhyyk.', 'kyyhhhyyk', '.kyyhyyk.', '..kyyyk..', '...kyk...', '....k....'], '#000',
      { k: '#1a1410', y: '#ffd23a', h: '#ffffff' });
    // billet vert
    iconTex(this, 'bill', ['kkkkkkk', 'kgglggk', 'kgldlgk', 'kgglggk', 'kkkkkkk'], '#000', { k: '#1e4a1e', g: '#5fbf5a', l: '#b8f0a0', d: '#2e7a2e' });
  },
});

// textures en plus + effets visuels des coups (flash du téléphone, éclair d'antenne, pièces)
(() => {

      const r = this.add.image(x, y, 'ring').setTint(0xcfe8ff).setDepth(30).setScale(0.6);

  P.zapFx = function (x, y0, y1) {

        this.tweens.add({ targets: q, alpha: 0, duration: 240, delay: k * 12, onComplete: () => q.destroy() });

})();

// ===========================================================================
// NATANAX : éclaireur en cape verte, une casquette « à la Peaky Blinders » à la main (lames dans la visière).
// Mécaniques :
//  - CASQUETTE (SPÉCIAL) : lancée en boomerang, elle coupe à l'aller et au retour. Rattrapée au retour = recharge
//    immédiate. Ratée, elle tombe au sol : il faut aller la ramasser (elle revient seule au bout de 5 s). Sans elle,
//    ses LÉGERS frappent moins fort (aux poings).
//  - TABLEAU E = MC² (SPÉCIAL + BAS TENU, au sol) : il écrit la formule à la craie, 0,5 s par morceau (E, =, MC²),
//    immobile et attaquable. Interrompu, ce qui est écrit reste (effacé seulement quand il perd une vie).
//  - FISSION (SPÉCIAL + BAS, appui court) : l'atome écrasé se coupe en deux, une moitié file de chaque côté.
//    Formule complète : RÉACTION EN CHAÎNE (lunettes noires, préparation longue, explosion, 4 neutrons) ; la formule
//    s'efface.
//  - ALLEY-OOP (SPÉCIAL haut) : saut très haut, dunk sur celui qui est au-dessus, le ballon repart vers le bas.
// Tout l'état de jeu est en champs simples (eqMs, sHold) ou dans les projectiles (back, spent, hits) : sauvegardé.
// ===========================================================================
const NX = { eqMs: 1500, eqStep: 500, holdMs: 130, bare: 0.75, catchX: 42, catchY: 58 };

CHARS.natanax = {
  id: 'natanax', name: 'NATANAX', role: 'ÉCLAIREUR ATOMIQUE', roleCol: '#7ee08a', cardCol: '#2f8a4a',
  speed: 355, jump: 690, weight: 1.0, jumps: 3, cap: true,
  pal: { main: '#1f6a36', dark: '#123a20', skin: '#f2c2a4', skin2: '#dc9e80', hair: '#26180e', accent: '#d29e54', glove: '#f2c2a4' },
  fx: { main: 0x349052, alt: 0xd29e54, core: 0xffffff, cres: 'cres_nx' },
  help: [],
  moves: {},
};
ORDER.push('natanax');

Object.assign(GameScene.prototype, {
  // la casquette est-elle partie (en vol ou par terre) ?
  nxCapOut(pl) {
    for (const p of this.projs) if (!p.dead && p.owner === pl && p.spec.kind === 'cap') return true;
    return false;
  },

  // choix du coup juste avant qu'il parte (null = refusé)
  nxPick(pl, m, now) {
    if (!pl.def.cap) return m;
    if (m.proj && m.proj.kind === 'cap' && this.nxCapOut(pl)) {
      const c = pl.sprite.body.center;
      this.popup(c.x, c.y - 80, 'PAS DE CASQUETTE', '#cfe8d4');
      pl.cdUntil = now + 150;
      return null;
    }
    // formule complète : la FISSION devient la RÉACTION EN CHAÎNE
    if (m.type === 'fission' && (pl.eqMs || 0) >= NX.eqMs && pl.def.moves.dSX) return pl.def.moves.dSX;
    return m;
  },

  // au départ du coup (pl.atk vient d'être créé)
  nxStart(pl, m, now, grounded) {
    if (!pl.def.cap) return;
    const a = pl.atk, s = pl.sprite;
    if (m.type === 'fission') {
      a.done = true;
      a.moveLock = now + m.startup;
      if (grounded) s.setVelocityX(s.body.velocity.x * 0.3);
      this.sched(m.startup, 'nxFission', { pi: pl.i, aid: a.id });
    }
    if (m.nuke) {
      s.setVelocityX(0);
      this.sched(m.startup, 'nxNuke', { pi: pl.i, aid: a.id });
      if (!this.resim) {
        // l'atome gonfle entre ses mains pendant la préparation
        const c = s.body.center;
        const g = this.add.image(c.x + pl.facing * 18, c.y - 4, 'ring').setTint(0x9ff4ff).setDepth(31).setScale(0.3);
        this.tweens.add({ targets: g, scale: 2.2, alpha: { from: 1, to: 0.2 }, duration: m.startup, onComplete: () => g.destroy() });
      }
    }
    if (m.dunk) this.sched(m.startup + m.dunk, 'nxDunk', { pi: pl.i, aid: a.id });
  },

  nxTimer(t, pl, now) {
    const d = t.data;
    if (!pl || !pl.atk || pl.atk.id !== d.aid || pl.stocks <= 0 || this.over) return;
    const m = pl.atk.m, foe = this.foeOf(pl);
    if (t.kind === 'nxFission') {
      const b = pl.sprite.body;
      const gnd = b.blocked.down || b.touching.down;
      const sp = gnd ? m.neutron : Object.assign({}, m.neutron, { ground: false, oy: 0 });
      this.spawnProj(pl, foe, { backFire: false }, now, 0, sp);
      this.spawnProj(pl, foe, { backFire: true }, now, 0, sp);
      if (!this.resim) {
        const x = b.center.x + pl.facing * 24, y = gnd ? b.bottom - 6 : b.center.y;
        const r = this.add.image(x, y, 'ring').setTint(0x9ff4ff).setDepth(30).setScale(0.5);
        this.tweens.add({ targets: r, scale: 3, alpha: 0, duration: 260, onComplete: () => r.destroy() });
        this.sfx('magic', 0.6);
      }
    } else if (t.kind === 'nxNuke') {
      pl.eqMs = 0; // la formule est consommée
      const sp = m.neutron;
      this.spawnProj(pl, foe, { backFire: false }, now, 0, sp);
      this.spawnProj(pl, foe, { backFire: true }, now, 0, sp);
      const sp2 = Object.assign({}, sp, { vx: sp.vx * 0.62, oy: sp.oy - 34, ground: false });
      this.spawnProj(pl, foe, { backFire: false }, now, -34, sp2);
      this.spawnProj(pl, foe, { backFire: true }, now, -34, sp2);
    } else if (t.kind === 'nxDunk') {
      this.spawnProj(pl, foe, null, now, 0, m.proj);
    }
  },

  // à chaque image (après le reste de step)
  nxStep(pl, now) {
    if (!pl.def.cap) return;
    const s = pl.sprite, b = s.body;
    const grounded = !pl.ledgeSide && (b.blocked.down || b.touching.down);
    if (pl.eqMs === undefined) pl.eqMs = 0;
    // SPÉCIAL + BAS encore tenu peu après l'appui : il ne lance pas la FISSION, il écrit au tableau
    const a = pl.atk;
    if (a && a.m.type === 'fission' && !a.wchk && now >= a.start + NX.holdMs) {
      a.wchk = true;
      if (pl.sHold && grounded && pl.eqMs < NX.eqMs && pl.def.moves.dSW) {
        pl.moveCd.dS = now; // la FISSION n'est pas partie : pas de recharge
        pl.atk = { id: ++this.atkSeq, m: pl.def.moves.dSW, key: 'dSW', pose: 'write', start: now, hitAt: 1e15, end: now + 200, moveLock: now + 200, done: true };
        pl.cdUntil = now + 200;
      }
    }
    const w = pl.atk;
    if (w && w.m.type === 'write' && !w.stop) {
      if (pl.sHold && grounded && pl.eqMs < NX.eqMs && pl.stocks > 0) {
        w.end = w.moveLock = pl.cdUntil = now + 2 * STEP_MS + 1;
        s.setVelocityX(0);
        const before = Math.floor(pl.eqMs / NX.eqStep);
        pl.eqMs = Math.min(NX.eqMs, pl.eqMs + STEP_MS);
        const after = Math.floor(pl.eqMs / NX.eqStep);
        w.pose = Math.floor((now - w.start) / 200) % 2 ? 'write2' : 'write';
        if (after > before) this.sfx(after >= 3 ? 'count' : 'note', 0.5); // un morceau de plus (affiché au-dessus de sa tête)
        if (pl.eqMs >= NX.eqMs) {
          w.stop = true;
          w.end = w.moveLock = pl.cdUntil = now + 250;
          if (!this.resim) {
            const c = b.center;
            this.shockwave(c.x, b.bottom, { main: 0x9ff4ff, alt: 0xffffff });
          }
        }
      } else {
        w.stop = true;
        w.end = w.moveLock = pl.cdUntil = now + 150;
      }
    }
    this.nxShow(pl, now);
  },

  // affichage seulement : la formule au-dessus de la tête, le tableau pendant l'écriture
  nxShow(pl, now) {
    const s = pl.sprite, b = s.body;
    const n = Math.floor((pl.eqMs || 0) / NX.eqStep);
    if (n > 0 && pl.stocks > 0) {
      const txt = ['', 'E', 'E =', 'E = MC²'][Math.min(n, 3)];
      if (!pl.eqImg && !this.resim) pl.eqImg = this.add.text(s.x, s.y - 100, txt, { fontFamily: FONT, fontSize: '15px', color: '#ffffff', stroke: '#123a20', strokeThickness: 5 }).setOrigin(0.5).setDepth(41);
      if (pl.eqImg) {
        if (pl.eqImg.text !== txt) pl.eqImg.setText(txt);
        const full = n >= 3;
        pl.eqImg.setPosition(s.x, s.y - 96 + (full ? dsin(now / 110) * 3 : 0)).setColor(full && Math.floor(now / 160) % 2 ? '#fff3a0' : '#ffffff');
        pl.eqImg.setVisible(!(now < (pl.invisUntil || 0)));
      }
    } else if (pl.eqImg) {
      pl.eqImg.destroy();
      pl.eqImg = null;
    }
    const writing = pl.atk && pl.atk.m.type === 'write' && pl.stocks > 0;
    if (writing) {
      const x = s.x + pl.facing * 64, y = b.bottom;
      if (!pl.boardImg && !this.resim) {
        pl.boardImg = this.add.image(x, y, 'board').setOrigin(0.5, 1).setScale(PX * 1.1).setDepth(8);
        pl.boardTxt = this.add.text(x, y - 46, '', { fontFamily: FONT, fontSize: '11px', color: '#f4f4ec' }).setOrigin(0.5).setDepth(9);
      }
      if (pl.boardImg) {
        pl.boardImg.setPosition(x, y);
        const k = Math.floor(((pl.eqMs || 0) / NX.eqMs) * 7 + 0.001);
        pl.boardTxt.setPosition(x, y - 46).setText('E = MC²'.slice(0, Math.min(k, 7)));
      }
    } else if (pl.boardImg) {
      pl.boardImg.destroy();
      pl.boardTxt.destroy();
      pl.boardImg = pl.boardTxt = null;
    }
  },

  // la casquette (true = déjà traitée, le reste de la boucle des projectiles est sauté)
  nxProj(p, now) {
    const sp = p.spec;
    if (sp.kind !== 'cap') return false;
    const o = p.owner, dt = STEP_MS / 1000;
    if (!p.hits) p.hits = new Set();
    if (now - p.born > sp.life || o.stocks <= 0) {
      // trop longtemps loin de lui : elle revient toute seule
      this.killProj(p, false);
      if (o.stocks > 0 && !this.resim) this.popup(o.sprite.x, o.sprite.y - 90, 'CASQUETTE !', '#cfe8d4');
      return true;
    }
    const ob = o.sprite.body.center;
    const near = Math.abs(p.x - ob.x) < NX.catchX && Math.abs(p.y - ob.y) < NX.catchY;
    if (p.spent) {
      // posée par terre : il la ramasse en passant dessus
      if (near) {
        this.killProj(p, false);
        if (!this.resim) this.popup(ob.x, ob.y - 90, 'CASQUETTE !', '#cfe8d4');
        this.sfx('catch', 0.4);
      }
      return true;
    }
    p.sprite.angle += 26 * p.f;
    const t = now - p.born;
    // boomerang : elle ralentit, fait demi-tour, revient ; après être repassée par son point de départ, elle tombe
    if (!p.back && p.vx * p.f <= 0) {
      p.back = true;
      p.hits = new Set();
    }
    if (t < sp.fallAt) {
      p.vx -= p.f * sp.decel * dt;
      p.vx = Math.max(-sp.vx, Math.min(sp.vx, p.vx));
    } else {
      p.vy += 1700 * dt;
      p.vx *= 0.86;
    }
    if (p.vy > 0 && p.y > L.baseY - 12 && Math.abs(p.x - this.W / 2) < L.mainW / 2) {
      p.y = L.baseY - 12;
      p.vx = p.vy = 0;
      p.spent = true;
      p.sprite.setPosition(p.x, p.y).setAngle(0);
      return true;
    }
    // RATTRAPÉE au retour : recharge immédiate
    if (p.back && near && now >= o.stunUntil) {
      this.killProj(p, false);
      o.moveCd.nS = now;
      if (!this.resim) {
        this.popup(ob.x, ob.y - 90, 'RATTRAPÉE !', '#7ee08a');
        const r = this.add.image(ob.x + o.facing * 10, ob.y - 10, 'ring').setTint(0x7ee08a).setDepth(31).setScale(0.6);
        this.tweens.add({ targets: r, scale: 2.6, alpha: 0, duration: 240, onComplete: () => r.destroy() });
      }
      this.sfx('catch', 0.6);
      return true;
    }
    // elle coupe une fois à l'aller et une fois au retour
    const victims = this.pls.length > 2 ? this.enemiesOf(o) : [p.target];
    for (const v of victims) {
      if (p.dead || p.hits.has(v) || now < v.invulnUntil || v.stocks <= 0 || v.grab) continue;
      if (v.atk && v.atk.m.projImmune && now < v.atk.end) continue;
      const vb = v.sprite.body;
      if (!(p.x + sp.w / 2 > vb.x && p.x - sp.w / 2 < vb.right && p.y + sp.h / 2 > vb.y && p.y - sp.h / 2 < vb.bottom)) continue;
      // CONTRÔLE d'AdieuLescure : il l'attrape et la renvoie
      if (v.atk && v.atk.m.type === 'catch' && now >= v.atk.cFrom && now <= v.atk.cTo) {
        this.catchProj(v, p, now);
        return true;
      }
      p.hits.add(v);
      this.applyHit(o, v, sp, now, Math.sign(p.vx) || p.f, { x: p.x, y: p.y });
    }
    return true;
  },

  // bot (appelé au début de botInput) : il écrit au tableau quand l'adversaire est loin (ou encore sonné), et lâche
  // s'il approche. null = le bot joue normalement.
  nxBot(bot, tgt, now) {
    if (!bot.def.cap || bot.stocks <= 0 || tgt.stocks <= 0 || now < bot.stunUntil || bot.ledgeSide) return null;
    const b = bot.sprite.body;
    const grounded = b.blocked.down || b.touching.down;
    const onStage = Math.abs(bot.sprite.x - this.W / 2) < L.mainW / 2 - 60;
    const far = Math.abs(tgt.sprite.x - bot.sprite.x) > 330 || now < tgt.stunUntil - 300;
    const idle = { sx: 0, sy: 0, jump: false, attack: false, heavy: false, special: false, hold: false, block: false };
    const a = bot.atk;
    if (a && (a.m.type === 'write' || a.m.type === 'fission') && bot.botWrite) {
      if (far && (bot.eqMs || 0) < NX.eqMs) return Object.assign(idle, { sy: 1, shold: true });
      bot.botWrite = false;
      return idle;
    }
    if (!a && grounded && onStage && far && (bot.eqMs || 0) < NX.eqMs && now > bot.cdUntil && Math.random() < 0.08) {
      bot.botWrite = true;
      return Object.assign(idle, { special: true, sy: 1, shold: true });
    }
    return null;
  },

  makeNxTextures() {
    crescentTex(this, 'cres_nx', ['#ffffff', '#d0d6e0', '#5cb874']);
    // casquette plate en vol (visière et lame à droite)
    iconTex(this, 'capProj', ['...kkkkk...', '..kTTTTTk..', '.kTtTTTTTk.', 'kTttTTTTTkk', 'kttttttttBk', '.kkkkkkkkkk'], '#000',
      { k: '#16121a', T: '#6a5c4c', t: '#463c32', B: '#e6eaf2' });
    // neutron (moitié d'atome lumineuse)
    iconTex(this, 'neutron', ['..kkk..', '.kcCck.', 'kcCWCck', 'kCWWWCk', 'kcCWCck', '.kcCck.', '..kkk..'], '#000',
      { k: '#0c3a48', c: '#3cc8e6', C: '#96f0ff', W: '#ffffff' });
    // ballon de basket
    iconTex(this, 'bball', ['..kkkk..', '.kOoOOk.', 'kOOkOOOk', 'kkkkkkkk', 'kOoOkOOk', 'kOOOkOok', '.kOOkOk.', '..kkkk..'], '#000',
      { k: '#1a0a04', O: '#e8761e', o: '#ffb070' });
    // tableau noir sur pieds
    iconTex(this, 'board', [
      'wwwwwwwwwwwwwwwwwwwwww', 'wggggggggggggggggggggw', 'wggggggggggggggggggggw', 'wggggggggggggggggggggw', 'wggggggggggggggggggggw', 'wggggggggggggggggggggw',
      'wggggggggggggggggggggw', 'wggggggggggggggggggggw', 'wggggggggggggggggggggw', 'wggggggggggggggggggggw', 'wwwwwwwwwwwwwwwwwwwwww', '..w................w..',
      '..w................w..', '.w..................w.', '.w..................w.', 'w....................w'], '#000', { w: '#7a4e24', g: '#24402c' });
    // champignon atomique (affichage)
    mkCanvas(this, 'mushroom', 40, 44, (c) => {
      const blob = (x, y, r, col) => { c.fillStyle = col; c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fill(); };
      c.fillStyle = '#c8a070'; c.fillRect(16, 16, 8, 26);
